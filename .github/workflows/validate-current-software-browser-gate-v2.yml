name: Validate current software and responsive browser gate v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-current-software-browser-gate-v2.yml']

permissions:
  contents: write

jobs:
  same-source-gate:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run same-source software gate without early exit
        id: software
        shell: pwsh
        run: |
          $stages = [ordered]@{}
          function Run-Stage([string]$Name, [scriptblock]$Command) {
            Write-Host "=== $Name ==="
            & $Command
            $stages[$Name] = $LASTEXITCODE
          }
          Run-Stage 'auditVirtual' { npm run audit:virtual-dx7 }
          Run-Stage 'auditResearch' { npm run audit:reconstruction-upstreams }
          Run-Stage 'typecheck' { npm run typecheck }
          Run-Stage 'lint' { npm run lint }
          Run-Stage 'tests' { npm run test }
          Run-Stage 'build' { npm run build }
          $stages | ConvertTo-Json | Set-Content -Encoding utf8 software-gate.json
          exit 0
      - name: Check responsive smoke syntax
        shell: pwsh
        run: |
          node --check scripts/smoke-target-responsive.mjs
      - name: Run Chrome and Edge FM-1/DX7 matrices
        shell: pwsh
        run: |
          Remove-Item responsive-*.json -Force -ErrorAction SilentlyContinue
          $pfx = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $pfx 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $pfx 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          function Run-Matrix([string]$Exe, [string]$Browser, [string]$Target) {
            $result = "responsive-$Target-$Browser.json"
            $code = 1
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              Remove-Item $result -Force -ErrorAction SilentlyContinue
              node scripts/smoke-target-responsive.mjs --browser-executable $Exe --browser-name $Browser --target $Target --result $result
              $code = $LASTEXITCODE
              if ($code -eq 0) { break }
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $result)) {
              @{ ok = $false; browserName = $Browser; target = $Target; error = "runner exited $code without result" } | ConvertTo-Json | Set-Content -Encoding utf8 $result
            }
          }
          Run-Matrix $chrome 'chrome' 'fm1'
          Run-Matrix $chrome 'chrome' 'dx7'
          Run-Matrix $edge 'edge' 'fm1'
          Run-Matrix $edge 'edge' 'dx7'
          exit 0
      - name: Persist same-source receipt and resolve roadmap only on success
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read_json(path, fallback):
              p=Path(path)
              if not p.exists(): return fallback
              try: return json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception as exc: return {**fallback, 'error': f'invalid json: {exc}'}
          software=read_json('software-gate.json', {})
          expected=['auditVirtual','auditResearch','typecheck','lint','tests','build']
          software_ok=all(software.get(stage)==0 for stage in expected)
          matrices={}
          for browser in ('chrome','edge'):
              for target in ('fm1','dx7'):
                  key=f'{browser}-{target}'
                  matrices[key]=read_json(f'responsive-{target}-{browser}.json', {'ok':False,'browserName':browser,'target':target,'error':'result missing'})
          browser_ok=all(bool(result.get('ok')) for result in matrices.values())
          ok=software_ok and browser_ok
          software_rows=['| Software stage | Exit |','| --- | ---: |']+[f'| {stage} | {software.get(stage,"?")} |' for stage in expected]
          matrix_rows=['| Browser | Target | Product | Desktop | Narrow | Mobile touch | MIDI requests | Result |','| --- | --- | --- | --- | --- | --- | ---: | --- |']
          for browser,target in [('chrome','fm1'),('chrome','dx7'),('edge','fm1'),('edge','dx7')]:
              result=matrices[f'{browser}-{target}']
              if not result.get('ok'):
                  matrix_rows.append(f'| {browser} | {target.upper()} | FAILED | — | — | — | — | {result.get("error","unknown")} |')
                  continue
              names={item.get('viewport') for item in result.get('matrix',[])}
              matrix_rows.append(f'| {browser} | {target.upper()} | {result.get("browserProduct")} | {"PASS" if "desktop" in names else "MISS"} | {"PASS" if "desktop-narrow" in names else "MISS"} | {"PASS" if "mobile-touch" in names else "MISS"} | {result.get("midiRequests",0)} | PASS |')
          receipt=['# Current same-source software and responsive browser gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'',*software_rows,'',*matrix_rows,'', 'All software checks and branded-browser matrices are executed from the same checkout/build. The responsive matrix covers desktop 1440×900, desktop-narrow 1024×768 and mobile-touch 390×844 for both FM-1 and DX7 target modes in Chrome and Edge. It validates application layout/navigation/error containment only; it does not validate physical MIDI/audio hardware.','']
          Path('docs/validation/current-software-browser-gate.md').write_text('\n'.join(receipt),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md'); text=plan.read_text(encoding='utf-8')
              prefix='- [ ] Execute typecheck, lint, the full test suite, production build and the permanent Chrome/Edge FM-1 + DX7 responsive matrices successfully on the same source commit.'
              lines=[line for line in text.splitlines() if not line.startswith(prefix)]
              plan.write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8')
          for path in Path('.').glob('responsive-*.json'): path.unlink(missing_ok=True)
          Path('software-gate.json').unlink(missing_ok=True)
          Path('.github/workflows/validate-current-software-browser-gate-v2.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit permanent receipt
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): record same-source FM1 DX7 responsive gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
