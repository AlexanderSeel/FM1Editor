name: Validate imported-bank PCM with catalog-safe selectors

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-imported-bank-audio-browser-v5.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Align runner with filtered catalog and padded Yamaha names
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/test-imported-bank-virtual-audio-browser.mjs')
          text=path.read_text(encoding='utf-8')
          replacements=[
          ("""  await waitForExpression(cdp, `[...document.querySelectorAll('article')].some((article) => article.textContent?.includes('ROM1A') && [...article.querySelectorAll('button')].some((button) => button.textContent?.includes('Load bank') && !button.disabled))`, 25_000)\n  const loaded = await evaluate(cdp, `(() => {\n    const article = [...document.querySelectorAll('article')].find((candidate) => candidate.textContent?.includes('ROM1A'));\n    const button = article && [...article.querySelectorAll('button')].find((candidate) => candidate.textContent?.includes('Load bank') && !candidate.disabled);\n    if (!button) return false; button.click(); return true;\n  })()`)\n  if (!loaded) throw new Error('Could not load ROM1A bank')\n  await waitForExpression(cdp, `[...document.querySelectorAll('article')].some((article) => article.textContent?.includes('ROM1A') && [...article.querySelectorAll('button')].some((button) => button.textContent?.trim() === 'Load bank' && !button.disabled))`, 30_000)\n\n  await clickButton(cdp, 'Voice')\n  await waitForExpression(cdp, `document.querySelector('.fm1-lcd-title')?.textContent?.includes('BRASS 1')`, 10_000)\n""",
          """  await waitForExpression(cdp, `[...document.querySelectorAll('article')].some((article) => [...article.querySelectorAll('button')].some((button) => button.textContent?.includes('Load bank') && !button.disabled))`, 25_000)\n  const loaded = await evaluate(cdp, `(() => {\n    const article = [...document.querySelectorAll('article')].find((candidate) => [...candidate.querySelectorAll('button')].some((button) => button.textContent?.includes('Load bank') && !button.disabled));\n    const button = article && [...article.querySelectorAll('button')].find((candidate) => candidate.textContent?.includes('Load bank') && !candidate.disabled);\n    if (!button) return false; button.click(); return true;\n  })()`)\n  if (!loaded) throw new Error('Could not load the ROM1A-filtered bank')\n  await waitForExpression(cdp, `(document.querySelector('.fm1-lcd-title')?.textContent ?? '').replace(/\\s+/g, ' ').includes('BRASS 1')`, 30_000)\n\n  await clickButton(cdp, 'Voice')\n  await waitForExpression(cdp, `(document.querySelector('.fm1-lcd-title')?.textContent ?? '').replace(/\\s+/g, ' ').includes('BRASS 1')`, 10_000)\n"""),
          ("""  await waitForExpression(cdp, `[...document.querySelectorAll('article')].some((article) => article.textContent?.includes('ROM1A') && [...article.querySelectorAll('button')].some((button) => button.textContent?.includes('Audition first voice') && !button.disabled))`, 20_000)\n  const catalogAuditionClicked = await evaluate(cdp, `(() => {\n    const article = [...document.querySelectorAll('article')].find((candidate) => candidate.textContent?.includes('ROM1A'));\n    const button = article && [...article.querySelectorAll('button')].find((candidate) => candidate.textContent?.includes('Audition first voice') && !candidate.disabled);\n    if (!button) return false; button.click(); return true;\n  })()`)\n""",
          """  await waitForExpression(cdp, `[...document.querySelectorAll('article')].some((article) => [...article.querySelectorAll('button')].some((button) => button.textContent?.includes('Audition first voice') && !button.disabled))`, 20_000)\n  const catalogAuditionClicked = await evaluate(cdp, `(() => {\n    const article = [...document.querySelectorAll('article')].find((candidate) => [...candidate.querySelectorAll('button')].some((button) => button.textContent?.includes('Audition first voice') && !button.disabled));\n    const button = article && [...article.querySelectorAll('button')].find((candidate) => candidate.textContent?.includes('Audition first voice') && !candidate.disabled);\n    if (!button) return false; button.click(); return true;\n  })()`)\n"""),
          ("""  await waitForExpression(cdp, `document.body.textContent.includes('Auditioning BRASS 1') || document.body.textContent.includes('Local audition: BRASS 1')`, 15_000)\n""",
          """  await waitForExpression(cdp, `(document.body.textContent ?? '').replace(/\\s+/g, ' ').includes('Auditioning BRASS 1') || (document.body.textContent ?? '').replace(/\\s+/g, ' ').includes('Local audition: BRASS 1')`, 15_000)\n""")]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit('imported-bank runner anchor not found')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge exact PCM acceptance
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          node scripts/test-imported-bank-virtual-audio-browser.mjs --browser-executable $chrome --browser-name chrome --result imported-bank-audio-chrome.json
          $chromeExit=$LASTEXITCODE
          node scripts/test-imported-bank-virtual-audio-browser.mjs --browser-executable $edge --browser-name edge --result imported-bank-audio-edge.json
          $edgeExit=$LASTEXITCODE
          Write-Host "Chrome exit $chromeExit; Edge exit $edgeExit"
          exit 0
      - name: Record evidence and PLAN status
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'ok':False,'error':'result missing'}
          chrome=read('imported-bank-audio-chrome.json'); edge=read('imported-bank-audio-edge.json')
          ok=bool(chrome.get('ok')) and bool(edge.get('ok'))
          def row(name,d):
              if not d.get('ok'): return f"| {name} | FAILED | — | — | — | — | {d.get('error','unknown')} |"
              return f"| {name} | {d.get('browserProduct')} | {d.get('loadedVoicePeak'):.8f} | {d.get('catalogAuditionPeak'):.8f} | {d.get('savedAuditionPeak'):.8f} | {d.get('midiRequests')} | PASS |"
          Path('docs/validation/imported-bank-virtual-audio-browser.md').write_text('\n'.join([
              '# Imported-bank virtual audio browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
              '| Browser | Product | Loaded bank PCM peak | Catalog audition peak | Saved-library audition peak | Web MIDI requests | Result |','| --- | --- | ---: | ---: | ---: | ---: | --- |',row('Chrome',chrome),row('Edge',edge),'',
              'Exact flow: Library → query ROM1A → load the filtered valid bank → Voice → Enable local audio → play BRASS 1; then catalog Audition first voice; then saved-library Audition local. Filename filtering and padded Yamaha display names are handled independently from visible catalog labels.','',
              'All three paths require measurable AudioWorklet PCM and zero Web MIDI requests. Software/browser validation only; no physical FM-1 or DX7 equivalence claim.',''
          ]),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md'); text=plan.read_text(encoding='utf-8')
              old='- [ ] Add direct local audition actions for catalog/library voices without first loading them into the editor; keep audition, load and hardware transmission as distinct user actions. Implementation is in progress; do not mark complete until the final mounted Chrome/Edge audition receipt succeeds.'
              new='- [x] Add direct local audition actions for catalog/library voices without first loading them into the editor; keep audition, load and hardware transmission as distinct user actions. Imported-bank and audition PCM are validated in Chrome/Edge. Evidence: [`docs/validation/imported-bank-virtual-audio-browser.md`](./docs/validation/imported-bank-virtual-audio-browser.md).'
              if old in text: text=text.replace(old,new,1)
              plan.write_text(text,encoding='utf-8')
          Path('.github/workflows/validate-imported-bank-audio-browser-v5.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit runner and evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): align imported-bank catalog acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
