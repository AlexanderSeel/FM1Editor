name: Integrate DX7 session panel

on:
  push:
    branches:
      - main
    paths:
      - docs/validation/.trigger-voice-editor-session-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch VoiceEditor
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/VoiceEditor.tsx')
          content = path.read_text(encoding='utf-8')

          old_import = "import { EnvelopeGraph } from './EnvelopeGraph'"
          new_import = "import { Dx7OperatorSessionPanel } from './Dx7OperatorSessionPanel'\nimport { EnvelopeGraph } from './EnvelopeGraph'"
          if old_import not in content:
              raise SystemExit('Missing VoiceEditor import anchor')
          content = content.replace(old_import, new_import, 1)

          old_panel = '''      <OperatorRoutingEditor
        key={documentKey}
        onChange={onChange}
        onSelect={setSelectedOperator}
        selectedOperator={selectedOperator}
        voice={voice}
      />

      <section className="rounded-2xl border border-white/10 bg-white/[0.025] p-4">'''
          new_panel = '''      <OperatorRoutingEditor
        key={documentKey}
        onChange={onChange}
        onSelect={setSelectedOperator}
        selectedOperator={selectedOperator}
        voice={voice}
      />

      <Dx7OperatorSessionPanel documentKey={documentKey} />

      <section className="rounded-2xl border border-white/10 bg-white/[0.025] p-4">'''
          if old_panel not in content:
              raise SystemExit('Missing VoiceEditor panel anchor')
          content = content.replace(old_panel, new_panel, 1)
          path.write_text(content, encoding='utf-8')

      - name: Commit VoiceEditor integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VoiceEditor.tsx
          git commit -m "feat(dx7): integrate operator session panel"
          git push
