name: Integrate DX7 session panel

on:
  push:
    branches:
      - main
    paths:
      - docs/validation/.trigger-voice-editor-session-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch VoiceEditor
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/VoiceEditor.tsx')
          content = path.read_text(encoding='utf-8')

          session_import = "import { Dx7OperatorSessionPanel } from './Dx7OperatorSessionPanel'"
          if session_import not in content:
              import_anchor = "import { EnvelopeGraph } from './EnvelopeGraph'"
              if import_anchor not in content:
                  raise SystemExit('Missing VoiceEditor import anchor')
              content = content.replace(import_anchor, f"{session_import}\n{import_anchor}", 1)

          session_panel = '      <Dx7OperatorSessionPanel documentKey={documentKey} />'
          if session_panel not in content:
              panel_anchor = '''      <OperatorRoutingEditor
        key={documentKey}
        onChange={onChange}
        onSelect={setSelectedOperator}
        selectedOperator={selectedOperator}
        voice={voice}
      />'''
              if panel_anchor not in content:
                  raise SystemExit('Missing VoiceEditor panel anchor')
              content = content.replace(panel_anchor, f"{panel_anchor}\n\n{session_panel}", 1)

          path.write_text(content, encoding='utf-8')

      - name: Commit VoiceEditor integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VoiceEditor.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(dx7): integrate operator session panel"
          git push
