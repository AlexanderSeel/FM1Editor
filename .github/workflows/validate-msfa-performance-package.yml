name: Validate flat MSFA performance package

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-msfa-performance-package.yml']

permissions:
  contents: write

concurrency:
  group: validate-msfa-performance-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build reproducible package
        run: |
          mkdir -p .tmp/source/msfa .tmp/out-a .tmp/out-b generated-package
          cp -R third_party/msfa/src/. .tmp/source/msfa/
          docker run --rm -v "$PWD:/repo" -w /repo \
            emscripten/emsdk@sha256:8acec700a48dbff5250afc1e3ee545b7c002b689043ee82c277de6481a237fd7 \
            bash -lc 'bash scripts/build-msfa-spike.sh /repo/.tmp/source /repo/.tmp/out-a wasm && bash scripts/build-msfa-spike.sh /repo/.tmp/source /repo/.tmp/out-b wasm'
          WASM_A=$(sha256sum .tmp/out-a/fm1-msfa.wasm | cut -d' ' -f1)
          WASM_B=$(sha256sum .tmp/out-b/fm1-msfa.wasm | cut -d' ' -f1)
          GLUE_A=$(sha256sum .tmp/out-a/fm1-msfa.mjs | cut -d' ' -f1)
          GLUE_B=$(sha256sum .tmp/out-b/fm1-msfa.mjs | cut -d' ' -f1)
          test "$WASM_A" = "$WASM_B"
          test "$GLUE_A" = "$GLUE_B"
          cp .tmp/out-a/fm1-msfa.mjs generated-package/fm1-msfa.mjs
          cp .tmp/out-a/fm1-msfa.wasm generated-package/fm1-msfa.wasm
          cp public/virtual-dx7/manifest.json generated-package/manifest.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('generated-package/manifest.json'); d=json.loads(p.read_text())
          d['wasm']['sha256']=hashlib.sha256(Path('generated-package/fm1-msfa.wasm').read_bytes()).hexdigest()
          d['glue']['sha256']=hashlib.sha256(Path('generated-package/fm1-msfa.mjs').read_bytes()).hexdigest()
          d['performanceControlAbi']=1
          p.write_text(json.dumps(d,indent=2)+'\n')
          Path('generated-package/build-result.json').write_text(json.dumps({
            'wasmSha256':d['wasm']['sha256'],
            'glueSha256':d['glue']['sha256'],
            'fixedPcmSha256':d['acceptedReferencePcmSha256'],
            'performanceControlAbi':1
          },indent=2)+'\n')
          PY
      - name: Verify generated module and fixed PCM
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'
          import { pathToFileURL } from 'node:url'
          import { resolve } from 'node:path'
          const factory=(await import(pathToFileURL(resolve('generated-package/fm1-msfa.mjs')).href)).default
          const wasmBinary=new Uint8Array(await readFile('generated-package/fm1-msfa.wasm'))
          const module=await factory({wasmBinary,locateFile:(path)=>path})
          const hex=(await readFile('native/virtual-dx7-spike/reference-patch-v1.hex','utf8')).replace(/\s/g,'')
          const patch=Uint8Array.from(hex.match(/../g),(value)=>Number.parseInt(value,16))
          const pp=module._malloc(156); const frames=72000; const op=module._malloc(frames*4)
          try {
            module.HEAPU8.set(patch,pp)
            if(module._fm1_msfa_render(pp,156,60,100,48000,48000,24000,42,op,frames)!==0) throw new Error('offline render failed')
            const start=op/4; const pcm=new Float32Array(module.HEAPF32.slice(start,start+frames))
            const hash=createHash('sha256').update(Buffer.from(pcm.buffer)).digest('hex')
            if(hash!=='313be5ffcb29436e92ecce45b5e1002c72dd810c6999379844b82ce87a18cfc2') throw new Error('fixed PCM changed: '+hash)
            const session=module._fm1_msfa_session_create(48000)
            if(!session) throw new Error('session create failed')
            try {
              if(module._fm1_msfa_session_load_patch(session,pp,156,42)!==0) throw new Error('load failed')
              if(module._fm1_msfa_session_configure_performance(session,12,0,99,1,99,2)!==0) throw new Error('configure failed')
              if(module._fm1_msfa_session_set_pitch_bend(session,16383)!==0) throw new Error('bend failed')
              if(module._fm1_msfa_session_set_modulation(session,127)!==0) throw new Error('mod failed')
              if(module._fm1_msfa_session_set_aftertouch(session,127)!==0) throw new Error('aftertouch failed')
              if(module._fm1_msfa_session_set_pitch_bend(session,20000)!==9) throw new Error('invalid value not rejected')
            } finally { module._fm1_msfa_session_destroy(session) }
          } finally { module._free(op); module._free(pp) }
          NODE
      - name: Software suite with generated package
        run: |
          cp generated-package/fm1-msfa.mjs public/virtual-dx7/fm1-msfa.mjs
          cp generated-package/fm1-msfa.wasm public/virtual-dx7/fm1-msfa.wasm
          cp generated-package/manifest.json public/virtual-dx7/manifest.json
          npm install --no-audit --no-fund
          npm run audit:virtual-dx7
          node --check scripts/test-msfa-audioworklet-browser.mjs
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: generated-performance-package
          path: generated-package/
          if-no-files-found: error

  browser:
    needs: build
    if: needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: generated-performance-package
          path: generated-package
      - name: Overlay generated package
        shell: pwsh
        run: |
          Get-ChildItem generated-package
          Copy-Item generated-package\fm1-msfa.mjs public\virtual-dx7\fm1-msfa.mjs -Force
          Copy-Item generated-package\fm1-msfa.wasm public\virtual-dx7\fm1-msfa.wasm -Force
          Copy-Item generated-package\manifest.json public\virtual-dx7\manifest.json -Force
      - name: Browser performance smoke
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          if ($env:BROWSER_NAME -eq 'chrome') {
            $candidates=@("$env:ProgramFiles\Google\Chrome\Application\chrome.exe","${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          } else {
            $candidates=@("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe")
          }
          $browser=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $result="performance-$env:BROWSER_NAME.json"
          if(-not $browser){ @{ok=$false;browserName=$env:BROWSER_NAME;error='browser executable missing'} | ConvertTo-Json | Set-Content -Encoding utf8 $result; exit 1 }
          node scripts/test-msfa-audioworklet-browser.mjs --browser-executable "$browser" --browser-name "$env:BROWSER_NAME" --soak-seconds 20 --result "$result"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-result-${{ matrix.browser }}
          path: performance-${{ matrix.browser }}.json
          if-no-files-found: error

  record:
    if: always()
    needs: [build,browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download package
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: generated-performance-package
          path: generated-package
      - name: Download browser results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: performance-result-*
          path: browser-results
          merge-multiple: true
      - name: Record result, publish only on full success, self-clean
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          build_ok=os.environ.get('BUILD_RESULT')=='success'
          results=[]
          for name in ['chrome','edge']:
              p=Path('browser-results')/f'performance-{name}.json'
              if p.exists():
                  try:d=json.loads(p.read_text(encoding='utf-8-sig'))
                  except Exception as exc:d={'ok':False,'browserName':name,'error':f'invalid result: {exc}'}
              else:d={'ok':False,'browserName':name,'error':'result missing'}
              results.append(d)
          browser_ok=all(bool(d.get('ok')) and d.get('performanceControlAbi')==1 and d.get('performanceCommandsVerified') is True and isinstance(d.get('sustainedPeak'),(int,float)) and d.get('sustainedPeak')>1e-6 and d.get('processorErrors')==0 and d.get('suspendedObservations')==0 for d in results)
          ok=build_ok and browser_ok
          build_data={}
          bp=Path('generated-package/build-result.json')
          if bp.exists(): build_data=json.loads(bp.read_text(encoding='utf-8-sig'))
          if ok:
              for name in ['fm1-msfa.mjs','fm1-msfa.wasm','manifest.json']:
                  shutil.copy2(Path('generated-package')/name,Path('public/virtual-dx7')/name)
          lines=['# MSFA performance-control package validation','',f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall performance package gate: **{'SUCCESS' if ok else 'FAILED'}**",'',f"- Reproducible build/software: **{'SUCCESS' if build_ok else 'FAILED'}**",f"- Chrome/Edge runtime: **{'SUCCESS' if browser_ok else 'FAILED'}**",f"- Generated WASM SHA-256: `{build_data.get('wasmSha256','n/a')}`",f"- Generated glue SHA-256: `{build_data.get('glueSha256','n/a')}`",f"- Fixed PCM SHA-256: `{build_data.get('fixedPcmSha256','n/a')}`",'', '| Browser | Result | Version | Perf ABI | Sustain peak | Processor errors | Suspensions |','| --- | --- | --- | ---: | ---: | ---: | ---: |']
          for d in results: lines.append(f"| {d.get('browserName','?')} | **{'SUCCESS' if d.get('ok') else 'FAILURE'}** | {d.get('browserProduct','n/a')} | {d.get('performanceControlAbi','n/a')} | {d.get('sustainedPeak','n/a')} | {d.get('processorErrors','n/a')} | {d.get('suspendedObservations','n/a')} |")
          lines += ['', '## Boundary','', '- Generated package is published only when reproducible build/software validation and both branded-browser runtime tests succeed.', '- Audited MSFA source files remain unchanged; only the FM1-owned bridge/export ABI and generated Emscripten artifacts change.', '- Fixed offline PCM must remain byte-identical to the accepted reference.', '- Live pitch bend, modulation and aftertouch use documented DX7 function ranges/assignment masks; sustain is worklet lifecycle state.', '- No physical DX7/FM-1 controller scaling, headroom or voice-stealing equivalence is claimed.']
          for d in results: lines += ['',f"## {d.get('browserName','browser')}",'```json',json.dumps(d,indent=2),'```']
          Path('docs/validation/msfa-performance-package.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/validate-msfa-performance-package.yml').unlink(missing_ok=True)
          PY
      - name: Commit accepted package or failure receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record MSFA performance package validation'
          git pull --rebase origin main
          git push origin HEAD:main
