name: Validate stateful MSFA engine ABI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-msfa-stateful-engine.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Prepare exact audited source
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git init "$RUNNER_TEMP/dexed"
            git -C "$RUNNER_TEMP/dexed" remote add origin https://github.com/asb2m10/dexed.git
            git -C "$RUNNER_TEMP/dexed" fetch --depth 1 origin 2e182b3db85c09083ab13c8b9b00565ce7d9ff85
            git -C "$RUNNER_TEMP/dexed" checkout --detach FETCH_HEAD
            npm run audit:virtual-dx7 -- --source-root "$RUNNER_TEMP/dexed" --require-hashes
            node scripts/materialize-msfa-spike.mjs --source-root "$RUNNER_TEMP/dexed" --output-root "$RUNNER_TEMP/materialized"
            node scripts/finalize-msfa-source.mjs --source-root "$RUNNER_TEMP/materialized/msfa"
            node scripts/prepare-msfa-distribution.mjs --source-root "$RUNNER_TEMP/materialized/msfa" --manifest "$RUNNER_TEMP/source-manifest.json"
            cmp "$RUNNER_TEMP/source-manifest.json" third_party/msfa/manifest.json
          } 2>&1 | tee "$RUNNER_TEMP/source.log"
      - name: Build stateful WASM twice
        id: wasm
        if: steps.source.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker pull emscripten/emsdk:4.0.7 >/dev/null
          docker image inspect emscripten/emsdk:4.0.7 --format '{{index .RepoDigests 0}}' | tee "$RUNNER_TEMP/emsdk-digest.txt"
          for out in wasm-a wasm-b; do
            docker run --rm -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" emscripten/emsdk:4.0.7 \
              bash scripts/build-msfa-spike.sh "$RUNNER_TEMP/materialized" "$RUNNER_TEMP/$out" wasm
          done 2>&1 | tee "$RUNNER_TEMP/wasm-build.log"
          sha256sum "$RUNNER_TEMP/wasm-a/fm1-msfa.wasm" | tee "$RUNNER_TEMP/wasm-a.sha"
          sha256sum "$RUNNER_TEMP/wasm-b/fm1-msfa.wasm" | tee "$RUNNER_TEMP/wasm-b.sha"
          cmp "$RUNNER_TEMP/wasm-a/fm1-msfa.wasm" "$RUNNER_TEMP/wasm-b/fm1-msfa.wasm"
      - name: Preserve accepted offline reference
        id: offline
        if: steps.wasm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-msfa-wasm-spike.mjs --module "$RUNNER_TEMP/wasm-a/fm1-msfa.mjs" \
            --patch native/virtual-dx7-spike/reference-patch-v1.hex --output "$RUNNER_TEMP/offline.f32" --random-seed 42 2>&1 | tee "$RUNNER_TEMP/offline.json"
          hash=$(sha256sum "$RUNNER_TEMP/offline.f32" | awk '{print $1}')
          test "$hash" = '313be5ffcb29436e92ecce45b5e1002c72dd810c6999379844b82ce87a18cfc2'
      - name: Validate stateful session equivalence
        id: stateful
        if: steps.wasm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-msfa-realtime-wasm.mjs --module "$RUNNER_TEMP/wasm-a/fm1-msfa.mjs" \
            --patch native/virtual-dx7-spike/reference-patch-v1.hex 2>&1 | tee "$RUNNER_TEMP/stateful.json"
      - name: Measure artifact size and publish v3
        id: package
        if: steps.offline.outcome == 'success' && steps.stateful.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json, os, shutil
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          wasm=t/'wasm-a/fm1-msfa.wasm'; glue=t/'wasm-a/fm1-msfa.mjs'
          compressed=len(gzip.compress(wasm.read_bytes()))+len(gzip.compress(glue.read_bytes()))
          if compressed > 1048576: raise SystemExit('stateful artifact exceeds 1 MiB compressed')
          shutil.copy2(wasm,'public/virtual-dx7/fm1-msfa.wasm')
          shutil.copy2(glue,'public/virtual-dx7/fm1-msfa.mjs')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('public/virtual-dx7/manifest.json').read_text())
          m['engineVersion']='msfa-2e182b3-fm1-v3-stateful'
          m['wasm']['sha256']=sha('public/virtual-dx7/fm1-msfa.wasm')
          m['glue']['sha256']=sha('public/virtual-dx7/fm1-msfa.mjs')
          m['statefulSessionAbi']=1
          m['renderBlockFrames']=64
          m['limitations']=['standard-12-TET only','dry engine only','AudioWorklet browser soak not yet validated','not physical-device validation']
          Path('public/virtual-dx7/manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          t.joinpath('size.json').write_text(json.dumps({'wasmBytes':wasm.stat().st_size,'glueBytes':glue.stat().st_size,'compressedCombinedBytes':compressed}))
          PY
      - id: typecheck
        if: steps.install.outcome == 'success' && steps.package.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck
      - id: lint
        if: steps.install.outcome == 'success' && steps.package.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - id: tests
        if: steps.install.outcome == 'success' && steps.package.outcome == 'success'
        continue-on-error: true
        run: npm run test
      - id: build
        if: steps.install.outcome == 'success' && steps.package.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Record receipt and self-clean
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          WASM: ${{ steps.wasm.outcome }}
          OFFLINE: ${{ steps.offline.outcome }}
          STATEFUL: ${{ steps.stateful.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys=['SOURCE','WASM','OFFLINE','STATEFUL','PACKAGE','TYPECHECK','LINT','TESTS','BUILD']
          r={k.lower():os.environ[k] for k in keys}; ok=all(v=='success' for v in r.values()); t=Path(os.environ['RUNNER_TEMP'])
          def txt(n):
            p=t/n; return p.read_text(errors='replace').strip() if p.exists() else 'not produced'
          def lastjson(n):
            x=txt(n)
            if x=='not produced': return None
            for line in reversed(x.splitlines()):
              try:return json.loads(line)
              except:pass
          def token(n):
            x=txt(n); return x.split()[0] if x!='not produced' else x
          off=lastjson('offline.json'); state=lastjson('stateful.json'); size=lastjson('size.json')
          lines=['# Stateful MSFA session validation','',f"Validated source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'', '| Check | Result |','| --- | --- |']
          lines += [f"| {k} | **{v.upper()}** |" for k,v in r.items()]
          lines += ['', '## Evidence','',f"- WASM build A: `{token('wasm-a.sha')}`",f"- WASM build B: `{token('wasm-b.sha')}`",f"- Emscripten: `{txt('emsdk-digest.txt')}`"]
          if off: lines.append(f"- Offline fixed render remained `{off['sha256']}` ({off['frames']} frames).")
          if state:
            lines += [f"- Stateful block reconstruction: `{state['fixedSha256']}` across {state['fixedFrames']} frames.",f"- Engine block: {state['blockFrames']} frames; target worklet callback: {state['callbackFrames']} frames.",f"- Note-off release matches offline reference: {state['noteOffReleaseMatchesOfflineReference']}.",f"- All-notes-off immediate silence: {state['allNotesOffImmediateSilence']}."]
          if size: lines.append(f"- Artifact: {size['wasmBytes']} WASM bytes + {size['glueBytes']} glue bytes; gzip combined {size['compressedCombinedBytes']} bytes.")
          if Path('public/virtual-dx7/manifest.json').exists():
            m=json.loads(Path('public/virtual-dx7/manifest.json').read_text()); lines += [f"- Published engine: `{m['engineVersion']}`",f"- Published WASM: `{m['wasm']['sha256']}`"]
          lines += ['', 'The stateful API owns one persistent patch/controller/LFO/note session. `noteOff` enters normal envelope release; `allNotesOff` immediately silences and reconstructs note state. LFO state advances on silent render blocks so key-sync-off remains free-running.', '', 'No AudioWorklet/browser or physical-device validation is claimed. The temporary workflow removes itself; normal CI remains read-only.']
          if not ok:
            lines += ['', '## Failure logs']
            for n in ['source.log','wasm-build.log','offline.json','stateful.json']:
              x=txt(n)
              if x!='not produced': lines += ['',f'### `{n}`','```text','\n'.join(x.splitlines()[-50:]),'```']
          Path('docs/validation/msfa-stateful-session.md').write_text('\n'.join(lines)+'\n')
          Path('.github/workflows/validate-msfa-stateful-engine.yml').unlink(missing_ok=True)
          PY
      - name: Commit package and cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat(audio): publish stateful virtual DX7 engine'
          git pull --rebase origin main
          git push origin HEAD:main
