name: Validate non-hardware roadmap closure

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-non-hardware-roadmap-closure.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate roadmap evidence boundary
        shell: python
        run: |
          from pathlib import Path
          plan = Path('PLAN.md').read_text(encoding='utf-8')
          provider = Path('docs/research/additional-patch-providers.md').read_text(encoding='utf-8')
          accelerator = Path('docs/validation/reconstruction-accelerator-contract.md').read_text(encoding='utf-8')
          checks = {
              'plan declares repository-side boundary': 'repository-side work that can be completed without new external evidence is complete' in plan,
              'provider is not an active checkbox': not any('provider' in line.lower() and line.startswith('- [ ]') for line in plan.splitlines()),
              'accelerator is not an active checkbox': not any('accelerator' in line.lower() and line.startswith('- [ ]') for line in plan.splitlines()),
              'real 2+2+2 remains explicit external evidence': 'genuine 2+2+2 isolated-sound set' in plan and 'human listening' in plan,
              'provider decision is standing policy': 'standing admission policy' in provider.lower() and 'no additional provider adapter should be implemented now' in provider.lower(),
              'accelerator decision is inactive until triggered': 'no active server-accelerator implementation/deployment task' in accelerator.lower() and 'future service activation gate' in accelerator.lower(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' ' + name)
          if failed:
              raise SystemExit('Roadmap boundary validation failed: ' + ', '.join(failed))

      - name: Install
        run: npm ci
      - name: Audit virtual DX7/MSFA sources
        run: npm run audit:virtual-dx7
      - name: Audit reconstruction upstreams
        run: npm run audit:reconstruction-upstreams
      - name: Audit learned assets
        run: npm run audit:learned-assets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build

      - name: Write permanent acceptance receipt and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          import os
          source = os.environ['GITHUB_SHA']
          receipt = f'''# Non-hardware roadmap closure acceptance

Source commit: `{source}`

Software/repository acceptance: **SUCCESS**

| Stage | Exit |
| --- | ---: |
| roadmap-boundary | 0 |
| install | 0 |
| audit-virtual | 0 |
| audit-reconstruction | 0 |
| audit-learned | 0 |
| typecheck | 0 |
| lint | 0 |
| full-test | 0 |
| build | 0 |

- `PLAN.md` contains no active additional-provider adapter task; provider discovery is a standing admission policy and the 2026-08-09 review found no currently admissible candidate.
- `PLAN.md` contains no active remote reconstruction-accelerator implementation/deployment task; the validated local reconstruction path remains authoritative unless committed real-reference evidence activates the documented future-service gate.
- The remaining Audio-to-FM 2+2+2 checkbox is explicitly external evidence: genuine real isolated recordings plus human listening judgments. It is not missing repository implementation and was not fabricated or auto-closed.
- All other remaining roadmap checkboxes require physical FM-1/Yamaha DX7 evidence or depend directly on those physical observations.

This receipt closes currently actionable repository-side work that does not require new external evidence. It does not claim any physical-device pass or human listening result.
'''
          Path('docs/validation/non-hardware-roadmap-closure.md').write_text(receipt, encoding='utf-8')
          Path('.github/workflows/validate-non-hardware-roadmap-closure.yml').unlink()

      - name: Commit acceptance receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/validation/non-hardware-roadmap-closure.md .github/workflows/validate-non-hardware-roadmap-closure.yml
          git commit -m "test(plan): record non-hardware roadmap closure SUCCESS"
          git push
