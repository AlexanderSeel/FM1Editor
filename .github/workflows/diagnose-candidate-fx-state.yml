name: Diagnose candidate FX integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-candidate-fx-state.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply candidate FX UI under validation
        shell: python
        run: |
          from pathlib import Path
          app=Path('src/App.tsx');t=app.read_text(encoding='utf-8')
          if "type Fm1FxState" not in t:t=t.replace("import { createInitializedFxState } from './domain/fx'", "import { createInitializedFxState, type Fm1FxState } from './domain/fx'", 1)
          anchor="""  const loadCatalogVoice = (nextVoice: Dx7Voice) => {\n    if (!confirmDiscardVoiceChanges('Loading another voice')) return\n    setBank([])\n    loadVoiceDocument(nextVoice)\n    setWorkspace('voice')\n  }\n\n"""
          addition=anchor+"""  const loadReconstructionCandidate = (nextVoice: Dx7Voice, nextFxState?: Fm1FxState) => {\n    const replacingDirtyEffects = nextFxState !== undefined && effectsHistory.dirty\n    if ((voiceHistory.dirty || replacingDirtyEffects) && !window.confirm(\n      `The current ${voiceHistory.dirty && replacingDirtyEffects ? 'voice and effects have' : voiceHistory.dirty ? 'voice has' : 'effects have'} unsaved changes. Loading this reconstruction candidate will replace them. Continue?`,\n    )) return\n    setBank([])\n    loadVoiceDocument(nextVoice)\n    if (nextFxState) effectsHistory.reset(nextFxState)\n    setWorkspace('voice')\n  }\n\n"""
          if 'loadReconstructionCandidate' not in t:
            if anchor not in t:raise SystemExit('App load anchor missing')
            t=t.replace(anchor,addition,1)
          old="""                    <AudioToFmReferencePanel\n                      onAuditionVoice={auditionVoice}\n                      onLoadVoice={loadCatalogVoice}\n                      onStopAudition={stopAudition}\n                    />\n"""
          new="""                    <AudioToFmReferencePanel\n                      fxState={effects}\n                      onAuditionVoice={auditionVoice}\n                      onLoadVoice={loadCatalogVoice}\n                      onLoadVoiceWithFx={loadReconstructionCandidate}\n                      onStopAudition={stopAudition}\n                    />\n"""
          if 'onLoadVoiceWithFx={loadReconstructionCandidate}' not in t:
            if old not in t:raise SystemExit('App AudioToFm anchor missing')
            t=t.replace(old,new,1)
          app.write_text(t,encoding='utf-8')

          audio=Path('src/components/AudioToFmReferencePanel.tsx');t=audio.read_text(encoding='utf-8')
          if "type Fm1FxState" not in t:t=t.replace("import type { Dx7Voice } from '../domain/voice'", "import type { Dx7Voice } from '../domain/voice'\nimport type { Fm1FxState } from '../domain/fx'", 1)
          old="""interface AudioToFmReferencePanelProps {\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n  onReferenceChange?: (reference: PreparedReferenceAudio | null) => void\n}\n"""
          new="""interface AudioToFmReferencePanelProps {\n  fxState?: Fm1FxState\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n  onLoadVoiceWithFx?: (voice: Dx7Voice, fxState: Fm1FxState) => void\n  onReferenceChange?: (reference: PreparedReferenceAudio | null) => void\n}\n"""
          if 'onLoadVoiceWithFx?:' not in t:
            if old not in t:raise SystemExit('Audio props anchor missing')
            t=t.replace(old,new,1)
          old="""export function AudioToFmReferencePanel({\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n  onReferenceChange,\n}: AudioToFmReferencePanelProps) {\n"""
          new="""export function AudioToFmReferencePanel({\n  fxState,\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n  onLoadVoiceWithFx,\n  onReferenceChange,\n}: AudioToFmReferencePanelProps) {\n"""
          if '  fxState,\n  onAuditionVoice' not in t:
            if old not in t:raise SystemExit('Audio destructure anchor missing')
            t=t.replace(old,new,1)
          old="""      <NearestPresetPanel\n        onAuditionVoice={onAuditionVoice}\n        onLoadVoice={onLoadVoice}\n        onStopAudition={onStopAudition}\n        reference={reference}\n      />\n"""
          new="""      <NearestPresetPanel\n        {...(fxState === undefined ? {} : { fxState })}\n        onAuditionVoice={onAuditionVoice}\n        onLoadVoice={onLoadVoice}\n        {...(onLoadVoiceWithFx === undefined ? {} : { onLoadVoiceWithFx })}\n        onStopAudition={onStopAudition}\n        reference={reference}\n      />\n"""
          if 'fxState === undefined ? {} : { fxState }' not in t:
            if old not in t:raise SystemExit('Nearest mount anchor missing')
            t=t.replace(old,new,1)
          audio.write_text(t,encoding='utf-8')

          panel=Path('src/components/NearestPresetPanel.tsx');t=panel.read_text(encoding='utf-8')
          if "type Fm1FxState" not in t:t=t.replace("import type { Dx7Voice } from '../domain/voice'", "import type { Dx7Voice } from '../domain/voice'\nimport type { Fm1FxState } from '../domain/fx'", 1)
          artifact_import="import { createDx7VoiceSemanticDiff, createDx7VoiceSyxArtifact } from '../audio/dx7CandidateArtifacts'\n"
          if 'createDx7CandidateFxAttachment' not in t:
            if artifact_import not in t:raise SystemExit('artifact import anchor missing')
            t=t.replace(artifact_import,artifact_import+"import { createDx7CandidateFxAttachment, type Dx7CandidateFxAttachment } from '../audio/dx7CandidateFxState'\n",1)
          old="""interface NearestPresetPanelProps {\n  reference: PreparedReferenceAudio | null\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n}\n"""
          new="""interface NearestPresetPanelProps {\n  reference: PreparedReferenceAudio | null\n  fxState?: Fm1FxState\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n  onLoadVoiceWithFx?: (voice: Dx7Voice, fxState: Fm1FxState) => void\n}\n"""
          if 'onLoadVoiceWithFx?:' not in t:
            if old not in t:raise SystemExit('Nearest props anchor missing')
            t=t.replace(old,new,1)
          old="""export function NearestPresetPanel({\n  reference,\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n}: NearestPresetPanelProps) {\n"""
          new="""export function NearestPresetPanel({\n  reference,\n  fxState,\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n  onLoadVoiceWithFx,\n}: NearestPresetPanelProps) {\n"""
          if '  fxState,\n  onAuditionVoice' not in t:
            if old not in t:raise SystemExit('Nearest destructure anchor missing')
            t=t.replace(old,new,1)
          state_anchor="  const [refinementProgress, setRefinementProgress] = useState<RefinementProgress | null>(null)\n"
          if 'candidateFxById' not in t:t=t.replace(state_anchor,state_anchor+"  const [candidateFxById, setCandidateFxById] = useState<Readonly<Record<string, Dx7CandidateFxAttachment>>>({})\n",1)
          reset_anchor="""    setRefinementResults([])\n    setRefinementProgress(null)\n"""
          if 'setCandidateFxById({})' not in t:t=t.replace(reset_anchor,reset_anchor+"    setCandidateFxById({})\n",1)
          load_button="""                  <button className=\"rounded-lg bg-emerald-300 px-3 py-2 text-xs font-black text-slate-950\" onClick={() => onLoadVoice(item.bestVoice)} type=\"button\">\n                    Load refined\n                  </button>\n"""
          if 'Attach current FX' not in t:
            if load_button not in t:raise SystemExit('load button anchor missing')
            t=t.replace(load_button,"""                  <button className=\"rounded-lg border border-cyan-300/30 px-3 py-2 text-xs font-bold text-cyan-100 disabled:opacity-40\" disabled={!fxState} onClick={() => { if (fxState) setCandidateFxById((current) => ({ ...current, [item.sourceCandidate.id]: createDx7CandidateFxAttachment(fxState) })) }} type=\"button\">{candidateFxById[item.sourceCandidate.id] ? 'Refresh attached FX' : 'Attach current FX'}</button>\n                  {candidateFxById[item.sourceCandidate.id] && onLoadVoiceWithFx && <button className=\"rounded-lg bg-cyan-200 px-3 py-2 text-xs font-black text-slate-950\" onClick={() => { const attachment=candidateFxById[item.sourceCandidate.id]; if (attachment) onLoadVoiceWithFx(item.bestVoice, attachment.state) }} type=\"button\">Load refined + FX</button>}\n"""+load_button,1)
          if 'data-candidate-fx-attached' not in t:
            marker="""              <div className=\"mt-3 rounded-lg border border-white/8 bg-black/15 p-2\">\n                <p className=\"text-[10px] font-bold uppercase tracking-[0.12em] text-slate-500\">Semantic changes from retrieved start</p>\n"""
            idx=t.rfind(marker)
            if idx<0:raise SystemExit('semantic diff marker missing')
            # Insert attachment summary immediately before semantic changes on refined card.
            attach="""              {candidateFxById[item.sourceCandidate.id] && <p className=\"mt-3 text-[10px] text-cyan-200\" data-candidate-fx-attached=\"true\">Attached FM-1-inspired FX snapshot · channel {candidateFxById[item.sourceCandidate.id]?.state.midiChannel} · {candidateFxById[item.sourceCandidate.id]?.nonZeroControls} non-zero controls · local metadata only</p>}\n"""
            t=t[:idx]+attach+t[idx:]
          panel.write_text(t,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting software gate
        id: gate
        shell: bash
        run: |
          set +e; : >/tmp/candidate-fx-gate.txt
          run_stage(){ local n="$1";shift;echo "=== $n ==="|tee -a /tmp/candidate-fx-gate.txt;"$@" 2>&1|tee -a /tmp/candidate-fx-gate.txt;local c=${PIPESTATUS[0]};echo "$n=$c" >> "$GITHUB_OUTPUT"; }
          run_stage audit npm run audit:virtual-dx7
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused npm test -- src/audio/dx7CandidateFxState.test.ts src/audio/dx7CandidateArtifacts.test.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.test.tsx
          run_stage test npm run test
          run_stage build npm run build
          if [ "$(grep -E '^(audit|typecheck|lint|focused|test|build)=' "$GITHUB_OUTPUT"|grep -vc '=0$')" -eq 0 ];then echo ok=true >> "$GITHUB_OUTPUT";else echo ok=false >> "$GITHUB_OUTPUT";fi
      - name: Persist result
        if: always()
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: python
        run: |
          import os,subprocess
          from pathlib import Path
          ok=os.environ.get('OK')=='true';log=Path('/tmp/candidate-fx-gate.txt').read_text(encoding='utf-8',errors='replace')
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {n} | {os.environ.get(k,"?")} |' for n,k in [('audit','AUDIT'),('typecheck','TYPECHECK'),('lint','LINT'),('focused','FOCUSED'),('full tests','TEST'),('build','BUILD')]]
          Path('docs/validation/dx7-candidate-fx-state-ui.md').write_text('\n'.join(['# Audio → FM optional candidate FX-state software validation','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'','Refined candidates may explicitly capture a detached FM-1-inspired software FX snapshot. Voice-only audition/export/load remain separate; combined load is explicit and has no hardware send behavior.','','```text',log[-18000:],'```','']),encoding='utf-8')
          if not ok:subprocess.run(['git','checkout','--','src/App.tsx','src/components/AudioToFmReferencePanel.tsx','src/components/NearestPresetPanel.tsx'],check=True)
          Path('.github/workflows/integrate-candidate-fx-state.yml').unlink(missing_ok=True);Path('.github/workflows/diagnose-candidate-fx-state.yml').unlink(missing_ok=True)
      - name: Commit evidence and validated source
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(audio): record candidate FX integration gate' || true;git pull --rebase origin main;git push origin HEAD:main
