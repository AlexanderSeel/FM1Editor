name: Validate reconstruction comparison harness

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-reconstruction-comparison-harness.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/reconstructionComparison.test.ts
      - run: npm run test
      - run: npm run build
      - name: Persist receipt
        shell: bash
        run: |
          cat > docs/validation/reconstruction-comparison-harness.md <<EOF
          # Reconstruction comparison harness

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          The repository now has a common experiment schema for retrieval, evolutionary and future learned-initialization reconstruction approaches. Each approach is measured using the same case kind, runtime clock, candidate count, best objective distance, best-candidate index, source initialization, optional metric breakdown and explicit failure field. Synthetic ground-truth and real-isolated-sound cases are distinguished.

          The harness does not claim that a learned initializer or real-isolated-sound benchmark is available yet, and therefore does not close the comparison roadmap item.

          Strict typecheck, lint, focused tests, full tests and production build passed.
          EOF
          rm .github/workflows/validate-reconstruction-comparison-harness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): accept reconstruction comparison harness'
          git pull --rebase origin main
          git push origin HEAD:main
