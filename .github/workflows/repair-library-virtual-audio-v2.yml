import { createInitializedVoice, type Dx7Voice } from '../domain/voice'
import { decodePackedVoice, encodePackedVoice } from '../sysex/dx7'
import { fingerprintVoice } from './model'
import { normalizeStoredPatchRecord, repairLegacyPackedVoice } from './storageMigration'

function legacyCorruptFromPacked(voice: Dx7Voice): Dx7Voice {
  const packed = voice.source?.packed
  if (!(packed instanceof Uint8Array)) throw new Error('test voice has no packed source')
  const operators = voice.operators.map((operator, operatorIndex) => {
    const offset = (5 - operatorIndex) * 17
    const curvesAndScaling = packed[offset + 11] ?? 0
    const modulationAndVelocity = packed[offset + 12] ?? 0
    const oscillatorAndCoarse = packed[offset + 14] ?? 0
    return {
      ...operator,
      keyboardScaling: { ...operator.keyboardScaling, rateScaling: (curvesAndScaling >> 4) & 7 },
      amplitudeModulationSensitivity: modulationAndVelocity & 3,
      keyVelocitySensitivity: (modulationAndVelocity >> 2) & 7,
      outputLevel: packed[offset + 13] ?? 0,
      oscillatorMode: (oscillatorAndCoarse & 1) === 0 ? 'ratio' as const : 'fixed' as const,
      frequencyCoarse: (oscillatorAndCoarse >> 1) & 31,
      frequencyFine: packed[offset + 15] ?? 0,
      detune: Math.min((packed[offset + 16] ?? 0) & 15, 14),
    }
  }) as unknown as Dx7Voice['operators']
  return { ...voice, operators }
}

describe('IndexedDB record migration', () => {
  it('normalizes metadata and fingerprints', () => {
    const voice=createInitializedVoice('LEGACY PAD')
    const migrated=normalizeStoredPatchRecord({ id:'legacy-1', fingerprint:'stale', voice, tags:[' Pad ',42,'bright','pad'], favorite:1, createdAt:'2026-08-01T08:00:00.000Z', origin:{kind:'unknown',label:''} },'2026-08-05T10:00:00.000Z')
    expect(migrated).toMatchObject({ id:'legacy-1', fingerprint:fingerprintVoice(voice), tags:['bright','pad'], favorite:false, origin:{kind:'file',label:'Migrated local library'} })
  })

  it('repairs every shifted packed operator field', () => {
    const canonical=createInitializedVoice('CACHED PAD')
    canonical.operators[1]={ ...canonical.operators[1], keyboardScaling:{...canonical.operators[1].keyboardScaling,rateScaling:6}, amplitudeModulationSensitivity:3, keyVelocitySensitivity:5, outputLevel:87, oscillatorMode:'fixed', frequencyCoarse:27, frequencyFine:73, detune:12 }
    const legacy=legacyCorruptFromPacked(decodePackedVoice(encodePackedVoice(canonical)))
    const repaired=repairLegacyPackedVoice(legacy)
    expect(repaired.operators[1]).toMatchObject({ keyboardScaling:{rateScaling:6}, amplitudeModulationSensitivity:3, keyVelocitySensitivity:5, outputLevel:87, oscillatorMode:'fixed', frequencyCoarse:27, frequencyFine:73, detune:12 })
  })

  it('preserves an explicit edit while repairing untouched fields', () => {
    const canonical=createInitializedVoice('EDIT KEPT')
    canonical.operators[2].outputLevel=91
    canonical.operators[2].frequencyCoarse=19
    const legacy=legacyCorruptFromPacked(decodePackedVoice(encodePackedVoice(canonical)))
    const edited: Dx7Voice={ ...legacy, operators:legacy.operators.map((op,index)=>index===2?{...op,outputLevel:77}:op) as unknown as Dx7Voice['operators'] }
    const repaired=repairLegacyPackedVoice(edited)
    expect(repaired.operators[2].outputLevel).toBe(77)
    expect(repaired.operators[2].frequencyCoarse).toBe(19)
  })

  it('creates fallback IDs and rejects invalid stored voices', () => {
    const voice=createInitializedVoice('NO ID')
    expect(normalizeStoredPatchRecord({voice},'2026-08-05T10:00:00.000Z')?.id).toBe(`migrated-${fingerprintVoice(voice)}`)
    expect(normalizeStoredPatchRecord({voice:{name:'BROKEN'}})).toBeNull()
    expect(normalizeStoredPatchRecord(null)).toBeNull()
  })
})
