name: Audit archived SpiegeLib learned-label order v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-spiegelib-label-order-v2.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-reporting label audit
        shell: bash
        run: |
          set +e
          : > label-stage-codes.txt
          run_stage() { name="$1"; shift; "$@" > "label-$name.log" 2>&1; code=$?; cat "label-$name.log"; echo "$name=$code" >> label-stage-codes.txt; return 0; }
          cat >/tmp/download.sh <<'SH'
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors https://zenodo.org/api/records/3722784/files/data_simple_FM_mfcc.zip/content -o mfcc.zip
          echo '7c9357219b70c07a4ab115d332f78ef5  mfcc.zip' | md5sum -c --strict
          unzip -l mfcc.zip | grep -Ei 'patch|train' || true
          member=$(unzip -Z1 mfcc.zip | grep -Ei '(^|/)train_patches\.npy$' | head -1)
          test -n "$member"
          echo "$member" > patch-member.txt
          unzip -p mfcc.zip "$member" > train_patches.npy
          test -s train_patches.npy
          SH
          run_stage download bash /tmp/download.sh
          cat >/tmp/inspect.sh <<'SH'
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input numpy==1.26.4
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,numpy as np
          patches=np.load('train_patches.npy',allow_pickle=False,mmap_mode='r')
          columns=[]
          for index in range(patches.shape[1] if patches.ndim==2 else 0):
              values=np.asarray(patches[:,index],dtype=np.float64); unique=np.unique(values)
              columns.append({'index':index,'uniqueCount':int(unique.size),'min':float(values.min()),'max':float(values.max()),'firstUnique':[float(v) for v in unique[:20]]})
          result={'member':Path('patch-member.txt').read_text().strip(),'sha256':hashlib.sha256(Path('train_patches.npy').read_bytes()).hexdigest(),'shape':list(patches.shape),'columns':columns}
          Path('label-order.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if patches.shape != (50000,9): raise SystemExit(f'unexpected patch shape {patches.shape}')
          counts=[c['uniqueCount'] for c in columns]
          if counts[6:] != [32,100,15]: raise SystemExit(f'last three columns do not match coarse/fine/detune quantization: {counts}')
          if any(count != 100 for count in counts[:6]): raise SystemExit(f'first six envelope columns not 100-value normalized controls: {counts}')
          PY
          SH
          run_stage inspect bash /tmp/inspect.sh
      - name: Persist audit result
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json,os
          codes={}
          p=Path('label-stage-codes.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                n,v=line.split('=',1)
                try:codes[n]=int(v)
                except:codes[n]=999
          stages=['download','inspect'];ok=all(codes.get(s)==0 for s in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {s} | {codes.get(s,"?")} |' for s in stages]
          details=[]
          if Path('label-order.json').exists():
            result=json.loads(Path('label-order.json').read_text());details=[f"- member: `{result['member']}`",f"- SHA-256: `{result['sha256']}`",f"- shape: `{result['shape']}`",f"- unique counts: `{[c['uniqueCount'] for c in result['columns']]}`"]
          failures=[]
          if not ok:
            for s in stages:
              if codes.get(s)==0:continue
              log=Path(f'label-{s}.log');text=log.read_text(errors='replace') if log.exists() else 'missing log';failures += ['',f'## {s} failure tail','','```text',text[-14000:],'```']
          Path('docs/research/spiegelib-label-order.md').write_text('\n'.join(['# SpiegeLib archived learned-label order audit','',f"FM1 Editor source commit: `{os.environ['GITHUB_SHA']}`",'',f"Audit status: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'',*details,'','A SUCCESS independently identifies output columns 6/7/8 as coarse/fine/detune from their 32/100/15 discrete normalized values. The first six 100-value controls remain mapped by the pinned historical Dexed host-parameter sequence in the experiment configuration/code.',*failures,'']))
          for name in ['.github/workflows/audit-spiegelib-label-order-v2.yml','.github/workflows/audit-spiegelib-label-order.yml']:Path(name).unlink(missing_ok=True)
          for path in Path('.').glob('label-*.log'):path.unlink(missing_ok=True)
          for name in ['mfcc.zip','train_patches.npy','patch-member.txt','label-order.json','label-stage-codes.txt']:Path(name).unlink(missing_ok=True)
      - name: Commit audit result
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record SpiegeLib label-order audit v2' || true
          git pull --rebase origin main
          git push origin HEAD:main
