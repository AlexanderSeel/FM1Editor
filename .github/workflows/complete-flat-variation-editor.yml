name: Complete flat variation editor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-flat-variation-editor.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate variation panel
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/VoiceEditor.tsx')
          text = path.read_text()
          import_marker = "import { KeyboardScalingGraph } from './KeyboardScalingGraph'\n"
          import_line = "import { VoiceVariationPanel } from './VoiceVariationPanel'\n"
          if import_line not in text:
            if import_marker not in text:
              raise SystemExit('VoiceEditor import marker not found.')
            text = text.replace(import_marker, import_marker + import_line, 1)

          component_marker = "\n      <OperatorRoutingEditor\n"
          component = "\n      <VoiceVariationPanel key={documentKey} onChange={onChange} voice={voice} />\n\n      <OperatorRoutingEditor\n"
          if '<VoiceVariationPanel ' not in text:
            if component_marker not in text:
              raise SystemExit('VoiceEditor component marker not found.')
            text = text.replace(component_marker, component, 1)

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and accessibility
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Validate visual refinements and variation workflow
        shell: bash
        run: |
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 > /tmp/fm1-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          cat > artifacts/validate-flat-variation.mjs <<'JS'
          import { chromium } from 'playwright'
          import { strict as assert } from 'node:assert'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } })
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })

          const chassis = page.locator('.fm1-chassis')
          const chassisRadius = Number.parseFloat(await chassis.evaluate((element) => getComputedStyle(element).borderTopLeftRadius))
          assert.ok(chassisRadius <= 14, `Expected flatter chassis radius, received ${chassisRadius}`)

          const genericButton = page.getByRole('button', { name: 'Undo last editor change' })
          const buttonRadius = Number.parseFloat(await genericButton.evaluate((element) => getComputedStyle(element).borderTopLeftRadius))
          assert.ok(buttonRadius <= 5, `Expected flat hardware button radius, received ${buttonRadius}`)

          const variationPanel = page.getByText('Variations and A/B comparison').locator('..').locator('..')
          await variationPanel.scrollIntoViewIfNeeded()
          await variationPanel.waitFor()
          const bButton = page.getByRole('button', { name: /^B/ })
          assert.equal(await bButton.isDisabled(), true)
          await page.getByRole('button', { name: 'Randomize voice' }).click()
          assert.equal(await page.getByLabel('Voice name').inputValue(), 'RANDOM')
          assert.equal(await bButton.isDisabled(), false)
          await bButton.click()
          await page.getByRole('button', { name: /^A/ }).click()
          assert.equal(await page.getByLabel('Voice name').inputValue(), 'INIT VOICE')

          const graph = page.getByRole('group', { name: /DX7 algorithm 1 routing controls/ })
          await graph.scrollIntoViewIfNeeded()
          const nodes = graph.locator('.fm1-algorithm-node')
          assert.equal(await nodes.count(), 6)
          for (let index = 0; index < 6; index += 1) {
            const node = nodes.nth(index)
            assert.equal(await node.locator('span').count(), 2)
            const noOverflow = await node.evaluate((element) => element.scrollHeight <= element.clientHeight + 1 && element.scrollWidth <= element.clientWidth + 1)
            assert.equal(noOverflow, true, `Algorithm node ${index + 1} text overflows`)
          }

          const boxes = await nodes.evaluateAll((elements) => elements.map((element) => {
            const rectangle = element.getBoundingClientRect()
            return { left: rectangle.left, right: rectangle.right, top: rectangle.top, bottom: rectangle.bottom }
          }))
          for (let left = 0; left < boxes.length; left += 1) {
            for (let right = left + 1; right < boxes.length; right += 1) {
              const a = boxes[left]
              const b = boxes[right]
              const overlaps = a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top
              assert.equal(overlaps, false, `Algorithm nodes ${left + 1} and ${right + 1} overlap`)
            }
          }

          const envelope = page.getByRole('group', { name: 'Operator 1 amplitude envelope draggable controls' })
          await envelope.scrollIntoViewIfNeeded()
          const envelopePanel = envelope.locator('..')
          const envelopeRadius = Number.parseFloat(await envelopePanel.evaluate((element) => getComputedStyle(element).borderTopLeftRadius))
          assert.ok(envelopeRadius <= 6)

          const rangeControl = page.getByRole('slider', { name: 'Output level' }).locator('..')
          const rangeHeight = await rangeControl.evaluate((element) => element.getBoundingClientRect().height)
          assert.ok(rangeHeight < 70, `Expected compact range control, received ${rangeHeight}`)

          await page.screenshot({ path: 'artifacts/flat-variation-editor.png', fullPage: true })
          await browser.close()
          JS
          node artifacts/validate-flat-variation.mjs
          rm artifacts/validate-flat-variation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: flat-variation-editor-render
          path: artifacts/flat-variation-editor.png
          if-no-files-found: error
      - name: Commit integration and validation
        shell: bash
        run: |
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p docs/validation
          cat > docs/validation/flat-variation-editor.md <<EOF
          # Flat hardware and voice variation validation

          Validated source commit: \`$validated_sha\`

          - npm install: **PASS**
          - npm run typecheck: **PASS**
          - npm run lint: **PASS**
          - npm run test: **PASS**
          - npm run build: **PASS**
          - flat chassis and hardware button radii: **PASS**
          - six non-overlapping algorithm nodes with two-line labels: **PASS**
          - compact envelope and range controls: **PASS**
          - constrained random voice generation: **PASS**
          - automatic A/B staging and recall: **PASS**
          - Chromium desktop render capture: **PASS**

          Verified behavior:

          - surfaces use a flatter short-bevel hardware treatment instead of deep glass gradients;
          - algorithm labels remain inside their nodes without node collisions;
          - envelope values wrap independently and range modules remain compact;
          - initialized variants, constrained randomization and mutation produce valid DX7 voices;
          - generated transformations remove stale imported source representations;
          - every generated result is staged as comparison B while the previous voice is retained in A;
          - applied changes continue through normal application undo/redo.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/VoiceEditor.tsx docs/validation/flat-variation-editor.md
          git commit -m 'feat(editor): integrate voice variations and validate flat UI'
          git push origin HEAD:main
