name: Validate Vite-safe MSFA public loader

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-msfa-vite-public-loader.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run acceptance stages
        shell: bash
        run: |
          set +e
          : > stages.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> stages.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit npm run audit:virtual-dx7
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage msfa-test npm test -- src/audio/msfaOfflineEngine.test.ts src/audio/msfaAudioWorklet.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          set +e
          npm run dev -- --host 127.0.0.1 > dev-server.log 2>&1 &
          pid=$!
          dev_code=1
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/virtual-dx7/fm1-msfa.mjs -o /tmp/fm1-msfa.mjs && curl -fsS http://127.0.0.1:5173/virtual-dx7/fm1-msfa.wasm -o /tmp/fm1-msfa.wasm; then
              dev_code=0
              break
            fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat dev-server.log
          if grep -Fq 'should not be imported from source code' dev-server.log || grep -Fq 'Failed to load url /virtual-dx7/fm1-msfa.mjs' dev-server.log; then dev_code=1; fi
          echo "dev-static=$dev_code" >> stages.txt
          exit 0

      - name: Persist receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('stages.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1)
                try: codes[k]=int(v)
                except ValueError: codes[k]=999
          stages=['install','audit','typecheck','lint','msfa-test','full-test','build','dev-static']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          if not ok:
            for stage in stages:
              if codes.get(stage)==0: continue
              log=Path(f'{stage}.log')
              if stage=='dev-static': log=Path('dev-server.log')
              text=log.read_text(errors='replace') if log.exists() else 'missing log'
              failures += ['',f'## {stage} failure tail','','```text',text[-12000:],'```']
          Path('docs/validation/msfa-vite-public-loader.md').write_text('\n'.join([
            '# Vite-safe MSFA public-module loader acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            '- `public/virtual-dx7/fm1-msfa.mjs` is fetched as a static asset rather than dynamically imported through Vite source transforms',
            '- the fetched module text is imported from a temporary blob URL',
            '- Emscripten `locateFile` resolves `fm1-msfa.wasm` beside the original public module URL, not beside the blob URL',
            '- the regression test asserts the public URL is fetched without Vite `?import` semantics',
            '- the dev-server smoke confirms the committed public `.mjs` and `.wasm` are served directly','',
            *failures,''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-msfa-vite-public-loader.yml').unlink(missing_ok=True)
          for path in Path('.').glob('*.log'): path.unlink(missing_ok=True)
          Path('dev-server.log').unlink(missing_ok=True)
          Path('stages.txt').unlink(missing_ok=True)

      - name: Commit receipt
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/msfa-vite-public-loader.md | grep -oE 'SUCCESS|FAILED' | head -1)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(audio): record Vite-safe MSFA loader $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
