name: Validate real-reference reconstruction benchmark

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-real-reference-reconstruction-benchmark.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run validation stages without short-circuiting evidence
        shell: bash
        run: |
          set +e
          : > validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            echo "=== $name ==="
            "$@" > "validation-$name.log" 2>&1
            code=$?
            cat "validation-$name.log"
            echo "$name=$code" >> validation-stage-codes.txt
          }
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused-test npm test -- src/audio/realReferenceReconstructionBenchmark.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist acceptance receipt and narrow PLAN item on success
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os

          codes = {}
          code_file = Path('validation-stage-codes.txt')
          if code_file.exists():
              for line in code_file.read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      name, value = line.split('=', 1)
                      try:
                          codes[name] = int(value)
                      except ValueError:
                          codes[name] = 999
          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'focused-test', 'full-test', 'build']
          ok = all(codes.get(stage) == 0 for stage in stages)
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]
          logs = []
          if not ok:
              for stage in stages:
                  if codes.get(stage) == 0:
                      continue
                  p = Path(f'validation-{stage}.log')
                  text = p.read_text(encoding='utf-8', errors='replace') if p.exists() else 'log missing'
                  logs.extend(['', f'## {stage} failure tail', '', '```text', text[-12000:], '```'])

          Path('docs/validation/real-reference-reconstruction-benchmark.md').write_text('\n'.join([
              '# Real-reference reconstruction benchmark harness',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              *rows,
              '',
              'The accepted workflow requires an explicit user declaration that the selected uploaded region is one real isolated sound or note. The JSON receipt stores filename, SHA-256, selected-region metadata, pitch metadata, configuration, similarity metrics, runtimes and failure status; it never embeds raw reference samples.',
              '',
              'Retrieval-only and seeded constrained CMA-ES are executable locally against the bundled catalog. Learned initialization remains an explicit unavailable result until a separately license-admitted implementation/checkpoint exists. This software acceptance is not a real-sound benchmark result and does not close the roadmap item by itself.',
              *logs,
              '',
          ]), encoding='utf-8')

          if ok:
              plan = Path('PLAN.md')
              old = '- [ ] Compare retrieval-only, evolutionary and learned-initialization approaches using synthetic ground-truth patches and real isolated sounds; report similarity metrics, runtime and failure cases rather than promising exact reconstruction.'
              new = '- [ ] Run the implemented local comparison receipt on a documented set of real isolated WAV/MP3 references and preserve the exported hash/metrics/runtime evidence. Synthetic ground-truth retrieval/CMA comparison and the real-reference benchmark harness are implemented; learned initialization remains explicitly unavailable until a separately license-admitted implementation/checkpoint exists.'
              text = plan.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit('PLAN reconstruction comparison anchor missing')
              plan.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/validate-real-reference-reconstruction-benchmark.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'):
              path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record real-reference benchmark harness acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
