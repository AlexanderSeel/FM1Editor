name: Fix algorithm graph accessibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-algorithm-a11y.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use an accessible interactive group
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/components/AlgorithmGraph.tsx')
          text = path.read_text()
          old = 'role="img" aria-label={`DX7 algorithm ${algorithm.number} routing diagram`}'
          new = 'role="group" aria-label={`DX7 algorithm ${algorithm.number} routing controls`}'
          if old not in text:
            raise SystemExit('Algorithm canvas role marker not found.')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AlgorithmGraph.tsx
          git commit -m 'fix(a11y): expose algorithm nodes as controls'
          git push origin HEAD:main
