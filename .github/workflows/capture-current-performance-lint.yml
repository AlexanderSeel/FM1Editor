name: Capture current performance lint

on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-current-performance-lint.yml']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture current lint
        run: |
          mkdir -p .tmp
          npm run lint > .tmp/lint-current.log 2>&1 || true
          cat .tmp/lint-current.log
      - name: Record output and self-clean
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log=Path('.tmp/lint-current.log').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/local-performance-lint-current.md').write_text('\n'.join([
            '# Current local performance lint output','',
            f"Diagnostic source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',
            '```text',log[-12000:],'```'
          ])+'\n',encoding='utf-8')
          Path('.github/workflows/capture-current-performance-lint.yml').unlink(missing_ok=True)
          PY
      - name: Commit diagnostic and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record current performance lint output'
          git pull --rebase origin main
          git push origin HEAD:main
