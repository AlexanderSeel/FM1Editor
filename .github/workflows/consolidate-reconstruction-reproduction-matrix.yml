name: Consolidate reconstruction reproduction matrix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-reconstruction-reproduction-matrix.yml']

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run audit:reconstruction-upstreams
      - name: Re-audit exact Sound2Synth pin without executing code
        shell: bash
        run: |
          rm -rf /tmp/sound2synth
          git clone --filter=blob:none https://github.com/Sound2Synth/Sound2Synth.git /tmp/sound2synth
          git -C /tmp/sound2synth checkout --detach 44d9176176d794f7fe3ec96573ce758f4a56896c
          test "$(git -C /tmp/sound2synth rev-parse HEAD)" = "44d9176176d794f7fe3ec96573ce758f4a56896c"
          if find /tmp/sound2synth -maxdepth 1 -type f \( -iname 'LICENSE' -o -iname 'LICENSE.*' -o -iname 'COPYING' -o -iname 'COPYING.*' \) | grep -q .; then
            echo 'Unexpected explicit root license appeared at pinned Sound2Synth commit.' >&2
            exit 1
          fi
          if find /tmp/sound2synth -type f \( -iname '*.ckpt' -o -iname '*.pt' -o -iname '*.pth' -o -iname '*.h5' -o -iname '*.onnx' \) | grep -q .; then
            echo 'Unexpected bundled model artifact appeared at pinned Sound2Synth commit.' >&2
            exit 1
          fi
          cat > docs/validation/sound2synth-license-block.md <<'EOF'
          # Sound2Synth reproduction/license block

          Pinned upstream: `Sound2Synth/Sound2Synth@44d9176176d794f7fe3ec96573ce758f4a56896c`

          Safe reproduction decision: **BLOCKED**

          The exact research pin is retrievable, but it has no explicit root LICENSE/COPYING file and no bundled model checkpoint with an independently reviewable artifact license/hash. FM1 Editor therefore stops before code execution, copying, vendoring or model reuse. The associated Sound2Synth-modified Dexed plug-in is separately GPL-3.0 and remains outside the Apache/MSFA runtime boundary.

          This is a successful provenance gate: execution is intentionally refused until rights are clarified, not treated as an implementation failure.
          EOF
      - name: Re-run SpiegeLib exact-pin container smoke
        shell: bash
        run: |
          rm -rf .spiegelib-reproduction
          docker run --rm -v "$PWD:/workspace" -w /workspace python:3.7-bullseye bash /workspace/scripts/reproduce-spiegelib-container.sh /workspace/.spiegelib-reproduction
      - name: Build SpiegeLib receipt and consolidated matrix
        shell: python
        run: |
          import json, re, shutil
          from pathlib import Path

          root=Path('.spiegelib-reproduction')
          status_path=root/'status.json'
          status=json.loads(status_path.read_text(encoding='utf-8')) if status_path.exists() else {'ok':False}
          log=(root/'execution.log').read_text(encoding='utf-8',errors='replace') if (root/'execution.log').exists() else 'execution log unavailable'
          freeze=(root/'freeze.txt').read_text(encoding='utf-8',errors='replace') if (root/'freeze.txt').exists() else ''
          match=re.search(r'SPIEGELIB_IMPORTS=(\{.*\})',log)
          versions=match.group(1) if match else 'not resolved'
          provenance_ok=all(status.get(key)==0 for key in ('clone','checkout','pin','license','provenance'))
          stages=[('container bootstrap','bootstrap'),('git install','install_git'),('clone','clone'),('exact checkout','checkout'),('pin verify','pin'),('MIT license verify','license'),('Sound2Synth provenance markers','provenance'),('pip bootstrap','pip_bootstrap'),('editable install','editable_install'),('native imports / blocked-not-imported','imports')]
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {label} | {status.get(key,"?")} |' for label,key in stages]
          Path('docs/validation/spiegelib-isolated-reproduction.md').write_text('\n'.join([
            '# SpiegeLib isolated environment reproduction','',
            'Pinned upstream: `hjdeheer/spiegelib@1a3fa1a172c89b869928005874071d0220fc9ccc`','',
            'Root code license reviewed: **MIT**','',
            f"Python 3.7 container smoke: **{'SUCCESS' if status.get('ok') else 'FAILED'}**",'',*rows,'',
            f'Resolved imports: `{versions}`.','',
            'The pinned merge contains three files explicitly marked “From Sound2Synth”; those files remain provenance-blocked because the reviewed Sound2Synth core has no explicit root code license. The native import smoke asserts they are not imported when the environment reaches import execution.','',
            'No Dexed/VST binary, RenderMan, preset bank, dataset or model weight is admitted into FM1 Editor. A historical dependency failure is retained as reproduction evidence rather than patched into upstream source.','',
            'Environment snapshot:','```text',freeze[-12000:],'```','','Execution log:','```text',log[-16000:],'```',''
          ]),encoding='utf-8')

          ddx7=Path('docs/validation/ddx7-numpy-compat-reproduction.md')
          ddsp=Path('docs/validation/ddsp-isolated-reproduction.md')
          ddx7_ok=ddx7.exists() and 'Compatibility smoke: **SUCCESS**' in ddx7.read_text(encoding='utf-8')
          ddsp_ok=ddsp.exists() and 'Environment smoke: **SUCCESS**' in ddsp.read_text(encoding='utf-8')
          sound_block=Path('docs/validation/sound2synth-license-block.md').exists()
          overall=ddx7_ok and ddsp_ok and sound_block and provenance_ok

          spiegelib_status='SUCCESS' if status.get('ok') else ('BLOCKED / ENVIRONMENT-ROTTED AFTER PROVENANCE CHECK' if provenance_ok else 'INCONCLUSIVE')
          matrix=[
            '# Audio reconstruction upstream reproduction matrix','',
            f"Overall admission/reproduction gate: **{'SUCCESS' if overall else 'INCOMPLETE'}**",'',
            '| Approach | Exact pin | Code license | Reproduction outcome | Artifact/data boundary | Production admitted |',
            '| --- | --- | --- | --- | --- | --- |',
            '| Sound2Synth core | `44d9176176d794f7fe3ec96573ce758f4a56896c` | no explicit root license | BLOCKED before execution | external presets/datasets/checkpoints unadmitted | no |',
            '| Sound2Synth Dexed plug-in | `560ba5772118712eca78a3583023c366817fcfa9` | GPL-3.0 | research reference only | GPL wrapper/VST outside MSFA boundary | no |',
            f'| SpiegeLib | `1a3fa1a172c89b869928005874071d0220fc9ccc` | MIT root | {spiegelib_status} | Sound2Synth-derived estimator files blocked; no VST/RenderMan/data/weights | no |',
            f'| DDX7 | `11d04fc16475ff81454f7436f318df9836971a0c` | Apache-2.0 | {"SUCCESS with NumPy 1.23.5 ABI constraint" if ddx7_ok else "receipt missing/failed"} | URMP/data/checkpoints remain separate | no |',
            f'| Magenta DDSP | `cf5e62dfe5d5c80aa14761832233a2e68e840e53` | Apache-2.0 | {"SUCCESS isolated source/import smoke" if ddsp_ok else "receipt missing/failed"} | pretrained models/datasets require separate license+hash | no |','',
            'A successful gate means every reviewed external method has an immutable source identity, explicit license/provenance disposition and either a controlled reproduction or an intentional block. It does **not** admit external code, weights, datasets or preprocessing into FM1 Editor. Any future production use requires a separate admission review with file/artifact hashes and licenses.','',
            'Evidence: `docs/research/audio-reconstruction-upstreams.json`, `docs/validation/sound2synth-license-block.md`, `docs/validation/spiegelib-isolated-reproduction.md`, `docs/validation/ddx7-numpy-compat-reproduction.md`, and `docs/validation/ddsp-isolated-reproduction.md`.',''
          ]
          Path('docs/research/audio-reconstruction-reproduction-matrix.md').write_text('\n'.join(matrix),encoding='utf-8')
          if overall:
              plan=Path('PLAN.md');lines=plan.read_text(encoding='utf-8').splitlines();prefix='- [ ] Reproduce and license-audit Sound2Synth, SpiegeLib/Dexed sound matching, DDX7 and related DDSP approaches before using code, weights, datasets or preprocessing in production.';plan.write_text('\n'.join(line for line in lines if not line.startswith(prefix)).rstrip()+'\n',encoding='utf-8')
          shutil.rmtree(root,ignore_errors=True)
          for name in ('audit-sound2synth-reproduction-block.yml','reproduce-spiegelib-container.yml','reproduce-spiegelib-container-v2.yml','consolidate-reconstruction-reproduction-matrix.yml'):
              Path('.github/workflows',name).unlink(missing_ok=True)
          if not overall:
              raise SystemExit('External reconstruction matrix remains incomplete; receipt persisted but PLAN item stays open.')
      - name: Commit matrix and receipts
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(research): consolidate reconstruction reproduction matrix' || true
          git pull --rebase origin main
          git push origin HEAD:main
