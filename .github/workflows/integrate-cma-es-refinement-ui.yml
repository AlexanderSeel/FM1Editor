name: Integrate renderer-backed CMA-ES refinement UI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-cma-es-refinement-ui.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Repair exact-optional CMA context and mount explicit refinement step
        shell: python
        run: |
          from pathlib import Path

          core=Path('src/audio/dx7CmaEs.ts')
          text=core.read_text(encoding='utf-8')
          old="""      const score = await objective(voice, { generation, candidateIndex, evaluation: evaluations, signal: options.signal })\n"""
          new="""      const score = await objective(voice, {\n        generation,\n        candidateIndex,\n        evaluation: evaluations,\n        ...(options.signal === undefined ? {} : { signal: options.signal }),\n      })\n"""
          if old in text:
              text=text.replace(old,new,1)
          core.write_text(text,encoding='utf-8')

          panel=Path('src/components/NearestPresetPanel.tsx')
          text=panel.read_text(encoding='utf-8')

          old_import="""import { createAudioDescriptorFingerprint } from '../audio/audioDescriptorFingerprint'\n"""
          new_import="""import { createAudioDescriptorFingerprint, type AudioDescriptorFingerprint } from '../audio/audioDescriptorFingerprint'\n"""
          if old_import in text:
              text=text.replace(old_import,new_import,1)
          elif 'type AudioDescriptorFingerprint' not in text:
              raise SystemExit('audio fingerprint import anchor missing')

          refine_import="""import { createMsfaOfflineEngine } from '../audio/msfaOfflineEngine'\n"""
          refine_import_new=refine_import+"import { refineRetrievedDx7Candidates, type Dx7RetrievedRefinementResult } from '../audio/dx7CmaEsRefinement'\n"
          if 'refineRetrievedDx7Candidates' not in text:
              if refine_import not in text: raise SystemExit('MSFA import anchor missing')
              text=text.replace(refine_import,refine_import_new,1)

          text=text.replace("type SearchPhase = 'idle' | 'catalog' | 'indexing' | 'ready' | 'cancelled' | 'error'", "type SearchPhase = 'idle' | 'catalog' | 'indexing' | 'refining' | 'ready' | 'cancelled' | 'error'", 1)

          progress_anchor="""interface SearchProgress {\n  completed: number\n  total: number\n  current: string\n}\n"""
          progress_new=progress_anchor+"""\ninterface RefinementProgress {\n  startIndex: number\n  startCount: number\n  generation: number\n  evaluations: number\n  bestDistance: number\n  sourceName: string\n}\n"""
          if 'interface RefinementProgress' not in text:
              if progress_anchor not in text: raise SystemExit('search progress anchor missing')
              text=text.replace(progress_anchor,progress_new,1)

          state_anchor="""  const [results, setResults] = useState<readonly CompactPresetRankedCandidate[]>([])\n  const [status, setStatus] = useState<string | null>(null)\n"""
          state_new="""  const [results, setResults] = useState<readonly CompactPresetRankedCandidate[]>([])\n  const [referenceFingerprint, setReferenceFingerprint] = useState<AudioDescriptorFingerprint | null>(null)\n  const [refinementResults, setRefinementResults] = useState<readonly Dx7RetrievedRefinementResult[]>([])\n  const [refinementProgress, setRefinementProgress] = useState<RefinementProgress | null>(null)\n  const [status, setStatus] = useState<string | null>(null)\n"""
          if 'const [referenceFingerprint' not in text:
              if state_anchor not in text: raise SystemExit('results state anchor missing')
              text=text.replace(state_anchor,state_new,1)

          reset_anchor="""    setResults([])\n    setCandidateCount(0)\n"""
          reset_new="""    setResults([])\n    setReferenceFingerprint(null)\n    setRefinementResults([])\n    setRefinementProgress(null)\n    setCandidateCount(0)\n"""
          if reset_new not in text:
              if reset_anchor not in text: raise SystemExit('reference reset anchor missing')
              text=text.replace(reset_anchor,reset_new,1)

          search_reset="""    setPhase('catalog')\n    setResults([])\n    setCacheHits(0)\n"""
          search_reset_new="""    setPhase('catalog')\n    setResults([])\n    setReferenceFingerprint(null)\n    setRefinementResults([])\n    setRefinementProgress(null)\n    setCacheHits(0)\n"""
          if search_reset in text:
              text=text.replace(search_reset,search_reset_new,1)

          fingerprint_anchor="""      const referenceFingerprint = createAudioDescriptorFingerprint(\n        createAudioDescriptorProfile(referenceSamples, INDEX_SAMPLE_RATE, COMPACT_PRESET_DESCRIPTOR_CONFIG),\n      )\n"""
          fingerprint_new=fingerprint_anchor+"      setReferenceFingerprint(referenceFingerprint)\n"
          if 'setReferenceFingerprint(referenceFingerprint)' not in text:
              if fingerprint_anchor not in text: raise SystemExit('reference fingerprint anchor missing')
              text=text.replace(fingerprint_anchor,fingerprint_new,1)

          working_anchor="""  const working = phase === 'catalog' || phase === 'indexing'\n"""
          working_new="""  const working = phase === 'catalog' || phase === 'indexing' || phase === 'refining'\n"""
          if working_anchor in text:
              text=text.replace(working_anchor,working_new,1)
          elif working_new not in text:
              raise SystemExit('working phase anchor missing')

          refine_insert_anchor="""  const working = phase === 'catalog' || phase === 'indexing' || phase === 'refining'\n  const progressPercent = progress.total > 0 ? Math.round(progress.completed * 100 / progress.total) : 0\n"""
          refine_callback="""  const refineTopCandidates = useCallback(async () => {\n    if (!referenceFingerprint || results.length === 0) return\n    cancelSearch()\n    stopReferencePlayback()\n    void onStopAudition().catch(() => undefined)\n    const controller = new AbortController()\n    abortRef.current = controller\n    const signal = controller.signal\n    setPhase('refining')\n    setRefinementResults([])\n    setRefinementProgress(null)\n    setError(null)\n    setStatus('Refining the top retrieved voices · output levels + feedback only…')\n\n    try {\n      const refined = await refineRetrievedDx7Candidates(results, referenceFingerprint, createMsfaOfflineEngine(), {\n        startCount: Math.min(3, results.length),\n        groups: ['output-feedback'],\n        seed: 2026,\n        descriptorConfig: COMPACT_PRESET_DESCRIPTOR_CONFIG,\n        fingerprintCache: createFingerprintCache(),\n        signal,\n        cmaEs: { populationSize: 8, maxGenerations: 8, sigma: 0.2, targetScore: 0 },\n        onProgress: (item) => {\n          setRefinementProgress({\n            startIndex: item.startIndex,\n            startCount: item.startCount,\n            generation: item.generation,\n            evaluations: item.evaluations,\n            bestDistance: item.bestDistance,\n            sourceName: item.sourceCandidate.voice.name || item.sourceCandidate.sourceLabel,\n          })\n        },\n      })\n      setRefinementResults(refined)\n      setStatus(`Refined ${refined.length} retrieved start${refined.length === 1 ? '' : 's'} · constrained output/feedback search`)\n      setPhase('ready')\n      abortRef.current = null\n    } catch (cause) {\n      abortRef.current = null\n      if (cause instanceof DOMException && cause.name === 'AbortError') {\n        setPhase('cancelled')\n        setStatus('CMA-ES refinement cancelled. Retrieval results and cached fingerprints remain available.')\n        return\n      }\n      setPhase('error')\n      setError(errorMessage(cause))\n      setStatus(null)\n    }\n  }, [cancelSearch, onStopAudition, referenceFingerprint, results, stopReferencePlayback])\n\n"""+refine_insert_anchor
          if 'const refineTopCandidates = useCallback' not in text:
              if refine_insert_anchor not in text: raise SystemExit('refinement callback insertion anchor missing')
              text=text.replace(refine_insert_anchor,refine_callback,1)

          search_button_anchor="""        {working && (\n          <button className=\"rounded-xl border border-rose-300/30 px-4 py-2.5 text-sm font-bold text-rose-200\" onClick={cancelSearch} type=\"button\">\n            Cancel\n          </button>\n        )}\n"""
          search_button_new="""        {!working && results.length > 0 && referenceFingerprint && (\n          <button\n            className=\"rounded-xl bg-amber-200 px-4 py-2.5 text-sm font-black text-slate-950\"\n            onClick={() => void refineTopCandidates()}\n            type=\"button\"\n          >\n            Refine top {Math.min(3, results.length)} · output + feedback\n          </button>\n        )}\n        {working && (\n          <button className=\"rounded-xl border border-rose-300/30 px-4 py-2.5 text-sm font-bold text-rose-200\" onClick={cancelSearch} type=\"button\">\n            Cancel\n          </button>\n        )}\n"""
          if 'Refine top {Math.min(3, results.length)}' not in text:
              if search_button_anchor not in text: raise SystemExit('cancel button anchor missing')
              text=text.replace(search_button_anchor,search_button_new,1)

          progress_ui_anchor="""      {status && <p className=\"mt-3 text-xs text-emerald-200\">{status}</p>}\n"""
          progress_ui_new="""      {phase === 'refining' && refinementProgress && (\n        <div className=\"mt-4 rounded-xl border border-amber-200/20 bg-amber-200/[0.035] p-3\" aria-label=\"CMA-ES refinement progress\">\n          <div className=\"flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400\">\n            <span>Start {refinementProgress.startIndex + 1}/{refinementProgress.startCount} · {refinementProgress.sourceName}</span>\n            <span>generation {refinementProgress.generation} · {refinementProgress.evaluations} evals</span>\n          </div>\n          <p className=\"mt-2 text-[11px] text-amber-100\">Best fingerprint distance {refinementProgress.bestDistance.toFixed(5)}</p>\n        </div>\n      )}\n\n"""+progress_ui_anchor
          if 'aria-label="CMA-ES refinement progress"' not in text:
              if progress_ui_anchor not in text: raise SystemExit('status anchor missing')
              text=text.replace(progress_ui_anchor,progress_ui_new,1)

          results_end_anchor="""      {results.length > 0 && (\n        <div className=\"mt-4 grid gap-3\">\n"""
          # Keep existing ranked results untouched; append refined section before component's final section close.
          closing_anchor="""      )}\n    </section>\n  )\n}\n"""
          refined_ui="""      {refinementResults.length > 0 && (\n        <div className=\"mt-5 grid gap-3\" aria-label=\"CMA-ES refined candidates\">\n          <div>\n            <h4 className=\"text-sm font-black uppercase tracking-[0.12em] text-amber-100\">CMA-ES refined candidates</h4>\n            <p className=\"mt-1 text-[11px] text-slate-500\">Seed 2026 · output levels + feedback only · each result starts from a ranked catalog voice.</p>\n          </div>\n          {refinementResults.map((item, index) => (\n            <article className=\"rounded-xl border border-amber-200/15 bg-amber-200/[0.025] p-3\" key={`${item.sourceCandidate.id}:refined`}>\n              <div className=\"flex flex-wrap items-start justify-between gap-3\">\n                <div className=\"min-w-0\">\n                  <p className=\"text-[10px] font-bold uppercase tracking-[0.14em] text-amber-200\">#{index + 1} refined · {item.improvement > 0 ? `improved ${item.improvement.toFixed(5)}` : 'no improvement'}</p>\n                  <h5 className=\"mt-1 text-base font-black text-white\">{item.bestVoice.name || 'UNTITLED'}</h5>\n                  <p className=\"mt-1 break-words text-[11px] text-slate-500\">Start: {item.sourceCandidate.sourceLabel}</p>\n                  <p className=\"mt-1 text-[10px] text-slate-600\">distance {item.initialDistance.toFixed(5)} → {item.bestDistance.toFixed(5)} · {item.optimizer.generationsCompleted} generations · {item.optimizer.evaluations} evaluations</p>\n                </div>\n                <div className=\"flex flex-wrap gap-2\">\n                  <button className=\"rounded-lg border border-amber-200/30 px-3 py-2 text-xs font-bold text-amber-100\" onClick={() => void onAuditionVoice(item.bestVoice)} type=\"button\">▶ Audition refined</button>\n                  <button className=\"rounded-lg bg-emerald-300 px-3 py-2 text-xs font-black text-slate-950\" onClick={() => onLoadVoice(item.bestVoice)} type=\"button\">Load refined</button>\n                </div>\n              </div>\n              <div className=\"mt-3 grid grid-cols-3 gap-2 text-[10px] text-slate-500 sm:grid-cols-6\">\n                <span>ENV {metric(item.bestMetrics.envelope)}</span><span>MEL {metric(item.bestMetrics.mel)}</span><span>MFCC {metric(item.bestMetrics.mfcc)}</span><span>CENT {metric(item.bestMetrics.centroid)}</span><span>ROLL {metric(item.bestMetrics.rolloff)}</span><span>FLAT {metric(item.bestMetrics.flatness)}</span>\n              </div>\n            </article>\n          ))}\n        </div>\n      )}\n"""+closing_anchor
          if 'aria-label="CMA-ES refined candidates"' not in text:
              if closing_anchor not in text: raise SystemExit('component close anchor missing')
              text=text.replace(closing_anchor,refined_ui,1)

          panel.write_text(text,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting integrated refinement gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/cma-ui-gate.txt
          ok=true
          for stage in audit typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/cma-ui-gate.txt
            case "$stage" in
              audit) npm run audit:virtual-dx7 2>&1 | tee -a /tmp/cma-ui-gate.txt ;;
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/cma-ui-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/cma-ui-gate.txt ;;
              focused) npm test -- src/audio/dx7CmaEs.test.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.test.tsx src/audio/compactPresetIndex.test.ts 2>&1 | tee -a /tmp/cma-ui-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/cma-ui-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/cma-ui-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}; echo "$stage=$code" >> "$GITHUB_OUTPUT"; [ "$code" = 0 ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist integration result
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'; log=Path('/tmp/cma-ui-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/dx7-cma-es-ui-software.md').write_text('\n'.join([
            '# Renderer-backed CMA-ES retrieval UI software gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',f"| audit | {os.environ.get('AUDIT')} |",f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'',
            'On a successful gate the mounted nearest-preset panel exposes an explicit second-stage CMA-ES refinement over the top three retrieval candidates. The default search mutates only six operator output levels plus feedback, uses seed 2026, persistent local fingerprint caching, progress/cancel, and separate refined Audition/Load actions. No candidate is auto-loaded or transmitted.','',
            'The PLAN item remains open until Chrome/Edge prove the mounted refinement path and zero Web MIDI requests.','',
            '```text',log[-16000:],'```',''
          ]),encoding='utf-8')
          Path('.github/workflows/integrate-cma-es-refinement-ui.yml').unlink(missing_ok=True)
          PY
          if [ "${OK}" != "true" ]; then git checkout -- src/audio/dx7CmaEs.ts src/components/NearestPresetPanel.tsx; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(audio): integrate renderer-backed CMA-ES refinement UI' || true
          git pull --rebase origin main
          git push origin HEAD:main
