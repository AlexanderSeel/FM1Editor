name: Validate current source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-current-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-current-source
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute validation and publish receipt
        shell: bash
        run: |
          set +e
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p docs/validation .validation-logs

          npm install --no-audit --no-fund >.validation-logs/install.log 2>&1
          install_status=$?

          expected='fde5aad29b215aa3ea67e9f57bf55d4443cc6efe7562d6cb6dc375b3c780b263'
          actual="$(sha256sum public/catalog/sysexFinal.zip 2>/dev/null | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          archive_hash_status=$?

          unzip -t public/catalog/sysexFinal.zip >.validation-logs/archive.log 2>&1
          archive_zip_status=$?

          npm run typecheck >.validation-logs/typecheck.log 2>&1
          typecheck_status=$?

          npm run test >.validation-logs/test.log 2>&1
          test_status=$?

          npm run build >.validation-logs/build.log 2>&1
          build_status=$?

          status_word() {
            if [[ "$1" -eq 0 ]]; then printf 'PASS'; else printf 'FAIL (%s)' "$1"; fi
          }

          cat > docs/validation/ci-receipt.md <<EOF
          # CI validation receipt

          - Validated commit: \`$validated_sha\`
          - Node: \`$(node --version 2>/dev/null || echo unavailable)\`
          - npm install: **$(status_word "$install_status")**
          - tracked archive SHA-256: **$(status_word "$archive_hash_status")**
          - tracked archive ZIP integrity: **$(status_word "$archive_zip_status")**
          - npm run typecheck: **$(status_word "$typecheck_status")**
          - npm run test: **$(status_word "$test_status")**
          - npm run build: **$(status_word "$build_status")**

          Expected archive SHA-256: \`$expected\`

          Actual archive SHA-256: \`${actual:-unavailable}\`
          EOF

          for log in install archive typecheck test build; do
            {
              printf '\n## %s output\n\n```text\n' "$log"
              tail -n 160 ".validation-logs/$log.log"
              printf '\n```\n'
            } >> docs/validation/ci-receipt.md
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/ci-receipt.md
          git commit -m 'test(ci): record current source validation' || true
          git push origin HEAD:main

          if [[ "$install_status" -ne 0 || "$archive_hash_status" -ne 0 || "$archive_zip_status" -ne 0 || "$typecheck_status" -ne 0 || "$test_status" -ne 0 || "$build_status" -ne 0 ]]; then
            exit 1
          fi
