name: Diagnose imported-bank PCM in Chromium

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-imported-bank-audio-chromium.yml']

permissions:
  contents: write

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Locate Chromium browser
        id: browser
        shell: bash
        run: |
          executable=""
          for candidate in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then executable=$(command -v "$candidate"); break; fi
          done
          if [ -z "$executable" ]; then echo 'No Chromium browser found'; exit 1; fi
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
      - name: Run exact imported-bank PCM flow
        id: run
        shell: bash
        run: |
          set +e
          node scripts/test-imported-bank-virtual-audio-browser.mjs --browser-executable '${{ steps.browser.outputs.executable }}' --browser-name chromium --result imported-bank-audio-chromium.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record diagnostic
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('imported-bank-audio-chromium.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'ok':False,'error':'result missing'}
          lines=['# Imported-bank Chromium diagnostic','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Result: **{'SUCCESS' if data.get('ok') else 'FAILED'}**",'']
          if data.get('ok'):
              lines += [f"- Browser: {data.get('browserProduct')}",f"- Loaded bank peak: {data.get('loadedVoicePeak')}",f"- Catalog audition peak: {data.get('catalogAuditionPeak')}",f"- Saved-library audition peak: {data.get('savedAuditionPeak')}",f"- Web MIDI requests: {data.get('midiRequests')}"]
          else:
              lines += [f"- Error: {data.get('error','unknown')}"]
          Path('docs/validation/imported-bank-virtual-audio-chromium-diagnostic.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/diagnose-imported-bank-audio-chromium.yml').unlink(missing_ok=True)
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(browser): record imported-bank Chromium diagnostic' || true
          git pull --rebase origin main
          git push origin HEAD:main
