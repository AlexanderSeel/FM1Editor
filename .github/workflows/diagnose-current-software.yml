name: Diagnose current software head

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-current-software.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting stages
        id: gate
        shell: bash
        run: |
          set +e
          : >/tmp/current-gate.txt
          run_stage(){ local name="$1"; shift; echo "=== $name ===" | tee -a /tmp/current-gate.txt; "$@" 2>&1 | tee -a /tmp/current-gate.txt; local code=${PIPESTATUS[0]}; echo "$name=$code" >> "$GITHUB_OUTPUT"; }
          run_stage audit npm run audit:virtual-dx7
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused npm test -- src/audio/reconstructionComparison.test.ts src/audio/dx7CandidateArtifacts.test.ts src/audio/fm1InspiredFxIsolation.test.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.test.tsx
          run_stage test npm run test
          run_stage build npm run build
      - name: Persist diagnostic receipt
        if: always()
        env:
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: python
        run: |
          import os
          from pathlib import Path
          log=Path('/tmp/current-gate.txt').read_text(encoding='utf-8',errors='replace') if Path('/tmp/current-gate.txt').exists() else 'no log'
          codes=[os.environ.get(k,'?') for k in ('AUDIT','TYPECHECK','LINT','FOCUSED','TEST','BUILD')]
          ok=all(code=='0' for code in codes)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {name} | {code} |' for name,code in zip(('audit','typecheck','lint','focused','full tests','build'),codes)]
          Path('docs/validation/current-development-software-gate.md').write_text('\n'.join(['# Current development software gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'','```text',log[-24000:],'```','']),encoding='utf-8')
          Path('.github/workflows/diagnose-current-software.yml').unlink(missing_ok=True)
      - name: Commit receipt
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(ci): record current development software gate' || true;git pull --rebase origin main;git push origin HEAD:main
