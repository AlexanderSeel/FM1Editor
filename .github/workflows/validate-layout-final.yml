name: Validate compact layout final

on:
  push:
    branches: [main]
    paths:
      - 'docs/validation/.trigger-layout-final'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      BROWSER_CHANNELS: chrome,msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: checks
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          npm install --no-audit --no-fund
          $install = $LASTEXITCODE
          npm run typecheck
          $typecheck = $LASTEXITCODE
          npm run lint
          $lint = $LASTEXITCODE
          npm run test
          $test = $LASTEXITCODE
          npm run build
          $build = $LASTEXITCODE
          npm install --no-save --package-lock=false playwright@1.55.0
          $playwrightInstall = $LASTEXITCODE
          node scripts/browser-layout-smoke.mjs
          $browser = $LASTEXITCODE
          "install=$install" >> $env:GITHUB_OUTPUT
          "typecheck=$typecheck" >> $env:GITHUB_OUTPUT
          "lint=$lint" >> $env:GITHUB_OUTPUT
          "test=$test" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "playwright_install=$playwrightInstall" >> $env:GITHUB_OUTPUT
          "browser=$browser" >> $env:GITHUB_OUTPUT

      - name: Record result
        shell: pwsh
        env:
          INSTALL: ${{ steps.checks.outputs.install }}
          TYPECHECK: ${{ steps.checks.outputs.typecheck }}
          LINT: ${{ steps.checks.outputs.lint }}
          TEST: ${{ steps.checks.outputs.test }}
          BUILD: ${{ steps.checks.outputs.build }}
          PLAYWRIGHT_INSTALL: ${{ steps.checks.outputs.playwright_install }}
          BROWSER: ${{ steps.checks.outputs.browser }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Result([string]$value) { if ($value -eq '0') { 'SUCCESS' } else { 'FAILURE' } }
          $values = @($env:INSTALL, $env:TYPECHECK, $env:LINT, $env:TEST, $env:BUILD, $env:PLAYWRIGHT_INSTALL, $env:BROWSER)
          $success = ($values | Where-Object { $_ -ne '0' }).Count -eq 0

          $receipt = @(
            '# Compact layout cleanup validation'
            ''
            "Validated source commit: ``$env:GITHUB_SHA``"
            ''
            "- npm install: **$(Result $env:INSTALL)**"
            "- TypeScript typecheck: **$(Result $env:TYPECHECK)**"
            "- ESLint and JSX accessibility: **$(Result $env:LINT)**"
            "- Full Vitest suite: **$(Result $env:TEST)**"
            "- Production build: **$(Result $env:BUILD)**"
            "- Transient Playwright install: **$(Result $env:PLAYWRIGHT_INSTALL)**"
            "- Chrome and Microsoft Edge responsive matrix: **$(Result $env:BROWSER)**"
            ''
            '- Decorative Master, Select, Algorithm and placeholder knobs are absent from application markup.'
            '- Brand, status screen and action-toolbar vertical space is reduced without removing operational controls.'
            '- Screen and active-control cyan gradients are darker.'
            '- Application chrome uses shared metadata, control and title text scales.'
            '- Responsive assertions cover desktop 1440×900, tablet 820×1180 and narrow mobile 390×844 in both browsers.'
          ) -join "`n"
          Set-Content docs/validation/layout-cleanup.md -Value $receipt -Encoding utf8

          if ($success) {
            $plan = Get-Content PLAN.md -Raw
            $layoutBlock = @"
## 1.1 Layout
- [ ] Remove the unusde knobs in the header section like Master, Select, etc
- [ ] make the blue a little bit darker and try to waste less space
- [ ] don't use 10 or more font-size, try to keep 1-3 and clean everything out which has no use
"@
            if (-not $plan.Contains($layoutBlock.TrimEnd())) { throw 'Expected PLAN.md layout block was not found.' }
            $plan = $plan.Replace($layoutBlock.TrimEnd() + "`r`n", '').Replace($layoutBlock.TrimEnd() + "`n", '')
            Set-Content PLAN.md -Value $plan -Encoding utf8
            Remove-Item .github/workflows/validate-layout-final.yml
            Remove-Item docs/validation/.trigger-layout-final
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m $(if ($success) { 'test(layout): record compact layout validation' } else { 'test(layout): record compact layout failure' })
          git push

          if (-not $success) { exit 1 }
