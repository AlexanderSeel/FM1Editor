name: Validate GitHub Pages subpath readiness

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-pages-subpath-readiness.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run readiness stages without short-circuiting evidence
        shell: bash
        run: |
          set +e
          : > validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            echo "=== $name ==="
            "$@" > "validation-$name.log" 2>&1
            code=$?
            cat "validation-$name.log"
            echo "$name=$code" >> validation-stage-codes.txt
          }
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage full-test npm run test
          run_stage pages-build npm run build:pages
          run_stage pages-subpath-smoke npm run test:pages-base
          exit 0

      - name: Persist readiness receipt and narrow PLAN item on success
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os

          codes = {}
          p = Path('validation-stage-codes.txt')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '=' not in line:
                      continue
                  name, value = line.split('=', 1)
                  try:
                      codes[name] = int(value)
                  except ValueError:
                      codes[name] = 999
          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'full-test', 'pages-build', 'pages-subpath-smoke']
          ok = all(codes.get(stage) == 0 for stage in stages)
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]
          logs = []
          if not ok:
              for stage in stages:
                  if codes.get(stage) == 0:
                      continue
                  log = Path(f'validation-{stage}.log')
                  text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'log missing'
                  logs.extend(['', f'## {stage} failure tail', '', '```text', text[-16000:], '```'])

          Path('docs/validation/pages-subpath-readiness.md').write_text('\n'.join([
              '# GitHub Pages repository-subpath readiness',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Static routing/build acceptance: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              *rows,
              '',
              'The Pages build uses `/FM1Editor/` as the deployment base. The smoke serves the generated `dist` only beneath that prefix and verifies the application entry, manifest, service worker, icons, virtual-DX7 manifest/module/WASM/AudioWorklet, catalog ZIP and sync manifest resolve under the prefix while equivalent root-only catalog/WASM requests fail.',
              '',
              'PWA registration already derives `sw.js` and scope from `import.meta.env.BASE_URL`; the service worker derives its navigation fallback from `self.registration.scope`; the web manifest uses relative start/scope/icon URLs. Catalog and virtual-DX7 runtime loaders use the Vite base URL.',
              '',
              'This is static/subpath/PWA routing evidence only. It does not verify Web MIDI permission, SysEx, USB audio or AudioWorklet behavior on the final GitHub Pages HTTPS origin with physical hardware, so deployment remains disabled until the existing physical browser/hardware prerequisite is recorded.',
              *logs,
              '',
          ]), encoding='utf-8')

          if ok:
              plan = Path('PLAN.md')
              old = '- [ ] Add GitHub Pages deployment after secure-context routing and Web MIDI/Web Audio behavior are verified.'
              new = '- [ ] Enable GitHub Pages deployment only after the physical Chrome/Edge FM-1 secure-context test records Web MIDI/SysEx and USB/Web Audio behavior on the intended HTTPS deployment. Repository-subpath build/PWA/static routing for `/FM1Editor/` is implemented and validated in [`docs/validation/pages-subpath-readiness.md`](./docs/validation/pages-subpath-readiness.md); do not publish before the hardware/browser prerequisite is satisfied.'
              text = plan.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit('PLAN Pages deployment anchor missing')
              plan.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/validate-pages-subpath-readiness.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'):
              path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent readiness evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(build): record pages subpath readiness' || true
          git pull --rebase origin main
          git push origin HEAD:main
