name: Validate catalog release audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-catalog-release-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize catalog
        run: npm run catalog:sync
      - name: Generate reviewed audit baseline
        run: npm run catalog:audit
      - name: Verify release gate
        run: npm run release:verify
      - name: Verify audit artifacts
        shell: bash
        run: |
          test -s public/catalog/release-audit.json
          test -s docs/catalog-release-audit.md
          grep -q '"catalogFingerprint"' public/catalog/release-audit.json
          grep -q '"changes"' public/catalog/release-audit.json
          grep -q '"rightsReview"' public/catalog/release-audit.json
          grep -q 'Unresolved rights metadata' docs/catalog-release-audit.md
      - name: Record validation and baseline
        shell: bash
        run: |
          validated_sha="$(git rev-parse HEAD)"
          fingerprint="$(node -e "const a=require('./public/catalog/release-audit.json'); process.stdout.write(a.catalogFingerprint)")"
          file_count="$(node -e "const a=require('./public/catalog/release-audit.json'); process.stdout.write(String(a.catalogFiles.length))")"
          rights_count="$(node -e "const a=require('./public/catalog/release-audit.json'); process.stdout.write(String(a.rightsReview.unresolvedCount))")"
          mkdir -p docs/validation
          cat > docs/validation/catalog-release-audit.md <<EOF
          # Catalog release audit validation

          Validated source commit: \`$validated_sha\`

          Reviewed catalog fingerprint: \`$fingerprint\`

          - npm install: **PASS**
          - strict catalog synchronization: **PASS**
          - catalog audit generation: **PASS**
          - catalog audit fingerprint check: **PASS**
          - npm run typecheck: **PASS**
          - npm run lint: **PASS**
          - npm run test: **PASS**
          - npm run build: **PASS**
          - audited catalog assets: **$file_count**
          - unresolved rights review groups recorded: **$rights_count**

          Verified behavior:

          - source hashes and every synchronized catalog file are recorded;
          - added, removed, modified and unchanged files are compared to the prior reviewed snapshot;
          - volatile synchronization timestamps do not change the catalog fingerprint;
          - missing license, rights-holder, attribution and provenance metadata is surfaced for review;
          - release verification fails when the synchronized catalog differs from the checked-in audit;
          - provider downloads remain subject to strict DX7 bank framing and checksum validation.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog/release-audit.json docs/catalog-release-audit.md docs/validation/catalog-release-audit.md
          git commit -m 'test(ci): record catalog release audit baseline'
          git push origin HEAD:main
