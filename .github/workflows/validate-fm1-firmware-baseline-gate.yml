name: Validate FM-1 firmware baseline delivery gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-fm1-firmware-baseline-gate.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit virtual DX7 boundary
        run: npm run audit:virtual-dx7
      - name: Audit reconstruction upstreams
        run: npm run audit:reconstruction-upstreams
      - name: Audit learned assets
        run: npm run audit:learned-assets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused firmware and delivery tests
        run: npx vitest run src/validation/fm1FirmwareBaseline.test.ts src/validation/fm1DeliveryEvidence.test.ts src/validation/fm1DeliveryEvidenceIntegrity.test.ts src/validation/fm1DeliveryEvidencePackageIntegrity.test.ts
      - name: Full tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Write receipt and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          import os
          source=os.environ['GITHUB_SHA']
          Path('docs/validation/fm1-firmware-baseline-delivery-gate.md').write_text(f'''# FM-1 firmware-baseline delivery gate acceptance

Source commit: `{source}`

Software acceptance: **SUCCESS**

| Stage | Exit |
| --- | ---: |
| install | 0 |
| audit-virtual | 0 |
| audit-reconstruction | 0 |
| audit-learned | 0 |
| typecheck | 0 |
| lint | 0 |
| focused firmware/delivery tests | 0 |
| full-test | 0 |
| build | 0 |

- reviewed public firmware baseline is V15, released 2026-07-30 and reviewed 2026-08-09;
- current-release delivery evaluation can require an explicit firmware baseline;
- manifests on another firmware remain parseable compatibility evidence but cannot satisfy that current-release gate;
- Chrome and Edge must still match firmware/editor/Windows identity and all v2/v3 raw-MIDI/package requirements;
- the production delivery panel supplies V15 as the reviewed baseline;
- this is software/evidence-gate acceptance only and does not claim that V15 has been physically tested.
''', encoding='utf-8')
          Path('.github/workflows/validate-fm1-firmware-baseline-gate.yml').unlink()
      - name: Commit acceptance receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/validation/fm1-firmware-baseline-delivery-gate.md .github/workflows/validate-fm1-firmware-baseline-gate.yml
          git commit -m "test(validation): record firmware baseline gate SUCCESS"
          git push
