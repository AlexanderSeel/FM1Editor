name: Validate expanded renderer performance limits

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-expanded-renderer-performance.yml']

permissions:
  contents: write

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Expose structural performance metadata
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/VirtualDx7PreviewPanel.tsx');t=p.read_text(encoding='utf-8')
          anchor="import { createVirtualFm1OutputRoute, VIRTUAL_FM1_LIMITER, VIRTUAL_FM1_MASTER_GAIN_DEFAULT_DB, VIRTUAL_FM1_MASTER_GAIN_MAX_DB, VIRTUAL_FM1_MASTER_GAIN_MIN_DB, type VirtualFm1OutputRoute } from '../audio/virtualFm1OutputRoute'\n"
          addition=anchor+"import { VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS } from '../audio/virtualFm1PerformanceLimits'\n"
          if 'VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS' not in t:
            if anchor not in t:raise SystemExit('performance import anchor missing')
            t=t.replace(anchor,addition,1)
          old='''      <div className="mt-4 grid gap-3 rounded-xl border border-white/10 bg-black/15 p-3 sm:grid-cols-2 lg:grid-cols-4" aria-label="Virtual FM-1 render diagnostics">\n'''
          new='''      <div\n        aria-label="Virtual FM-1 render diagnostics"\n        className="mt-4 grid gap-3 rounded-xl border border-white/10 bg-black/15 p-3 sm:grid-cols-2 lg:grid-cols-4"\n        data-callbacks={diagnostics?.callbacks ?? ''}\n        data-max-utilization={diagnostics?.maxUtilization ?? ''}\n        data-max-utilization-limit={VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS.maxUtilization}\n        data-mean-utilization={diagnostics?.meanUtilization ?? ''}\n        data-mean-utilization-limit={VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS.meanUtilization}\n        data-over-budget-callbacks={diagnostics?.overBudgetCallbacks ?? ''}\n        data-over-budget-limit={VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS.overBudgetCallbacks}\n      >\n'''
          if 'data-max-utilization-limit' not in t:
            if old not in t:raise SystemExit('diagnostics div anchor missing')
            t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          r=Path('scripts/test-virtual-fm1-preview-browser.mjs');s=r.read_text(encoding='utf-8')
          anchor="""  const diagnosticsJson = await evaluate(cdp, `JSON.stringify({ errors:window.__fm1PreviewErrors,rejections:window.__fm1PreviewRejections,midiRequests:window.__fm1PreviewMidiRequests,fetches:window.__fm1PreviewFetches,downloads:window.__fm1PreviewDownloads,diagnosticsText:document.querySelector('[aria-label=\"Virtual FM-1 render diagnostics\"]')?.textContent??'' })`)\n  const diagnostics = JSON.parse(diagnosticsJson ?? '{}')\n"""
          replacement="""  const diagnosticsJson = await evaluate(cdp, `(() => { const root=document.querySelector('[aria-label=\"Virtual FM-1 render diagnostics\"]'); return JSON.stringify({ errors:window.__fm1PreviewErrors,rejections:window.__fm1PreviewRejections,midiRequests:window.__fm1PreviewMidiRequests,fetches:window.__fm1PreviewFetches,downloads:window.__fm1PreviewDownloads,diagnosticsText:root?.textContent??'',performance:root?{meanUtilization:Number(root.dataset.meanUtilization),maxUtilization:Number(root.dataset.maxUtilization),overBudgetCallbacks:Number(root.dataset.overBudgetCallbacks),callbacks:Number(root.dataset.callbacks),meanLimit:Number(root.dataset.meanUtilizationLimit),maxLimit:Number(root.dataset.maxUtilizationLimit),overBudgetLimit:Number(root.dataset.overBudgetLimit)}:null }); })()`)\n  const diagnostics = JSON.parse(diagnosticsJson ?? '{}')\n"""
          if 'meanUtilization:Number(root.dataset.meanUtilization)' not in s:
            if anchor not in s:raise SystemExit('diagnostics JSON anchor missing')
            s=s.replace(anchor,replacement,1)
          anchor="""  if (diagnostics.midiRequests !== 0) throw new Error(`Virtual FM-1 preview requested Web MIDI ${diagnostics.midiRequests} time(s)`)\n"""
          addition=anchor+"""  const performanceSample = diagnostics.performance\n  if (!performanceSample || ![performanceSample.meanUtilization,performanceSample.maxUtilization,performanceSample.overBudgetCallbacks,performanceSample.callbacks,performanceSample.meanLimit,performanceSample.maxLimit,performanceSample.overBudgetLimit].every(Number.isFinite)) throw new Error(`Invalid structural performance diagnostics: ${JSON.stringify(performanceSample)}`)\n  if (!(performanceSample.callbacks > 0)) throw new Error(`Invalid diagnostic callback count: ${performanceSample.callbacks}`)\n  if (performanceSample.meanUtilization > performanceSample.meanLimit) throw new Error(`Mean render utilization ${(performanceSample.meanUtilization*100).toFixed(2)}% exceeds ${(performanceSample.meanLimit*100).toFixed(2)}%`)\n  if (performanceSample.maxUtilization > performanceSample.maxLimit) throw new Error(`Max render utilization ${(performanceSample.maxUtilization*100).toFixed(2)}% exceeds ${(performanceSample.maxLimit*100).toFixed(2)}%`)\n  if (performanceSample.overBudgetCallbacks > performanceSample.overBudgetLimit) throw new Error(`Over-budget callbacks ${performanceSample.overBudgetCallbacks} exceed ${performanceSample.overBudgetLimit}`)\n"""
          if 'Invalid structural performance diagnostics' not in s:
            if anchor not in s:raise SystemExit('MIDI diagnostics anchor missing')
            s=s.replace(anchor,addition,1)
          old="""  const result = { ok:true,browserName,browserProduct:version.Browser??null,dryPeak,fxPeak,attenuatedPeak,referencePeak,currentBPeak,downloadCount:diagnostics.downloads.length,wavDetails,midiRequests:diagnostics.midiRequests,utilization,diagnosticsText:diagnostics.diagnosticsText }\n"""
          new="""  const result = { ok:true,browserName,browserProduct:version.Browser??null,dryPeak,fxPeak,attenuatedPeak,referencePeak,currentBPeak,downloadCount:diagnostics.downloads.length,wavDetails,midiRequests:diagnostics.midiRequests,utilization,performance:performanceSample,diagnosticsText:diagnostics.diagnosticsText }\n"""
          if 'performance:performanceSample' not in s:
            if old not in s:raise SystemExit('result anchor missing')
            s=s.replace(old,new,1)
          r.write_text(s,encoding='utf-8')
      - run: node --check public/virtual-dx7/fm1-msfa-worklet.js
      - run: node --check scripts/test-virtual-fm1-preview-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/virtualDx7Engine.test.ts src/audio/msfaOfflineEngine.test.ts src/audio/virtualFm1WavRenderer.test.ts src/audio/fm1InspiredFxGraph.test.ts src/audio/fm1InspiredFxIsolation.test.ts src/audio/msfaAudioWorklet.test.ts src/audio/virtualFm1PerformanceLimits.test.ts src/components/VirtualDx7PreviewPanel.test.tsx
      - run: npm run test
      - run: npm run build
      - name: Persist software source and receipt
        shell: bash
        run: |
          cat > docs/validation/virtual-fm1-expanded-regression-software.md <<EOF
          # Expanded Virtual FM-1 renderer regression software gate

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          Deterministic render planning/offline execution, deterministic WAV output, per-effect isolation, AudioWorklet request/fatal/error containment, structural render diagnostics and the browser performance policy all pass strict typecheck/lint/focused tests/full tests/build. Performance policy: mean utilization <= 5%, max utilization <= 60%, over-budget callbacks = 0.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/VirtualDx7PreviewPanel.tsx scripts/test-virtual-fm1-preview-browser.mjs docs/validation/virtual-fm1-expanded-regression-software.md
          git commit -m 'feat(audio): expose renderer performance acceptance metadata'
          git pull --rebase origin main
          git push origin HEAD:main

  browser:
    needs: software
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - shell: bash
        run: git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge performance acceptance
        shell: pwsh
        run: |
          Remove-Item virtual-fm1-preview-chrome.json,virtual-fm1-preview-edge.json -Force -ErrorAction SilentlyContinue
          $pfx=${env:ProgramFiles(x86)}
          $chrome=@((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'),(Join-Path $pfx 'Google\Chrome\Application\chrome.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          $edge=@((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'),(Join-Path $pfx 'Microsoft\Edge\Application\msedge.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          if(-not $chrome){throw 'Chrome not found'};if(-not $edge){throw 'Edge not found'}
          node scripts/test-virtual-fm1-preview-browser.mjs --browser-executable $chrome --browser-name chrome --result virtual-fm1-preview-chrome.json
          $chromeExit=$LASTEXITCODE
          node scripts/test-virtual-fm1-preview-browser.mjs --browser-executable $edge --browser-name edge --result virtual-fm1-preview-edge.json
          $edgeExit=$LASTEXITCODE
          if($chromeExit -ne 0 -or $edgeExit -ne 0){exit 1}
      - name: Persist performance evidence and close roadmap item
        shell: pwsh
        run: |
          @'
          import json,os
          from pathlib import Path
          c=json.loads(Path('virtual-fm1-preview-chrome.json').read_text(encoding='utf-8-sig'));e=json.loads(Path('virtual-fm1-preview-edge.json').read_text(encoding='utf-8-sig'))
          def row(n,d):
            p=d['performance'];return f"| {n} | {d.get('browserProduct')} | {p['meanUtilization']*100:.2f}% | {p['maxUtilization']*100:.2f}% | {p['overBudgetCallbacks']}/{p['callbacks']} | PASS |"
          Path('docs/validation/virtual-fm1-expanded-regression-browser.md').write_text('\n'.join(['# Expanded Virtual FM-1 renderer browser performance gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'','Overall browser performance gate: **SUCCESS**','','| Browser | Product | Mean utilization | Max utilization | Over budget | Result |','| --- | --- | ---: | ---: | ---: | --- |',row('Chrome',c),row('Edge',e),'','Enforced limits are repository-owned: mean <= 5%, max <= 60%, and zero callbacks over the 128-frame audio-quantum budget. The same run also requires no uncaught browser errors/rejections, zero Web MIDI requests, no external/write fetches, dry/FX/master behavior, reference A/B and valid WAV output.','','The limits are based on prior accepted branded-browser observations with deliberate margin and do not constitute physical FM-1 performance claims.','']),encoding='utf-8')
          p=Path('PLAN.md');t=p.read_text(encoding='utf-8');old='- [ ] Add deterministic render regression tests, effect-isolation tests, integrated AudioWorklet underrun/error checks and Chrome/Edge performance limits as the renderer expands beyond the accepted dry performance-control core.';new='- [x] Add deterministic render regression tests, per-effect isolation, integrated AudioWorklet error/deadline checks and enforced Chrome/Edge performance limits (mean <= 5%, max <= 60%, zero over-budget callbacks) for the expanded renderer. Evidence: [`docs/validation/virtual-fm1-expanded-regression-software.md`](./docs/validation/virtual-fm1-expanded-regression-software.md) and [`docs/validation/virtual-fm1-expanded-regression-browser.md`](./docs/validation/virtual-fm1-expanded-regression-browser.md).'
          if old in t:t=t.replace(old,new,1)
          elif new not in t:raise SystemExit('expanded renderer roadmap item not found')
          p.write_text(t,encoding='utf-8')
          for name in ('virtual-fm1-preview-chrome.json','virtual-fm1-preview-edge.json'):Path(name).unlink(missing_ok=True)
          Path('.github/workflows/validate-expanded-renderer-performance.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit browser evidence
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(browser): enforce expanded renderer performance limits';git pull --rebase origin main;git push origin HEAD:main
