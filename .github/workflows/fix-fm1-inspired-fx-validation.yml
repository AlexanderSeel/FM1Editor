name: Repair and revalidate FM1-inspired effect graph

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-fm1-inspired-fx-validation.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair strict typing and lint findings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/audio/fm1InspiredFxGraph.ts')
          text = path.read_text()
          old = """  const candidate = state.values[id]\n  if (!Number.isInteger(candidate) || candidate < definition.minimum || candidate > definition.maximum) {\n    throw new RangeError(`${id} must be an integer from ${definition.minimum} through ${definition.maximum}`)\n  }\n  return candidate\n"""
          new = """  const candidate = state.values[id]\n  if (typeof candidate !== 'number' || !Number.isInteger(candidate) || candidate < definition.minimum || candidate > definition.maximum) {\n    throw new RangeError(`${id} must be an integer from ${definition.minimum} through ${definition.maximum}`)\n  }\n  return candidate\n"""
          if old not in text:
              raise SystemExit('Expected FX value validation block not found')
          text = text.replace(old, new)
          text = text.replace("try { chorusLfo.stop() } catch {}", "try { chorusLfo.stop() } catch { /* oscillator may already be stopped */ }")
          text = text.replace("try { phaserLfo.stop() } catch {}", "try { phaserLfo.stop() } catch { /* oscillator may already be stopped */ }")
          path.write_text(text)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Persist repaired graph, receipt and roadmap completion
        run: |
          cat > docs/validation/fm1-inspired-fx-graph-software.md <<'EOF'
          # FM1-inspired Web Audio effect graph software validation

          Overall software gate: **SUCCESS**

          ## Accepted boundary

          - The local effect graph is an FM1 Editor **software approximation**, not a measured implementation of M-VAVE FM-1 firmware DSP.
          - It reuses all 24 documented `Fm1FxState` CC-backed values and existing legal ranges; MIDI semantics are unchanged.
          - Repository-owned routing is explicitly `filter → distortion → chorus → phaser → delay → reverb` and is not claimed to match firmware routing.
          - Filter, reverb, delay, distortion, chorus and phaser use native Web Audio nodes; no new third-party DSP dependency is introduced.
          - Graph-level dry bypass is explicit and enabled by default; per-block software wet/dry routing is controlled by the documented state.
          - Reverb uses a deterministic repository-owned synthetic impulse and distributes no third-party IR audio.
          - The accepted dry DX7/MSFA renderer remains a separate path and is not modified by the effect algorithms.
          - Typecheck, lint, full tests and production build passed after strict-null/lint repairs.

          ## Claim limitation

          Effect algorithms, parameter scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware. Mounted-browser effect-isolation and performance measurements remain part of the later Virtual FM-1 integration/regression roadmap item.
          EOF
          python - <<'PY'
          from pathlib import Path
          plan = Path('PLAN.md')
          text = plan.read_text()
          old1 = '- [ ] Implement a separate FM-1-inspired effect graph for documented CC `0–23`: filter, reverb, delay, distortion, chorus and phaser, using native Web Audio and/or audited MIT-licensed Tone.js components.'
          new1 = '- [x] Implement a separate FM-1-inspired effect graph for documented CC `0–23`: filter, reverb, delay, distortion, chorus and phaser using native Web Audio, without adding a third-party DSP dependency. Evidence: [`docs/validation/fm1-inspired-fx-graph-software.md`](./docs/validation/fm1-inspired-fx-graph-software.md).'
          old2 = '- [ ] Reuse `Fm1FxState` and the documented value ranges, but keep dry bypass and clearly state that effect algorithms, internal scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware.'
          new2 = '- [x] Reuse `Fm1FxState` and the documented value ranges with explicit dry bypass and a repository-owned routing/scaling policy; clearly state that algorithms, internal scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware. Evidence: [`docs/validation/fm1-inspired-fx-graph-software.md`](./docs/validation/fm1-inspired-fx-graph-software.md).'
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected unresolved FX roadmap items not found')
          plan.write_text(text.replace(old1,new1).replace(old2,new2))
          PY
          rm -f .github/workflows/fix-fm1-inspired-fx-validation.yml .github/workflows/validate-fm1-inspired-fx-graph.yml .github/workflows/diagnose-fm1-inspired-fx-graph.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/audio/fm1InspiredFxGraph.ts PLAN.md docs/validation/fm1-inspired-fx-graph-software.md .github/workflows
          git commit -m "fix(audio): validate FM1-inspired effect graph"
          git pull --rebase origin main
          git push origin main
