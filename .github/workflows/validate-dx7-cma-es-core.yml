name: Validate constrained DX7 CMA-ES core

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-dx7-cma-es-core.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting CMA-ES gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/cma-gate.txt
          ok=true
          for stage in typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/cma-gate.txt
            case "$stage" in
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/cma-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/cma-gate.txt ;;
              focused) npm test -- src/audio/dx7CmaEs.test.ts 2>&1 | tee -a /tmp/cma-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/cma-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/cma-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}; echo "$stage=$code" >> "$GITHUB_OUTPUT"; [ "$code" = 0 ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result
        env:
          OK: ${{ steps.gate.outputs.ok }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'; log=Path('/tmp/cma-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/dx7-cma-es-core.md').write_text('\n'.join([
            '# Constrained seeded DX7 CMA-ES core','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'',
            'The initial repository-owned separable CMA-ES search space is deliberately constrained to legal semantic `Dx7Voice` groups. The default group contains six operator output levels plus feedback. Optional frequency and operator-envelope groups exist but are not enabled by default. Candidate generation is seeded, bounded, sequential for deterministic async evaluation, cancellable between evaluations, and drops stale raw packed/unpacked source provenance when semantic parameters change.','',
            'This receipt validates the optimizer core only. The PLAN CMA-ES item remains open until the objective is integrated with the accepted local renderer/fingerprint metric and refinement starts from retrieved catalog candidates.','',
            '```text',log[-14000:],'```',''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-dx7-cma-es-core.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record constrained CMA-ES core gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
