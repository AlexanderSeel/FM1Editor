name: Audit Sound2Synth reproduction block

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-sound2synth-reproduction-block.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Clone exact Sound2Synth research pin without executing code
        id: audit
        shell: bash
        run: |
          set +e
          : >/tmp/sound2synth-audit.log
          git clone --filter=blob:none https://github.com/Sound2Synth/Sound2Synth.git /tmp/sound2synth 2>&1 | tee -a /tmp/sound2synth-audit.log
          clone=${PIPESTATUS[0]}
          if [ "$clone" -eq 0 ]; then
            git -C /tmp/sound2synth checkout --detach 44d9176176d794f7fe3ec96573ce758f4a56896c 2>&1 | tee -a /tmp/sound2synth-audit.log
            checkout=${PIPESTATUS[0]}
          else checkout=99; fi
          if [ "$checkout" -eq 0 ]; then
            test "$(git -C /tmp/sound2synth rev-parse HEAD)" = "44d9176176d794f7fe3ec96573ce758f4a56896c"
            pin=$?
            if find /tmp/sound2synth -maxdepth 1 -type f \( -iname 'LICENSE' -o -iname 'LICENSE.*' -o -iname 'COPYING' -o -iname 'COPYING.*' \) | grep -q .; then license_absent=1; else license_absent=0; fi
            find /tmp/sound2synth -maxdepth 3 -type f | sed 's#^/tmp/sound2synth/##' | sort | tee -a /tmp/sound2synth-audit.log
            if find /tmp/sound2synth -type f \( -iname '*.ckpt' -o -iname '*.pt' -o -iname '*.pth' -o -iname '*.h5' -o -iname '*.onnx' \) | grep -q .; then checkpoint_absent=1; else checkpoint_absent=0; fi
            grep -n -E 'preset|checkpoint|pretrained|dataset' /tmp/sound2synth/README.md 2>/dev/null | head -80 | tee -a /tmp/sound2synth-audit.log
          else pin=99; license_absent=99; checkpoint_absent=99; fi
          echo "clone=$clone" >> "$GITHUB_OUTPUT"
          echo "checkout=$checkout" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "license_absent=$license_absent" >> "$GITHUB_OUTPUT"
          echo "checkpoint_absent=$checkpoint_absent" >> "$GITHUB_OUTPUT"
          # The expected safe outcome is that cloning/pinning works, but no explicit root license or bundled model checkpoint exists.
          if [ "$clone" -eq 0 ] && [ "$checkout" -eq 0 ] && [ "$pin" -eq 0 ] && [ "$license_absent" -eq 0 ] && [ "$checkpoint_absent" -eq 0 ]; then echo blocked=true >> "$GITHUB_OUTPUT"; else echo blocked=false >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Persist license-block receipt
        if: always()
        env:
          BLOCKED: ${{ steps.audit.outputs.blocked }}
          CLONE: ${{ steps.audit.outputs.clone }}
          CHECKOUT: ${{ steps.audit.outputs.checkout }}
          PIN: ${{ steps.audit.outputs.pin }}
          LICENSE_ABSENT: ${{ steps.audit.outputs.license_absent }}
          CHECKPOINT_ABSENT: ${{ steps.audit.outputs.checkpoint_absent }}
        shell: python
        run: |
          import os
          from pathlib import Path
          log=Path('/tmp/sound2synth-audit.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/sound2synth-audit.log').exists() else 'audit log unavailable'
          blocked=os.environ.get('BLOCKED')=='true'
          rows=['| Check | Exit / state |','| --- | ---: |',f"| clone | {os.environ.get('CLONE','?')} |",f"| exact checkout | {os.environ.get('CHECKOUT','?')} |",f"| pin verification | {os.environ.get('PIN','?')} |",f"| explicit root license absent | {os.environ.get('LICENSE_ABSENT','?')} |",f"| bundled checkpoint absent | {os.environ.get('CHECKPOINT_ABSENT','?')} |"]
          Path('docs/validation/sound2synth-license-block.md').write_text('\n'.join(['# Sound2Synth reproduction/license block','', 'Pinned upstream: `Sound2Synth/Sound2Synth@44d9176176d794f7fe3ec96573ce758f4a56896c`','',f"Safe reproduction decision: **{'BLOCKED' if blocked else 'AUDIT INCONCLUSIVE'}**",'',*rows,'', 'At the reviewed pin there is no explicit root LICENSE/COPYING file and no bundled checkpoint artifact that can be independently license-hashed. The project instructions also refer to external preset/dataset sources. FM1 Editor therefore does not execute, copy, vendor or redistribute the Sound2Synth research code or a model checkpoint.','', 'The associated Sound2Synth-modified Dexed plug-in is separately classified GPL-3.0 and remains outside the current Apache/MSFA runtime boundary. This block is a successful safety/provenance outcome, not a claim that Sound2Synth itself is unusable under private permission from its authors.','', 'Audit log:','```text',log[-16000:],'```','']),encoding='utf-8')
          Path('.github/workflows/audit-sound2synth-reproduction-block.yml').unlink(missing_ok=True)
      - name: Commit research evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(research): record Sound2Synth license block' || true
          git pull --rebase origin main
          git push origin HEAD:main
