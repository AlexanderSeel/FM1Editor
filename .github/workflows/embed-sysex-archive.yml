name: Embed supplied SysEx archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/embed-sysex-archive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embed-sysex-archive
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add audited archive to source
        shell: bash
        run: |
          set -euo pipefail
          expected='fde5aad29b215aa3ea67e9f57bf55d4443cc6efe7562d6cb6dc375b3c780b263'
          target='public/catalog/sysexFinal.zip'

          if [[ -f "$target" ]]; then
            actual="$(sha256sum "$target" | awk '{print $1}')"
            if [[ "$actual" == "$expected" ]]; then
              echo 'The exact supplied archive is already tracked.'
              exit 0
            fi
            echo "Refusing to replace an unexpected tracked archive: $actual" >&2
            exit 1
          fi

          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 4 --retry-all-errors \
            'https://github.com/probonopd/MiniDexed/files/11312517/sysexFinal.zip' \
            --output "$target"
          echo "$expected  $target" | sha256sum --check --strict
          unzip -t "$target" >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force "$target"
          git commit -m 'chore(catalog): embed supplied SysEx archive'
          git push origin HEAD:main
