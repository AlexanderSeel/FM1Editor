name: Validate synthetic SysEx fixtures

on:
  push:
    branches: [main]
    paths:
      - docs/validation/.trigger-synthetic-sysex-fixtures

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finalize corpus and plan
        run: python scripts/finalize-synthetic-sysex-fixtures.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Focused fixture tests
        run: npx vitest run src/sysex/syntheticFixtureCorpus.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and accessibility
        run: npm run lint

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Publish source, receipt and cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/validation
          cat > docs/validation/synthetic-sysex-fixtures.md <<EOF
          # Synthetic SysEx fixture validation

          Validated source commit: \`$GITHUB_SHA\`

          - deterministic finalizer: **SUCCESS**
          - focused synthetic fixture tests: **SUCCESS**
          - npm install: **SUCCESS**
          - TypeScript typecheck: **SUCCESS**
          - ESLint and JSX accessibility: **SUCCESS**
          - full Vitest suite: **SUCCESS**
          - production build: **SUCCESS**

          The nine-case corpus is repository-authored and distributed under the MIT license. It covers valid single voices, complete 32-voice banks, all algorithms, varied legal ranges, reserved-value normalization, checksum errors, unsupported manufacturers, nested starts, truncation and mixed-file salvage.
          EOF

          rm -f \
            .github/workflows/validate-synthetic-sysex-fixtures.yml \
            docs/validation/.trigger-synthetic-sysex-fixtures \
            scripts/finalize-synthetic-sysex-fixtures.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sysex): complete synthetic compatibility corpus"
          git push
