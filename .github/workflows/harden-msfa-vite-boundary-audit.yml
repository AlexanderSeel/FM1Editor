name: Harden MSFA Vite public-asset boundary

on:
  push:
    branches: [main]
    paths: ['.github/workflows/harden-msfa-vite-boundary-audit.yml']

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add recurring Vite boundary assertions
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/verify-msfa-source-audit.mjs')
          text=path.read_text(encoding='utf-8')
          anchor="""if (notes.length > 0) {\n  console.log('Computed source hashes (record these before vendoring):')\n"""
          insert="""const applicationLoaderPath = resolve(repoRoot, 'src/audio/msfaOfflineEngine.ts')\ncheck(existsSync(applicationLoaderPath), 'MSFA application loader is missing')\nif (existsSync(applicationLoaderPath)) {\n  const applicationLoader = readFileSync(applicationLoaderPath, 'utf8')\n  check(applicationLoader.includes(\"fetch(url, { cache: 'no-cache' })\"), 'MSFA public module must be fetched as a static public asset')\n  check(applicationLoader.includes(\"new Blob([source], { type: 'text/javascript' })\"), 'MSFA public module must be evaluated from a blob URL rather than imported through Vite')\n  check(applicationLoader.includes('locateFile: (path) => assetSiblingUrl(moduleUrl, path)'), 'MSFA blob loader must resolve WASM beside the original public module URL')\n  check(!applicationLoader.includes('import(/* @vite-ignore */ moduleUrl)'), 'MSFA public module must not be dynamically imported from its public URL')\n  check(!applicationLoader.includes('?import'), 'MSFA application loader must not depend on Vite ?import semantics for public artifacts')\n}\n\nif (notes.length > 0) {\n  console.log('Computed source hashes (record these before vendoring):')\n"""
          if anchor not in text: raise SystemExit('MSFA audit insertion anchor missing')
          text=text.replace(anchor,insert,1)
          path.write_text(text,encoding='utf-8')
      - name: Validate recurring boundary
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run audit:virtual-dx7
          npm run typecheck
          npm run lint
          npm test -- src/audio/msfaOfflineEngine.test.ts
          npm run build
      - name: Persist receipt and commit
        shell: bash
        run: |
          cat > docs/validation/msfa-vite-boundary-audit.md <<EOF
          # MSFA Vite public-asset boundary audit

          Source commit: \`${GITHUB_SHA}\`

          Software acceptance: **SUCCESS**

          The recurring \`audit:virtual-dx7\` command now fails if the browser MSFA loader regresses to dynamically importing \`public/virtual-dx7/fm1-msfa.mjs\` through Vite. It requires static fetch + blob evaluation and an Emscripten \`locateFile\` mapping back to the original public WASM URL, and rejects the previous direct \`import(moduleUrl)\` / \`?import\` boundary.
          EOF
          rm .github/workflows/harden-msfa-vite-boundary-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): enforce MSFA Vite public-asset boundary'
          git pull --rebase origin main
          git push origin HEAD:main
