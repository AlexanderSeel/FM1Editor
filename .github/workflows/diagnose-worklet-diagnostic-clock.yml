name: Diagnose AudioWorklet diagnostics clock fallback

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-worklet-diagnostic-clock.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply fallback under validation
        shell: python
        run: |
          from pathlib import Path
          w=Path('public/virtual-dx7/fm1-msfa-worklet.js');t=w.read_text(encoding='utf-8')
          old="""  diagnosticNow() {\n    return typeof performance !== 'undefined' && typeof performance.now === 'function' ? performance.now() : null\n  }\n"""
          new="""  diagnosticClock() {\n    if (typeof performance !== 'undefined' && typeof performance.now === 'function') return 'performance'\n    if (typeof Date !== 'undefined' && typeof Date.now === 'function') return 'date'\n    return null\n  }\n\n  diagnosticNow() {\n    const clock = this.diagnosticClock()\n    if (clock === 'performance') return performance.now()\n    if (clock === 'date') return Date.now()\n    return null\n  }\n"""
          if old in t:t=t.replace(old,new,1)
          elif 'diagnosticClock()' not in t:raise SystemExit('diagnosticNow anchor missing')
          old="""    this.port.postMessage({ type: 'diagnostics', callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization: meanRenderMs / budgetMs, maxUtilization: maxRenderMs / budgetMs, overBudgetCallbacks: this.diagnosticOverBudget, activeVoices: this.voices.filter((voice) => voice.state !== 'idle').length, polyphony: MAX_POLYPHONY })\n"""
          new="""    this.port.postMessage({ type: 'diagnostics', callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization: meanRenderMs / budgetMs, maxUtilization: maxRenderMs / budgetMs, overBudgetCallbacks: this.diagnosticOverBudget, activeVoices: this.voices.filter((voice) => voice.state !== 'idle').length, polyphony: MAX_POLYPHONY, clock: this.diagnosticClock() })\n"""
          if old in t:t=t.replace(old,new,1)
          elif 'clock: this.diagnosticClock()' not in t:raise SystemExit('diagnostics post anchor missing')
          w.write_text(t,encoding='utf-8')

          ts=Path('src/audio/msfaAudioWorklet.ts');s=ts.read_text(encoding='utf-8')
          marker="""  readonly polyphony: number\n}\n\nexport interface MsfaAudioWorkletController"""
          replacement="""  readonly polyphony: number\n  readonly clock?: 'performance' | 'date'\n}\n\nexport interface MsfaAudioWorkletController"""
          if "readonly clock?: 'performance' | 'date'" not in s:
            if marker not in s:raise SystemExit('diagnostics interface anchor missing')
            s=s.replace(marker,replacement,1)
          old="""        diagnostics = { callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization, maxUtilization, overBudgetCallbacks, activeVoices, polyphony }\n"""
          new="""        const clock = data.clock === 'performance' || data.clock === 'date' ? data.clock : undefined\n        diagnostics = { callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization, maxUtilization, overBudgetCallbacks, activeVoices, polyphony, ...(clock === undefined ? {} : { clock }) }\n"""
          if old in s:s=s.replace(old,new,1)
          elif 'const clock = data.clock' not in s:raise SystemExit('controller diagnostic assignment anchor missing')
          ts.write_text(s,encoding='utf-8')

          ui=Path('src/components/VirtualDx7PreviewPanel.tsx');u=ui.read_text(encoding='utf-8')
          old="""        <div><p className=\"text-[10px] font-bold uppercase tracking-[0.12em] text-slate-500\">Mean render</p><p className=\"mt-1 text-sm font-black text-white\">{diagnostics ? `${diagnostics.meanRenderMs.toFixed(3)} ms · ${(diagnostics.meanUtilization * 100).toFixed(1)}%` : 'measurement pending'}</p></div>\n"""
          new="""        <div><p className=\"text-[10px] font-bold uppercase tracking-[0.12em] text-slate-500\">Mean render</p><p className=\"mt-1 text-sm font-black text-white\">{diagnostics ? `${diagnostics.meanRenderMs.toFixed(3)} ms · ${(diagnostics.meanUtilization * 100).toFixed(1)}%` : 'measurement pending'}</p><p className=\"mt-1 text-[9px] uppercase tracking-[0.1em] text-slate-600\">{diagnostics?.clock === 'date' ? '1 ms fallback clock' : diagnostics?.clock === 'performance' ? 'high-resolution clock' : 'clock pending'}</p></div>\n"""
          if '1 ms fallback clock' not in u:
            if old not in u:raise SystemExit('diagnostics UI anchor missing')
            u=u.replace(old,new,1)
          ui.write_text(u,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting gate
        id: gate
        shell: bash
        run: |
          set +e
          : >/tmp/clock-gate.txt
          run_stage(){ local name="$1"; shift; echo "=== $name ===" | tee -a /tmp/clock-gate.txt; "$@" 2>&1 | tee -a /tmp/clock-gate.txt; local code=${PIPESTATUS[0]}; echo "$name=$code" >> "$GITHUB_OUTPUT"; }
          run_stage syntax node --check public/virtual-dx7/fm1-msfa-worklet.js
          run_stage audit npm run audit:virtual-dx7
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused npm test -- src/audio/msfaAudioWorklet.test.ts src/components/VirtualDx7PreviewPanel.test.tsx
          run_stage test npm run test
          run_stage build npm run build
          if [ "$(grep -E '^(syntax|audit|typecheck|lint|focused|test|build)=' "$GITHUB_OUTPUT" | grep -vc '=0$')" -eq 0 ]; then echo 'ok=true' >> "$GITHUB_OUTPUT"; else echo 'ok=false' >> "$GITHUB_OUTPUT"; fi
      - name: Persist evidence
        if: always()
        env:
          OK: ${{ steps.gate.outputs.ok }}
          SYNTAX: ${{ steps.gate.outputs.syntax }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: python
        run: |
          import os,subprocess
          from pathlib import Path
          ok=os.environ.get('OK')=='true';log=Path('/tmp/clock-gate.txt').read_text(encoding='utf-8',errors='replace') if Path('/tmp/clock-gate.txt').exists() else 'gate log unavailable'
          rows=['| Stage | Exit |','| --- | ---: |']+[f"| {name} | {os.environ.get(key,'?')} |" for name,key in [('syntax','SYNTAX'),('audit','AUDIT'),('typecheck','TYPECHECK'),('lint','LINT'),('focused','FOCUSED'),('full tests','TEST'),('build','BUILD')]]
          Path('docs/validation/msfa-worklet-diagnostic-clock.md').write_text('\n'.join(['# AudioWorklet diagnostics clock fallback','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'','The worklet prefers `performance.now()` and falls back to measured `Date.now()` wall-clock callback timing when the AudioWorklet global does not expose the high-resolution Performance API. Diagnostic samples identify the clock source; the 1 ms fallback is not represented as a high-resolution profiler. Deadline budget, utilization and over-budget callback calculations remain measured rather than guessed.','', '```text',log[-18000:],'```','']),encoding='utf-8')
          if not ok:
            subprocess.run(['git','checkout','--','public/virtual-dx7/fm1-msfa-worklet.js','src/audio/msfaAudioWorklet.ts','src/components/VirtualDx7PreviewPanel.tsx'],check=True)
          Path('.github/workflows/add-worklet-diagnostic-clock-fallback.yml').unlink(missing_ok=True)
          Path('.github/workflows/diagnose-worklet-diagnostic-clock.yml').unlink(missing_ok=True)
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(audio): record worklet diagnostic clock gate' || true;git pull --rebase origin main;git push origin HEAD:main
