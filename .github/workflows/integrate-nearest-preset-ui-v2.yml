name: Integrate repaired nearest preset reconstruction UI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-nearest-preset-ui-v2.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fix owned playback buffer and mount reconstruction panel
        shell: python
        run: |
          from pathlib import Path
          panel=Path('src/components/NearestPresetPanel.tsx')
          text=panel.read_text(encoding='utf-8')
          old='buffer.copyToChannel(reference.samples, 0)'
          new='buffer.copyToChannel(Float32Array.from(reference.samples), 0)'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('Reference playback copy anchor missing')
          panel.write_text(text,encoding='utf-8')

          app=Path('src/App.tsx')
          text=app.read_text(encoding='utf-8')
          old_import="import { ReferenceAudioInputPanel } from './components/ReferenceAudioInputPanel'\n"
          new_import="import { AudioToFmReferencePanel } from './components/AudioToFmReferencePanel'\n"
          if old_import in text:
              text=text.replace(old_import,new_import,1)
          elif new_import not in text:
              raise SystemExit('Reference panel import anchor missing')
          old_hook='const { auditionVoice } = useLocalVoiceAudition()'
          new_hook='const { auditionVoice, stopAudition } = useLocalVoiceAudition()'
          if old_hook in text:
              text=text.replace(old_hook,new_hook,1)
          elif new_hook not in text:
              raise SystemExit('Local audition hook anchor missing')
          old_panel='''                    <ReferenceAudioInputPanel />\n'''
          new_panel='''                    <AudioToFmReferencePanel\n                      onAuditionVoice={auditionVoice}\n                      onLoadVoice={loadCatalogVoice}\n                      onStopAudition={stopAudition}\n                    />\n'''
          if old_panel in text:
              text=text.replace(old_panel,new_panel,1)
          elif '<AudioToFmReferencePanel' not in text:
              raise SystemExit('Mounted reference panel anchor missing')
          app.write_text(text,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/catalogPresetCandidates.test.ts src/audio/compactPresetIndex.test.ts src/components/NearestPresetPanel.test.tsx src/audio/nearestPreset.test.ts src/audio/referenceAudio.test.ts
      - run: npm run test
      - run: npm run build
      - name: Persist accepted software integration
        run: |
          cat > docs/validation/nearest-preset-ui-software.md <<EOF
          # Nearest-preset reconstruction UI software validation

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          - The mounted Audio → FM section combines local reference preparation and explicit nearest-preset retrieval.
          - Quick scan indexes up to 256 checksum-valid bundled voices; Full local bundled catalog is explicitly selectable.
          - Website-only/remote and diagnostic banks are excluded from the local index.
          - Matching is cancellable and chunked, uses the compact deterministic fingerprint index, a pitch-appropriate standardized probe and persistent local fingerprint cache.
          - Up to eight semantic candidates expose similarity and envelope/mel/MFCC/centroid/rolloff/flatness breakdowns.
          - Play reference A, dry Audition B and Load into editor are distinct explicit actions. Reference playback copies prepared samples into an owned ArrayBuffer-backed Web Audio buffer.
          - No candidate is auto-loaded, transmitted over Web MIDI or uploaded.
          - Virtual-DX7 source audit, typecheck, lint, focused tests, the full test suite and production build passed.

          Browser acceptance remains required before the nearest-preset PLAN item is closed.
          EOF
          rm -f .github/workflows/integrate-nearest-preset-ui.yml
          rm -f .github/workflows/integrate-nearest-preset-ui-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(audio): mount nearest preset reconstruction' || true
          git pull --rebase origin main
          git push origin HEAD:main
