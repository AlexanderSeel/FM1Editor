name: Validate scoped Virtual FM1 preview browser acceptance v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-virtual-fm1-preview-browser-v2.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden controlled Filter selector
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/test-virtual-fm1-preview-browser.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  const filterEnabled = await evaluate(cdp, `(() => { const section=[...document.querySelectorAll('section')].find((node)=>node.querySelector('h4')?.textContent?.trim()==='Filter'); const checkbox=section?.querySelector('input[type=checkbox]'); if(!checkbox) return false; if(!checkbox.checked) checkbox.click(); return checkbox.checked; })()`)\n  if (!filterEnabled) throw new Error('Unable to enable software Filter state')\n"""
          new = """  const filterControlFound = await evaluate(cdp, `(() => { const heading=[...document.querySelectorAll('h4')].find((node)=>node.textContent?.trim()==='Filter'); const section=heading?.closest('section'); const checkbox=section?.querySelector('input[type=checkbox]'); if(!checkbox) return false; if(!checkbox.checked) checkbox.click(); return true; })()`)\n  if (!filterControlFound) throw new Error('Unable to locate software Filter state control')\n  await waitForExpression(cdp, `(() => { const heading=[...document.querySelectorAll('h4')].find((node)=>node.textContent?.trim()==='Filter'); return Boolean(heading?.closest('section')?.querySelector('input[type=checkbox]')?.checked); })()`, 5_000)\n"""
          if old not in text and new not in text:
              raise SystemExit('Filter selector anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - run: node --check scripts/test-virtual-fm1-preview-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge with one startup retry
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          function Run-Acceptance($exe, $name, $result) {
            $exitCode = 1
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              node scripts/test-virtual-fm1-preview-browser.mjs --browser-executable $exe --browser-name $name --result $result
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) { break }
              Write-Host "$name attempt $attempt failed; retrying if available"
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $result)) {
              @{ ok = $false; browserName = $name; error = "runner exited $exitCode without result file" } | ConvertTo-Json | Set-Content -Encoding utf8 $result
            }
            return $exitCode
          }
          $chromeExit = Run-Acceptance $chrome 'chrome' 'virtual-fm1-preview-chrome.json'
          $edgeExit = Run-Acceptance $edge 'edge' 'virtual-fm1-preview-edge.json'
          Write-Host "Chrome exit $chromeExit; Edge exit $edgeExit"
          exit 0
      - name: Persist browser receipt and close roadmap item only on success
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p = Path(path)
              if not p.exists(): return {'ok': False, 'error': 'result missing'}
              try: return json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception as exc: return {'ok': False, 'error': f'invalid result: {exc}'}
          chrome = read('virtual-fm1-preview-chrome.json')
          edge = read('virtual-fm1-preview-edge.json')
          ok = bool(chrome.get('ok')) and bool(edge.get('ok'))
          def fmt(value):
              return '—' if value is None else f"{float(value):.8f}"
          def row(name, data):
              if not data.get('ok'):
                  return f"| {name} | FAILED | — | — | — | — | — | — | — | {data.get('error','unknown')} |"
              utilization = ', '.join(f"{float(value):.2f}%" for value in data.get('utilization', [])) or 'reported text only'
              return f"| {name} | {data.get('browserProduct')} | {fmt(data.get('dryPeak'))} | {fmt(data.get('fxPeak'))} | {fmt(data.get('attenuatedPeak'))} | {fmt(data.get('referencePeak'))} | {fmt(data.get('currentBPeak'))} | {data.get('downloadCount')} | {utilization} | PASS |"
          Path('docs/validation/virtual-fm1-preview-browser.md').write_text('\n'.join([
              '# Complete Virtual FM-1 preview browser acceptance','',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
              f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
              '| Browser | Product | Dry peak | FX peak | Attenuated peak | Reference A peak | Current B peak | WAV downloads | Measured utilization | Result |',
              '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- |',
              row('Chrome', chrome), row('Edge', edge),'',
              'The real mounted preview configures a non-zero local software Filter state with hardware Live send off, measures post-limiter dry and FX output, verifies master attenuation, waits for measured AudioWorklet render diagnostics, and scopes prepared-reference A/current-B/WAV actions specifically to the Virtual FM-1 A/B section. Note and chord downloads must contain valid RIFF/WAVE headers.','',
              'Acceptance requires zero Web MIDI requests and no external/write fetches. This validates browser-local DX7-compatible / FM-1-inspired behavior only; it does not claim physical FM-1 algorithm or audio equivalence.',''
          ]), encoding='utf-8')
          if ok:
              plan = Path('PLAN.md')
              text = plan.read_text(encoding='utf-8')
              old = '- [ ] Add a Virtual FM-1 preview target with local-audio enable, dry/FX toggle, master gain, limiter, polyphony/CPU diagnostics, current voice/effect synchronization, note/chord WAV rendering and uploaded-reference A/B comparison.'
              new = '- [x] Add a Virtual FM-1 preview target with explicit local-audio enable, dry/FX toggle, master gain, limiter, measured worklet polyphony/render diagnostics, current semantic voice/effect synchronization, deterministic note/chord WAV rendering and prepared-reference A/B comparison. Evidence: [`docs/validation/virtual-fm1-preview-complete-software.md`](./docs/validation/virtual-fm1-preview-complete-software.md) and [`docs/validation/virtual-fm1-preview-browser.md`](./docs/validation/virtual-fm1-preview-browser.md).'
              if old in text: text = text.replace(old, new, 1)
              elif new not in text: raise SystemExit('Virtual FM-1 roadmap item not found')
              plan.write_text(text, encoding='utf-8')
          Path('.github/workflows/validate-virtual-fm1-preview-browser-v2.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit harness, evidence and roadmap state
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): rerun scoped Virtual FM1 preview acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
