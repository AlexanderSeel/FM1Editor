name: Validate scoped complete Virtual FM1 preview in browsers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-virtual-fm1-preview-browser-v2.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scope A-B and WAV actions to the Virtual FM1 extras section
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/test-virtual-fm1-preview-browser.mjs')
          text=path.read_text(encoding='utf-8')
          anchor="""  await waitForExpression(cdp, `document.body.textContent.includes('preview-a4.wav') && document.body.textContent.includes('A 441.0 Hz')`, 25_000)\n\n  await clickButton(cdp, 'Play reference A')\n"""
          replacement="""  await waitForExpression(cdp, `document.body.textContent.includes('preview-a4.wav') && document.body.textContent.includes('A 441.0 Hz')`, 25_000)\n\n  const previewExtrasRoot = `document.querySelector('[aria-label=\\"Virtual FM-1 A/B and WAV rendering\\"]')`\n  await clickButton(cdp, 'Play reference A', previewExtrasRoot)\n"""
          if anchor not in text: raise SystemExit('Reference A scope anchor missing')
          text=text.replace(anchor,replacement,1)
          text=text.replace("await clickButton(cdp, 'Stop reference A')", "await clickButton(cdp, 'Stop reference A', previewExtrasRoot)",1)
          text=text.replace("await clickButton(cdp, 'Preview current B')", "await clickButton(cdp, 'Preview current B', previewExtrasRoot)",1)
          text=text.replace("await clickButton(cdp, 'Stop current B')", "await clickButton(cdp, 'Stop current B', previewExtrasRoot)",1)
          text=text.replace("await clickButton(cdp, 'Download note WAV')", "await clickButton(cdp, 'Download note WAV', previewExtrasRoot)",1)
          text=text.replace("await clickButton(cdp, 'Download chord WAV')", "await clickButton(cdp, 'Download chord WAV', previewExtrasRoot)",1)
          path.write_text(text,encoding='utf-8')
      - run: node --check scripts/test-virtual-fm1-preview-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge scoped acceptance with one retry
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          function Run-Acceptance($exe, $name, $result) {
            $exitCode=1
            for ($attempt=1; $attempt -le 2; $attempt++) {
              node scripts/test-virtual-fm1-preview-browser.mjs --browser-executable $exe --browser-name $name --result $result
              $exitCode=$LASTEXITCODE
              if ($exitCode -eq 0) { break }
              Write-Host "$name attempt $attempt failed; retrying if available"
              Start-Sleep -Seconds 1
            }
            return $exitCode
          }
          $chromeExit=Run-Acceptance $chrome 'chrome' 'virtual-fm1-preview-chrome.json'
          $edgeExit=Run-Acceptance $edge 'edge' 'virtual-fm1-preview-edge.json'
          Write-Host "Chrome exit $chromeExit; Edge exit $edgeExit"
          exit 0
      - name: Persist scoped browser evidence and close PLAN item on success
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'ok':False,'error':'result missing'}
          chrome=read('virtual-fm1-preview-chrome.json'); edge=read('virtual-fm1-preview-edge.json')
          ok=bool(chrome.get('ok')) and bool(edge.get('ok'))
          def row(name,d):
              if not d.get('ok'):
                  return f"| {name} | FAILED | — | — | — | — | — | — | — | {d.get('error','unknown')} |"
              util=', '.join(f"{value:.1f}%" for value in d.get('utilization',[])) or 'recorded in diagnostics text'
              return f"| {name} | {d.get('browserProduct')} | {d.get('dryPeak'):.8f} | {d.get('fxPeak'):.8f} | {d.get('attenuatedPeak'):.8f} | {d.get('referencePeak'):.8f} | {d.get('currentBPeak'):.8f} | {d.get('downloadCount')} | {util} | PASS |"
          Path('docs/validation/virtual-fm1-preview-browser.md').write_text('\n'.join([
            '# Complete Virtual FM-1 preview browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Browser | Product | Dry peak | FX peak | Attenuated peak | Reference A peak | Current B peak | WAV downloads | Measured utilization | Result |',
            '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- |',row('Chrome',chrome),row('Edge',edge),'',
            'The real mounted preview configures a non-zero local Filter state with hardware Live send off, measures post-limiter dry and FX output, verifies master attenuation, and waits for measured AudioWorklet diagnostics. Prepared-reference A, current B, note WAV and chord WAV actions are explicitly scoped to the Virtual FM-1 A/B section; downloaded blobs must contain valid RIFF/WAVE headers.','',
            'Acceptance requires zero Web MIDI requests and no external/write fetches. This validates browser-local DX7-compatible / FM-1-inspired behavior only; it does not claim physical FM-1 algorithm or audio equivalence.',''
          ]),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md'); text=plan.read_text(encoding='utf-8')
              old='- [ ] Add a Virtual FM-1 preview target with local-audio enable, dry/FX toggle, master gain, limiter, polyphony/CPU diagnostics, current voice/effect synchronization, note/chord WAV rendering and uploaded-reference A/B comparison.'
              new='- [x] Add a Virtual FM-1 preview target with explicit local-audio enable, dry/FM-1-inspired-FX toggle, master gain, limiter, measured polyphony/render diagnostics, current semantic voice/effect synchronization, deterministic note/chord WAV rendering and prepared local-reference A/B comparison. Evidence: [`docs/validation/virtual-fm1-preview-complete-software.md`](./docs/validation/virtual-fm1-preview-complete-software.md) and [`docs/validation/virtual-fm1-preview-browser.md`](./docs/validation/virtual-fm1-preview-browser.md).'
              if old in text: text=text.replace(old,new,1)
              elif new not in text: raise SystemExit('Virtual FM-1 preview roadmap item not found')
              plan.write_text(text,encoding='utf-8')
          Path('.github/workflows/validate-virtual-fm1-preview-browser.yml').unlink(missing_ok=True)
          Path('.github/workflows/validate-virtual-fm1-preview-browser-v2.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit scoped runner, evidence and roadmap state
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): record scoped Virtual FM1 preview acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
