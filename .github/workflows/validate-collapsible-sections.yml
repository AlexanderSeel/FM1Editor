name: Validate collapsible sections

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-collapsible-sections.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collapsible UI
        shell: bash
        run: |
          set +e
          validated_sha="$(git rev-parse HEAD)"
          npm install --no-audit --no-fund >/tmp/install.log 2>&1
          install_status=$?
          npm run typecheck >/tmp/typecheck.log 2>&1
          typecheck_status=$?
          npm run lint >/tmp/lint.log 2>&1
          lint_status=$?
          npm run test >/tmp/test.log 2>&1
          test_status=$?
          npm run build >/tmp/build.log 2>&1
          build_status=$?

          status_word() {
            if [[ "$1" -eq 0 ]]; then printf 'PASS'; else printf 'FAIL (%s)' "$1"; fi
          }

          mkdir -p docs/validation
          cat > docs/validation/collapsible-sections.md <<EOF
          # Collapsible sections validation

          Validated commit: \`$validated_sha\`

          - npm install: **$(status_word "$install_status")**
          - npm run typecheck: **$(status_word "$typecheck_status")**
          - npm run lint: **$(status_word "$lint_status")**
          - npm run test: **$(status_word "$test_status")**
          - npm run build: **$(status_word "$build_status")**

          Covered UI behavior:

          - major Voice, Library, Effects and Sequencer panels have independent collapse controls;
          - MIDI Monitor is collapsible and closed by default;
          - open/closed state is persisted in local storage;
          - controls expose aria-expanded and aria-controls;
          - hidden content remains mounted so editor state is preserved while collapsed.
          EOF

          for log in typecheck lint test build; do
            {
              printf '\n## %s output\n\n```text\n' "$log"
              tail -n 80 "/tmp/$log.log"
              printf '\n```\n'
            } >> docs/validation/collapsible-sections.md
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/collapsible-sections.md
          git commit -m 'test(ci): record collapsible section validation' || true
          git push origin HEAD:main

          if [[ "$install_status" -ne 0 || "$typecheck_status" -ne 0 || "$lint_status" -ne 0 || "$test_status" -ne 0 || "$build_status" -ne 0 ]]; then
            exit 1
          fi
