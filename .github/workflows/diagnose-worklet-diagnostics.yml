name: Diagnose measured worklet diagnostics

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-worklet-diagnostics.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Execute exact staged diagnostics patch
        shell: python
        run: |
          from pathlib import Path
          workflow=Path('.github/workflows/implement-worklet-diagnostics-v2.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,line in enumerate(workflow) if line.strip() == '- name: Instrument worklet and controller')
          run=next(i for i in range(start+1,len(workflow)) if workflow[i].strip() == 'run: |')
          lines=[]
          for line in workflow[run+1:]:
              if line.startswith('          '): lines.append(line[10:])
              elif line.strip() == '': lines.append('')
              else: break
          exec(compile('\n'.join(lines),'staged-diagnostics-patch','exec'),{})
      - run: node --check public/virtual-dx7/fm1-msfa-worklet.js
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/diag-gate.txt
          ok=true
          for stage in audit typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/diag-gate.txt
            case "$stage" in
              audit) npm run audit:virtual-dx7 2>&1 | tee -a /tmp/diag-gate.txt ;;
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/diag-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/diag-gate.txt ;;
              focused) npm test -- src/audio/msfaAudioWorklet.test.ts 2>&1 | tee -a /tmp/diag-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/diag-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/diag-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}; echo "$stage=$code" >> "$GITHUB_OUTPUT"; [ "$code" = 0 ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic or acceptance
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'; log=Path('/tmp/diag-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/msfa-worklet-diagnostics-diagnostic.md').write_text('\n'.join([
            '# MSFA measured worklet diagnostics gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',f"| audit | {os.environ.get('AUDIT')} |",f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'', '```text',log[-16000:],'```',''
          ]),encoding='utf-8')
          if ok:
              Path('docs/validation/msfa-worklet-diagnostics.md').write_text('\n'.join([
                '# MSFA AudioWorklet measured diagnostics','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'','Overall software gate: **SUCCESS**','',
                'The AudioWorklet measures render callback duration with `performance.now()` when available and reports every 128 callbacks: mean/max render ms, audio quantum budget, mean/max utilization, over-budget callback count, active voices and configured polyphony. If the high-resolution clock is unavailable, no diagnostic sample is emitted.','',
                'The controller validates and exposes only the latest accepted sample and clears it on shutdown. Worklet syntax, virtual-engine audit, typecheck, lint, focused tests, full tests and build passed. Browser performance evidence remains required.',''
              ]),encoding='utf-8')
              Path('.github/workflows/implement-worklet-diagnostics.yml').unlink(missing_ok=True)
              Path('.github/workflows/implement-worklet-diagnostics-v2.yml').unlink(missing_ok=True)
          PY
          if [ "${OK}" != "true" ]; then git checkout -- public/virtual-dx7/fm1-msfa-worklet.js src/audio/msfaAudioWorklet.ts src/audio/msfaAudioWorklet.test.ts; fi
          rm -f .github/workflows/diagnose-worklet-diagnostics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record measured worklet diagnostics gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
