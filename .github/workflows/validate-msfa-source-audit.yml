name: Validate pinned MSFA source audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-msfa-source-audit.yml'

permissions:
  contents: write

concurrency:
  group: validate-msfa-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Validate local source policy
        id: policy
        continue-on-error: true
        run: npm run audit:virtual-dx7

      - name: Verify pinned upstream and record SHA-256
        id: upstream
        continue-on-error: true
        run: npm run audit:virtual-dx7:upstream -- --write-hashes

      - name: Materialize exact pinned Dexed checkout outside repository
        id: clone
        if: steps.upstream.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/dexed"
          git -C "$RUNNER_TEMP/dexed" remote add origin https://github.com/asb2m10/dexed.git
          git -C "$RUNNER_TEMP/dexed" fetch --depth 1 origin 2e182b3db85c09083ab13c8b9b00565ce7d9ff85
          git -C "$RUNNER_TEMP/dexed" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/dexed" rev-parse HEAD)" = '2e182b3db85c09083ab13c8b9b00565ce7d9ff85'

      - name: Verify source-root identities, licenses and hashes
        id: source_root
        if: steps.upstream.outcome == 'success' && steps.clone.outcome == 'success'
        continue-on-error: true
        run: npm run audit:virtual-dx7 -- --source-root "$RUNNER_TEMP/dexed" --require-hashes

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint and accessibility
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Full Vitest suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record receipt and remove temporary workflow
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          POLICY_RESULT: ${{ steps.policy.outcome }}
          UPSTREAM_RESULT: ${{ steps.upstream.outcome }}
          CLONE_RESULT: ${{ steps.clone.outcome }}
          SOURCE_ROOT_RESULT: ${{ steps.source_root.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('docs/research/msfa-source-audit.json').read_text(encoding='utf-8'))
          hashes = [entry.get('sha256') for entry in manifest.get('files', [])]
          hash_count = sum(1 for value in hashes if isinstance(value, str) and len(value) == 64)

          results = {
              'dependency install': os.environ['INSTALL_RESULT'],
              'local source policy': os.environ['POLICY_RESULT'],
              'pinned upstream hash audit': os.environ['UPSTREAM_RESULT'],
              'exact Dexed checkout': os.environ['CLONE_RESULT'],
              'source-root audit': os.environ['SOURCE_ROOT_RESULT'],
              'typecheck': os.environ['TYPECHECK_RESULT'],
              'lint': os.environ['LINT_RESULT'],
              'full Vitest suite': os.environ['TEST_RESULT'],
              'production build': os.environ['BUILD_RESULT'],
          }
          required = [
              'pinned upstream hash audit', 'exact Dexed checkout', 'source-root audit',
              'typecheck', 'lint', 'full Vitest suite', 'production build',
          ]
          success = all(results[name] == 'success' for name in required) and hash_count == len(manifest.get('files', []))

          lines = [
              '# Pinned MSFA source audit execution',
              '',
              f"Validated FM1 Editor source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Pinned upstream: `asb2m10/dexed@{manifest['upstream']['commit']}`",
              '',
              f"Overall provenance/software gate: **{'SUCCESS' if success else 'FAILED'}**",
              '',
              '| Check | Result |',
              '| --- | --- |',
          ]
          lines.extend(f"| {name} | **{value.upper()}** |" for name, value in results.items())
          lines.extend([
              '',
              f"Recorded candidate SHA-256 values: **{hash_count}/{len(manifest.get('files', []))}**.",
              '',
              'The upstream audit fetched only the exact pinned candidate paths and did not retain MSFA source in the FM1 Editor repository. The source-root audit used a detached temporary checkout under the GitHub Actions runner and verified Git blob identities, file-level Apache-2.0 headers and the recorded SHA-256 values.',
              '',
              'This workflow did not compile MSFA, generate WebAssembly, run an AudioWorklet or validate physical Yamaha DX7 / M-VAVE FM-1 audio. Chrome/Edge renderer validation is not applicable until a renderer exists.',
              '',
              'The normal `.github/workflows/ci.yml` workflow remains read-only. This temporary write-enabled workflow removes itself in the result commit.',
              '',
          ])
          Path('docs/validation/msfa-source-hash-execution.md').write_text('\n'.join(lines), encoding='utf-8')
          Path('.github/workflows/validate-msfa-source-audit.yml').unlink(missing_ok=True)
          PY

      - name: Commit receipt, hashes and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(ci): record pinned MSFA source audit'
          git pull --rebase origin main
          git push origin HEAD:main
