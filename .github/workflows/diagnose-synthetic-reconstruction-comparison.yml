name: Diagnose packaged synthetic reconstruction comparison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-synthetic-reconstruction-comparison.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting benchmark gate
        id: gate
        shell: bash
        run: |
          set +e; : >/tmp/synthetic-comparison-gate.txt
          run_stage(){ local n="$1";shift;echo "=== $n ==="|tee -a /tmp/synthetic-comparison-gate.txt;"$@" 2>&1|tee -a /tmp/synthetic-comparison-gate.txt;local c=${PIPESTATUS[0]};echo "$n=$c" >> "$GITHUB_OUTPUT"; }
          run_stage audit npm run audit:virtual-dx7
          run_stage upstream npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          export FM1_RECONSTRUCTION_COMPARISON_RESULT=docs/validation/synthetic-reconstruction-comparison.json
          run_stage focused npm test -- src/audio/reconstructionComparison.integration.test.ts
          run_stage test npm run test
          run_stage build npm run build
          if [ "$(grep -E '^(audit|upstream|typecheck|lint|focused|test|build)=' "$GITHUB_OUTPUT"|grep -vc '=0$')" -eq 0 ];then echo ok=true >> "$GITHUB_OUTPUT";else echo ok=false >> "$GITHUB_OUTPUT";fi
      - name: Persist result
        if: always()
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          UPSTREAM: ${{ steps.gate.outputs.upstream }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: python
        run: |
          import json,os
          from pathlib import Path
          ok=os.environ.get('OK')=='true';log=Path('/tmp/synthetic-comparison-gate.txt').read_text(encoding='utf-8',errors='replace')
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {n} | {os.environ.get(k,"?")} |' for n,k in [('audit','AUDIT'),('upstream audit','UPSTREAM'),('typecheck','TYPECHECK'),('lint','LINT'),('focused benchmark','FOCUSED'),('full tests','TEST'),('build','BUILD')]]
          report=Path('docs/validation/synthetic-reconstruction-comparison.json')
          summary=['# Packaged-engine synthetic reconstruction comparison','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall benchmark gate: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'']
          if report.exists():
            try:
              data=json.loads(report.read_text(encoding='utf-8'));results={r['approachId']:r for r in data['results']};retrieval=results['retrieval'];evolutionary=results['evolutionary'];learned=results['learned-initialization'];delta=data['benchmark']['retrievalVsEvolutionaryDelta']
              summary += ['| Approach | Candidates | Best distance | Runtime ms | Source / failure |','| --- | ---: | ---: | ---: | --- |',f"| Retrieval only | {retrieval['candidateCount']} | {retrieval['bestDistance']:.8f} | {retrieval['runtimeMs']:.3f} | {retrieval.get('sourceInitialization') or '—'} |",f"| Seeded constrained CMA-ES | {evolutionary['candidateCount']} | {evolutionary['bestDistance']:.8f} | {evolutionary['runtimeMs']:.3f} | {evolutionary.get('sourceInitialization') or '—'} |",f"| Learned initialization | {learned['candidateCount']} | — | {learned['runtimeMs']:.3f} | {learned.get('failure') or '—'} |",'',f"Retrieval minus evolutionary best-distance delta: `{delta:.8f}`.",'']
            except Exception as exc: summary += [f'Benchmark JSON exists but could not be summarized: `{exc}`','']
          summary += ['Scope remains one repository-owned synthetic ground-truth case through the packaged DX7-compatible MSFA engine. It is not a real isolated-sound benchmark and does not establish learned initialization.','','```text',log[-22000:],'```','']
          Path('docs/validation/synthetic-reconstruction-comparison.md').write_text('\n'.join(summary),encoding='utf-8')
          Path('.github/workflows/validate-synthetic-reconstruction-comparison.yml').unlink(missing_ok=True);Path('.github/workflows/diagnose-synthetic-reconstruction-comparison.yml').unlink(missing_ok=True)
      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(audio): record synthetic comparison gate' || true;git pull --rebase origin main;git push origin HEAD:main
