name: Implement compact preset fingerprint index

on:
  push:
    branches: [main]
    paths: ['.github/workflows/implement-compact-preset-index.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add compact fingerprint and index infrastructure
        run: |
          cat > src/audio/audioDescriptorFingerprint.ts <<'EOF'
          import {
            AUDIO_DESCRIPTOR_SCHEMA,
            type AudioDescriptorProfile,
            type AudioSpectralResolutionDescriptor,
          } from './audioDescriptors'

          export const AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA = 'fm1-editor.audio-descriptor-fingerprint.v1' as const
          export const AUDIO_DESCRIPTOR_FINGERPRINT_ENVELOPE_POINTS = 32 as const

          export interface AudioSpectralFingerprint {
            readonly fftSize: number
            readonly meanLogMel: Float32Array
            readonly meanMfcc: Float32Array
            readonly centroidMeanHz: number
            readonly centroidStandardDeviationHz: number
            readonly rolloffMeanHz: number
            readonly rolloffStandardDeviationHz: number
            readonly flatnessMean: number
            readonly flatnessStandardDeviation: number
          }

          export interface AudioDescriptorFingerprint {
            readonly schema: typeof AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA
            readonly sourceDescriptorSchema: typeof AUDIO_DESCRIPTOR_SCHEMA
            readonly sampleRate: number
            readonly durationSeconds: number
            readonly envelopeRms: Float32Array
            readonly envelopePeak: Float32Array
            readonly spectral: readonly AudioSpectralFingerprint[]
          }

          export interface FingerprintMetricBreakdown {
            readonly envelope: number
            readonly mel: number
            readonly mfcc: number
            readonly centroid: number
            readonly rolloff: number
            readonly flatness: number
            readonly total: number
          }

          function resample(values: Float32Array, points: number): Float32Array {
            if (values.length === 0) return new Float32Array(points)
            if (values.length === 1) return new Float32Array(points).fill(values[0] ?? 0)
            const result = new Float32Array(points)
            for (let index = 0; index < points; index += 1) {
              const position = points === 1 ? 0 : index * (values.length - 1) / (points - 1)
              const left = Math.floor(position)
              const right = Math.min(values.length - 1, left + 1)
              const amount = position - left
              result[index] = (values[left] ?? 0) * (1 - amount) + (values[right] ?? 0) * amount
            }
            return result
          }

          function meanFrames(values: Float32Array, frameCount: number, width: number): Float32Array {
            const result = new Float32Array(width)
            if (frameCount <= 0 || width <= 0) return result
            if (values.length !== frameCount * width) throw new Error('Descriptor frame matrix shape is inconsistent.')
            for (let frame = 0; frame < frameCount; frame += 1) {
              const offset = frame * width
              for (let column = 0; column < width; column += 1) {
                result[column] = (result[column] ?? 0) + (values[offset + column] ?? 0) / frameCount
              }
            }
            return result
          }

          function compactResolution(
            resolution: AudioSpectralResolutionDescriptor,
            melBands: number,
            mfccCount: number,
          ): AudioSpectralFingerprint {
            const frameCount = resolution.sampledFrameStarts.length
            return {
              fftSize: resolution.fftSize,
              meanLogMel: meanFrames(resolution.logMelSpectrum, frameCount, melBands),
              meanMfcc: meanFrames(resolution.mfcc, frameCount, mfccCount),
              centroidMeanHz: resolution.centroidMoments.mean,
              centroidStandardDeviationHz: resolution.centroidMoments.standardDeviation,
              rolloffMeanHz: resolution.rolloffMoments.mean,
              rolloffStandardDeviationHz: resolution.rolloffMoments.standardDeviation,
              flatnessMean: resolution.flatnessMoments.mean,
              flatnessStandardDeviation: resolution.flatnessMoments.standardDeviation,
            }
          }

          export function createAudioDescriptorFingerprint(profile: AudioDescriptorProfile): AudioDescriptorFingerprint {
            if (profile.schema !== AUDIO_DESCRIPTOR_SCHEMA) throw new Error('Unsupported audio descriptor schema.')
            return {
              schema: AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA,
              sourceDescriptorSchema: AUDIO_DESCRIPTOR_SCHEMA,
              sampleRate: profile.sampleRate,
              durationSeconds: profile.durationSeconds,
              envelopeRms: resample(profile.amplitudeEnvelopeRms, AUDIO_DESCRIPTOR_FINGERPRINT_ENVELOPE_POINTS),
              envelopePeak: resample(profile.amplitudeEnvelopePeak, AUDIO_DESCRIPTOR_FINGERPRINT_ENVELOPE_POINTS),
              spectral: profile.spectral.map((resolution) => compactResolution(
                resolution,
                profile.config.melBands,
                profile.config.mfccCount,
              )),
            }
          }

          function rmsDistance(left: Float32Array, right: Float32Array, scale = 1): number {
            if (left.length !== right.length) throw new Error('Fingerprint vectors must have equal lengths.')
            if (left.length === 0) return 0
            let sum = 0
            for (let index = 0; index < left.length; index += 1) {
              const difference = ((left[index] ?? 0) - (right[index] ?? 0)) / scale
              sum += difference * difference
            }
            return Math.sqrt(sum / left.length)
          }

          function mean(values: readonly number[]): number {
            return values.length === 0 ? 0 : values.reduce((sum, value) => sum + value, 0) / values.length
          }

          export function compareAudioDescriptorFingerprints(
            reference: AudioDescriptorFingerprint,
            candidate: AudioDescriptorFingerprint,
          ): FingerprintMetricBreakdown {
            if (reference.schema !== AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA || candidate.schema !== AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA) {
              throw new Error('Unsupported audio descriptor fingerprint schema.')
            }
            if (reference.spectral.length !== candidate.spectral.length) throw new Error('Fingerprint spectral resolutions differ.')
            const nyquist = Math.max(reference.sampleRate, candidate.sampleRate) / 2
            const envelope = mean([
              rmsDistance(reference.envelopeRms, candidate.envelopeRms),
              rmsDistance(reference.envelopePeak, candidate.envelopePeak),
            ])
            const mel: number[] = []
            const mfcc: number[] = []
            const centroid: number[] = []
            const rolloff: number[] = []
            const flatness: number[] = []
            reference.spectral.forEach((left, index) => {
              const right = candidate.spectral[index]
              if (!right || left.fftSize !== right.fftSize) throw new Error('Fingerprint FFT resolutions differ.')
              mel.push(rmsDistance(left.meanLogMel, right.meanLogMel, 12))
              mfcc.push(rmsDistance(left.meanMfcc, right.meanMfcc, 20))
              centroid.push(Math.abs(left.centroidMeanHz - right.centroidMeanHz) / nyquist)
              centroid.push(Math.abs(left.centroidStandardDeviationHz - right.centroidStandardDeviationHz) / nyquist)
              rolloff.push(Math.abs(left.rolloffMeanHz - right.rolloffMeanHz) / nyquist)
              rolloff.push(Math.abs(left.rolloffStandardDeviationHz - right.rolloffStandardDeviationHz) / nyquist)
              flatness.push(Math.abs(left.flatnessMean - right.flatnessMean))
              flatness.push(Math.abs(left.flatnessStandardDeviation - right.flatnessStandardDeviation))
            })
            const metrics = {
              envelope,
              mel: mean(mel),
              mfcc: mean(mfcc),
              centroid: mean(centroid),
              rolloff: mean(rolloff),
              flatness: mean(flatness),
            }
            return {
              ...metrics,
              total: metrics.envelope * 0.18
                + metrics.mel * 0.32
                + metrics.mfcc * 0.22
                + metrics.centroid * 0.10
                + metrics.rolloff * 0.10
                + metrics.flatness * 0.08,
            }
          }

          export function fingerprintFloatCount(fingerprint: AudioDescriptorFingerprint): number {
            return fingerprint.envelopeRms.length + fingerprint.envelopePeak.length + fingerprint.spectral.reduce(
              (sum, resolution) => sum + resolution.meanLogMel.length + resolution.meanMfcc.length + 6,
              0,
            )
          }
          EOF

          cat > src/audio/presetFingerprintCache.ts <<'EOF'
          import type { AudioDescriptorConfig } from './audioDescriptors'
          import {
            AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA,
            type AudioDescriptorFingerprint,
            type AudioSpectralFingerprint,
          } from './audioDescriptorFingerprint'

          export const PRESET_FINGERPRINT_CACHE_SCHEMA = 'fm1-editor.preset-fingerprint-cache.v1' as const
          const DATABASE_NAME = 'fm1-editor-preset-fingerprints'
          const STORE_NAME = 'fingerprints'

          export interface PresetFingerprintCache {
            get(key: string): Promise<AudioDescriptorFingerprint | null>
            put(key: string, fingerprint: AudioDescriptorFingerprint): Promise<void>
            clear(): Promise<void>
          }

          export interface PresetFingerprintCacheIdentity {
            readonly engineId: string
            readonly engineVersion: string
            readonly renderKey: string
            readonly descriptorConfig: AudioDescriptorConfig
          }

          function configIdentity(config: AudioDescriptorConfig): string {
            return JSON.stringify({
              envelopeWindowMs: config.envelopeWindowMs,
              envelopeHopMs: config.envelopeHopMs,
              fftSizes: [...config.fftSizes],
              spectralHopRatio: config.spectralHopRatio,
              melBands: config.melBands,
              mfccCount: config.mfccCount,
              rolloffFraction: config.rolloffFraction,
              maxSpectralFrames: config.maxSpectralFrames,
              minimumHz: config.minimumHz,
              maximumHz: config.maximumHz,
            })
          }

          export function createPresetFingerprintCacheKey(identity: PresetFingerprintCacheIdentity): string {
            return [
              PRESET_FINGERPRINT_CACHE_SCHEMA,
              AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA,
              identity.engineId,
              identity.engineVersion,
              identity.renderKey,
              configIdentity(identity.descriptorConfig),
            ].join('|')
          }

          function cloneSpectral(value: AudioSpectralFingerprint): AudioSpectralFingerprint {
            return { ...value, meanLogMel: new Float32Array(value.meanLogMel), meanMfcc: new Float32Array(value.meanMfcc) }
          }

          export function cloneAudioDescriptorFingerprint(value: AudioDescriptorFingerprint): AudioDescriptorFingerprint {
            return {
              ...value,
              envelopeRms: new Float32Array(value.envelopeRms),
              envelopePeak: new Float32Array(value.envelopePeak),
              spectral: value.spectral.map(cloneSpectral),
            }
          }

          function valid(value: unknown): value is AudioDescriptorFingerprint {
            if (!value || typeof value !== 'object') return false
            const candidate = value as Partial<AudioDescriptorFingerprint>
            return candidate.schema === AUDIO_DESCRIPTOR_FINGERPRINT_SCHEMA
              && candidate.envelopeRms instanceof Float32Array
              && candidate.envelopePeak instanceof Float32Array
              && Array.isArray(candidate.spectral)
          }

          export function createMemoryPresetFingerprintCache(): PresetFingerprintCache {
            const values = new Map<string, AudioDescriptorFingerprint>()
            return {
              async get(key) {
                const value = values.get(key)
                return value ? cloneAudioDescriptorFingerprint(value) : null
              },
              async put(key, fingerprint) {
                if (!valid(fingerprint)) throw new Error('Preset fingerprint cache requires a versioned fingerprint.')
                values.set(key, cloneAudioDescriptorFingerprint(fingerprint))
              },
              async clear() { values.clear() },
            }
          }

          function requestResult<T>(request: IDBRequest<T>): Promise<T> {
            return new Promise<T>((resolve, reject) => {
              request.onsuccess = () => resolve(request.result)
              request.onerror = () => reject(request.error ?? new Error('IndexedDB fingerprint request failed.'))
            })
          }

          function transactionDone(transaction: IDBTransaction): Promise<void> {
            return new Promise<void>((resolve, reject) => {
              transaction.oncomplete = () => resolve()
              transaction.onerror = () => reject(transaction.error ?? new Error('IndexedDB fingerprint transaction failed.'))
              transaction.onabort = () => reject(transaction.error ?? new Error('IndexedDB fingerprint transaction aborted.'))
            })
          }

          export function createIndexedDbPresetFingerprintCache(options: { readonly indexedDb?: IDBFactory; readonly databaseName?: string } = {}): PresetFingerprintCache {
            const factory = options.indexedDb ?? globalThis.indexedDB
            if (!factory) throw new Error('IndexedDB is unavailable for the local compact preset index.')
            const databaseName = options.databaseName ?? DATABASE_NAME
            let openPromise: Promise<IDBDatabase> | null = null
            const database = () => {
              openPromise ??= new Promise<IDBDatabase>((resolve, reject) => {
                const request = factory.open(databaseName, 1)
                request.onupgradeneeded = () => {
                  if (!request.result.objectStoreNames.contains(STORE_NAME)) request.result.createObjectStore(STORE_NAME)
                }
                request.onsuccess = () => resolve(request.result)
                request.onerror = () => reject(request.error ?? new Error('Unable to open local compact preset index.'))
                request.onblocked = () => reject(new Error('Local compact preset index is blocked by another tab.'))
              })
              return openPromise
            }
            return {
              async get(key) {
                const db = await database()
                const transaction = db.transaction(STORE_NAME, 'readonly')
                const value = await requestResult(transaction.objectStore(STORE_NAME).get(key))
                await transactionDone(transaction)
                return valid(value) ? cloneAudioDescriptorFingerprint(value) : null
              },
              async put(key, fingerprint) {
                if (!valid(fingerprint)) throw new Error('Preset fingerprint cache requires a versioned fingerprint.')
                const db = await database()
                const transaction = db.transaction(STORE_NAME, 'readwrite')
                transaction.objectStore(STORE_NAME).put(cloneAudioDescriptorFingerprint(fingerprint), key)
                await transactionDone(transaction)
              },
              async clear() {
                const db = await database()
                const transaction = db.transaction(STORE_NAME, 'readwrite')
                transaction.objectStore(STORE_NAME).clear()
                await transactionDone(transaction)
              },
            }
          }
          EOF

          cat > src/audio/compactPresetIndex.ts <<'EOF'
          import type { Dx7Voice } from '../domain/voice'
          import {
            createAudioDescriptorProfile,
            DEFAULT_AUDIO_DESCRIPTOR_CONFIG,
            type AudioDescriptorConfig,
          } from './audioDescriptors'
          import {
            compareAudioDescriptorFingerprints,
            createAudioDescriptorFingerprint,
            type AudioDescriptorFingerprint,
            type FingerprintMetricBreakdown,
          } from './audioDescriptorFingerprint'
          import { frequencyToMidiNote, type PresetIndexCandidate, type PresetRenderProbe } from './nearestPreset'
          import { createPresetFingerprintCacheKey, type PresetFingerprintCache } from './presetFingerprintCache'
          import {
            createVirtualDx7RenderPlan,
            type VirtualDx7OfflineEngine,
            type VirtualDx7SampleRate,
          } from './virtualDx7Engine'

          export const COMPACT_PRESET_INDEX_SCHEMA = 'fm1-editor.compact-preset-index.v1' as const
          export const COMPACT_PRESET_DESCRIPTOR_CONFIG: AudioDescriptorConfig = Object.freeze({
            ...DEFAULT_AUDIO_DESCRIPTOR_CONFIG,
            fftSizes: Object.freeze([512, 1024, 2048]),
            maxSpectralFrames: 16,
          })
          export const COMPACT_PRESET_PROBES: readonly PresetRenderProbe[] = Object.freeze([
            { id: 'c3-soft', midiNote: 48, velocity: 80, noteOnSeconds: 1, releaseSeconds: 0.5, randomSeed: 42 },
            { id: 'c4-main', midiNote: 60, velocity: 108, noteOnSeconds: 1, releaseSeconds: 0.5, randomSeed: 42 },
            { id: 'c5-main', midiNote: 72, velocity: 108, noteOnSeconds: 1, releaseSeconds: 0.5, randomSeed: 42 },
          ])

          export interface CompactPresetIndexedProbe {
            readonly probe: PresetRenderProbe
            readonly renderKey: string
            readonly fingerprint: AudioDescriptorFingerprint
          }
          export interface CompactPresetIndexEntry {
            readonly id: string
            readonly voice: Dx7Voice
            readonly sourceLabel: string
            readonly probes: readonly CompactPresetIndexedProbe[]
          }
          export interface CompactPresetDescriptorIndex {
            readonly schema: typeof COMPACT_PRESET_INDEX_SCHEMA
            readonly engineId: string
            readonly engineVersion: string
            readonly sampleRate: VirtualDx7SampleRate
            readonly descriptorConfig: AudioDescriptorConfig
            readonly probes: readonly PresetRenderProbe[]
            readonly entries: readonly CompactPresetIndexEntry[]
          }
          export interface CompactPresetRankedCandidate {
            readonly id: string
            readonly voice: Dx7Voice
            readonly sourceLabel: string
            readonly matchedProbe: PresetRenderProbe
            readonly renderKey: string
            readonly distance: number
            readonly score: number
            readonly metrics: FingerprintMetricBreakdown
          }

          function abort(signal?: AbortSignal): void {
            if (signal?.aborted) throw new DOMException('Preset index build was cancelled.', 'AbortError')
          }
          function copyConfig(config: AudioDescriptorConfig): AudioDescriptorConfig { return { ...config, fftSizes: [...config.fftSizes] } }
          function copyProbe(probe: PresetRenderProbe): PresetRenderProbe { return { ...probe } }

          export async function buildCompactPresetDescriptorIndex(
            candidates: readonly PresetIndexCandidate[],
            engine: VirtualDx7OfflineEngine,
            options: {
              readonly sampleRate?: VirtualDx7SampleRate
              readonly probes?: readonly PresetRenderProbe[]
              readonly descriptorConfig?: AudioDescriptorConfig
              readonly fingerprintCache?: PresetFingerprintCache
              readonly signal?: AbortSignal
              readonly onCacheHit?: (candidate: PresetIndexCandidate, probe: PresetRenderProbe) => void
              readonly onProgress?: (completed: number, total: number, candidate: PresetIndexCandidate, probe: PresetRenderProbe) => void
            } = {},
          ): Promise<CompactPresetDescriptorIndex> {
            abort(options.signal)
            const ids = new Set<string>()
            for (const candidate of candidates) {
              if (ids.has(candidate.id)) throw new Error(`Duplicate preset candidate id: ${candidate.id}`)
              ids.add(candidate.id)
            }
            const sampleRate = options.sampleRate ?? 48_000
            const probes = options.probes ?? COMPACT_PRESET_PROBES
            const descriptorConfig = options.descriptorConfig ?? COMPACT_PRESET_DESCRIPTOR_CONFIG
            const entries: CompactPresetIndexEntry[] = []
            let completed = 0
            const total = candidates.length * probes.length
            for (const candidate of candidates) {
              const indexedProbes: CompactPresetIndexedProbe[] = []
              for (const probe of probes) {
                abort(options.signal)
                const plan = createVirtualDx7RenderPlan({ voice: candidate.voice, sampleRate, ...probe })
                const cacheKey = createPresetFingerprintCacheKey({
                  engineId: engine.engineId,
                  engineVersion: engine.engineVersion,
                  renderKey: plan.renderKey,
                  descriptorConfig,
                })
                let fingerprint = options.fingerprintCache ? await options.fingerprintCache.get(cacheKey) : null
                abort(options.signal)
                if (fingerprint) {
                  options.onCacheHit?.(candidate, probe)
                } else {
                  const render = await engine.render(plan, options.signal)
                  abort(options.signal)
                  fingerprint = createAudioDescriptorFingerprint(
                    createAudioDescriptorProfile(render.samples, render.sampleRate, descriptorConfig),
                  )
                  if (options.fingerprintCache) await options.fingerprintCache.put(cacheKey, fingerprint)
                }
                indexedProbes.push({ probe: copyProbe(probe), renderKey: plan.renderKey, fingerprint })
                completed += 1
                options.onProgress?.(completed, total, candidate, probe)
              }
              entries.push({ id: candidate.id, voice: candidate.voice, sourceLabel: candidate.sourceLabel, probes: indexedProbes })
            }
            return {
              schema: COMPACT_PRESET_INDEX_SCHEMA,
              engineId: engine.engineId,
              engineVersion: engine.engineVersion,
              sampleRate,
              descriptorConfig: copyConfig(descriptorConfig),
              probes: probes.map(copyProbe),
              entries,
            }
          }

          function targetProbe(probes: readonly PresetRenderProbe[], referencePitchHz?: number | null): PresetRenderProbe | undefined {
            if (probes.length === 0) return undefined
            if (!referencePitchHz || !Number.isFinite(referencePitchHz) || referencePitchHz <= 0) return probes.find((probe) => probe.id === 'c4-main') ?? probes[0]
            const target = frequencyToMidiNote(referencePitchHz)
            return [...probes].sort((left, right) => Math.abs(left.midiNote - target) - Math.abs(right.midiNote - target))[0]
          }

          export function rankCompactPresetDescriptorIndex(
            reference: AudioDescriptorFingerprint,
            index: CompactPresetDescriptorIndex,
            options: { readonly limit?: number; readonly referencePitchHz?: number | null } = {},
          ): readonly CompactPresetRankedCandidate[] {
            const probe = targetProbe(index.probes, options.referencePitchHz)
            if (!probe) return []
            const ranked = index.entries.map((entry) => {
              const indexed = entry.probes.find((item) => item.probe.id === probe.id) ?? entry.probes[0]
              if (!indexed) throw new Error(`Preset index entry ${entry.id} contains no probes.`)
              const metrics = compareAudioDescriptorFingerprints(reference, indexed.fingerprint)
              return {
                id: entry.id,
                voice: entry.voice,
                sourceLabel: entry.sourceLabel,
                matchedProbe: indexed.probe,
                renderKey: indexed.renderKey,
                distance: metrics.total,
                score: 1 / (1 + metrics.total),
                metrics,
              }
            }).sort((left, right) => left.distance - right.distance || left.id.localeCompare(right.id))
            return ranked.slice(0, Math.max(1, options.limit ?? 8))
          }
          EOF

          cat > src/audio/compactPresetIndex.test.ts <<'EOF'
          import { describe, expect, it, vi } from 'vitest'
          import { createInitializedVoice } from '../domain/voice'
          import { createAudioDescriptorProfile, type AudioDescriptorConfig } from './audioDescriptors'
          import {
            compareAudioDescriptorFingerprints,
            createAudioDescriptorFingerprint,
            fingerprintFloatCount,
          } from './audioDescriptorFingerprint'
          import { buildCompactPresetDescriptorIndex, rankCompactPresetDescriptorIndex } from './compactPresetIndex'
          import { createMemoryPresetFingerprintCache } from './presetFingerprintCache'
          import type { VirtualDx7OfflineEngine, VirtualDx7RenderPlan } from './virtualDx7Engine'

          const CONFIG: AudioDescriptorConfig = {
            envelopeWindowMs: 20, envelopeHopMs: 10, fftSizes: [256, 512, 1024], spectralHopRatio: 0.25,
            melBands: 24, mfccCount: 10, rolloffFraction: 0.85, maxSpectralFrames: 12, minimumHz: 20, maximumHz: null,
          }
          function sine(frequency: number, sampleRate = 8_000, seconds = 0.5): Float32Array {
            return Float32Array.from({ length: Math.round(sampleRate * seconds) }, (_, index) => Math.sin(2 * Math.PI * frequency * index / sampleRate) * 0.5)
          }
          function rawFloatCount(profile: ReturnType<typeof createAudioDescriptorProfile>): number {
            return profile.amplitudeEnvelopeRms.length + profile.amplitudeEnvelopePeak.length + profile.spectral.reduce((sum, item) =>
              sum + item.logMagnitude.length + item.logMelSpectrum.length + item.mfcc.length + item.spectralCentroidHz.length + item.spectralRolloffHz.length + item.spectralFlatness.length, 0)
          }

          describe('compact audio fingerprints', () => {
            it('is deterministic and substantially smaller than the bounded analysis profile', () => {
              const profile = createAudioDescriptorProfile(sine(440), 8_000, CONFIG)
              const first = createAudioDescriptorFingerprint(profile)
              const second = createAudioDescriptorFingerprint(createAudioDescriptorProfile(sine(440), 8_000, CONFIG))
              expect(first).toEqual(second)
              expect(fingerprintFloatCount(first) * 8).toBeLessThan(rawFloatCount(profile))
            })

            it('gives zero distance to itself and separates a different tone', () => {
              const a = createAudioDescriptorFingerprint(createAudioDescriptorProfile(sine(440), 8_000, CONFIG))
              const b = createAudioDescriptorFingerprint(createAudioDescriptorProfile(sine(880), 8_000, CONFIG))
              expect(compareAudioDescriptorFingerprints(a, a).total).toBe(0)
              expect(compareAudioDescriptorFingerprints(a, b).total).toBeGreaterThan(0)
            })
          })

          describe('compact preset index', () => {
            it('reuses persistent fingerprints and ranks the matching timbre first', async () => {
              const render = vi.fn(async (plan: VirtualDx7RenderPlan) => {
                const frequency = plan.voice.algorithm === 1 ? 440 : 880
                const samples = sine(frequency, plan.sampleRate, plan.totalFrames / plan.sampleRate)
                return { renderKey: plan.renderKey, sampleRate: plan.sampleRate, channelCount: 1 as const, frameCount: plan.totalFrames, samples }
              })
              const engine: VirtualDx7OfflineEngine = { engineId: 'test', engineVersion: '1', licenseSpdx: 'test', render }
              const firstVoice = { ...createInitializedVoice('MATCH'), algorithm: 1 }
              const secondVoice = { ...createInitializedVoice('OTHER'), algorithm: 2 }
              const candidates = [
                { id: 'a', voice: firstVoice, sourceLabel: 'A' },
                { id: 'b', voice: secondVoice, sourceLabel: 'B' },
              ]
              const probes = [{ id: 'c4-main', midiNote: 60, velocity: 100, noteOnSeconds: 0.1, releaseSeconds: 0.1, randomSeed: 42 }]
              const cache = createMemoryPresetFingerprintCache()
              const first = await buildCompactPresetDescriptorIndex(candidates, engine, { probes, descriptorConfig: CONFIG, fingerprintCache: cache })
              expect(render).toHaveBeenCalledTimes(2)
              const cacheHit = vi.fn()
              const second = await buildCompactPresetDescriptorIndex(candidates, engine, { probes, descriptorConfig: CONFIG, fingerprintCache: cache, onCacheHit: cacheHit })
              expect(render).toHaveBeenCalledTimes(2)
              expect(cacheHit).toHaveBeenCalledTimes(2)
              const reference = createAudioDescriptorFingerprint(createAudioDescriptorProfile(sine(440), 8_000, CONFIG))
              expect(rankCompactPresetDescriptorIndex(reference, second, { limit: 2 }).map((item) => item.id)).toEqual(['a', 'b'])
              expect(first.entries).toHaveLength(2)
            })
          })
          EOF
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/compactPresetIndex.test.ts src/audio/nearestPreset.test.ts src/audio/audioDescriptors.test.ts
      - run: npm run test
      - run: npm run build
      - name: Persist implementation receipt
        run: |
          cat > docs/validation/compact-preset-index-core.md <<EOF
          # Compact preset fingerprint index core

