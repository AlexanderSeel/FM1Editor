name: Diagnose MSFA performance ABI rebuild v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-msfa-performance-build-v2.yml']

permissions:
  contents: write

concurrency:
  group: diagnose-msfa-performance-build-v2
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run staged diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .tmp/source/msfa .tmp/out-a .tmp/out-b
          cp -R third_party/msfa/src/. .tmp/source/msfa/
          : > .tmp/diagnostic-v2.log
          run_stage() {
            local name="$1"; shift
            echo >> .tmp/diagnostic-v2.log
            echo "## $name" >> .tmp/diagnostic-v2.log
            "$@" >> .tmp/diagnostic-v2.log 2>&1
            local rc=$?
            echo "RC=$rc" >> .tmp/diagnostic-v2.log
            return 0
          }
          run_stage BUILD_A docker run --rm -v "$PWD:/repo" -w /repo \
            emscripten/emsdk@sha256:8acec700a48dbff5250afc1e3ee545b7c002b689043ee82c277de6481a237fd7 \
            bash -lc 'bash scripts/build-msfa-spike.sh /repo/.tmp/source /repo/.tmp/out-a wasm'
          if [ -f .tmp/out-a/fm1-msfa.wasm ]; then
            run_stage BUILD_B docker run --rm -v "$PWD:/repo" -w /repo \
              emscripten/emsdk@sha256:8acec700a48dbff5250afc1e3ee545b7c002b689043ee82c277de6481a237fd7 \
              bash -lc 'bash scripts/build-msfa-spike.sh /repo/.tmp/source /repo/.tmp/out-b wasm'
            run_stage HASHES sha256sum .tmp/out-a/fm1-msfa.wasm .tmp/out-b/fm1-msfa.wasm .tmp/out-a/fm1-msfa.mjs .tmp/out-b/fm1-msfa.mjs
            cat > .tmp/probe.mjs <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'
          import { pathToFileURL } from 'node:url'
          import { resolve } from 'node:path'
          const factory=(await import(pathToFileURL(resolve('.tmp/out-a/fm1-msfa.mjs')).href)).default
          const wasmBinary=new Uint8Array(await readFile('.tmp/out-a/fm1-msfa.wasm'))
          const module=await factory({wasmBinary,locateFile:(path)=>path})
          const exports=['_fm1_msfa_session_configure_performance','_fm1_msfa_session_set_pitch_bend','_fm1_msfa_session_set_modulation','_fm1_msfa_session_set_aftertouch']
          console.log('exports', Object.fromEntries(exports.map((name)=>[name,typeof module[name]])))
          const hex=(await readFile('native/virtual-dx7-spike/reference-patch-v1.hex','utf8')).replace(/\s/g,'')
          const patch=Uint8Array.from(hex.match(/../g),(value)=>Number.parseInt(value,16))
          const pp=module._malloc(156); const frames=72000; const op=module._malloc(frames*4)
          try {
            module.HEAPU8.set(patch,pp)
            const status=module._fm1_msfa_render(pp,156,60,100,48000,48000,24000,42,op,frames)
            console.log('renderStatus',status)
            const start=op/4
            const pcm=new Float32Array(module.HEAPF32.slice(start,start+frames))
            console.log('pcmHash',createHash('sha256').update(Buffer.from(pcm.buffer)).digest('hex'))
            const session=module._fm1_msfa_session_create(48000)
            console.log('session',session)
            console.log('load',module._fm1_msfa_session_load_patch(session,pp,156,42))
            console.log('configure',module._fm1_msfa_session_configure_performance(session,12,0,99,1,99,2))
            console.log('bend',module._fm1_msfa_session_set_pitch_bend(session,16383))
            console.log('mod',module._fm1_msfa_session_set_modulation(session,127))
            console.log('aftertouch',module._fm1_msfa_session_set_aftertouch(session,127))
            console.log('invalid',module._fm1_msfa_session_set_pitch_bend(session,20000))
            module._fm1_msfa_session_destroy(session)
          } finally { module._free(op); module._free(pp) }
          NODE
            run_stage PROBE node .tmp/probe.mjs
          fi
          run_stage NODE_CHECK node --check scripts/test-msfa-audioworklet-browser.mjs
          run_stage INSTALL npm install --no-audit --no-fund
          run_stage SOURCE_AUDIT npm run audit:virtual-dx7
          cat .tmp/diagnostic-v2.log
      - name: Record diagnostic and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log=Path('.tmp/diagnostic-v2.log').read_text(encoding='utf-8', errors='replace')
          lines=['# MSFA performance rebuild diagnostic v2','',f"Diagnostic source commit: `{os.environ['GITHUB_SHA']}`",'', '```text', log[-30000:], '```','', 'This diagnostic does not publish generated artifacts or establish browser/runtime acceptance.']
          Path('docs/validation/msfa-performance-rebuild-diagnostic-v2.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/diagnose-msfa-performance-build-v2.yml').unlink(missing_ok=True)
          PY
      - name: Commit diagnostic and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record performance rebuild diagnostic v2'
          git pull --rebase origin main
          git push origin HEAD:main
