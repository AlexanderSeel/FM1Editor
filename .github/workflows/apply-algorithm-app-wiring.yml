name: Apply algorithm app wiring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-algorithm-app-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire voice document version
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          replacements = [
            (
              "  const [selectedBankSlot, setSelectedBankSlot] = useState<number | null>(null)\n",
              "  const [selectedBankSlot, setSelectedBankSlot] = useState<number | null>(null)\n  const [voiceDocumentVersion, setVoiceDocumentVersion] = useState(0)\n",
            ),
            (
              "  const loadVoiceDocument = (nextVoice: Dx7Voice, bankSlot: number | null = null) => {\n    voiceHistory.reset(nextVoice)\n    setSelectedBankSlot(bankSlot)\n  }",
              "  const loadVoiceDocument = (nextVoice: Dx7Voice, bankSlot: number | null = null) => {\n    voiceHistory.reset(nextVoice)\n    setVoiceDocumentVersion((current) => current + 1)\n    setSelectedBankSlot(bankSlot)\n  }",
            ),
            (
              "                    <VoiceEditor onChange={voiceHistory.setValue} voice={voice} />",
              "                    <VoiceEditor documentKey={voiceDocumentVersion} onChange={voiceHistory.setValue} voice={voice} />",
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Missing App marker: {old}')
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'feat(editor): reset operator masks on voice load'
          git push origin HEAD:main
