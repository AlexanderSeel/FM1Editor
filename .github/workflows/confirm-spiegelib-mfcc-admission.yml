name: Confirm SpiegeLib MFCC admission signal

on:
  push:
    branches: [main]
    paths: ['.github/workflows/confirm-spiegelib-mfcc-admission.yml']

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate admission evidence
        id: gate
        shell: bash
        run: |
          set +e
          status=SUCCESS
          reasons=()
          grep -Fq 'Compatibility status: **SUCCESS**' docs/research/spiegelib-mfcc-compatibility.md || { status=FAILED; reasons+=("compatibility receipt is not SUCCESS"); }
          test -f src/audio/spiegelibSimpleFmMfcc072.test.ts || { status=FAILED; reasons+=("permanent MFCC072 compatibility test is missing"); }
          test -f src/audio/data/spiegelib-mfcc-librosa-0.7.2-reference.json || { status=FAILED; reasons+=("pinned Librosa reference fixture is missing"); }
          npm install --no-audit --no-fund > admission-install.log 2>&1 || { status=FAILED; reasons+=("clean npm install failed"); }
          if test "$status" = SUCCESS; then
            npm test -- src/audio/spiegelibSimpleFmMfcc072.test.ts > admission-test.log 2>&1 || { status=FAILED; reasons+=("MFCC072 focused compatibility test failed"); }
          fi
          {
            echo "status=$status"
            printf 'reason=%s\n' "${reasons[*]:-none}"
          } > admission-status.txt
          cat admission-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist admission confirmation
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          values={}
          p=Path('admission-status.txt')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      key,value=line.split('=',1);values[key]=value
          status=values.get('status','FAILED')
          reason=values.get('reason','status file missing')
          Path('docs/validation/spiegelib-mfcc-admission.md').write_text('\n'.join([
              '# SpiegeLib MFCC admission confirmation','',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
              f"Admission confirmation: **{status}**",'',
              f"Reason: {reason}",'',
              'SUCCESS requires the permanent Librosa 0.7.2 compatibility receipt, pinned 572-value reference fixture, permanent MFCC072 focused test, clean dependency install and a passing focused compatibility test.','',
              'This confirmation does not itself run the real-sound benchmark and does not assert physical FM-1 equivalence.',''
          ]),encoding='utf-8')
          Path('.github/workflows/confirm-spiegelib-mfcc-admission.yml').unlink(missing_ok=True)
          for name in ['admission-status.txt','admission-install.log','admission-test.log']:
              Path(name).unlink(missing_ok=True)
      - name: Commit SUCCESS confirmation
        if: steps.gate.outputs.status == 'SUCCESS'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): confirm SpiegeLib MFCC admission SUCCESS' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Commit FAILED confirmation
        if: steps.gate.outputs.status != 'SUCCESS'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): confirm SpiegeLib MFCC admission FAILED' || true
          git pull --rebase origin main
          git push origin HEAD:main
