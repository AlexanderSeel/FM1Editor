name: Validate FM1-inspired effect graph

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-fm1-inspired-fx-graph.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Record software evidence and close implemented FX graph items
        run: |
          cat > docs/validation/fm1-inspired-fx-graph-software.md <<'EOF'
          # FM1-inspired Web Audio effect graph software validation

          Validated source/workflow commit: `${{ github.sha }}`

          Overall software gate: **SUCCESS**

          ## Accepted boundary

          - The local effect graph is an FM1 Editor **software approximation**, not a measured implementation of M-VAVE FM-1 firmware DSP.
          - It reuses all 24 documented `Fm1FxState` CC-backed values and their existing legal ranges; it does not change MIDI semantics.
          - The repository-owned routing order is explicitly `filter → distortion → chorus → phaser → delay → reverb` and is not claimed to match firmware routing.
          - Filter, reverb, delay, distortion, chorus and phaser are implemented with native Web Audio nodes; no new third-party DSP dependency is introduced.
          - Graph-level dry bypass is explicit and enabled by default. Each effect block also has software wet/dry routing driven by the documented state.
          - Reverb uses a deterministic repository-owned synthetic impulse; no third-party impulse-response audio is distributed.
          - The accepted dry DX7/MSFA renderer is not modified by this graph implementation.
          - Typecheck, lint, full tests and production build passed on the validated source.

          ## Claim limitation

          Effect algorithms, parameter scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware. Browser/audio integration and effect-isolation measurements remain part of the later Virtual FM-1 integration/regression roadmap item.
          EOF
          python - <<'PY'
          from pathlib import Path
          path = Path('PLAN.md')
          text = path.read_text(encoding='utf-8')
          old1 = '- [ ] Implement a separate FM-1-inspired effect graph for documented CC `0–23`: filter, reverb, delay, distortion, chorus and phaser, using native Web Audio and/or audited MIT-licensed Tone.js components.'
          new1 = '- [x] Implement a separate FM-1-inspired effect graph for documented CC `0–23`: filter, reverb, delay, distortion, chorus and phaser using native Web Audio, without adding a third-party DSP dependency. Evidence: [`docs/validation/fm1-inspired-fx-graph-software.md`](./docs/validation/fm1-inspired-fx-graph-software.md).'
          old2 = '- [ ] Reuse `Fm1FxState` and the documented value ranges, but keep dry bypass and clearly state that effect algorithms, internal scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware.'
          new2 = '- [x] Reuse `Fm1FxState` and the documented value ranges with explicit dry bypass and a repository-owned routing/scaling policy; clearly state that algorithms, internal scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware. Evidence: [`docs/validation/fm1-inspired-fx-graph-software.md`](./docs/validation/fm1-inspired-fx-graph-software.md).'
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected unresolved FX roadmap items were not found.')
          path.write_text(text.replace(old1, new1).replace(old2, new2), encoding='utf-8')
          PY
          rm .github/workflows/validate-fm1-inspired-fx-graph.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PLAN.md docs/validation/fm1-inspired-fx-graph-software.md .github/workflows/validate-fm1-inspired-fx-graph.yml
          git commit -m "test(audio): accept FM1-inspired effect graph"
          git pull --rebase origin main
          git push origin main
