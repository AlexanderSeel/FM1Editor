name: Validate expanded renderer regression

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-expanded-renderer-regression.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: node --check public/virtual-dx7/fm1-msfa-worklet.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/virtualDx7Engine.test.ts src/audio/msfaOfflineEngine.test.ts src/audio/virtualFm1WavRenderer.test.ts src/audio/fm1InspiredFxGraph.test.ts src/audio/fm1InspiredFxIsolation.test.ts src/audio/msfaAudioWorklet.test.ts src/components/VirtualDx7PreviewPanel.test.tsx
      - run: npm run test
      - run: npm run build
      - name: Persist software receipt
        shell: bash
        run: |
          cat > docs/validation/virtual-fm1-expanded-regression-software.md <<EOF
          # Expanded Virtual FM-1 renderer regression software gate

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          This consolidated gate covers deterministic semantic render planning, packaged offline MSFA execution, deterministic note/chord WAV rendering, FM-1-inspired graph planning and isolated block enablement, AudioWorklet request/fatal/error containment and the mounted Virtual FM-1 preview contract. The complete test suite and production build also pass.

          Effect-isolation tests verify that each documented software effect block can be enabled independently and that the initialized state remains dry. The AudioWorklet diagnostic timer remains measured, with high-resolution and explicitly labeled 1 ms fallback clocks.

          This receipt does not close the expanded renderer/performance roadmap item by itself. Branded Chrome/Edge acceptance must still establish and enforce measured performance limits and integrated underrun/error behavior.
          EOF
          rm .github/workflows/validate-expanded-renderer-regression.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): accept expanded renderer software regression'
          git pull --rebase origin main
          git push origin HEAD:main
