name: Validate mounted reference audio in browsers v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-reference-audio-browser-v2.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Make pitch acceptance estimator-aware
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/test-reference-audio-input-browser.mjs')
          text=path.read_text(encoding='utf-8')
          old="""  await waitForExpression(cdp, `document.body.textContent.includes('440.') || document.body.textContent.includes('441.') || document.body.textContent.includes('439.')`, 10_000)\n  const detectedPitchText = await evaluate(cdp, `(() => [...document.querySelectorAll('span')].map((node) => node.textContent ?? '').find((text) => text.includes('detected pitch')) ?? '')()`)\n"""
          new="""  await waitForExpression(cdp, `([...document.querySelectorAll('span')].map((node) => node.textContent ?? '').some((text) => text.includes('detected pitch') && text.includes('Hz') && !text.includes('unresolved')))`, 10_000)\n  const detectedPitchText = await evaluate(cdp, `(() => [...document.querySelectorAll('span')].map((node) => node.textContent ?? '').find((text) => text.includes('detected pitch')) ?? '')()`)\n  const detectedPitchMatch = String(detectedPitchText).match(/([0-9]+(?:\\.[0-9]+)?)\\s*Hz/i)\n  const detectedPitchHz = detectedPitchMatch ? Number(detectedPitchMatch[1]) : Number.NaN\n  if (!Number.isFinite(detectedPitchHz) || detectedPitchHz < 400 || detectedPitchHz > 480) {\n    throw new Error(`Expected a resolved A4-range detected pitch, got ${detectedPitchText}`)\n  }\n"""
          if old not in text:
              raise SystemExit('reference pitch acceptance anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge reference-audio acceptance
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          node scripts/test-reference-audio-input-browser.mjs --browser-executable $chrome --browser-name chrome --result reference-audio-chrome.json
          $chromeExit=$LASTEXITCODE
          node scripts/test-reference-audio-input-browser.mjs --browser-executable $edge --browser-name edge --result reference-audio-edge.json
          $edgeExit=$LASTEXITCODE
          Write-Host "Chrome exit $chromeExit; Edge exit $edgeExit"
          exit 0
      - name: Record receipt
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'ok':False,'error':'result missing'}
          chrome=read('reference-audio-chrome.json'); edge=read('reference-audio-edge.json')
          ok=bool(chrome.get('ok')) and bool(edge.get('ok'))
          def row(name,d):
              if not d.get('ok'): return f"| {name} | FAILED | — | — | {d.get('error','unknown')} |"
              return f"| {name} | {d.get('browserProduct')} | {d.get('manualPitchVisible')} | {d.get('fetchesAfter') - d.get('baselineFetches')} | PASS |"
          Path('docs/validation/reference-audio-browser.md').write_text('\n'.join([
            '# Local reference audio browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Browser | Product | Manual pitch override | New network fetches | Result |','| --- | --- | --- | ---: | --- |',row('Chrome',chrome),row('Edge',edge),'',
            'A generated local WAV with leading/trailing silence is selected through the real mounted file input. Detected pitch is accepted within a plausible A4 range rather than requiring an exact autocorrelation-bin rounding. Acceptance also requires region controls, silence trimming, normalization, SHA-256 display, manual pitch override, explicit local-only privacy copy and zero new network fetches caused by reference processing.','',
            'No server upload or physical-hardware claim is part of this acceptance.',''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-reference-audio-browser-v2.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit runner and evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(browser): accept resolved reference pitch range' || true
          git pull --rebase origin main
          git push origin HEAD:main
