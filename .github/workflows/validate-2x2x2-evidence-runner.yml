name: Validate 2x2x2 real-reference evidence runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-2x2x2-evidence-runner.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run acceptance stages
        shell: bash
        run: |
          set +e
          : > stages.txt
          run_stage() {
            name="$1"; shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> stages.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-reconstruction npm run audit:reconstruction-upstreams
          run_stage audit-learned npm run audit:learned-assets
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage runner npm test -- src/components/ReconstructionEvidenceRunPanel.test.tsx src/audio/realReferenceReconstructionBenchmark.test.ts src/audio/realReferenceBenchmarkAggregate.test.ts src/audio/realReferenceAggregateEvidenceDocument.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist validation receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('stages.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1)
                try: codes[k]=int(v)
                except ValueError: codes[k]=999
          stages=['install','audit-virtual','audit-reconstruction','audit-learned','typecheck','lint','runner','full-test','build']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          if not ok:
            for stage in stages:
              if codes.get(stage)==0: continue
              log=Path(f'{stage}.log')
              body=log.read_text(errors='replace') if log.exists() else 'missing log'
              failures += ['',f'## {stage} failure tail','','```text',body[-12000:],'```']
          Path('docs/validation/real-reference-2x2x2-runner.md').write_text('\n'.join([
            '# Real-reference 2+2+2 evidence runner acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            '- requires exactly two FM-friendly electronic, two pitched acoustic and two difficult/noisy isolated files',
            '- requires one explicit isolation/classification declaration and never silently chooses a region from clips longer than 30 seconds',
            '- full bundled catalog is the default final-evidence scope; quick 256-voice scope remains explicit',
            '- catalog candidates are loaded once and the same local MSFA engine/fingerprint cache are reused across all six sequential benchmarks',
            '- each completed run retains prepared reference PCM only in browser memory for listening plus an exact winner-bearing receipt and receipt SHA-256',
            '- exact retrieval/CMA/learned winners can be auditioned and exported as single-voice SysEx before structured listening verdicts are entered',
            '- aggregate readiness reuses the existing fail-closed learned/listening/exact-winner/receipt-integrity gates',
            '- evidence ZIP contains the six receipt JSON files and aggregate JSON; closure-ready sets additionally include the generated SHA-bound Markdown; source WAV/MP3 files are never included','',
            *failures,''
          ]),encoding='utf-8')
          for log in Path('.').glob('*.log'): log.unlink(missing_ok=True)
          Path('stages.txt').unlink(missing_ok=True)

      - name: Align protocol and PLAN on success
        if: always()
        shell: python
        run: |
          from pathlib import Path
          receipt=Path('docs/validation/real-reference-2x2x2-runner.md').read_text(encoding='utf-8')
          if 'Software acceptance: **SUCCESS**' not in receipt:
            raise SystemExit(0)

          protocol=Path('docs/validation/real-reference-benchmark-protocol.md')
          text=protocol.read_text(encoding='utf-8')
          anchor='## Per-reference procedure\n'
          addition='''## In-app 2+2+2 evidence runner\n\nFor the final retained minimum set, the **2+2+2 final evidence run** panel can execute the six references as one controlled local session. Choose exactly two already-isolated clips in each evidence category; clips must be no longer than 30 seconds because the batch path deliberately refuses to choose a sub-region silently. Optional manual pitch can be supplied per clip. Full bundled-catalog scope is the default for final evidence.\n\nThe runner loads the catalog once, reuses the same local renderer/fingerprint cache, processes references sequentially, and preserves completed receipts if a later case fails or the run is cancelled. After each run it keeps the prepared reference PCM only in browser memory so the operator can compare **Reference A** against the exact retrieval, CMA and learned winner voices retained in that receipt. Structured listening verdicts and notes are collected in the same panel.\n\nThe **Export evidence ZIP** convenience action contains the six unchanged receipt JSON files and aggregate JSON and, only when closure-ready, the generated hash-bound closure Markdown. It never contains the source WAV/MP3 files. The individual JSON/Markdown files inside the ZIP remain the canonical repository artifacts; the ZIP itself is optional transport convenience.\n\n'''
          if addition not in text:
            if anchor not in text: raise SystemExit('protocol per-reference anchor missing')
            text=text.replace(anchor,addition+anchor,1)
          protocol.write_text(text,encoding='utf-8')

          plan=Path('PLAN.md')
          text=plan.read_text(encoding='utf-8')
          old='This item now requires actual real isolated recordings and listening evidence.'
          new='The validated in-app 2+2+2 evidence runner now executes the six-file set sequentially with a shared local catalog/renderer cache, exact-winner audition, receipt hashing and final evidence ZIP export; this item now requires actual real isolated recordings and human listening evidence.'
          if old not in text: raise SystemExit('PLAN real-evidence terminal anchor missing')
          text=text.replace(old,new,1)
          plan.write_text(text,encoding='utf-8')

      - name: Commit result
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/real-reference-2x2x2-runner.md | grep -oE 'SUCCESS|FAILED' | head -1)
          rm -f .github/workflows/validate-2x2x2-evidence-runner.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(audio): validate 2x2x2 evidence runner ($status)" || true
          git pull --rebase origin main
          git push origin HEAD:main
