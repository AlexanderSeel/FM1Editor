name: Validate target capability routing

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/validation/target-capability-routing.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/test.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Verify target routing markers
        id: markers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q "TargetVoiceAuditionPanel" src/App.tsx
          grep -q "targetDefinition.capabilities.fm1Effects" src/App.tsx
          grep -q "No SysEx operation enabled" src/components/TargetVoiceAuditionPanel.tsx
          grep -q "FM-1 bank and effects writes are disabled" src/domain/deviceTarget.ts

      - name: Record validation receipt
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MARKERS_OUTCOME: ${{ steps.markers.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/validation
          strip_ansi() {
            sed -r 's/\x1B\[[0-9;]*[mK]//g'
          }
          {
            echo '# Device target capability routing validation'
            echo
            echo "Validated source commit: \`${GITHUB_SHA}\`"
            echo
            echo "- npm install: **${INSTALL_OUTCOME^^}**"
            echo "- npm run typecheck: **${TYPECHECK_OUTCOME^^}**"
            echo "- npm run lint: **${LINT_OUTCOME^^}**"
            echo "- npm run test: **${TEST_OUTCOME^^}**"
            echo "- npm run build: **${BUILD_OUTCOME^^}**"
            echo "- target routing marker check: **${MARKERS_OUTCOME^^}**"
            echo
            echo 'Physical FM-1 and Yamaha DX7 hardware behavior remains unverified.'
            for entry in \
              'Install:/tmp/npm-install.log' \
              'Typecheck:/tmp/typecheck.log' \
              'Lint:/tmp/lint.log' \
              'Test:/tmp/test.log' \
              'Build:/tmp/build.log'; do
              title="${entry%%:*}"
              file="${entry#*:}"
              echo
              echo "## ${title} output"
              echo
              echo '```text'
              if [[ -f "$file" ]]; then
                tail -n 120 "$file" | strip_ansi
              else
                echo 'No output captured.'
              fi
              echo '```'
            done
          } > docs/validation/target-capability-routing.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/target-capability-routing.md
          if ! git diff --cached --quiet; then
            git commit -m "test(ci): record target capability validation"
            git push
          fi

      - name: Fail when validation failed
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MARKERS_OUTCOME: ${{ steps.markers.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$INSTALL_OUTCOME" "$TYPECHECK_OUTCOME" "$LINT_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME" "$MARKERS_OUTCOME"; do
            [[ "$outcome" == 'success' ]] || exit 1
          done
