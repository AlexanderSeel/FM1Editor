name: Repair packed DX7 detune decoding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-packed-detune.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-packed-detune
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch packed detune bit field
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/sysex/dx7.ts')
          text = path.read_text(encoding='utf-8')
          decode_old = '    detune: data[offset + 16] ?? 0,\n'
          decode_new = '    detune: (data[offset + 16] ?? 0) & 0x0f,\n'
          encode_old = '    data[offset + 16] = operator.detune\n'
          encode_new = '    data[offset + 16] = ((data[offset + 16] ?? 0) & 0x70) | operator.detune\n'

          if decode_old not in text:
              raise SystemExit('Packed detune decoder target not found.')
          if encode_old not in text:
              raise SystemExit('Packed detune encoder target not found.')

          text = text.replace(decode_old, decode_new, 1)
          text = text.replace(encode_old, encode_new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sysex/dx7.ts
          git commit -m 'fix(codec): mask packed DX7 detune bits'
          git push origin HEAD:main
