name: Check local performance software stages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-local-performance-software.yml']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Record stage matrix
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          values={key.lower():os.environ.get(key,'skipped') for key in ['INSTALL','TYPECHECK','LINT','TESTS','BUILD']}
          lines=['# Local performance software stage matrix','',f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'', '| Stage | Result |','| --- | --- |']
          lines += [f"| {key} | **{value.upper()}** |" for key,value in values.items()]
          Path('docs/validation/local-performance-software-stage-matrix.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/check-local-performance-software.yml').unlink(missing_ok=True)
          PY
      - name: Commit stage matrix and cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record local performance software stage matrix'
          git pull --rebase origin main
          git push origin HEAD:main
