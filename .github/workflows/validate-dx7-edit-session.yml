name: Validate DX7 edit session model

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-dx7-edit-session.yml
      - docs/validation/.trigger-dx7-edit-session
      - src/domain/dx7EditSession.ts
      - src/domain/dx7EditSession.test.ts

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/test.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Verify edit-session boundary markers
        id: markers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DX7_OPERATOR_ENABLE_PARAMETER = 155' src/domain/dx7EditSession.ts
          grep -Fq '1 << (5 - operatorIndex)' src/domain/dx7EditSession.ts
          grep -Fq 'round-trips every valid six-bit mask' src/domain/dx7EditSession.test.ts
          grep -Fq 'never adds parameter 155 to single or packed voice payloads' src/domain/dx7EditSession.test.ts

      - name: Record validation receipt
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MARKERS_OUTCOME: ${{ steps.markers.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/validation
          {
            echo '# DX7 edit-session operator mask validation'
            echo
            echo "Validated source commit: \`${GITHUB_SHA}\`"
            echo
            echo "- Node setup: **${SETUP_OUTCOME^^}**"
            echo "- npm install: **${INSTALL_OUTCOME^^}**"
            echo "- npm run typecheck: **${TYPECHECK_OUTCOME^^}**"
            echo "- npm run lint: **${LINT_OUTCOME^^}**"
            echo "- npm run test: **${TEST_OUTCOME^^}**"
            echo "- npm run build: **${BUILD_OUTCOME^^}**"
            echo "- edit-session boundary marker check: **${MARKERS_OUTCOME^^}**"
            echo
            echo '- parameter 155 is modeled as separate edit-session state.'
            echo '- OP1 maps to bit 5 and OP6 maps to bit 0.'
            echo '- all 64 valid masks round-trip.'
            echo '- session state is excluded from 155-byte single-voice and 128-byte packed voice payloads.'
            echo '- parameter-change transmission remains disabled.'
          } > docs/validation/dx7-edit-session.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/dx7-edit-session.md
          if ! git diff --cached --quiet; then
            git commit -m "test(ci): record DX7 edit-session validation"
            git push
          fi

      - name: Fail when validation failed
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MARKERS_OUTCOME: ${{ steps.markers.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$SETUP_OUTCOME" "$INSTALL_OUTCOME" "$TYPECHECK_OUTCOME" "$LINT_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME" "$MARKERS_OUTCOME"; do
            [[ "$outcome" == 'success' ]] || exit 1
          done
