name: Validate renderer-backed CMA-ES refinement in browsers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-cma-refinement-browser.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check scripts/test-cma-refinement-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge CMA refinement acceptance with one startup retry
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          function Run-Acceptance($exe, $name, $result) {
            $exitCode=1
            for ($attempt=1; $attempt -le 2; $attempt++) {
              node scripts/test-cma-refinement-browser.mjs --browser-executable $exe --browser-name $name --result $result
              $exitCode=$LASTEXITCODE
              if ($exitCode -eq 0) { break }
              Write-Host "$name attempt $attempt failed; retrying if available"
              Start-Sleep -Seconds 1
            }
            return $exitCode
          }
          $chromeExit=Run-Acceptance $chrome 'chrome' 'cma-refinement-chrome.json'
          $edgeExit=Run-Acceptance $edge 'edge' 'cma-refinement-edge.json'
          Write-Host "Chrome exit $chromeExit; Edge exit $edgeExit"
          exit 0
      - name: Persist browser evidence and close PLAN item on success
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'ok':False,'error':'result missing'}
          chrome=read('cma-refinement-chrome.json'); edge=read('cma-refinement-edge.json')
          ok=bool(chrome.get('ok')) and bool(edge.get('ok'))
          def row(name,d):
              if not d.get('ok'):
                  return f"| {name} | FAILED | — | — | — | — | {d.get('error','unknown')} |"
              improvements=sum(1 for pair in d.get('distancePairs',[]) if pair[1] < pair[0] - 1e-6)
              return f"| {name} | {d.get('browserProduct')} | {d.get('refinedCount')} | {improvements} | {d.get('auditionPeak'):.8f} | {d.get('midiRequests')} | PASS |"
          Path('docs/validation/dx7-cma-es-browser.md').write_text('\n'.join([
            '# Renderer-backed CMA-ES browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Browser | Product | Refined candidates | Improved starts | Refined audition peak | Web MIDI requests | Result |',
            '| --- | --- | ---: | ---: | ---: | ---: | --- |',row('Chrome',chrome),row('Edge',edge),'',
            'The mounted Audio → FM flow prepares a local A4 reference, runs Quick-scan retrieval, then explicitly refines the top retrieved candidates with seeded CMA-ES over six operator output levels plus feedback. Acceptance requires non-worsening reported best distances with at least one improvement, measurable dry refined audition PCM, no editor change during search/refinement/audition, an explicit Load refined transition, zero Web MIDI requests, and no external/write fetches.','',
            'This validates only local semantic optimization against the DX7-compatible renderer/fingerprint metric. It does not claim exact recovery of a physical source sound or FM-1 hardware equivalence.',''
          ]),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md'); text=plan.read_text(encoding='utf-8')
              old='- [ ] Implement cancellable, repeatable evolutionary/CMA-ES refinement starting from the best catalog candidates and operating only on legal semantic `Dx7Voice` fields; begin with constrained parameter groups before attempting the full search space.'
              new='- [x] Implement cancellable, repeatable seeded CMA-ES refinement starting from the best retrieved catalog candidates and operating only on legal semantic `Dx7Voice` fields, initially constrained to six operator output levels plus feedback. The objective uses the accepted deterministic local renderer and compact fingerprint metric; progress/cancel and refined Audition/Load are explicit. Evidence: [`docs/validation/dx7-cma-es-core.md`](./docs/validation/dx7-cma-es-core.md), [`docs/validation/dx7-renderer-refinement.md`](./docs/validation/dx7-renderer-refinement.md), [`docs/validation/dx7-cma-es-ui-software.md`](./docs/validation/dx7-cma-es-ui-software.md) and [`docs/validation/dx7-cma-es-browser.md`](./docs/validation/dx7-cma-es-browser.md).'
              if old in text: text=text.replace(old,new,1)
              elif new not in text: raise SystemExit('CMA-ES roadmap item not found')
              plan.write_text(text,encoding='utf-8')
          Path('.github/workflows/validate-cma-refinement-browser.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit browser evidence and roadmap state
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): record renderer-backed CMA-ES acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
