name: Validate exact-version SpiegeLib source state

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-spiegelib-072-source.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run software gate
        shell: bash
        run: |
          set +e
          : > codes.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> codes.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage audit-learned npm run audit:learned-assets
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage candidate072 npm test -- src/audio/spiegelibSimpleFmCandidate072.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0
      - name: Persist exact-source receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('codes.txt')
          if p.exists():
              for line in p.read_text().splitlines():
                  if '=' in line:
                      k,v=line.split('=',1)
                      try:codes[k]=int(v)
                      except ValueError:codes[k]=999
          stages=['install','audit-virtual','audit-research','audit-learned','typecheck','lint','candidate072','full-test','build']
          ok=all(codes.get(s)==0 for s in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {s} | {codes.get(s,"?")} |' for s in stages]
          failures=[]
          if not ok:
              for s in stages:
                  if codes.get(s)==0:continue
                  log=Path(f'{s}.log');text=log.read_text(errors='replace') if log.exists() else 'missing log'
                  failures += ['',f'## {s} failure tail','','```text',text[-12000:],'```']
          Path('docs/validation/spiegelib-072-source.md').write_text('\n'.join([
              '# Exact-version SpiegeLib source software acceptance','',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
              f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
              *rows,'',
              'This validates the repository-local MFCC072/candidate source, pinned model/scaler provenance and normal build/test health. It does not independently establish Librosa numerical equivalence and therefore cannot by itself enable the learned benchmark row.','',
              *failures,''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-spiegelib-072-source.yml').unlink(missing_ok=True)
          for log in Path('.').glob('*.log'):log.unlink(missing_ok=True)
          Path('codes.txt').unlink(missing_ok=True)
      - name: Commit receipt
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/spiegelib-072-source.md | grep -oE 'SUCCESS|FAILED' | head -1)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(audio): record MFCC072 source gate $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
