name: Validate mounted local virtual preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-local-virtual-preview.yml']

permissions:
  contents: write

concurrency:
  group: integrate-local-virtual-preview
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify local preview is mounted in voice workspace
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('src/App.tsx').read_text(encoding='utf-8')
          required=[
            "import { VirtualDx7PreviewPanel } from './components/VirtualDx7PreviewPanel'",
            'storageKey="voice-local-virtual-preview"',
            '<VirtualDx7PreviewPanel voice={voice} />',
          ]
          missing=[item for item in required if item not in text]
          if missing: raise SystemExit('Mounted local preview boundary missing: '+repr(missing))
          PY
      - id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run audit:virtual-dx7
      - id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Record result and self-clean
        if: always()
        env:
          MOUNT: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          results={name.lower():os.environ.get(name,'skipped') for name in ['MOUNT','INSTALL','AUDIT','TYPECHECK','LINT','TESTS','BUILD']}
          success=all(value=='success' for value in results.values())
          lines=['# Local virtual preview integration','',f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall integration gate: **{'SUCCESS' if success else 'FAILED'}**",'', '| Check | Result |','| --- | --- |']
          lines += [f"| {name} | **{value.upper()}** |" for name,value in results.items()]
          lines += ['', '## Boundary', '', '- `App.tsx` mounts a separate local-preview section above hardware audition.', '- The preview does not impersonate a `MidiOutputTarget`.', '- No `AudioContext` is created during render; the user must explicitly choose **Enable local audio**.', '- After activation, only the current semantic `Dx7Voice` is mapped into the audited v3-stateful worklet.', '- Voice changes use local all-notes-off before semantic resynchronization.', '- Blur/visibility/unmount cleanup remains centralized in `VirtualPiano`; the preview additionally closes its AudioWorklet controller on unmount/disable.', '- The exposed renderer remains explicitly monophonic; no polyphony claim is made.', '- Hardware MIDI/SysEx audition remains a separate panel and action path.']
          Path('docs/validation/local-virtual-preview-integration.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/integrate-local-virtual-preview.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt and cleanup
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): validate mounted local virtual preview'
          git pull --rebase origin main
          git push origin HEAD:main
