name: Integrate local virtual preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-local-virtual-preview.yml']

permissions:
  contents: write

concurrency:
  group: integrate-local-virtual-preview
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert local preview into voice workspace
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/App.tsx')
          text=path.read_text(encoding='utf-8')
          import_anchor="import { TargetVoiceAuditionPanel } from './components/TargetVoiceAuditionPanel'\n"
          preview_import="import { VirtualDx7PreviewPanel } from './components/VirtualDx7PreviewPanel'\n"
          if preview_import not in text:
              if import_anchor not in text: raise SystemExit('TargetVoiceAuditionPanel import anchor not found')
              text=text.replace(import_anchor, import_anchor+preview_import, 1)

          audition_anchor="""                  <CollapsibleSection
                    description={fm1Mode ? 'Whole-bank transfer, preset recall and virtual piano' : 'Yamaha single-voice and 32-voice bulk transfer, plus virtual piano'}
                    storageKey=\"voice-bank-audition\"
                    title={fm1Mode ? 'FM-1 bank audition' : 'DX7 audition and bulk transfer'}
                  >
"""
          preview="""                  <CollapsibleSection
                    description=\"Audited dry DX7-compatible AudioWorklet · explicit browser-local enable · no MIDI hardware required\"
                    storageKey=\"voice-local-virtual-preview\"
                    title=\"Local virtual preview\"
                  >
                    <VirtualDx7PreviewPanel voice={voice} />
                  </CollapsibleSection>
"""
          if 'storageKey="voice-local-virtual-preview"' not in text:
              if audition_anchor not in text: raise SystemExit('voice audition insertion anchor not found')
              text=text.replace(audition_anchor, preview+audition_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff -- src/App.tsx
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Audit virtual DX7 boundary
        id: audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run audit:virtual-dx7
      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck
      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Test
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test
      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Record result and self-clean
        if: always()
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          names=['PATCH','INSTALL','AUDIT','TYPECHECK','LINT','TESTS','BUILD']
          results={name.lower():os.environ.get(name,'skipped') for name in names}
          success=all(value=='success' for value in results.values())
          if not success:
              import subprocess
              subprocess.run(['git','restore','src/App.tsx'],check=False)
          lines=['# Local virtual preview integration','',f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall integration gate: **{'SUCCESS' if success else 'FAILED'}**",'', '| Check | Result |','| --- | --- |']
          lines += [f"| {name} | **{value.upper()}** |" for name,value in results.items()]
          lines += ['', '## Boundary', '', '- The preview is a separate browser-local section in the voice workspace and does not impersonate a `MidiOutputTarget`.', '- No `AudioContext` is created during render; the user must explicitly choose **Enable local audio**.', '- After activation, only the current semantic `Dx7Voice` is mapped into the audited v3-stateful worklet.', '- Voice changes use local all-notes-off before semantic resynchronization.', '- Blur/visibility/unmount cleanup remains centralized in `VirtualPiano`; the local preview additionally closes its AudioWorklet controller on unmount/disable.', '- The accepted renderer remains monophonic here. Overlapping UI notes deterministically replace the active local note; no polyphony claim is made.', '- Hardware MIDI/SysEx audition remains a separate panel and action path.']
          Path('docs/validation/local-virtual-preview-integration.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/integrate-local-virtual-preview.yml').unlink(missing_ok=True)
          PY
      - name: Commit validated integration or failure receipt
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat(audio): integrate local virtual preview'
          git pull --rebase origin main
          git push origin HEAD:main
