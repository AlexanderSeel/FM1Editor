name: Validate deterministic audio descriptors

# Rerun against current main after the imported-bank and reference-audio repairs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-audio-descriptors.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full software gate
        run: |
          npm install --no-audit --no-fund
          npm run audit:virtual-dx7
          npm run typecheck
          npm run lint
          npm test -- src/audio/audioDescriptors.test.ts
          npm run test
          npm run build
      - name: Record descriptor evidence and close roadmap item
        run: |
          cat > docs/validation/audio-descriptors-software.md <<EOF
          # Audio-to-FM deterministic descriptor validation

          Validated source/workflow commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          ## Accepted scope

          - One pure TypeScript descriptor function accepts normalized mono Float32 PCM from either prepared reference audio or the deterministic virtual renderer.
          - The descriptor schema is versioned as \`fm1-editor.audio-descriptors.v1\` with an explicit configuration snapshot.
          - Amplitude descriptors contain RMS and peak envelopes using deterministic window/hop sizes.
          - Spectral descriptors use deterministic Hann-windowed radix-2 FFT at 512, 1024 and 2048 samples by default.
          - Long inputs are bounded by deterministic uniform frame sampling rather than allocating an unbounded STFT matrix.
          - Every spectral resolution stores sampled log-magnitude STFT frames, 40-band log-mel spectra, 13 MFCCs, centroid, 85% rolloff and spectral flatness plus moments.
          - Focused tests prove exact repeatability for identical PCM, 440 Hz localization, envelope tracking, lower tonal than broadband-noise flatness, and fail-closed validation for invalid/non-normalized PCM.
          - Source audit, typecheck, lint, full tests and production build passed.

          This validates deterministic software descriptors only. Retrieval weighting and similarity metrics remain separate roadmap work.
          EOF
          python - <<'PY'
          from pathlib import Path
          plan = Path('PLAN.md')
          text = plan.read_text(encoding='utf-8')
          old = '- [ ] Implement reproducible audio descriptors for both references and virtual renders: amplitude envelope, multi-resolution STFT/mel spectrum, MFCCs, spectral centroid, rolloff and flatness.'
          new = '- [x] Implement reproducible audio descriptors shared by prepared references and virtual-render PCM: amplitude RMS/peak envelope, bounded multi-resolution STFT/log-mel spectrum, MFCCs, spectral centroid, rolloff and flatness. Evidence: [`docs/validation/audio-descriptors-software.md`](./docs/validation/audio-descriptors-software.md).'
          if old not in text:
              raise SystemExit('Expected unresolved descriptor roadmap item was not found')
          plan.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/validate-audio-descriptors.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(audio): accept deterministic audio descriptors'
          git pull --rebase origin main
          git push origin HEAD:main
