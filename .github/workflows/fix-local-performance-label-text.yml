name: Fix local performance label text

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-local-performance-label-text.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flatten accessible pitch labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/VirtualDx7PreviewPanel.tsx')
          text=p.read_text(encoding='utf-8')
          old_range='''          <label className="grid gap-1.5 text-xs text-slate-400" htmlFor="virtual-dx7-pitch-bend-range">\n            <span className="flex justify-between font-semibold uppercase tracking-[0.12em]"><span>Pitch-bend range</span><strong>{performance.pitchBendRange}</strong></span>\n          </label>'''
          new_range='''          <label className="flex justify-between gap-2 text-xs font-semibold uppercase tracking-[0.12em] text-slate-400" htmlFor="virtual-dx7-pitch-bend-range">\n            Pitch-bend range <strong>{performance.pitchBendRange}</strong>\n          </label>'''
          old_step='''          <label className="grid gap-1.5 text-xs text-slate-400" htmlFor="virtual-dx7-pitch-bend-step">\n            <span className="flex justify-between font-semibold uppercase tracking-[0.12em]"><span>Pitch-bend step</span><strong>{performance.pitchBendStep}</strong></span>\n          </label>'''
          new_step='''          <label className="flex justify-between gap-2 text-xs font-semibold uppercase tracking-[0.12em] text-slate-400" htmlFor="virtual-dx7-pitch-bend-step">\n            Pitch-bend step <strong>{performance.pitchBendStep}</strong>\n          </label>'''
          if old_range not in text or old_step not in text:
              raise SystemExit('Expected pitch labels not found')
          text=text.replace(old_range,new_range,1).replace(old_step,new_step,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate full software suite
        run: |
          npm install --no-audit --no-fund
          npm run audit:virtual-dx7
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: Record fix receipt and self-clean
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('docs/validation/local-performance-label-fix.md').write_text('\n'.join([
            '# Local performance label accessibility fix','',
            f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',
            'Overall software gate: **SUCCESS**','',
            '- Flattened the visible pitch-bend range and step captions so `jsx-a11y/label-has-associated-control` recognizes accessible label text.',
            '- Source audit, typecheck, lint, full tests and production build all passed after the markup-only change.',
            '- Renderer, worklet, controller protocol and hardware boundaries were not changed.'
          ])+'\n',encoding='utf-8')
          Path('.github/workflows/fix-local-performance-label-text.yml').unlink(missing_ok=True)
          PY
      - name: Commit validated fix and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(a11y): flatten local performance labels'
          git pull --rebase origin main
          git push origin HEAD:main
