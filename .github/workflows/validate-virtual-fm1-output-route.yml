name: Validate virtual FM1 output route

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-virtual-fm1-output-route.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/virtualFm1OutputRoute.test.ts src/audio/fm1InspiredFxGraph.test.ts
      - run: npm run test
      - run: npm run build
      - name: Persist route receipt
        run: |
          cat > docs/validation/virtual-fm1-output-route.md <<EOF
          # Virtual FM-1 output route software validation

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          A reusable preview output route now composes the accepted FM-1-inspired FX graph with an explicit −48…+6 dB master gain and a conservative Web Audio dynamics-compressor limiter (−1 dB threshold, 20:1 ratio, zero knee). Dry/FX bypass remains explicit and defaults to dry; FX state continues to use the existing validated `Fm1FxState` domain.

          Typecheck, lint, focused route/FX tests, the full test suite and production build passed. The route is not yet connected to the AudioWorklet in the default local preview, so this receipt does not close the Virtual FM-1 preview roadmap item.
          EOF
          rm .github/workflows/validate-virtual-fm1-output-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): accept virtual FM1 output route' || true
          git pull --rebase origin main
          git push origin HEAD:main
