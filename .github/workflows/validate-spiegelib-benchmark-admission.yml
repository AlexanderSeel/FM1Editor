name: Validate admitted SpiegeLib benchmark block

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-spiegelib-benchmark-admission.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run acceptance stages
        shell: bash
        run: |
          set +e
          : > stages.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> stages.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage audit-learned npm run audit:learned-assets
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage mfcc npm test -- src/audio/spiegelibSimpleFmMfcc.librosa072.test.ts
          run_stage candidate npm test -- src/audio/spiegelibSimpleFmCandidate072.test.ts
          run_stage benchmark npm test -- src/audio/realReferenceReconstructionBenchmark.test.ts
          run_stage aggregate npm test -- src/audio/realReferenceBenchmarkAggregate.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          cat >/tmp/check-lazy.mjs <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs'
          import { join } from 'node:path'
          const html=readFileSync('dist/index.html','utf8')
          const match=html.match(/<script[^>]+type="module"[^>]+src="([^"]+)"/)
          if(!match) throw new Error('could not identify Vite entry script')
          const entryPath=join('dist',match[1].replace(/^\.\//,'').replace(/^\//,''))
          const entry=readFileSync(entryPath,'utf8')
          const marker='96f1d58d3190fc7590f62d1293bb5d39d4d1dbde74c1a754ad5c576c26c32c4f'
          if(entry.includes(marker)) throw new Error('SpiegeLib model provenance marker leaked into initial entry chunk')
          const assets=readdirSync('dist/assets').filter((name)=>name.endsWith('.js')).map((name)=>readFileSync(join('dist/assets',name),'utf8'))
          if(!assets.some((text)=>text.includes(marker))) throw new Error('SpiegeLib model provenance marker missing from built lazy assets')
          console.log(`entry=${entryPath}`)
          console.log('learned model marker present only outside initial entry chunk')
          NODE
          run_stage lazy-bundle node /tmp/check-lazy.mjs
          exit 0

      - name: Persist receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('stages.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1)
                try: codes[k]=int(v)
                except ValueError: codes[k]=999
          stages=['install','audit-virtual','audit-research','audit-learned','typecheck','lint','mfcc','candidate','benchmark','aggregate','full-test','build','lazy-bundle']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          if not ok:
            for stage in stages:
              if codes.get(stage)==0: continue
              path=Path(f'{stage}.log')
              text=path.read_text(errors='replace') if path.exists() else 'missing log'
              failures += ['',f'## {stage} failure tail','','```text',text[-12000:],'```']
          Path('docs/validation/spiegelib-learned-benchmark-admission.md').write_text('\n'.join([
            '# SpiegeLib learned benchmark admission acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            '- numerical preprocessing evidence: `docs/research/spiegelib-mfcc-compatibility.md` (Python 3.7.7 + Librosa 0.7.2, strict 572-value comparison)',
            '- learned row: one local SpiegeLib simple-FM MLP candidate; nine historical Dexed OP2 controls over a fixed training base; no CMA refinement',
            '- privacy: selected reference remains local; benchmark receipt contains metadata/metrics only',
            '- delivery: model/scaler are lazy-loaded for benchmark execution and are not embedded in the initial entry chunk',
            '- legacy receipts with the earlier blocked learned row remain accepted by the evidence aggregator','',
            *failures,''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-spiegelib-benchmark-admission.yml').unlink(missing_ok=True)
          for path in Path('.').glob('*.log'): path.unlink(missing_ok=True)
          Path('stages.txt').unlink(missing_ok=True)

      - name: Commit receipt
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/spiegelib-learned-benchmark-admission.md | grep -oE 'SUCCESS|FAILED' | head -1)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(audio): record learned benchmark admission $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
