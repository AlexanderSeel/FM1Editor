name: Validate Audio-to-FM candidate output browser contract

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-candidate-output-browser.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Derive candidate-output runner from accepted CMA flow
        shell: python
        run: |
          from pathlib import Path
          source=Path('scripts/test-cma-refinement-browser-v3.mjs')
          target=Path('scripts/test-candidate-output-browser.mjs')
          text=source.read_text(encoding='utf-8')
          text=text.replace("`cma-refinement-${browserName}.json`", "`candidate-output-${browserName}.json`", 1)
          old="""    window.__fm1CmaErrors=[];window.__fm1CmaRejections=[];window.__fm1CmaMidiRequests=0;window.__fm1CmaFetches=[];window.__fm1CmaNodes=[];\n"""
          new="""    window.__fm1CmaErrors=[];window.__fm1CmaRejections=[];window.__fm1CmaMidiRequests=0;window.__fm1CmaFetches=[];window.__fm1CmaNodes=[];window.__fm1CandidateBlobs=[];window.__fm1CandidateDownloads=[];\n"""
          if old not in text: raise SystemExit('instrumentation state anchor missing')
          text=text.replace(old,new,1)
          old="""    Object.defineProperty(navigator,'requestMIDIAccess',{configurable:true,value:async()=>{window.__fm1CmaMidiRequests+=1;throw new Error('CMA refinement must not request Web MIDI');}});\n    const Original=window.AudioWorkletNode;window.AudioWorkletNode=new Proxy(Original,{construct(target,args,newTarget){const node=Reflect.construct(target,args,newTarget);window.__fm1CmaNodes.push(node);return node;}});return true;\n"""
          new="""    Object.defineProperty(navigator,'requestMIDIAccess',{configurable:true,value:async()=>{window.__fm1CmaMidiRequests+=1;throw new Error('Candidate output flow must not request Web MIDI');}});\n    const originalCreateObjectURL=URL.createObjectURL.bind(URL);URL.createObjectURL=(blob)=>{window.__fm1CandidateBlobs.push(blob);return originalCreateObjectURL(blob);};\n    const originalAnchorClick=HTMLAnchorElement.prototype.click;HTMLAnchorElement.prototype.click=function(){if(this.download)window.__fm1CandidateDownloads.push(this.download);return originalAnchorClick.call(this);};\n    window.confirm=()=>true;\n    const Original=window.AudioWorkletNode;window.AudioWorkletNode=new Proxy(Original,{construct(target,args,newTarget){const node=Reflect.construct(target,args,newTarget);window.__fm1CmaNodes.push(node);return node;}});return true;\n"""
          if old not in text: raise SystemExit('instrumentation transport anchor missing')
          text=text.replace(old,new,1)
          old="""  const initialVoice=await evaluate(cdp,`document.querySelector('.fm1-lcd-title')?.textContent?.trim()??''`)\n\n  await clickButton(cdp,'Audio → FM reference')\n"""
          new="""  const initialVoice=await evaluate(cdp,`document.querySelector('.fm1-lcd-title')?.textContent?.trim()??''`)\n\n  await clickButton(cdp,'Effects')\n  await waitForExpression(cdp,`[...document.querySelectorAll('h4')].some((node)=>node.textContent?.trim()==='Filter')`,10_000)\n  const preparedFx=await evaluate(cdp,`(() => {\n    const heading=[...document.querySelectorAll('h4')].find((node)=>node.textContent?.trim()==='Filter');const section=heading?.closest('section');if(!section)return false;\n    const checkbox=section.querySelector('input[type=checkbox]');const cutoff=section.querySelector('input[aria-label=\"Cutoff\"]');if(!checkbox||!cutoff)return false;\n    if(!checkbox.checked)checkbox.click();const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value')?.set;setter?.call(cutoff,'22');cutoff.dispatchEvent(new Event('input',{bubbles:true}));cutoff.dispatchEvent(new Event('change',{bubbles:true}));return true;\n  })()`)\n  if(!preparedFx) throw new Error('Unable to prepare local candidate FX state')\n  await waitForExpression(cdp,`(() => {const heading=[...document.querySelectorAll('h4')].find((node)=>node.textContent?.trim()==='Filter');const section=heading?.closest('section');return Boolean(section?.querySelector('input[type=checkbox]')?.checked&&section?.querySelector('input[aria-label=\"Cutoff\"]')?.value==='22')})()`,5_000)\n  await clickButton(cdp,'Voice')\n  await waitForExpression(cdp,`document.body.textContent.includes('Audio → FM reference')`,10_000)\n\n  await clickButton(cdp,'Audio → FM reference')\n"""
          if old not in text: raise SystemExit('initial FX setup anchor missing')
          text=text.replace(old,new,1)
          old="""  const refinedName=await evaluate(cdp,`${refinedRoot}.querySelector('h5')?.textContent?.trim()??''`)\n  if(!refinedName) throw new Error('First refined result has no name')\n  const nodesBefore=await evaluate(cdp,`window.__fm1CmaNodes.length`)\n"""
          new="""  const refinedName=await evaluate(cdp,`${refinedRoot}.querySelector('h5')?.textContent?.trim()??''`)\n  if(!refinedName) throw new Error('First refined result has no name')\n\n  const downloadsBefore=await evaluate(cdp,`window.__fm1CandidateDownloads.length`)\n  await clickButton(cdp,'Export refined .syx',refinedRoot)\n  await waitForExpression(cdp,`window.__fm1CandidateDownloads.length>${downloadsBefore}&&window.__fm1CandidateBlobs.length>0`,10_000)\n  const syxDetails=await evaluate(cdp,`(async()=>{const blob=window.__fm1CandidateBlobs.at(-1);if(!blob)return null;const bytes=new Uint8Array(await blob.arrayBuffer());let sum=0;for(let i=6;i<161;i+=1)sum=(sum+bytes[i])&0x7f;const expected=(-sum)&0x7f;return{filename:window.__fm1CandidateDownloads.at(-1),size:bytes.length,start:bytes[0],manufacturer:bytes[1],format:bytes[3],lengthHi:bytes[4],lengthLo:bytes[5],checksum:bytes[161],expectedChecksum:expected,end:bytes[162]};})()`,true)\n  if(!syxDetails||syxDetails.size!==163||syxDetails.start!==0xf0||syxDetails.manufacturer!==0x43||syxDetails.format!==0||syxDetails.lengthHi!==1||syxDetails.lengthLo!==0x1b||syxDetails.checksum!==syxDetails.expectedChecksum||syxDetails.end!==0xf7||!String(syxDetails.filename).endsWith('.syx')) throw new Error(`Invalid refined syx export: ${JSON.stringify(syxDetails)}`)\n  const titleAfterExport=await evaluate(cdp,`document.querySelector('.fm1-lcd-title')?.textContent?.trim()??''`)\n  if(titleAfterExport!==initialVoice) throw new Error(`Refined export implicitly loaded voice: ${initialVoice} -> ${titleAfterExport}`)\n\n  await clickButton(cdp,'Attach current FX',refinedRoot)\n  await waitForExpression(cdp,`Boolean(${refinedRoot}.querySelector('[data-candidate-fx-attached=\"true\"]')&&${refinedRoot}.textContent?.includes('Load refined + FX'))`,10_000)\n  const attachmentText=await evaluate(cdp,`${refinedRoot}.querySelector('[data-candidate-fx-attached=\"true\"]')?.textContent?.trim()??''`)\n  if(!attachmentText.includes('2 non-zero controls')) throw new Error(`Unexpected FX attachment summary: ${attachmentText}`)\n\n  const nodesBefore=await evaluate(cdp,`window.__fm1CmaNodes.length`)\n"""
          if old not in text: raise SystemExit('refined output anchor missing')
          text=text.replace(old,new,1)
          old="""  await clickButton(cdp,'Load refined',refinedRoot)\n  const normalizedRefined=refinedName.split(' ').filter(Boolean).join(' ')\n  await waitForExpression(cdp,`(document.querySelector('.fm1-lcd-title')?.textContent??'').split(' ').filter(Boolean).join(' ')===${JSON.stringify(normalizedRefined)}`,15_000)\n  const finalVoice=await evaluate(cdp,`document.querySelector('.fm1-lcd-title')?.textContent?.trim()??''`)\n\n  const diagnostics=JSON.parse(await evaluate(cdp,`JSON.stringify({errors:window.__fm1CmaErrors,rejections:window.__fm1CmaRejections,midiRequests:window.__fm1CmaMidiRequests,fetches:window.__fm1CmaFetches})`)??'{}')\n"""
          new="""  await clickButton(cdp,'Load refined + FX',refinedRoot)\n  const normalizedRefined=refinedName.split(' ').filter(Boolean).join(' ')\n  await waitForExpression(cdp,`(document.querySelector('.fm1-lcd-title')?.textContent??'').split(' ').filter(Boolean).join(' ')===${JSON.stringify(normalizedRefined)}`,15_000)\n  const finalVoice=await evaluate(cdp,`document.querySelector('.fm1-lcd-title')?.textContent?.trim()??''`)\n  await clickButton(cdp,'Effects')\n  await waitForExpression(cdp,`[...document.querySelectorAll('h4')].some((node)=>node.textContent?.trim()==='Filter')`,10_000)\n  const restoredFx=await evaluate(cdp,`(() => {const heading=[...document.querySelectorAll('h4')].find((node)=>node.textContent?.trim()==='Filter');const section=heading?.closest('section');return Boolean(section?.querySelector('input[type=checkbox]')?.checked&&section?.querySelector('input[aria-label=\"Cutoff\"]')?.value==='22')})()`)\n  if(!restoredFx) throw new Error('Combined candidate load did not restore attached Filter enabled/Cutoff 22 state')\n\n  const diagnostics=JSON.parse(await evaluate(cdp,`JSON.stringify({errors:window.__fm1CmaErrors,rejections:window.__fm1CmaRejections,midiRequests:window.__fm1CmaMidiRequests,fetches:window.__fm1CmaFetches,downloads:window.__fm1CandidateDownloads})`)??'{}')\n"""
          if old not in text: raise SystemExit('combined load anchor missing')
          text=text.replace(old,new,1)
          old="""  const result={ok:true,browserName,browserProduct:version.Browser??null,refinedCount,distancePairs,refinedName,initialVoice,finalVoice,auditionPeak,midiRequests:diagnostics.midiRequests,localFetchCount:diagnostics.fetches.length}\n"""
          new="""  const result={ok:true,browserName,browserProduct:version.Browser??null,refinedCount,distancePairs,refinedName,initialVoice,finalVoice,auditionPeak,syxDetails,attachmentText,restoredFx,midiRequests:diagnostics.midiRequests,downloadCount:diagnostics.downloads.length,localFetchCount:diagnostics.fetches.length}\n"""
          if old not in text: raise SystemExit('result anchor missing')
          text=text.replace(old,new,1)
          target.write_text(text,encoding='utf-8')
      - run: node --check scripts/test-candidate-output-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run audit:reconstruction-upstreams
      - run: npm run build
      - name: Run Chrome and Edge candidate-output acceptance
        shell: pwsh
        run: |
          Remove-Item candidate-output-chrome.json,candidate-output-edge.json -Force -ErrorAction SilentlyContinue
          $pfx=${env:ProgramFiles(x86)}
          $chrome=@((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'),(Join-Path $pfx 'Google\Chrome\Application\chrome.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          $edge=@((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'),(Join-Path $pfx 'Microsoft\Edge\Application\msedge.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          if(-not $chrome){throw 'Chrome not found'};if(-not $edge){throw 'Edge not found'}
          function Run($exe,$name,$result){$code=1;for($i=1;$i -le 2;$i++){Remove-Item $result -Force -ErrorAction SilentlyContinue;node scripts/test-candidate-output-browser.mjs --browser-executable $exe --browser-name $name --result $result;$code=$LASTEXITCODE;if($code -eq 0){break};Start-Sleep -Seconds 1};if(-not(Test-Path $result)){@{ok=$false;browserName=$name;error="runner exited $code without result file"}|ConvertTo-Json|Set-Content -Encoding utf8 $result}}
          Run $chrome 'chrome' 'candidate-output-chrome.json';Run $edge 'edge' 'candidate-output-edge.json';exit 0
      - name: Persist evidence and close candidate-output roadmap only on success
        if: always()
        shell: pwsh
        run: |
          @'
          import json,os
          from pathlib import Path
          def read(p):
            q=Path(p)
            if not q.exists():return {'ok':False,'error':'result missing'}
            try:return json.loads(q.read_text(encoding='utf-8-sig'))
            except Exception as exc:return {'ok':False,'error':f'invalid result: {exc}'}
          c,e=read('candidate-output-chrome.json'),read('candidate-output-edge.json');ok=bool(c.get('ok')) and bool(e.get('ok'))
          def row(name,d):
            if not d.get('ok'):return f"| {name} | FAILED | — | — | — | — | {d.get('error','unknown')} |"
            return f"| {name} | {d.get('browserProduct')} | {d.get('syxDetails',{}).get('size')} | {d.get('downloadCount')} | {str(bool(d.get('restoredFx'))).lower()} | {d.get('midiRequests')} | PASS |"
          Path('docs/validation/dx7-candidate-output-browser.md').write_text('\n'.join(['# Audio → FM candidate output browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'','| Browser | Product | .syx bytes | Downloads | FX restored | Web MIDI requests | Result |','| --- | --- | ---: | ---: | --- | ---: | --- |',row('Chrome',c),row('Edge',e),'','The accepted flow starts from local reference retrieval/CMA refinement, exports a standard 163-byte Yamaha DX7 single-voice SysEx with valid checksum, attaches the current FM-1-inspired FX snapshot, auditions without loading, then uses only the explicit Load refined + FX action and verifies Filter enabled/Cutoff 22 after load. Semantic diffs, source initialization and metric breakdown are already displayed by the refined candidate UI.','','Acceptance requires zero Web MIDI requests and no external/write fetches. No candidate is auto-sent to hardware and no physical FM-1 equivalence is claimed.','']),encoding='utf-8')
          if ok:
            p=Path('PLAN.md');t=p.read_text(encoding='utf-8');old='- [ ] Return multiple editable candidates with semantic parameter diffs, source initialization, metric breakdown, `.syx` export and optional FM-1-inspired FX state; never auto-send a generated patch to hardware.';new='- [x] Return multiple editable candidates with semantic parameter diffs, source initialization, metric breakdown, checksum-valid `.syx` export and optional detached FM-1-inspired FX snapshots. Audition, voice-only load, combined voice+FX load and export remain separate explicit actions; generated patches are never auto-sent to hardware. Evidence: [`docs/validation/dx7-candidate-artifacts-ui.md`](./docs/validation/dx7-candidate-artifacts-ui.md), [`docs/validation/dx7-candidate-fx-state-ui.md`](./docs/validation/dx7-candidate-fx-state-ui.md) and [`docs/validation/dx7-candidate-output-browser.md`](./docs/validation/dx7-candidate-output-browser.md).'
            if old in t:t=t.replace(old,new,1)
            elif new not in t:raise SystemExit('candidate-output roadmap item not found')
            p.write_text(t,encoding='utf-8')
          for name in ('candidate-output-chrome.json','candidate-output-edge.json'):Path(name).unlink(missing_ok=True)
          Path('.github/workflows/validate-candidate-output-browser.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit runner and evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(browser): validate Audio-to-FM candidate output contract' || true;git pull --rebase origin main;git push origin HEAD:main
