name: Bind aggregate evidence to exact benchmark receipts

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-real-reference-receipt-hashes.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bind aggregate rows to exact imported receipt bytes
        shell: python
        run: |
          from pathlib import Path

          path=Path('src/audio/realReferenceBenchmarkAggregate.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
            "  readonly learnedListeningAssessment: RealReferenceLearnedListeningAssessment\n  readonly notes?: string\n",
            "  readonly learnedListeningAssessment: RealReferenceLearnedListeningAssessment\n  /** SHA-256 of the exact imported/exported per-reference receipt bytes. Legacy callers may omit it, but final closure then remains blocked. */\n  readonly receiptSha256?: string\n  readonly notes?: string\n",
            1,
          )
          text=text.replace(
            "  readonly auditionEvidenceReceiptCount: number\n  readonly closureReadiness: {",
            "  readonly auditionEvidenceReceiptCount: number\n  readonly receiptIntegrityCount: number\n  readonly closureReadiness: {",
            1,
          )
          text=text.replace(
            "    readonly auditionEvidenceComplete: boolean\n    readonly readyForAggregateEvidence: boolean",
            "    readonly auditionEvidenceComplete: boolean\n    readonly receiptIntegrityComplete: boolean\n    readonly readyForAggregateEvidence: boolean",
            1,
          )
          text=text.replace(
            "    readonly referenceSha256: string\n    readonly filename: string",
            "    readonly referenceSha256: string\n    readonly receiptSha256: string | null\n    readonly filename: string",
            1,
          )
          text=text.replace(
            "  let auditionEvidenceReceiptCount = 0\n",
            "  let auditionEvidenceReceiptCount = 0\n  let receiptIntegrityCount = 0\n",
            1,
          )
          anchor="""    const hash = input.report.reference.contentSha256.toLowerCase()\n    if (seenHashes.has(hash)) throw new Error(`Duplicate real-reference SHA-256: ${hash}.`)\n    seenHashes.add(hash)\n\n"""
          replacement=anchor+"""    const receiptSha256 = input.receiptSha256?.toLowerCase() ?? null\n    if (receiptSha256 !== null && !/^[0-9a-f]{64}$/.test(receiptSha256)) {\n      throw new Error(`${input.report.reference.filename} receipt SHA-256 must contain exactly 64 hexadecimal characters.`)\n    }\n    if (receiptSha256 !== null) receiptIntegrityCount += 1\n\n"""
          if anchor not in text: raise SystemExit('aggregate hash anchor missing')
          text=text.replace(anchor,replacement,1)
          text=text.replace(
            "      referenceSha256: hash,\n      filename: input.report.reference.filename,",
            "      referenceSha256: hash,\n      receiptSha256,\n      filename: input.report.reference.filename,",
            1,
          )
          anchor="""  const auditionEvidenceComplete = auditionEvidenceReceiptCount === receipts.length\n  if (!auditionEvidenceComplete) missing.push(`${receipts.length - auditionEvidenceReceiptCount} receipt${receipts.length - auditionEvidenceReceiptCount === 1 ? '' : 's'} must be rerun with exact benchmark winner audition evidence`)\n\n"""
          replacement=anchor+"""  const receiptIntegrityComplete = receiptIntegrityCount === receipts.length\n  if (!receiptIntegrityComplete) missing.push(`${receipts.length - receiptIntegrityCount} receipt${receipts.length - receiptIntegrityCount === 1 ? '' : 's'} must be retained/imported with an exact receipt SHA-256 binding`)\n\n"""
          if anchor not in text: raise SystemExit('aggregate closure anchor missing')
          text=text.replace(anchor,replacement,1)
          text=text.replace(
            "    auditionEvidenceReceiptCount,\n    closureReadiness: {",
            "    auditionEvidenceReceiptCount,\n    receiptIntegrityCount,\n    closureReadiness: {",
            1,
          )
          text=text.replace(
            "      auditionEvidenceComplete,\n      readyForAggregateEvidence: mixedSetComplete && listeningAssessmentsComplete && learnedListeningAssessmentsComplete && currentThreeWayComplete && auditionEvidenceComplete,",
            "      auditionEvidenceComplete,\n      receiptIntegrityComplete,\n      readyForAggregateEvidence: mixedSetComplete && listeningAssessmentsComplete && learnedListeningAssessmentsComplete && currentThreeWayComplete && auditionEvidenceComplete && receiptIntegrityComplete,",
            1,
          )
          text=text.replace(
            "Current closure additionally requires each receipt to carry the exact three semantic benchmark winner voices so listening evidence is reproducible; those voices are not copied into the aggregate.",
            "Current closure additionally requires each receipt to carry the exact three semantic benchmark winner voices and the aggregate to bind the exact retained receipt bytes by SHA-256; winner voices are not copied into the aggregate.",
            1,
          )
          path.write_text(text,encoding='utf-8')

          panel=Path('src/components/ReconstructionBenchmarkSetPanel.tsx')
          text=panel.read_text(encoding='utf-8')
          text=text.replace(
            "  serializeRealReferenceBenchmarkAggregate,\n} from '../audio/realReferenceAggregateEvidenceDocument'",
            "  serializeRealReferenceBenchmarkAggregate,\n  sha256Utf8,\n} from '../audio/realReferenceAggregateEvidenceDocument'",
            1,
          )
          text=text.replace(
            "  report: RealReferenceReconstructionBenchmarkReport\n  category:",
            "  report: RealReferenceReconstructionBenchmarkReport\n  receiptSha256: string\n  category:",
            1,
          )
          old="""        const parsed = JSON.parse(await file.text()) as unknown\n        const report = parseRealReferenceBenchmarkReceipt(parsed)\n        const learned = learnedResult(report)\n        next.push({\n          id: `${report.reference.contentSha256}:${file.name}`,\n          sourceFilename: file.name,\n          report,\n"""
          new="""        const receiptText = await file.text()\n        const parsed = JSON.parse(receiptText) as unknown\n        const report = parseRealReferenceBenchmarkReceipt(parsed)\n        const learned = learnedResult(report)\n        const receiptSha256 = await sha256Utf8(receiptText)\n        next.push({\n          id: `${report.reference.contentSha256}:${file.name}`,\n          sourceFilename: file.name,\n          report,\n          receiptSha256,\n"""
          if old not in text: raise SystemExit('set panel import anchor missing')
          text=text.replace(old,new,1)
          text=text.replace(
            "        learnedListeningAssessment: item.learnedListeningAssessment,\n        ...(item.notes.trim()",
            "        learnedListeningAssessment: item.learnedListeningAssessment,\n        receiptSha256: item.receiptSha256,\n        ...(item.notes.trim()",
            1,
          )
          text=text.replace(
            "                    <p className=\"mt-1 text-[10px] text-slate-500\">Receipt {item.sourceFilename}</p>",
            "                    <p className=\"mt-1 text-[10px] text-slate-500\">Receipt {item.sourceFilename}</p>\n                    <p className=\"mt-1 break-all font-mono text-[9px] text-emerald-300/70\">Receipt SHA-256 {item.receiptSha256}</p>",
            1,
          )
          text=text.replace(
            "Current closure also requires each receipt to preserve the exact three semantic benchmark winners used for those listening judgments.",
            "Current closure also requires each receipt to preserve the exact three semantic benchmark winners used for those listening judgments and binds the exact imported receipt file bytes into the aggregate by SHA-256.",
            1,
          )
          panel.write_text(text,encoding='utf-8')

          doc=Path('src/audio/realReferenceAggregateEvidenceDocument.ts')
          text=doc.read_text(encoding='utf-8')
          text=text.replace(
            "    `- Current three-way set complete: **${aggregate.closureReadiness.currentThreeWayComplete ? 'yes' : 'no'}**`,",
            "    `- Current three-way set complete: **${aggregate.closureReadiness.currentThreeWayComplete ? 'yes' : 'no'}**`,\n    `- Exact per-reference receipt SHA-256 bindings: **${aggregate.receiptIntegrityCount}/${aggregate.receiptCount}**`,\n    `- Receipt integrity complete: **${aggregate.closureReadiness.receiptIntegrityComplete ? 'yes' : 'no'}**`,",
            1,
          )
          text=text.replace(
            "    '| Reference | SHA-256 | Class | Retrieval | CMA | Learned | Exact winners | Retrieval/CMA listening | Learned listening | Notes |',\n    '| --- | --- | --- | ---: | ---: | ---: | --- | --- | --- | --- |',",
            "    '| Reference | Reference SHA-256 | Receipt SHA-256 | Class | Retrieval | CMA | Learned | Exact winners | Retrieval/CMA listening | Learned listening | Notes |',\n    '| --- | --- | --- | --- | ---: | ---: | ---: | --- | --- | --- | --- |',",
            1,
          )
          text=text.replace(
            "    lines.push(`| ${safeCell(receipt.filename)} | \\`${receipt.referenceSha256}\\` | ${receipt.category} |",
            "    lines.push(`| ${safeCell(receipt.filename)} | \\`${receipt.referenceSha256}\\` | ${receipt.receiptSha256 === null ? '—' : `\\`${receipt.receiptSha256}\\``} | ${receipt.category} |",
            1,
          )
          text=text.replace(
            "hashes, classifications, metrics, runtimes, listening assessments and notes only.",
            "reference/receipt hashes, classifications, metrics, runtimes, listening assessments and notes only.",
            1,
          )
          doc.write_text(text,encoding='utf-8')

          test=Path('src/audio/realReferenceBenchmarkAggregate.test.ts')
          text=test.read_text(encoding='utf-8')
          text=text.replace(
            "    learnedListeningAssessment: 'unavailable' as const,\n  }",
            "    learnedListeningAssessment: 'unavailable' as const,\n    receiptSha256: hashCharacter.repeat(64),\n  }",
            1,
          )
          text=text.replace(
            "    learnedListeningAssessment,\n  }",
            "    learnedListeningAssessment,\n    receiptSha256: hashCharacter.repeat(64),\n  }",
            1,
          )
          text=text.replace(
            "      auditionEvidenceComplete: false,\n      readyForAggregateEvidence: false,",
            "      auditionEvidenceComplete: false,\n      receiptIntegrityComplete: true,\n      readyForAggregateEvidence: false,",
            1,
          )
          text=text.replace(
            "      auditionEvidenceComplete: true,\n      readyForAggregateEvidence: true,",
            "      auditionEvidenceComplete: true,\n      receiptIntegrityComplete: true,\n      readyForAggregateEvidence: true,",
            1,
          )
          marker="""  it('keeps successful learned receipts without exact winner voices parseable but not closure-ready', () => {\n"""
          addition="""  it('keeps current exact-winner receipts without retained receipt SHA binding parseable but not closure-ready', () => {\n    const current = currentItem('8', 'fm-friendly-electronic', 'similar', 'learned-similar', 0.5, 0.4, 0.45)\n    const { receiptSha256: _receiptSha256, ...withoutReceiptHash } = current\n    const aggregate = aggregateRealReferenceBenchmarkEvidence([withoutReceiptHash])\n    expect(aggregate.closureReadiness.auditionEvidenceComplete).toBe(true)\n    expect(aggregate.closureReadiness.receiptIntegrityComplete).toBe(false)\n    expect(aggregate.receiptIntegrityCount).toBe(0)\n    expect(aggregate.closureReadiness.readyForAggregateEvidence).toBe(false)\n    expect(aggregate.closureReadiness.missing.join(' ')).toMatch(/receipt SHA-256 binding/)\n  })\n\n"""+marker
          if marker not in text: raise SystemExit('aggregate test marker missing')
          text=text.replace(marker,addition,1)
          test.write_text(text,encoding='utf-8')

          doc_test=Path('src/audio/realReferenceAggregateEvidenceDocument.test.ts')
          text=doc_test.read_text(encoding='utf-8')
          text=text.replace(
            "    auditionEvidenceReceiptCount: ready ? 6 : 5,\n    closureReadiness: {",
            "    auditionEvidenceReceiptCount: ready ? 6 : 5,\n    receiptIntegrityCount: 6,\n    closureReadiness: {",
            1,
          )
          text=text.replace(
            "      auditionEvidenceComplete: ready,\n      readyForAggregateEvidence: ready,",
            "      auditionEvidenceComplete: ready,\n      receiptIntegrityComplete: true,\n      readyForAggregateEvidence: ready,",
            1,
          )
          text=text.replace(
            "      referenceSha256: String(index + 1).repeat(64),\n      filename:",
            "      referenceSha256: String(index + 1).repeat(64),\n      receiptSha256: 'abcdef'[index]?.repeat(64) ?? 'a'.repeat(64),\n      filename:",
            1,
          )
          text=text.replace(
            "    expect(output.markdown).toContain('Exact winner audition receipts: **6/6**')",
            "    expect(output.markdown).toContain('Exact winner audition receipts: **6/6**')\n    expect(output.markdown).toContain('Exact per-reference receipt SHA-256 bindings: **6/6**')\n    expect(output.markdown).toContain('Receipt integrity complete: **yes**')",
            1,
          )
          doc_test.write_text(text,encoding='utf-8')

          protocol=Path('docs/validation/real-reference-benchmark-protocol.md')
          text=protocol.read_text(encoding='utf-8')
          text=text.replace(
            "6. Export the JSON receipt.\n7. Listen to the best retrieval",
            "6. Export the JSON receipt and retain that exact file unchanged. When it is imported into the evidence-set panel, the app computes SHA-256 over the exact receipt bytes and carries that receipt hash into the aggregate.\n7. Listen to the best retrieval",
            1,
          )
          text=text.replace(
            "- no embedded raw audio samples.\n",
            "- no embedded raw audio samples;\n- exact semantic retrieval/CMA/learned winner voices for reproducible listening;\n- an exact-file receipt SHA-256 supplied by the evidence-set importer before final aggregation.\n",
            1,
          )
          text=text.replace(
            "4. every retained receipt contains a successful current admitted learned row.\n",
            "4. every retained receipt contains a successful current admitted learned row;\n5. every retained receipt contains the exact three semantic winner voices used for listening;\n6. every retained receipt is bound into the aggregate by SHA-256 of the exact retained JSON receipt bytes.\n",
            1,
          )
          text=text.replace(
            "Commit the unmodified exported aggregate JSON and its generated closure Markdown together.",
            "Commit the six exact per-reference benchmark receipt JSON files, the unmodified exported aggregate JSON and its generated closure Markdown together. The aggregate rows contain the receipt SHA-256 values, so the exact winner-bearing receipts used for listening remain cryptographically auditable without committing source audio.",
            1,
          )
          protocol.write_text(text,encoding='utf-8')

          plan=Path('PLAN.md')
          text=plan.read_text(encoding='utf-8')
          text=text.replace(
            "and commit the unmodified aggregate JSON plus its generated closure Markdown/SHA-256 evidence.",
            "and commit the six exact winner-bearing per-reference receipt JSON files plus the unmodified aggregate JSON and its generated closure Markdown/SHA-256 evidence.",
            1,
          )
          text=text.replace(
            "legacy/current receipts without exact winner audition evidence remain parseable but cannot satisfy final closure.",
            "legacy/current receipts without exact winner audition evidence or an exact retained receipt-file SHA-256 binding remain parseable but cannot satisfy final closure.",
            1,
          )
          plan.write_text(text,encoding='utf-8')

      - name: Run acceptance stages
        shell: bash
        run: |
          set +e
          : > stages.txt
          run_stage() {
            name="$1"; shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> stages.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-reconstruction npm run audit:reconstruction-upstreams
          run_stage audit-learned npm run audit:learned-assets
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage aggregate npm test -- src/audio/realReferenceBenchmarkAggregate.test.ts src/audio/realReferenceAggregateEvidenceDocument.test.ts src/components/ReconstructionBenchmarkSetPanel.test.tsx
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('stages.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1)
                try: codes[k]=int(v)
                except ValueError: codes[k]=999
          stages=['install','audit-virtual','audit-reconstruction','audit-learned','typecheck','lint','aggregate','full-test','build']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          if not ok:
            for stage in stages:
              if codes.get(stage)==0: continue
              log=Path(f'{stage}.log')
              body=log.read_text(errors='replace') if log.exists() else 'missing log'
              failures += ['',f'## {stage} failure tail','','```text',body[-12000:],'```']
          Path('docs/validation/real-reference-receipt-integrity.md').write_text('\n'.join([
            '# Real-reference per-receipt integrity acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            '- evidence-set import hashes the exact per-reference receipt file bytes before parsing/aggregation',
            '- aggregate rows retain each exact receipt SHA-256 alongside the reference-audio SHA-256',
            '- final closure requires receipt hashes for every retained row in addition to learned/listening/exact-winner gates',
            '- closure Markdown exposes receipt-integrity count and per-row receipt hashes',
            '- exact winner voices remain in the per-reference receipts and are not duplicated into the aggregate',
            '- raw source audio remains excluded; final evidence can retain receipt JSON without retaining copyrighted recordings','',
            *failures,''
          ]),encoding='utf-8')
          Path('.github/workflows/integrate-real-reference-receipt-hashes.yml').unlink(missing_ok=True)
          for log in Path('.').glob('*.log'): log.unlink(missing_ok=True)
          Path('stages.txt').unlink(missing_ok=True)

      - name: Commit result
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/real-reference-receipt-integrity.md | grep -oE 'SUCCESS|FAILED' | head -1)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(audio): bind aggregate to exact benchmark receipts ($status)" || true
          git pull --rebase origin main
          git push origin HEAD:main
