name: Diagnose nearest preset UI integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-nearest-preset-ui.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Mount panel in checkout
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/App.tsx')
          text=path.read_text(encoding='utf-8')
          old_import="import { ReferenceAudioInputPanel } from './components/ReferenceAudioInputPanel'\n"
          new_import="import { AudioToFmReferencePanel } from './components/AudioToFmReferencePanel'\n"
          if old_import in text:
              text=text.replace(old_import,new_import,1)
          elif new_import not in text:
              raise SystemExit('Reference panel import anchor missing')
          old_hook="const { auditionVoice } = useLocalVoiceAudition()"
          new_hook="const { auditionVoice, stopAudition } = useLocalVoiceAudition()"
          if old_hook in text:
              text=text.replace(old_hook,new_hook,1)
          elif new_hook not in text:
              raise SystemExit('Local audition hook anchor missing')
          old_panel='''                    <ReferenceAudioInputPanel />\n'''
          new_panel='''                    <AudioToFmReferencePanel\n                      onAuditionVoice={auditionVoice}\n                      onLoadVoice={loadCatalogVoice}\n                      onStopAudition={stopAudition}\n                    />\n'''
          if old_panel in text:
              text=text.replace(old_panel,new_panel,1)
          elif '<AudioToFmReferencePanel' not in text:
              raise SystemExit('Mounted reference panel anchor missing')
          path.write_text(text,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - name: Run diagnostic gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/nearest-ui-gate.txt
          ok=true
          for stage in typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/nearest-ui-gate.txt
            case "$stage" in
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/nearest-ui-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/nearest-ui-gate.txt ;;
              focused) npm test -- src/audio/catalogPresetCandidates.test.ts src/audio/compactPresetIndex.test.ts src/components/NearestPresetPanel.test.tsx src/audio/nearestPreset.test.ts src/audio/referenceAudio.test.ts 2>&1 | tee -a /tmp/nearest-ui-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/nearest-ui-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/nearest-ui-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}
            echo "$stage=$code" >> "$GITHUB_OUTPUT"
            if [ "$code" != 0 ]; then ok=false; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result
        env:
          OK: ${{ steps.gate.outputs.ok }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'
          log=Path('/tmp/nearest-ui-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/nearest-preset-ui-diagnostic.md').write_text('\n'.join([
            '# Nearest-preset UI integration diagnostic','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',
            f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'',
            '```text',log[-18000:],'```',''
          ]),encoding='utf-8')
          if ok:
              Path('docs/validation/nearest-preset-ui-software.md').write_text('\n'.join([
                '# Nearest-preset reconstruction UI software validation','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
                'Overall software gate: **SUCCESS**','',
                '- The mounted Audio → FM section combines local reference preparation and explicit nearest-preset retrieval.','- Quick scan indexes up to 256 checksum-valid bundled voices; full bundled-catalog indexing is explicitly available.','- Matching is cancellable and chunked, uses the compact deterministic fingerprint index and persistent local cache.','- Up to eight ranked semantic candidates expose metric breakdown, Play reference A, dry Audition B and explicit Load into editor.','- No candidate is auto-loaded, transmitted over Web MIDI or uploaded.','- Typecheck, lint, focused tests, full tests and production build passed.','',
                'Browser acceptance remains required before the PLAN item is closed.',''
              ]),encoding='utf-8')
              Path('.github/workflows/integrate-nearest-preset-ui.yml').unlink(missing_ok=True)
          PY
          if [ "${OK}" != "true" ]; then git checkout -- src/App.tsx; fi
          rm -f .github/workflows/diagnose-nearest-preset-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record nearest preset UI gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
