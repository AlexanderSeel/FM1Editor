name: Diagnose compact preset index gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-compact-preset-index.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Materialize staged source from implementation workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/implement-compact-preset-index.yml').read_text(encoding='utf-8')
          for target in [
              'src/audio/audioDescriptorFingerprint.ts',
              'src/audio/presetFingerprintCache.ts',
              'src/audio/compactPresetIndex.ts',
              'src/audio/compactPresetIndex.test.ts',
          ]:
              marker=f"cat > {target} <<'EOF'\n"
              start=workflow.find(marker)
              if start < 0: raise SystemExit(f'marker missing: {target}')
              start += len(marker)
              end=workflow.find("\n          EOF", start)
              if end < 0: raise SystemExit(f'EOF missing: {target}')
              Path(target).write_text(textwrap.dedent(workflow[start:end])+'\n',encoding='utf-8')
          PY
      - run: npm install --no-audit --no-fund
      - name: Run diagnostic gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/compact-gate.txt
          ok=true
          for stage in typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/compact-gate.txt
            case "$stage" in
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/compact-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/compact-gate.txt ;;
              focused) npm test -- src/audio/compactPresetIndex.test.ts src/audio/nearestPreset.test.ts src/audio/audioDescriptors.test.ts 2>&1 | tee -a /tmp/compact-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/compact-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/compact-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}
            echo "$stage=$code" >> "$GITHUB_OUTPUT"
            if [ "$code" != 0 ]; then ok=false; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic or accepted implementation
        env:
          OK: ${{ steps.gate.outputs.ok }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'
          log=Path('/tmp/compact-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/compact-preset-index-diagnostic.md').write_text('\n'.join([
            '# Compact preset index diagnostic','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',
            f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'',
            '```text',log[-16000:],'```',''
          ]),encoding='utf-8')
          if ok:
              Path('docs/validation/compact-preset-index-core.md').write_text('\n'.join([
                '# Compact preset fingerprint index core','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
                'Overall software gate: **SUCCESS**','',
                'The reconstruction path now has a compact descriptor fingerprint for scalable catalog retrieval. It keeps resampled RMS/peak envelopes, per-resolution mean log-mel/MFCC vectors and centroid/rolloff/flatness moments rather than STFT matrices.','',
                'A separate local IndexedDB fingerprint cache is keyed by engine id/version, deterministic semantic render key, fingerprint schema and descriptor configuration. Unchanged probes bypass rendering. The compact index remains cancellable, uses standardized C3/C4/C5 probes and ranks semantic voices with a metric breakdown.','',
                'Focused compact-index tests, typecheck, lint, full tests and production build passed. The nearest-preset roadmap item remains open until the mounted UI provides several ranked candidates, dry A/B playback and explicit load actions.',''
              ]),encoding='utf-8')
              Path('.github/workflows/implement-compact-preset-index.yml').unlink(missing_ok=True)
          Path('.github/workflows/diagnose-compact-preset-index.yml').unlink(missing_ok=True)
          PY
      - name: Commit diagnostic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(audio): record compact preset index diagnostic" || true
          git pull --rebase origin main
          git push origin HEAD:main
