name: Validate draggable envelopes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-draggable-envelopes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and accessibility
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Validate envelope controls in Chromium
        shell: bash
        run: |
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 > /tmp/fm1-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          cat > artifacts/validate-envelopes.mjs <<'JS'
          import { chromium } from 'playwright'
          import { strict as assert } from 'node:assert'

          async function value(locator) {
            return Number(await locator.getAttribute('aria-valuenow'))
          }

          async function drag(locator, deltaX, deltaY) {
            await locator.scrollIntoViewIfNeeded()
            const box = await locator.boundingBox()
            assert.ok(box)
            const x = box.x + box.width / 2
            const y = box.y + box.height / 2
            await locator.hover()
            await page.mouse.move(x, y)
            await page.mouse.down()
            await page.mouse.move(x + deltaX, y + deltaY, { steps: 8 })
            await page.mouse.up()
          }

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } })
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })

          const pitchGraph = page.getByRole('group', { name: 'Pitch envelope draggable controls' })
          await pitchGraph.waitFor()
          assert.equal(await pitchGraph.getByRole('slider').count(), 8)

          const pitchRate = page.getByRole('slider', { name: 'Pitch envelope stage 1 rate' })
          const pitchRateNumeric = page.getByRole('slider', { name: 'Pitch rate 1' })
          assert.equal(await value(pitchRate), 99)
          assert.equal(await pitchRateNumeric.inputValue(), '99')

          await drag(pitchRate, 48, 0)
          const draggedRate = await value(pitchRate)
          assert.ok(draggedRate < 99)
          assert.equal(await pitchRateNumeric.inputValue(), String(draggedRate))

          await page.getByRole('button', { name: 'Undo last editor change' }).click()
          await page.waitForFunction(() => document.querySelector('[aria-label="Pitch envelope stage 1 rate"]')?.getAttribute('aria-valuenow') === '99')
          assert.equal(await pitchRateNumeric.inputValue(), '99')

          const pitchRateFour = page.getByRole('slider', { name: 'Pitch envelope stage 4 rate' })
          const pitchRateFourNumeric = page.getByRole('slider', { name: 'Pitch rate 4' })
          await drag(pitchRateFour, 42, 0)
          const draggedRateFour = await value(pitchRateFour)
          assert.ok(draggedRateFour < 99)
          assert.equal(await pitchRateFourNumeric.inputValue(), String(draggedRateFour))
          await page.getByRole('button', { name: 'Undo last editor change' }).click()
          await page.waitForFunction(() => document.querySelector('[aria-label="Pitch envelope stage 4 rate"]')?.getAttribute('aria-valuenow') === '99')

          await pitchRate.focus()
          await page.keyboard.press('Home')
          assert.equal(await value(pitchRate), 0)
          assert.equal(await pitchRateNumeric.inputValue(), '0')
          await page.keyboard.press('End')
          assert.equal(await value(pitchRate), 99)
          assert.equal(await pitchRateNumeric.inputValue(), '99')

          const pitchLevel = page.getByRole('slider', { name: 'Pitch envelope stage 1 level' })
          const pitchLevelNumeric = page.getByRole('slider', { name: 'Pitch level 1' })
          const initialPitchLevel = await value(pitchLevel)
          await drag(pitchLevel, 0, -34)
          const draggedPitchLevel = await value(pitchLevel)
          assert.ok(draggedPitchLevel > initialPitchLevel)
          assert.equal(await pitchLevelNumeric.inputValue(), String(draggedPitchLevel))

          const operatorLevel = page.getByRole('slider', { name: 'Operator 1 amplitude envelope stage 1 level' })
          const operatorLevelNumeric = page.getByRole('slider', { name: 'Level 1', exact: true })
          await drag(operatorLevel, 0, 42)
          const draggedOperatorLevel = await value(operatorLevel)
          assert.ok(draggedOperatorLevel < 99)
          assert.equal(await operatorLevelNumeric.inputValue(), String(draggedOperatorLevel))

          await page.screenshot({ path: 'artifacts/draggable-envelopes.png', fullPage: true })
          await browser.close()
          JS
          node artifacts/validate-envelopes.mjs
          rm artifacts/validate-envelopes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: draggable-envelope-render
          path: artifacts/draggable-envelopes.png
          if-no-files-found: error
      - name: Record validation
        shell: bash
        run: |
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p docs/validation
          cat > docs/validation/draggable-envelopes.md <<EOF
          # Draggable envelope validation

          Validated source commit: \`$validated_sha\`

          - npm install: **PASS**
          - npm run typecheck: **PASS**
          - npm run lint: **PASS**
          - npm run test: **PASS**
          - npm run build: **PASS**
          - Chromium horizontal rate dragging: **PASS**
          - Chromium stage-4 rate dragging: **PASS**
          - Chromium vertical level dragging: **PASS**
          - Chromium keyboard precision controls: **PASS**
          - numeric/graph synchronization: **PASS**
          - single-step undo after pointer drag: **PASS**
          - Chromium desktop render capture: **PASS**

          Verified behavior:

          - operator and pitch envelopes expose four horizontal rate handles and four vertical level handles;
          - all handles support mouse, touch/pointer capture and keyboard adjustment;
          - relative drag deltas remain stable across responsive SVG scaling;
          - fixed graph timing keeps rate 4 directly movable instead of pinning the final point to the right edge;
          - pointer movement updates a local draft and commits once on release;
          - pointer cancellation restores the source envelope;
          - pitch rate and level numeric controls remain available for exact values;
          - selected-operator numeric controls stay synchronized with graph edits;
          - graph edits flow through voice history, SysEx export and bank merge data.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/draggable-envelopes.md
          git commit -m 'test(ci): record draggable envelope validation'
          git push origin HEAD:main
