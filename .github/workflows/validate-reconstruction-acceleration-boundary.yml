name: Validate reconstruction acceleration boundary

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-reconstruction-acceleration-boundary.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run validation stages without short-circuiting evidence
        shell: bash
        run: |
          set +e
          : > validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            echo "=== $name ==="
            "$@" > "validation-$name.log" 2>&1
            code=$?
            cat "validation-$name.log"
            echo "$name=$code" >> validation-stage-codes.txt
          }
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused-test npm test -- src/audio/reconstructionAcceleration.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist acceptance receipt and narrow PLAN item on success
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os

          codes = {}
          p = Path('validation-stage-codes.txt')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '=' not in line:
                      continue
                  name, value = line.split('=', 1)
                  try:
                      codes[name] = int(value)
                  except ValueError:
                      codes[name] = 999
          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'focused-test', 'full-test', 'build']
          ok = all(codes.get(stage) == 0 for stage in stages)
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]
          logs = []
          if not ok:
              for stage in stages:
                  if codes.get(stage) == 0:
                      continue
                  log = Path(f'validation-{stage}.log')
                  text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'log missing'
                  logs.extend(['', f'## {stage} failure tail', '', '```text', text[-12000:], '```'])

          Path('docs/validation/reconstruction-acceleration-boundary.md').write_text('\n'.join([
              '# Optional reconstruction acceleration boundary',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              *rows,
              '',
              'The accepted client remains local-only when `VITE_RECONSTRUCTION_ACCELERATOR_URL` is absent. Capability discovery uploads no audio. A remote request requires HTTPS/localhost, complete service/model/license metadata, bounded automatic deletion, a one-shot consent tied to the exact reference SHA-256 and policy identity, and a valid deletion receipt. Returned candidates must decode as legal 155-byte DX7 voice data before they can be loaded.',
              '',
              'This acceptance validates the browser/client safety boundary and local fallback. It does not claim that a production accelerator service exists or that a learned model has been admitted.',
              *logs,
              '',
          ]), encoding='utf-8')

          if ok:
              plan = Path('PLAN.md')
              old = '- [ ] Add optional server/Python acceleration only behind explicit upload consent, documented retention/deletion, model/version metadata and a fully local fallback for normal editing and audition.'
              new = '- [ ] Implement and deploy an optional reconstruction accelerator only if committed real-reference benchmark receipts demonstrate a material runtime/quality need or a separately license-admitted learned initializer becomes available. The disabled-by-default client boundary, capability/policy validation, one-shot SHA-bound consent, bounded automatic-deletion receipt enforcement, returned DX7 validation and fully local fallback are implemented; any service must satisfy [`docs/validation/reconstruction-accelerator-contract.md`](./docs/validation/reconstruction-accelerator-contract.md).'
              text = plan.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit('PLAN acceleration anchor missing')
              plan.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/validate-reconstruction-acceleration-boundary.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'):
              path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record acceleration boundary acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
