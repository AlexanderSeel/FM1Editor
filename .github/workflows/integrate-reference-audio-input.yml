name: Integrate local reference audio input

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-reference-audio-input.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mount Audio-to-FM reference input in Voice workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          import_anchor = "import { PersistentWorkspace } from './components/PersistentWorkspace'\n"
          if "ReferenceAudioInputPanel" not in text:
              if import_anchor not in text:
                  raise SystemExit('App import anchor not found')
              text = text.replace(import_anchor, import_anchor + "import { ReferenceAudioInputPanel } from './components/ReferenceAudioInputPanel'\n")
          anchor = '''                  <CollapsibleSection\n                    description="Audited dry DX7-compatible AudioWorklet · explicit browser-local enable · no MIDI hardware required"\n                    storageKey="voice-local-virtual-preview"\n                    title="Local virtual preview"\n                  >\n                    <VirtualDx7PreviewPanel voice={voice} />\n                  </CollapsibleSection>\n'''
          insertion = anchor + '''                  <CollapsibleSection\n                    defaultOpen={false}\n                    description="Local WAV/MP3 · region, trim, mono, pitch, normalization and SHA-256 · no server upload"\n                    storageKey="voice-audio-to-fm-reference"\n                    title="Audio → FM reference"\n                  >\n                    <ReferenceAudioInputPanel />\n                  </CollapsibleSection>\n'''
          if 'storageKey="voice-audio-to-fm-reference"' not in text:
              if anchor not in text:
                  raise SystemExit('Voice local preview anchor not found')
              text = text.replace(anchor, insertion)
          path.write_text(text)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Persist mounted input and software receipt
        run: |
          cat > docs/validation/reference-audio-input-software.md <<'EOF'
          # Local Audio-to-FM reference input software validation

          Overall software gate: **SUCCESS**

          ## Accepted scope

          - Voice workspace exposes a separate **Audio → FM reference** panel.
          - WAV and MP3 are accepted; other extensions/MIME combinations are rejected.
          - File size is capped at 25 MB and decoded source duration at 120 seconds before region selection.
          - Prepared analysis regions are limited to 30 seconds and at least 50 ms.
          - Region selection, −60 dBFS leading/trailing silence trim, channel averaging to mono, optional −1 dBFS peak normalization, deterministic autocorrelation pitch estimate and 20–5000 Hz manual override are implemented.
          - Source bytes receive a local SHA-256 identity.
          - Decoding starts only after explicit file selection. The feature contains no fetch/upload/server path; privacy state is `local-browser-only`.
          - Typecheck, lint, full tests and production build passed with the panel mounted in the application.

          Browser codec behavior still depends on the browser's `decodeAudioData` support for the specific WAV/MP3 encoding; real-file browser fixtures and waveform/region UX can be expanded later without weakening the local-only boundary.
          EOF
          python - <<'PY'
          from pathlib import Path
          plan = Path('PLAN.md')
          text = plan.read_text()
          old = '- [ ] Add local WAV/MP3 upload with region selection, duration/size limits, silence trimming, mono analysis, pitch detection with manual override, normalization controls, content hashes and explicit privacy status.'
          new = '- [x] Add local WAV/MP3 reference input with region selection, duration/size limits, silence trimming, mono analysis, pitch detection with manual override, normalization controls, content hashes and explicit local-browser-only privacy status. Evidence: [`docs/validation/reference-audio-input-software.md`](./docs/validation/reference-audio-input-software.md).'
          if old not in text:
              raise SystemExit('Expected open reference-audio roadmap item not found')
          plan.write_text(text.replace(old,new))
          PY
          rm .github/workflows/integrate-reference-audio-input.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src/App.tsx src/audio/referenceAudio.ts src/audio/referenceAudio.test.ts src/components/ReferenceAudioInputPanel.tsx PLAN.md docs/validation/reference-audio-input-software.md .github/workflows/integrate-reference-audio-input.yml
          git commit -m "feat(audio): integrate local reference audio input"
          git pull --rebase origin main
          git push origin main
