name: Implement optional worklet output route

on:
  push:
    branches: [main]
    paths: ['.github/workflows/implement-worklet-output-route.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add optional controller output route
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/audio/msfaAudioWorklet.ts')
          text=path.read_text(encoding='utf-8')
          dep_anchor='''export interface MsfaAudioWorkletDependencies {\n  createAudioContext?: () => AudioContextLike\n'''
          dep_new='''export interface MsfaAudioWorkletOutputRoute {\n  readonly destination: AudioNode\n  dispose?(): void\n}\n\nexport interface MsfaAudioWorkletDependencies {\n  createAudioContext?: () => AudioContextLike\n'''
          if dep_anchor in text:
              text=text.replace(dep_anchor,dep_new,1)
          elif 'export interface MsfaAudioWorkletOutputRoute' not in text:
              raise SystemExit('dependencies anchor missing')
          route_dep='''  loadPackage?: () => Promise<MsfaWorkletPackage>\n  readyTimeoutMs?: number\n}'''
          route_dep_new='''  loadPackage?: () => Promise<MsfaWorkletPackage>\n  /** Optional browser-audio route used by richer local preview targets. Default remains direct dry destination. */\n  createOutputRoute?: (context: AudioContext) => MsfaAudioWorkletOutputRoute\n  readyTimeoutMs?: number\n}'''
          if route_dep in text:
              text=text.replace(route_dep,route_dep_new,1)
          elif 'createOutputRoute?:' not in text:
              raise SystemExit('route dependency anchor missing')
          factory_anchor='''  const createNode = dependencies.createAudioWorkletNode ?? defaultAudioWorkletNode\n  const packageLoader = dependencies.loadPackage ?? loadMsfaWorkletPackage\n'''
          factory_new='''  const createNode = dependencies.createAudioWorkletNode ?? defaultAudioWorkletNode\n  const packageLoader = dependencies.loadPackage ?? loadMsfaWorkletPackage\n  const createOutputRoute = dependencies.createOutputRoute\n'''
          if factory_anchor in text:
              text=text.replace(factory_anchor,factory_new,1)
          elif 'const createOutputRoute = dependencies.createOutputRoute' not in text:
              raise SystemExit('factory anchor missing')
          state_anchor='''  let context: AudioContextLike | null = null\n  let node: AudioWorkletNodeLike | null = null\n'''
          state_new='''  let context: AudioContextLike | null = null\n  let node: AudioWorkletNodeLike | null = null\n  let outputRoute: MsfaAudioWorkletOutputRoute | null = null\n'''
          if state_anchor in text:
              text=text.replace(state_anchor,state_new,1)
          elif 'let outputRoute:' not in text:
              raise SystemExit('state anchor missing')
          cleanup_anchor='''    node = null\n    const closingContext = context\n'''
          cleanup_new='''    node = null\n    const closingRoute = outputRoute\n    outputRoute = null\n    if (closingRoute) {\n      try {\n        closingRoute.dispose?.()\n      } catch {\n        // Output route teardown must not prevent AudioContext shutdown.\n      }\n    }\n    const closingContext = context\n'''
          if cleanup_anchor in text:
              text=text.replace(cleanup_anchor,cleanup_new,1)
          elif 'const closingRoute = outputRoute' not in text:
              raise SystemExit('cleanup anchor missing')
          connect_anchor='''          node.connect(context.destination)\n          await ready\n'''
          connect_new='''          outputRoute = createOutputRoute ? createOutputRoute(context as AudioContext) : null\n          node.connect(outputRoute?.destination ?? context.destination)\n          await ready\n'''
          if connect_anchor in text:
              text=text.replace(connect_anchor,connect_new,1)
          elif 'node.connect(outputRoute?.destination ?? context.destination)' not in text:
              raise SystemExit('connect anchor missing')
          path.write_text(text,encoding='utf-8')

          test=Path('src/audio/msfaAudioWorklet.test.ts')
          content=test.read_text(encoding='utf-8')
          options_anchor='''  readyPerformanceAbi?: number\n} = {}) {'''
          options_new='''  readyPerformanceAbi?: number\n  outputRoute?: boolean\n} = {}) {'''
          if options_anchor in content:
              content=content.replace(options_anchor,options_new,1)
          elif 'outputRoute?: boolean' not in content:
              raise SystemExit('test options anchor missing')
          context_anchor='''  const createContext = vi.fn(() => ({\n    sampleRate: options.sampleRate ?? 48_000,\n    state: 'running' as AudioContextState,\n    destination: {} as AudioNode,\n'''
          context_new='''  const defaultDestination = {} as AudioNode\n  const routedDestination = {} as AudioNode\n  const routeDispose = vi.fn()\n  const createOutputRoute = vi.fn(() => ({ destination: routedDestination, dispose: routeDispose }))\n  const createContext = vi.fn(() => ({\n    sampleRate: options.sampleRate ?? 48_000,\n    state: 'running' as AudioContextState,\n    destination: defaultDestination,\n'''
          if context_anchor in content:
              content=content.replace(context_anchor,context_new,1)
          elif 'const routedDestination' not in content:
              raise SystemExit('test context anchor missing')
          controller_anchor='''    createAudioWorkletNode: createNode as never,\n    loadPackage,\n  })'''
          controller_new='''    createAudioWorkletNode: createNode as never,\n    loadPackage,\n    ...(options.outputRoute ? { createOutputRoute: createOutputRoute as never } : {}),\n  })'''
          if controller_anchor in content:
              content=content.replace(controller_anchor,controller_new,1)
          elif 'options.outputRoute ?' not in content:
              raise SystemExit('controller test anchor missing')
          return_anchor='''    loadPackage,\n    get nodeOptions() { return nodeOptions },\n'''
          return_new='''    loadPackage,\n    defaultDestination,\n    routedDestination,\n    createOutputRoute,\n    routeDispose,\n    get nodeOptions() { return nodeOptions },\n'''
          if return_anchor in content:
              content=content.replace(return_anchor,return_new,1)
          elif 'routedDestination,' not in content:
              raise SystemExit('test return anchor missing')
          insert_anchor='''  it('routes semantic voice, performance controls and independent notes', async () => {\n'''
          addition='''  it('keeps direct dry routing by default and supports an explicit disposable output route', async () => {\n    const dry = browserHarness()\n    await dry.controller.enable()\n    expect(dry.createOutputRoute).not.toHaveBeenCalled()\n    expect(dry.connect).toHaveBeenCalledWith(dry.defaultDestination)\n    await dry.controller.close()\n    expect(dry.routeDispose).not.toHaveBeenCalled()\n\n    const routed = browserHarness({ outputRoute: true })\n    await routed.controller.enable()\n    expect(routed.createOutputRoute).toHaveBeenCalledTimes(1)\n    expect(routed.connect).toHaveBeenCalledWith(routed.routedDestination)\n    await routed.controller.close()\n    expect(routed.routeDispose).toHaveBeenCalledTimes(1)\n  })\n\n'''+insert_anchor
          if "keeps direct dry routing by default" not in content:
              if insert_anchor not in content: raise SystemExit('test insertion anchor missing')
              content=content.replace(insert_anchor,addition,1)
          fatal_anchor='''    const fatal = browserHarness({ fatal: 'WASM init failed' })\n    await expect(fatal.controller.enable()).rejects.toThrow('WASM init failed')\n    expect(fatal.controller.state).toBe('error')\n'''
          fatal_new='''    const fatal = browserHarness({ fatal: 'WASM init failed', outputRoute: true })\n    await expect(fatal.controller.enable()).rejects.toThrow('WASM init failed')\n    expect(fatal.controller.state).toBe('error')\n    expect(fatal.routeDispose).toHaveBeenCalledTimes(1)\n'''
          if fatal_anchor in content:
              content=content.replace(fatal_anchor,fatal_new,1)
          test.write_text(content,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/msfaAudioWorklet.test.ts src/audio/virtualFm1OutputRoute.test.ts src/audio/fm1InspiredFxGraph.test.ts
      - run: npm run test
      - run: npm run build
      - name: Persist validation
        run: |
          cat > docs/validation/msfa-output-route-boundary.md <<EOF
          # MSFA AudioWorklet optional output-route boundary

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          The local AudioWorklet controller now accepts an optional output-route factory. Without one, the existing audited dry behavior is unchanged: the worklet connects directly to `AudioContext.destination`. With a route, the worklet connects to that route's destination and disposes the route on normal close and initialization failure before closing the AudioContext.

          This boundary allows the Virtual FM-1 preview to opt into the validated FX/master/limiter graph without changing catalog audition, sequencer local audio, or the default dry DX7-compatible preview. Virtual-DX7 source audit, typecheck, lint, focused routing tests, the full test suite and production build passed.
          EOF
          rm .github/workflows/implement-worklet-output-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(audio): add optional worklet output route' || true
          git pull --rebase origin main
          git push origin HEAD:main
