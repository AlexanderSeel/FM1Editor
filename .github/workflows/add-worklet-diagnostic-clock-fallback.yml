name: Add AudioWorklet diagnostics clock fallback

on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-worklet-diagnostic-clock-fallback.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Add real millisecond fallback and expose clock source
        shell: python
        run: |
          from pathlib import Path
          w=Path('public/virtual-dx7/fm1-msfa-worklet.js');t=w.read_text(encoding='utf-8')
          old="""  diagnosticNow() {\n    return typeof performance !== 'undefined' && typeof performance.now === 'function' ? performance.now() : null\n  }\n"""
          new="""  diagnosticClock() {\n    if (typeof performance !== 'undefined' && typeof performance.now === 'function') return 'performance'\n    if (typeof Date !== 'undefined' && typeof Date.now === 'function') return 'date'\n    return null\n  }\n\n  diagnosticNow() {\n    const clock = this.diagnosticClock()\n    if (clock === 'performance') return performance.now()\n    if (clock === 'date') return Date.now()\n    return null\n  }\n"""
          if old not in t and new not in t: raise SystemExit('diagnosticNow anchor missing')
          t=t.replace(old,new,1)
          old="""    this.port.postMessage({ type: 'diagnostics', callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization: meanRenderMs / budgetMs, maxUtilization: maxRenderMs / budgetMs, overBudgetCallbacks: this.diagnosticOverBudget, activeVoices: this.voices.filter((voice) => voice.state !== 'idle').length, polyphony: MAX_POLYPHONY })\n"""
          new="""    this.port.postMessage({ type: 'diagnostics', callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization: meanRenderMs / budgetMs, maxUtilization: maxRenderMs / budgetMs, overBudgetCallbacks: this.diagnosticOverBudget, activeVoices: this.voices.filter((voice) => voice.state !== 'idle').length, polyphony: MAX_POLYPHONY, clock: this.diagnosticClock() })\n"""
          if old not in t and new not in t: raise SystemExit('diagnostics post anchor missing')
          t=t.replace(old,new,1);w.write_text(t,encoding='utf-8')

          ts=Path('src/audio/msfaAudioWorklet.ts');s=ts.read_text(encoding='utf-8')
          old="""  readonly polyphony: number\n}\n"""
          new="""  readonly polyphony: number\n  readonly clock?: 'performance' | 'date'\n}\n"""
          if "readonly clock?: 'performance' | 'date'" not in s:
            if old not in s: raise SystemExit('diagnostics interface anchor missing')
            s=s.replace(old,new,1)
          old="""        diagnostics = { callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization, maxUtilization, overBudgetCallbacks, activeVoices, polyphony }\n"""
          new="""        const clock = data.clock === 'performance' || data.clock === 'date' ? data.clock : undefined\n        diagnostics = { callbacks, meanRenderMs, maxRenderMs, budgetMs, meanUtilization, maxUtilization, overBudgetCallbacks, activeVoices, polyphony, ...(clock === undefined ? {} : { clock }) }\n"""
          if old not in s and new not in s: raise SystemExit('controller diagnostics assignment anchor missing')
          s=s.replace(old,new,1);ts.write_text(s,encoding='utf-8')

          ui=Path('src/components/VirtualDx7PreviewPanel.tsx');u=ui.read_text(encoding='utf-8')
          old="""        <div><p className=\"text-[10px] font-bold uppercase tracking-[0.12em] text-slate-500\">Mean render</p><p className=\"mt-1 text-sm font-black text-white\">{diagnostics ? `${diagnostics.meanRenderMs.toFixed(3)} ms · ${(diagnostics.meanUtilization * 100).toFixed(1)}%` : 'measurement pending'}</p></div>\n"""
          new="""        <div><p className=\"text-[10px] font-bold uppercase tracking-[0.12em] text-slate-500\">Mean render</p><p className=\"mt-1 text-sm font-black text-white\">{diagnostics ? `${diagnostics.meanRenderMs.toFixed(3)} ms · ${(diagnostics.meanUtilization * 100).toFixed(1)}%` : 'measurement pending'}</p><p className=\"mt-1 text-[9px] uppercase tracking-[0.1em] text-slate-600\">{diagnostics?.clock === 'date' ? '1 ms fallback clock' : diagnostics?.clock === 'performance' ? 'high-resolution clock' : 'clock pending'}</p></div>\n"""
          if '1 ms fallback clock' not in u:
            if old not in u: raise SystemExit('diagnostics UI anchor missing')
            u=u.replace(old,new,1)
          ui.write_text(u,encoding='utf-8')

          test=Path('src/audio/msfaAudioWorklet.test.ts');x=test.read_text(encoding='utf-8')
          marker="""      polyphony: 16,\n"""
          # Add clock only to the diagnostics-message fixture that already contains meanRenderMs.
          needle="""      meanRenderMs: 0.25,\n      maxRenderMs: 0.5,\n"""
          replacement="""      meanRenderMs: 0.25,\n      maxRenderMs: 0.5,\n      clock: 'date',\n"""
          if needle in x and "clock: 'date'" not in x:x=x.replace(needle,replacement,1)
          test.write_text(x,encoding='utf-8')
      - run: node --check public/virtual-dx7/fm1-msfa-worklet.js
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/msfaAudioWorklet.test.ts src/components/VirtualDx7PreviewPanel.test.tsx
      - run: npm run test
      - run: npm run build
      - name: Persist receipt
        shell: bash
        run: |
          cat > docs/validation/msfa-worklet-diagnostic-clock.md <<EOF
          # AudioWorklet diagnostics clock fallback

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          The worklet uses \`performance.now()\` when that high-resolution timer is exposed by the AudioWorklet global. If it is not exposed, it falls back to the real millisecond wall clock from \`Date.now()\` instead of leaving diagnostics permanently unavailable. Each diagnostic sample records the clock source. The fallback is intentionally described as 1 ms precision and is not treated as equivalent to a high-resolution CPU profiler.

          Deadline-health semantics are unchanged: measurements aggregate 128 render callbacks, compare each callback duration with the 128-frame audio quantum budget, and report mean/max utilization plus over-budget callback count. No synthetic or guessed CPU percentage is inserted.

          Worklet syntax, engine audit, strict typecheck, lint, focused diagnostics/UI tests, full tests and production build passed. Branded-browser evidence remains required.
          EOF
          rm .github/workflows/add-worklet-diagnostic-clock-fallback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(audio): add worklet diagnostic timer fallback'
          git pull --rebase origin main
          git push origin HEAD:main
