name: Prune completed PLAN items

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-completed-plan-items.yml']

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Keep unresolved checklist items only
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('PLAN.md')
          lines=path.read_text(encoding='utf-8').splitlines()
          completed=re.compile(r'^\s*-\s*\[x\]\s+',re.IGNORECASE)
          kept=[line for line in lines if not completed.match(line)]
          # Collapse excessive blank runs left by fully completed groups.
          output=[]
          blanks=0
          for line in kept:
              if line.strip():
                  blanks=0
                  output.append(line)
              else:
                  blanks+=1
                  if blanks<=1: output.append(line)
          path.write_text('\n'.join(output).rstrip()+'\n',encoding='utf-8')
          remaining=[line for line in output if re.match(r'^\s*-\s*\[[ xX]\]\s+',line)]
          if any(completed.match(line) for line in remaining): raise SystemExit('Completed items remain in PLAN')
          print(f'PLAN pruned to {sum("- [ ]" in line for line in remaining)} unresolved checklist items.')
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/prune-completed-plan-items.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(plan): keep unresolved roadmap only'
          git pull --rebase origin main
          git push origin HEAD:main
