name: Reproduce pinned SpiegeLib simple-FM MLP

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reproduce-spiegelib-simple-fm.yml']

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: fm1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/spiegelib/vst-fm-sound-match.git upstream
          git -C upstream checkout --detach e1baab7fbeb0bc3f4d4946f8348e77dd18028080
          test "$(git -C upstream rev-parse HEAD)" = "e1baab7fbeb0bc3f4d4946f8348e77dd18028080"

      - name: Inspect checkpoint without TensorFlow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'numpy<2' 'h5py<4'
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import h5py
          import numpy as np

          root = Path('upstream')
          model = root / 'saved_models/simple_fm_mlp.h5'
          config = root / 'synth_params/dexed_simple_fm.json'
          license_candidates = [root / 'LICENSE', root / 'LICENSE.txt', root / 'LICENSE.md']
          license_path = next((p for p in license_candidates if p.exists()), None)
          if not model.exists(): raise SystemExit('model missing')
          if not config.exists(): raise SystemExit('config missing')
          if license_path is None: raise SystemExit('license file missing')

          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          datasets = {}
          with h5py.File(model, 'r') as handle:
              def visit(name, obj):
                  if isinstance(obj, h5py.Dataset):
                      datasets[name] = tuple(obj.shape)
              handle.visititems(visit)
              model_config = handle.attrs.get('model_config')
              if isinstance(model_config, bytes): model_config = model_config.decode('utf-8')
              parsed_config = json.loads(model_config)

              layers = []
              for layer in parsed_config['config']['layers']:
                  cfg = layer['config']
                  if layer['class_name'] == 'Dense':
                      layers.append({
                          'name': cfg['name'],
                          'units': cfg['units'],
                          'activation': cfg['activation'],
                          'batch_input_shape': cfg.get('batch_input_shape'),
                      })

              expected = [
                  ('dense', 572, 50, 'relu'),
                  ('dense_1', 50, 40, 'relu'),
                  ('dense_2', 40, 30, 'relu'),
                  ('dense_3', 30, 9, 'linear'),
              ]
              if len(layers) != len(expected): raise SystemExit(f'unexpected dense layer count: {layers}')

              arrays = []
              for layer_name, input_size, output_size, activation in expected:
                  layer = next(item for item in layers if item['name'] == layer_name)
                  if layer['units'] != output_size or layer['activation'] != activation:
                      raise SystemExit(f'unexpected layer config: {layer}')
                  candidates = [(name, shape) for name, shape in datasets.items() if f'{layer_name}/' in name]
                  kernel_name = next((name for name, shape in candidates if shape == (input_size, output_size)), None)
                  bias_name = next((name for name, shape in candidates if shape == (output_size,)), None)
                  if kernel_name is None or bias_name is None:
                      raise SystemExit(f'weights not found for {layer_name}: {candidates}')
                  arrays.append((handle[kernel_name][...].astype(np.float64), handle[bias_name][...].astype(np.float64), activation))

              x = np.zeros((572,), dtype=np.float64)
              for kernel, bias, activation in arrays:
                  x = x @ kernel + bias
                  if activation == 'relu': x = np.maximum(x, 0.0)
              if x.shape != (9,) or not np.isfinite(x).all():
                  raise SystemExit(f'invalid forward output: shape={x.shape} values={x}')
              zero_output = [float(value) for value in x]

          scaler_matches = sorted(str(path.relative_to(root)) for path in root.rglob('data_scaler.pkl'))
          result = {
              'upstreamCommit': 'e1baab7fbeb0bc3f4d4946f8348e77dd18028080',
              'modelPath': str(model.relative_to(root)),
              'modelBytes': model.stat().st_size,
              'modelSha256': sha256(model),
              'configPath': str(config.relative_to(root)),
              'configSha256': sha256(config),
              'licensePath': str(license_path.relative_to(root)),
              'licenseSha256': sha256(license_path),
              'denseLayers': layers,
              'zeroStandardizedInputOutput': zero_output,
              'scalerMatches': scaler_matches,
              'scalerPresent': bool(scaler_matches),
          }
          Path('spiegelib-reproduction.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - name: Validate FM1 adapter and repository
        working-directory: fm1
        shell: bash
        run: |
          set +e
          : > ../validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "../validation-$name.log" 2>&1
            code=$?
            cat "../validation-$name.log"
            echo "$name=$code" >> ../validation-stage-codes.txt
          }
          npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused-adapter npm test -- src/audio/spiegelibSimpleFmInitializer.test.ts
          run_stage focused-package npm test -- src/validation/physicalEvidencePackage.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist reproduction receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import json
          import os

          repo = Path('fm1')
          result_path = Path('spiegelib-reproduction.json')
          result = json.loads(result_path.read_text(encoding='utf-8')) if result_path.exists() else None
          codes = {}
          code_file = Path('validation-stage-codes.txt')
          if code_file.exists():
              for line in code_file.read_text(encoding='utf-8').splitlines():
                  if '=' in line:
                      name, value = line.split('=', 1)
                      try: codes[name] = int(value)
                      except ValueError: codes[name] = 999
          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'focused-adapter', 'focused-package', 'full-test', 'build']
          repo_ok = all(codes.get(stage) == 0 for stage in stages)
          checkpoint_ok = result is not None and result.get('modelSha256') and len(result.get('denseLayers', [])) == 4
          scaler_present = bool(result and result.get('scalerPresent'))
          reproduction = 'PARTIAL' if checkpoint_ok and repo_ok and not scaler_present else ('SUCCESS' if checkpoint_ok and repo_ok and scaler_present else 'FAILED')
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]

          details = []
          if result:
              details = [
                  '',
                  '## Pinned upstream artifacts',
                  '',
                  f"- upstream commit: `{result['upstreamCommit']}`",
                  f"- model: `{result['modelPath']}` — {result['modelBytes']} bytes — SHA-256 `{result['modelSha256']}`",
                  f"- synth configuration: `{result['configPath']}` — SHA-256 `{result['configSha256']}`",
                  f"- upstream license: `{result['licensePath']}` — SHA-256 `{result['licenseSha256']}`",
                  f"- dense architecture: `{result['denseLayers']}`",
                  f"- pure NumPy zero-standardized-input output: `{result['zeroStandardizedInputOutput']}`",
                  f"- committed scaler matches: `{result['scalerMatches']}`",
              ]

          Path(repo / 'docs/research/spiegelib-simple-fm-reproduction.md').write_text('\n'.join([
              '# SpiegeLib simple-FM MLP reproduction',
              '',
              f"FM1 Editor source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Reproduction status: **{reproduction}**",
              '',
              *rows,
              *details,
              '',
              'The pinned HDF5 checkpoint is structurally reproducible without TensorFlow: the workflow loads its stored Dense weights with h5py and performs the 572 → 50 → 40 → 30 → 9 ReLU/linear forward pass in NumPy. FM1 Editor separately validates the explicit nine-output Dexed-host-parameter mapping and standards-valid 155-byte Yamaha voice encoding.',
              '',
              'The upstream experiment requires a fitted MFCC `data_scaler.pkl` for raw-audio inference. No such scaler is committed in the pinned upstream checkout, so end-to-end audio preprocessing cannot be reproduced exactly from the published artifacts. The product benchmark learned-initialization row must remain unavailable until that scaler is recovered with compatible provenance or the model is retrained with a repository-owned reproducible scaler/dataset.',
              '',
              'This receipt does not add the upstream HDF5 model or scaler to FM1 Editor and does not enable server upload/inference.',
              '',
          ]), encoding='utf-8')

          (repo / '.github/workflows/reproduce-spiegelib-simple-fm.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'): path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent reproduction evidence
        if: always()
        working-directory: fm1
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record SpiegeLib MLP reproduction' || true
          git pull --rebase origin main
          git push origin HEAD:main
