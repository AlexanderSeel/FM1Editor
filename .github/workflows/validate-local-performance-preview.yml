name: Validate local performance preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-local-performance-preview.yml']

permissions:
  contents: write

concurrency:
  group: validate-local-performance-preview-rerun
  cancel-in-progress: false

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  browser:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute accepted local performance runtime
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          if ($env:BROWSER_NAME -eq 'chrome') {
            $candidates=@("$env:ProgramFiles\Google\Chrome\Application\chrome.exe","${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          } else {
            $candidates=@("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe")
          }
          $browser=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $result="performance-preview-$env:BROWSER_NAME.json"
          if(-not $browser){ @{ok=$false;browserName=$env:BROWSER_NAME;error='browser executable missing'} | ConvertTo-Json | Set-Content -Encoding utf8 $result; exit 1 }
          node scripts/test-msfa-audioworklet-browser.mjs --browser-executable "$browser" --browser-name "$env:BROWSER_NAME" --soak-seconds 20 --result "$result"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-preview-${{ matrix.browser }}
          path: performance-preview-${{ matrix.browser }}.json
          if-no-files-found: error

  record:
    if: always()
    needs: [software,browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: performance-preview-*
          path: browser-results
          merge-multiple: true
      - name: Record receipt and self-clean
        env:
          SOFTWARE_RESULT: ${{ needs.software.result }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          software_ok=os.environ.get('SOFTWARE_RESULT')=='success'
          results=[]
          for name in ['chrome','edge']:
              p=Path('browser-results')/f'performance-preview-{name}.json'
              if p.exists():
                  try:d=json.loads(p.read_text(encoding='utf-8-sig'))
                  except Exception as exc:d={'ok':False,'browserName':name,'error':f'invalid result: {exc}'}
              else:d={'ok':False,'browserName':name,'error':'result missing'}
              results.append(d)
          browser_ok=all(bool(d.get('ok')) and d.get('performanceControlAbi')==1 and d.get('performanceCommandsVerified') is True and d.get('processorErrors')==0 and d.get('suspendedObservations')==0 for d in results)
          ok=software_ok and browser_ok
          lines=['# Local virtual preview performance-control final gate','',f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall final gate: **{'SUCCESS' if ok else 'FAILED'}**",'',f"- Typecheck/lint/tests/build: **{'SUCCESS' if software_ok else 'FAILED'}**",f"- Chrome/Edge performance runtime: **{'SUCCESS' if browser_ok else 'FAILED'}**",'', '## Accepted scope','', '- Explicit browser-local audio enable remains required.', '- Current semantic voice is synchronized into the audited renderer without changing hardware transmission behavior.', '- 16-voice polyphony, per-note release and deterministic voice stealing are enabled for the local piano.', '- Local pitch bend, modulation, sustain and aftertouch are exposed with documented DX7-style range/assignment controls.', '- Performance state is separate from `Dx7Voice` and never automatically sent over Web MIDI/SysEx.', '- Fixed offline PCM and physical DX7/FM-1 equivalence remain separate evidence domains.']
          for d in results: lines += ['',f"## {d.get('browserName','browser')}",'```json',json.dumps(d,indent=2),'```']
          Path('docs/validation/local-virtual-preview-performance-final.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/validate-local-performance-preview.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record final local performance preview gate'
          git pull --rebase origin main
          git push origin HEAD:main
