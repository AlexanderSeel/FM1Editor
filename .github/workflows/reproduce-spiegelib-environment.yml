name: Reproduce pinned SpiegeLib environment

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reproduce-spiegelib-environment.yml']

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Clone exact MIT SpiegeLib pin and verify blocked Sound2Synth-derived files
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/hjdeheer/spiegelib.git /tmp/spiegelib
          git -C /tmp/spiegelib checkout --detach 1a3fa1a172c89b869928005874071d0220fc9ccc
          test "$(git -C /tmp/spiegelib rev-parse HEAD)" = "1a3fa1a172c89b869928005874071d0220fc9ccc"
          grep -q 'MIT License' /tmp/spiegelib/LICENSE
          grep -q 'From Sound2Synth' /tmp/spiegelib/src/spiegelib/estimator/conv_s2s.py
          grep -q 'From Sound2Synth' /tmp/spiegelib/src/spiegelib/estimator/linear.py
          grep -q 'From Sound2Synth' /tmp/spiegelib/src/spiegelib/estimator/lstm_s2s.py
      - name: Reproduce native package import without executing blocked backbones
        id: smoke
        shell: bash
        run: |
          set +e
          : >/tmp/spiegelib-reproduction.log
          python -m venv /tmp/spiegelib-venv
          source /tmp/spiegelib-venv/bin/activate
          python -m pip install --upgrade 'pip<24' 'setuptools<68' 'wheel<0.42' 2>&1 | tee -a /tmp/spiegelib-reproduction.log
          bootstrap=${PIPESTATUS[0]}
          python -m pip install -e /tmp/spiegelib 2>&1 | tee -a /tmp/spiegelib-reproduction.log
          install=${PIPESTATUS[0]}
          if [ "$install" -eq 0 ]; then
            python - <<'PY' 2>&1 | tee -a /tmp/spiegelib-reproduction.log
          import json, sys
          import spiegelib
          import spiegelib.core.audio_buffer
          import spiegelib.estimator
          blocked = [
              'spiegelib.estimator.conv_s2s',
              'spiegelib.estimator.linear',
              'spiegelib.estimator.lstm_s2s',
          ]
          imported = [name for name in blocked if name in sys.modules]
          if imported:
              raise RuntimeError('Blocked Sound2Synth-derived modules were imported: ' + ', '.join(imported))
          import numpy, scipy, numba, tensorflow
          print('SPIEGELIB_IMPORTS=' + json.dumps({
              'spiegelib': getattr(spiegelib, '__version__', 'imported'),
              'numpy': numpy.__version__,
              'scipy': scipy.__version__,
              'numba': numba.__version__,
              'tensorflow': tensorflow.__version__,
              'blockedModulesImported': imported,
          }, sort_keys=True))
          PY
            imports=${PIPESTATUS[0]}
            python -m pip freeze | sort > /tmp/spiegelib-freeze.txt
          else
            imports=99
            : >/tmp/spiegelib-freeze.txt
          fi
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"
          echo "imports=$imports" >> "$GITHUB_OUTPUT"
          if [ "$bootstrap" -eq 0 ] && [ "$install" -eq 0 ] && [ "$imports" -eq 0 ]; then echo ok=true >> "$GITHUB_OUTPUT"; else echo ok=false >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Persist isolated reproduction receipt
        if: always()
        env:
          OK: ${{ steps.smoke.outputs.ok }}
          BOOTSTRAP: ${{ steps.smoke.outputs.bootstrap }}
          INSTALL: ${{ steps.smoke.outputs.install }}
          IMPORTS: ${{ steps.smoke.outputs.imports }}
        shell: python
        run: |
          import os,re
          from pathlib import Path
          log=Path('/tmp/spiegelib-reproduction.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/spiegelib-reproduction.log').exists() else 'reproduction log unavailable'
          freeze=Path('/tmp/spiegelib-freeze.txt').read_text(encoding='utf-8',errors='replace') if Path('/tmp/spiegelib-freeze.txt').exists() else ''
          match=re.search(r'SPIEGELIB_IMPORTS=(\{.*\})',log)
          versions=match.group(1) if match else 'not resolved'
          ok=os.environ.get('OK')=='true'
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {name} | {os.environ.get(key,"?")} |' for name,key in [('toolchain bootstrap','BOOTSTRAP'),('editable install + upstream dependencies','INSTALL'),('MIT-native top-level/import smoke','IMPORTS')]]
          Path('docs/validation/spiegelib-isolated-reproduction.md').write_text('\n'.join(['# SpiegeLib isolated environment reproduction','', 'Pinned upstream: `hjdeheer/spiegelib@1a3fa1a172c89b869928005874071d0220fc9ccc`','', 'Root code license reviewed: **MIT**','',f"Environment smoke: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'',f'Resolved imports: `{versions}`.','', 'The pinned merge adds `conv_s2s.py`, `linear.py` and `lstm_s2s.py` explicitly labeled “From Sound2Synth”. Because the reviewed Sound2Synth core has no explicit root code license, those modules are treated as provenance-blocked. This smoke asserts that the normal SpiegeLib package/estimator import surface does not execute them.','', 'No Dexed/VST binary, RenderMan dependency, preset library, training data or model weights are admitted into FM1 Editor by this reproduction.','', 'Environment snapshot:','```text',freeze[-12000:],'```','','Execution log:','```text',log[-16000:],'```','']),encoding='utf-8')
          Path('.github/workflows/reproduce-spiegelib-environment.yml').unlink(missing_ok=True)
      - name: Commit research evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(research): record SpiegeLib environment reproduction' || true
          git pull --rebase origin main
          git push origin HEAD:main
