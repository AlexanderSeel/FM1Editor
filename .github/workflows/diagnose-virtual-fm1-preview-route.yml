name: Diagnose routed Virtual FM1 preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-virtual-fm1-preview-route.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Execute exact staged preview patch
        shell: python
        run: |
          from pathlib import Path
          workflow=Path('.github/workflows/upgrade-virtual-fm1-preview-route-v2.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,line in enumerate(workflow) if line.strip() == '- name: Apply routed preview upgrade with backwards-compatible props')
          run=next(i for i in range(start+1,len(workflow)) if workflow[i].strip() == 'run: |')
          lines=[]
          for line in workflow[run+1:]:
              if line.startswith('          '): lines.append(line[10:])
              elif line.strip() == '': lines.append('')
              else: break
          script='\n'.join(lines)
          exec(compile(script,'staged-preview-patch','exec'),{})
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/route-gate.txt
          ok=true
          for stage in audit typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/route-gate.txt
            case "$stage" in
              audit) npm run audit:virtual-dx7 2>&1 | tee -a /tmp/route-gate.txt ;;
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/route-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/route-gate.txt ;;
              focused) npm test -- src/audio/msfaAudioWorklet.test.ts src/audio/virtualFm1OutputRoute.test.ts src/audio/fm1InspiredFxGraph.test.ts src/components/VirtualDx7PreviewPanel.test.tsx 2>&1 | tee -a /tmp/route-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/route-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/route-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}; echo "$stage=$code" >> "$GITHUB_OUTPUT"; [ "$code" = 0 ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostic or acceptance
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'; log=Path('/tmp/route-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/virtual-fm1-preview-route-diagnostic.md').write_text('\n'.join([
            '# Virtual FM-1 routed preview diagnostic','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',f"| audit | {os.environ.get('AUDIT')} |",f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'', '```text',log[-18000:],'```',''
          ]),encoding='utf-8')
          if ok:
              Path('docs/validation/virtual-fm1-preview-route-ui.md').write_text('\n'.join([
                '# Virtual FM-1 preview routed-output UI validation','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'','Overall software gate: **SUCCESS**','',
                'The existing local Voice preview now acts as the Virtual FM-1 target while retaining the audited DX7-compatible dry engine. Its default browser controller opts into the validated FM-1-inspired output route; injected/custom controllers remain unchanged.','',
                'Current semantic `Dx7Voice` and App `Fm1FxState` synchronize into the route. The panel exposes explicit dry/FX bypass, −48…+6 dB master gain and the accepted −1 dB/20:1 limiter; dry remains default. Catalog audition and sequencer local audio remain direct dry.','',
                'Virtual-engine audit, typecheck, lint, focused tests, full tests and production build passed.',''
              ]),encoding='utf-8')
              Path('.github/workflows/upgrade-virtual-fm1-preview-route.yml').unlink(missing_ok=True)
              Path('.github/workflows/upgrade-virtual-fm1-preview-route-v2.yml').unlink(missing_ok=True)
          PY
          if [ "${OK}" != "true" ]; then git checkout -- src/components/VirtualDx7PreviewPanel.tsx src/components/VirtualDx7PreviewPanel.test.tsx src/App.tsx; fi
          rm -f .github/workflows/diagnose-virtual-fm1-preview-route.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record routed Virtual FM1 preview gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
