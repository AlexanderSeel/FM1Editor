name: Validate algorithm routing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-algorithm-routing.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and accessibility
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx --yes playwright@1.54.2 install --with-deps chromium
      - name: Validate algorithm controls in Chromium
        shell: bash
        run: |
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 > /tmp/fm1-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          cat > /tmp/validate-algorithm.mjs <<'JS'
          import { chromium } from 'playwright'
          import { strict as assert } from 'node:assert'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } })
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })

          const graph = page.getByRole('group', { name: 'DX7 algorithm 1 routing controls' })
          await graph.waitFor()
          assert.equal(await graph.locator('button[aria-label^="Select operator"]').count(), 6)

          const muteOp1 = page.getByTitle('Mute operator 1 by setting its output level to 0')
          await muteOp1.click()
          await page.getByTitle('Restore operator 1 output level').waitFor()
          assert.equal(await graph.locator('button[aria-label*="operator 1"][aria-label$="muted"]').count(), 1)

          await page.getByTitle('Restore operator 1 output level').click()
          await page.getByTitle('Mute operator 1 by setting its output level to 0').waitFor()
          assert.equal(await graph.locator('button[aria-label*="operator 1"][aria-label$="enabled"]').count(), 1)

          await page.getByTitle('Solo operator 2').click()
          await page.getByTitle('Exit solo and restore the previous operator levels').waitFor()
          assert.equal(await graph.locator('button[aria-label*="operator 2"][aria-label$="enabled"]').count(), 1)
          assert.equal(await graph.locator('button[aria-label$="muted"]').count(), 5)

          await page.getByTitle('Exit solo and restore the previous operator levels').click()
          await page.getByTitle('Solo operator 2').waitFor()
          await page.getByTitle('Mute operator 1 by setting its output level to 0').waitFor()
          await page.screenshot({ path: 'artifacts/algorithm-routing.png', fullPage: true })
          await browser.close()
          JS
          node /tmp/validate-algorithm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: algorithm-routing-render
          path: artifacts/algorithm-routing.png
          if-no-files-found: error
      - name: Record validation
        shell: bash
        run: |
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p docs/validation
          cat > docs/validation/algorithm-routing.md <<EOF
          # DX7 algorithm routing validation

          Validated source commit: \`$validated_sha\`

          - npm install: **PASS**
          - npm run typecheck: **PASS**
          - npm run lint: **PASS**
          - npm run test: **PASS**
          - npm run build: **PASS**
          - Chromium operator-routing interaction: **PASS**
          - Chromium desktop render capture: **PASS**

          Verified behavior:

          - all 32 DX7 algorithms classify all six operators as carriers or modulators;
          - modulation and feedback edges are derived from the reference operator-bus table;
          - every topology lays out six finite operator positions inside the graph;
          - carriers connect to the common audio output bus;
          - selecting a graph node opens the corresponding numeric operator editor;
          - OP1 mute writes output level 0 and Enable restores its remembered level;
          - OP2 solo mutes the other five operators and exiting solo restores the captured levels;
          - mute and solo changes flow through the application voice history and SysEx model;
          - temporary solo state resets when another voice document is loaded;
          - the interactive graph exposes controls as an accessible labelled group.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/algorithm-routing.md
          git commit -m 'test(ci): record algorithm routing validation'
          git push origin HEAD:main
