name: Validate real-reference evidence aggregation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-real-reference-evidence-aggregate.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run validation stages without short-circuiting evidence
        shell: bash
        run: |
          set +e
          : > validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            echo "=== $name ==="
            "$@" > "validation-$name.log" 2>&1
            code=$?
            cat "validation-$name.log"
            echo "$name=$code" >> validation-stage-codes.txt
          }
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused-test npm test -- src/audio/realReferenceBenchmarkAggregate.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist aggregate acceptance and narrow PLAN item on success
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os

          codes = {}
          p = Path('validation-stage-codes.txt')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '=' not in line:
                      continue
                  name, value = line.split('=', 1)
                  try:
                      codes[name] = int(value)
                  except ValueError:
                      codes[name] = 999
          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'focused-test', 'full-test', 'build']
          ok = all(codes.get(stage) == 0 for stage in stages)
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]
          logs = []
          if not ok:
              for stage in stages:
                  if codes.get(stage) == 0:
                      continue
                  log = Path(f'validation-{stage}.log')
                  text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'log missing'
                  logs.extend(['', f'## {stage} failure tail', '', '```text', text[-14000:], '```'])

          Path('docs/validation/real-reference-evidence-aggregate.md').write_text('\n'.join([
              '# Real-reference benchmark evidence aggregation',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              *rows,
              '',
              'The accepted evidence-set UI imports privacy-safe benchmark receipts, rejects duplicate source SHA-256 identities, requires an explicit source class and listening assessment, and calculates median/range distances and runtimes, numerical CMA improvement rate, listening preference and metric-improved/listening-not-better cases.',
              '',
              'The machine-readable minimum gate is two FM-friendly electronic/sustained references, two pitched acoustic/instrument references and two difficult transient/noisy/nonlinear references, with no listening assessment left incomplete. Meeting this gate still requires actual real recordings and does not imply exact reconstruction or physical FM-1 equivalence.',
              *logs,
              '',
          ]), encoding='utf-8')

          if ok:
              plan = Path('PLAN.md')
              old = '- [ ] Run the implemented local comparison receipt on a documented set of real isolated WAV/MP3 references and preserve the exported hash/metrics/runtime evidence. Synthetic ground-truth retrieval/CMA comparison and the real-reference benchmark harness are implemented; learned initialization remains explicitly unavailable until a separately license-admitted implementation/checkpoint exists.'
              new = '- [ ] Run the implemented benchmark on the real 2+2+2 isolated-sound set defined by [`docs/validation/real-reference-benchmark-protocol.md`](./docs/validation/real-reference-benchmark-protocol.md), import the exported receipts into the evidence-set aggregator, complete listening assessments and commit the aggregate hash/metrics/runtime evidence. Synthetic ground-truth comparison, real-reference receipts and aggregate validation are implemented; learned initialization remains explicitly unavailable until a separately license-admitted implementation/checkpoint exists.'
              text = plan.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit('PLAN real-reference evidence anchor missing')
              plan.write_text(text.replace(old, new, 1), encoding='utf-8')

          protocol = Path('docs/validation/real-reference-benchmark-protocol.md')
          if ok and protocol.exists():
              text = protocol.read_text(encoding='utf-8')
              marker = '## Closing the PLAN item\n'
              addition = 'Before creating the final aggregate validation document, import the retained JSON receipts into the in-app **Evidence set · aggregate real-reference receipts** panel, assign the three evidence classes and listening assessments, and export the aggregate JSON. The panel must report **Minimum mixed evidence set complete**.\n\n'
              if addition not in text:
                  text = text.replace(marker, marker + '\n' + addition, 1)
                  protocol.write_text(text, encoding='utf-8')

          Path('.github/workflows/validate-real-reference-evidence-aggregate.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'):
              path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record real-reference aggregate acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
