name: Validate guarded DX7 bulk transfer

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/validation/dx7-bulk-transfer.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee /tmp/test.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Verify guarded transfer markers
        id: markers
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q "sendSingleVoiceToDx7" src/midi/dx7Transfer.ts
          grep -q "sendVoiceBankToDx7" src/midi/dx7Transfer.ts
          grep -q "standard 163-byte Yamaha single-voice bulk dump" src/components/TargetVoiceAuditionPanel.tsx
          grep -q "standard 4,104-byte Yamaha bank bulk dump" src/components/TargetVoiceAuditionPanel.tsx
          grep -q "Memory Protect is off" src/components/TargetVoiceAuditionPanel.tsx
          grep -q "dump requests remain disabled" src/domain/deviceTarget.ts

      - name: Record validation receipt
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MARKERS_OUTCOME: ${{ steps.markers.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/validation
          strip_ansi() {
            sed -r 's/\x1B\[[0-9;]*[mK]//g'
          }
          {
            echo '# Yamaha DX7 bulk transfer validation'
            echo
            echo "Validated source commit: \`${GITHUB_SHA}\`"
            echo
            echo "- Node setup: **${SETUP_OUTCOME^^}**"
            echo "- npm install: **${INSTALL_OUTCOME^^}**"
            echo "- npm run typecheck: **${TYPECHECK_OUTCOME^^}**"
            echo "- npm run lint: **${LINT_OUTCOME^^}**"
            echo "- npm run test: **${TEST_OUTCOME^^}**"
            echo "- npm run build: **${BUILD_OUTCOME^^}**"
            echo "- guarded DX7 transfer marker check: **${MARKERS_OUTCOME^^}**"
            echo
            echo '- software tests cover channel-addressed 163-byte single-voice and 4,104-byte 32-voice bank messages.'
            echo '- parameter changes, function data and device dump requests remain disabled.'
            echo '- physical Yamaha DX7 reception and memory behavior remain unverified.'
            for entry in \
              'Install:/tmp/npm-install.log' \
              'Typecheck:/tmp/typecheck.log' \
              'Lint:/tmp/lint.log' \
              'Test:/tmp/test.log' \
              'Build:/tmp/build.log'; do
              title="${entry%%:*}"
              file="${entry#*:}"
              echo
              echo "## ${title} output"
              echo
              echo '```text'
              if [[ -f "$file" ]]; then
                tail -n 120 "$file" | strip_ansi
              else
                echo 'No output captured.'
              fi
              echo '```'
            done
          } > docs/validation/dx7-bulk-transfer.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/dx7-bulk-transfer.md
          if ! git diff --cached --quiet; then
            git commit -m "test(ci): record DX7 bulk transfer validation"
            git push
          fi

      - name: Fail when validation failed
        if: always()
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          MARKERS_OUTCOME: ${{ steps.markers.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$SETUP_OUTCOME" "$INSTALL_OUTCOME" "$TYPECHECK_OUTCOME" "$LINT_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME" "$MARKERS_OUTCOME"; do
            [[ "$outcome" == 'success' ]] || exit 1
          done
