name: Finalize PLAN v3 and recreation docs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-plan-v3-and-recreation-docs.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align roadmap and evidence docs
        shell: python
        run: |
          from pathlib import Path

          plan=Path('PLAN.md')
          text=plan.read_text(encoding='utf-8')
          old="""Known limitations, current evidence and conservative recovery procedures are maintained in [`docs/validation/support-matrix-and-recovery.md`](./docs/validation/support-matrix-and-recovery.md). The in-app **FM-1 delivery evidence gate v2** keeps the validated v1 manifest-completeness checks but final READY additionally requires each selected Chrome and Edge manifest SHA-256 to be backed by exactly one structurally consistent raw-MIDI correlation receipt, with distinct manifest and raw-capture hashes across the two browser sessions. Use the local-only **Physical evidence package** helper documented in [`docs/validation/physical-evidence-package.md`](./docs/validation/physical-evidence-package.md) to SHA-index each sanitized session and export its hash-bound raw-MIDI correlation receipt. The software acceptance for the v2 binding is recorded in [`docs/validation/fm1-delivery-evidence-integrity.md`](./docs/validation/fm1-delivery-evidence-integrity.md). None of these integrity layers is a physical PASS.

- [ ] Test Chrome and Edge on Windows with a physical FM-1 over USB MIDI and USB audio, including merged bank import, destination selection, preset recall, recording, note-off recovery and channel selection; test BLE MIDI where browser/platform support permits. For each browser session retain the sanitized hardware manifest, matching raw MIDI export and hash-bound correlation receipt; import both manifests plus their correlation receipts into delivery gate v2 and commit the READY receipt when the physical matrix is genuinely complete.
- [ ] Enable GitHub Pages deployment only after a committed **v2 READY** delivery evidence receipt records the intended HTTPS origin/firmware/editor/Windows tuple and binds both browser manifests to distinct raw MIDI captures by SHA-256. Repository-subpath build/PWA/static routing for `/FM1Editor/` is implemented and validated in [`docs/validation/pages-subpath-readiness.md`](./docs/validation/pages-subpath-readiness.md); the delivery-gate implementation itself does not satisfy the physical prerequisite or enable deployment automatically.
"""
          new="""Known limitations, current evidence and conservative recovery procedures are maintained in [`docs/validation/support-matrix-and-recovery.md`](./docs/validation/support-matrix-and-recovery.md). The in-app **FM-1 delivery evidence gate v3** composes three fail-closed integrity layers: v1 checks Chrome/Edge physical-manifest completeness, v2 binds each selected manifest SHA-256 to exactly one structurally consistent raw-MIDI capture SHA-256, and v3 additionally requires one unique FM-1 physical-evidence package index per browser session containing those exact manifest/raw-MIDI hashes plus WAV, SysEx and screenshot-or-notes evidence. Chrome and Edge must use distinct manifest, raw-MIDI, package-index and WAV hashes; the controlled merged-bank SysEx input may legitimately be shared. Software acceptance is recorded in [`docs/validation/fm1-delivery-evidence-integrity.md`](./docs/validation/fm1-delivery-evidence-integrity.md) and [`docs/validation/fm1-delivery-package-integrity.md`](./docs/validation/fm1-delivery-package-integrity.md). None of these integrity layers is a physical PASS.

- [ ] Test Chrome and Edge on Windows with a physical FM-1 over USB MIDI and USB audio, including merged bank import, destination selection, preset recall, recording, note-off recovery and channel selection; test BLE MIDI where browser/platform support permits. For each browser session retain the sanitized hardware manifest, matching raw MIDI export, hash-bound correlation receipt and SHA-indexed FM-1 physical-evidence package containing that exact pair plus WAV, SysEx and screen/recovery evidence; import both complete session sets into delivery gate v3 and commit the READY receipt when the physical matrix is genuinely complete.
- [ ] Enable GitHub Pages deployment only after a committed **v3 READY** delivery evidence receipt records the intended HTTPS origin/firmware/editor/Windows tuple and binds both browser sessions through manifest → raw MIDI → package index, including distinct WAV evidence. Repository-subpath build/PWA/static routing for `/FM1Editor/` is implemented and validated in [`docs/validation/pages-subpath-readiness.md`](./docs/validation/pages-subpath-readiness.md); the delivery-gate implementation itself does not satisfy the physical prerequisite or enable deployment automatically.
"""
          if old not in text: raise SystemExit('PLAN delivery v2 anchor missing')
          text=text.replace(old,new,1)
          anchor="The staged technical decision and reviewed libraries/research are documented in [`docs/research/audio-to-fm-and-virtual-synth.md`](./docs/research/audio-to-fm-and-virtual-synth.md). The admitted local SpiegeLib simple-FM initializer, licenses, hashes, historical preprocessing reproduction, nine-control scope and benchmark boundary are documented in [`docs/research/learned-initializer-admission.md`](./docs/research/learned-initializer-admission.md) and validated in [`docs/validation/spiegelib-learned-benchmark-admission.md`](./docs/validation/spiegelib-learned-benchmark-admission.md)."
          replacement=anchor+" The primary Audio → FM action now **recreates** a DX7-compatible patch rather than stopping at nearest-preset lookup: local retrieval is used only to select promising seeds, then deterministic CMA-ES changes operator output levels, feedback, operator frequencies and operator envelopes against the prepared reference. Similar-preset search remains a secondary action. This software behavior is validated in [`docs/validation/primary-sound-recreation-ui.md`](./docs/validation/primary-sound-recreation-ui.md); exact inverse recovery is not claimed."
          if anchor not in text: raise SystemExit('PLAN reconstruction intro anchor missing')
          text=text.replace(anchor,replacement,1)
          plan.write_text(text,encoding='utf-8')

          protocol=Path('docs/validation/fm1-hardware-test-protocol.md')
          p=protocol.read_text(encoding='utf-8')
          p=p.replace('**FM-1 delivery evidence gate v2** retains the validated v1 manifest-completeness checks and adds a hash-bound integrity requirement.', '**FM-1 delivery evidence gate v3** retains the validated v1 manifest-completeness checks and v2 raw-MIDI hash binding, then adds package-level evidence coverage.')
          p=p.replace('A v2 READY result is still an evidence-completeness/integrity result only;', 'A v3 READY result is still an evidence-completeness/integrity result only;')
          p=p.replace('For the Chrome/Edge delivery prerequisite, keep the manifest, raw MIDI export and correlation receipt from each browser session. Import both hardware manifests and both correlation receipts into **FM-1 delivery evidence gate v2** and export the compact v2 gate receipt.', 'For the Chrome/Edge delivery prerequisite, keep the manifest, raw MIDI export, correlation receipt and physical-evidence package index from each browser session. Each package index must contain that exact manifest/raw-MIDI pair plus at least one WAV, one SysEx artifact and screenshot-or-notes evidence. Import both complete session sets into **FM-1 delivery evidence gate v3** and export the compact v3 gate receipt.')
          p=p.replace('Import both manifests and both correlation receipts into **FM-1 delivery evidence gate v2**. Do not treat a single-browser result, origin/commit mismatch, missing correlation receipt, reused raw capture or ambiguous hash binding as delivery-ready.', 'Import both manifests, both correlation receipts and both package indexes into **FM-1 delivery evidence gate v3**. Do not treat a single-browser result, origin/commit mismatch, missing correlation receipt/package, reused raw capture/WAV or ambiguous hash binding as delivery-ready.')
          p=p.replace('- exported **v2** delivery evidence gate receipt when validating Chrome/Edge delivery readiness;', '- exported **v3** delivery evidence gate receipt when validating Chrome/Edge delivery readiness;')
          p=p.replace('For a Chrome/Edge delivery proposal, retain both browser manifests, both distinct raw MIDI exports, both correlation receipts and the final v2 gate receipt. A v1 manifest-completeness result, package index or correlation receipt alone is not sufficient to close delivery/Pages readiness.', 'For a Chrome/Edge delivery proposal, retain both browser manifests, both distinct raw MIDI exports, both correlation receipts, both distinct physical-evidence package indexes with distinct WAV recordings, and the final v3 gate receipt. A v1/v2 result, package index or correlation receipt alone is not sufficient to close delivery/Pages readiness.')
          protocol.write_text(p,encoding='utf-8')

          pkg=Path('docs/validation/physical-evidence-package.md')
          q=pkg.read_text(encoding='utf-8')
          q=q.replace('- `fm1-editor.fm1-delivery-evidence-gate.v2` as the final hash-bound FM-1 delivery-gate receipt;', '- `fm1-editor.fm1-delivery-evidence-gate.v2` as the manifest/raw-MIDI hash-bound intermediate gate receipt;\n- `fm1-editor.fm1-delivery-evidence-gate.v3` as the final package-bound FM-1 delivery-gate receipt;')
          q=q.replace('## FM-1 delivery gate v2 linkage', '## FM-1 delivery gate v2/v3 linkage')
          marker='The v2 receipt records the source/hash bindings but not the imported manifest bodies or MIDI payloads. This closes file/session ambiguity only; the physical observations in the manifests remain tester evidence governed by the hardware protocol.\n'
          addition=marker+"\nThe final **v3** gate additionally imports one `fm1-editor.physical-evidence-package.v1` index per selected browser session. A package is eligible only when it contains the exact manifest SHA-256 and raw-MIDI SHA-256 already selected by v2, at least one WAV artifact, at least one SysEx artifact and screenshot-or-notes evidence. Chrome and Edge package-index hashes and WAV hashes must be distinct. The same controlled merged-bank SysEx input may be present in both packages. v3 stores only artifact names/hashes and coverage metadata; it does not embed the WAV, SysEx or MIDI payloads.\n"
          if marker not in q: raise SystemExit('Physical package v2 marker missing')
          q=q.replace(marker,addition,1)
          q=q.replace('export the final **v2 delivery gate receipt** from both manifests plus both correlation receipts.', 'export the final **v3 delivery gate receipt** from both manifests, both correlation receipts and both package indexes.')
          q=q.replace('for delivery/Pages also cite the v2 gate receipt.', 'for delivery/Pages also cite the v3 gate receipt.')
          pkg.write_text(q,encoding='utf-8')

      - name: Verify documentation anchors
        shell: bash
        run: |
          grep -F 'FM-1 delivery evidence gate v3' PLAN.md
          grep -F 'v3 READY' PLAN.md
          grep -F 'primary Audio → FM action now **recreates**' PLAN.md
          grep -F 'FM-1 delivery evidence gate v3' docs/validation/fm1-hardware-test-protocol.md
          grep -F 'fm1-editor.fm1-delivery-evidence-gate.v3' docs/validation/physical-evidence-package.md
          test -f docs/validation/fm1-delivery-package-integrity.md
          grep -F 'Software acceptance: **SUCCESS**' docs/validation/fm1-delivery-package-integrity.md
          grep -F 'Software acceptance: **SUCCESS**' docs/validation/primary-sound-recreation-ui.md

      - name: Commit documentation
        shell: bash
        run: |
          rm .github/workflows/finalize-plan-v3-and-recreation-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(plan): align delivery v3 and sound recreation'
          git pull --rebase origin main
          git push origin HEAD:main
