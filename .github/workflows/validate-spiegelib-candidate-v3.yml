name: Validate composed SpiegeLib learned candidate v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-spiegelib-candidate-v3.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run fully fail-reporting candidate gate
        shell: bash
        run: |
          set +e
          : > codes.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> codes.txt
          }
          run_stage install npm install --no-audit --no-fund
          if grep -q '^install=0$' codes.txt; then
            run_stage audit npm run audit:learned-assets
            run_stage typecheck npm run typecheck
            run_stage lint npm run lint
            run_stage scaler npm test -- src/audio/spiegelibSimpleFmScaler.test.ts src/audio/spiegelibSimpleFmScalerData.test.ts
            run_stage model npm test -- src/audio/spiegelibSimpleFmMlp.test.ts src/audio/spiegelibSimpleFmModel.test.ts
            run_stage adapter npm test -- src/audio/spiegelibSimpleFmInitializer.test.ts src/audio/spiegelibSimpleFmCandidate.test.ts
            run_stage full-test npm run test
            run_stage build npm run build
          fi
          exit 0
      - name: Persist diagnostic receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('codes.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                n,v=line.split('=',1)
                try: codes[n]=int(v)
                except ValueError: codes[n]=999
          stages=['install','audit','typecheck','lint','scaler','model','adapter','full-test','build']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          for stage in stages:
            if codes.get(stage)==0: continue
            log=Path(f'{stage}.log')
            text=log.read_text(errors='replace') if log.exists() else ('stage not run' if stage not in codes else 'missing log')
            failures += ['',f'## {stage} failure tail','','```text',text[-12000:],'```']
          Path('docs/validation/spiegelib-candidate.md').write_text('\n'.join([
            '# SpiegeLib composed learned-candidate software acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            'This gate covers dependency installation, learned-asset provenance, TypeScript/lint, scaler/model/adapter focused tests, full tests and production build for the locally composed SpiegeLib candidate. Historical MFCC numerical compatibility remains a separate admission condition.','',
            *failures,''
          ]))
          for name in ['.github/workflows/validate-spiegelib-candidate-v3.yml','.github/workflows/validate-spiegelib-candidate-v2.yml','.github/workflows/validate-spiegelib-candidate.yml']:
            Path(name).unlink(missing_ok=True)
          for log in Path('.').glob('*.log'): log.unlink(missing_ok=True)
          Path('codes.txt').unlink(missing_ok=True)
      - name: Commit diagnostic receipt
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record SpiegeLib candidate acceptance v3' || true
          git pull --rebase origin main
          git push origin HEAD:main
