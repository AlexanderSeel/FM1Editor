name: Reproduce pinned SpiegeLib in Python 3.7 container

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reproduce-spiegelib-container.yml']

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reproduce in pinned Python 3.7 Debian container
        id: smoke
        shell: bash
        run: |
          set +e
          rm -f /tmp/spiegelib-container.log /tmp/spiegelib-container-freeze.txt /tmp/spiegelib-status.env
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            python:3.7-bullseye \
            bash -lc '
              set +e
              : >/workspace/spiegelib-container.log
              apt-get update 2>&1 | tee -a /workspace/spiegelib-container.log
              apt-get install -y --no-install-recommends git 2>&1 | tee -a /workspace/spiegelib-container.log
              bootstrap=${PIPESTATUS[0]}
              git clone --filter=blob:none https://github.com/hjdeheer/spiegelib.git /tmp/spiegelib 2>&1 | tee -a /workspace/spiegelib-container.log
              clone=${PIPESTATUS[0]}
              if [ "$clone" -eq 0 ]; then
                git -C /tmp/spiegelib checkout --detach 1a3fa1a172c89b869928005874071d0220fc9ccc 2>&1 | tee -a /workspace/spiegelib-container.log
                checkout=${PIPESTATUS[0]}
              else checkout=99; fi
              if [ "$checkout" -eq 0 ]; then
                test "$(git -C /tmp/spiegelib rev-parse HEAD)" = "1a3fa1a172c89b869928005874071d0220fc9ccc"
                pin=$?
                grep -q "MIT License" /tmp/spiegelib/LICENSE; license=$?
                grep -q "From Sound2Synth" /tmp/spiegelib/src/spiegelib/estimator/conv_s2s.py && grep -q "From Sound2Synth" /tmp/spiegelib/src/spiegelib/estimator/linear.py && grep -q "From Sound2Synth" /tmp/spiegelib/src/spiegelib/estimator/lstm_s2s.py
                blocked=$?
              else pin=99; license=99; blocked=99; fi
              python -m pip install --upgrade "pip<24" "setuptools<68" "wheel<0.42" 2>&1 | tee -a /workspace/spiegelib-container.log
              pipboot=${PIPESTATUS[0]}
              if [ "$checkout" -eq 0 ] && [ "$pipboot" -eq 0 ]; then
                python -m pip install -e /tmp/spiegelib 2>&1 | tee -a /workspace/spiegelib-container.log
                install=${PIPESTATUS[0]}
              else install=99; fi
              if [ "$install" -eq 0 ]; then
                python - <<"PY" 2>&1 | tee -a /workspace/spiegelib-container.log
import json, sys
import spiegelib
import spiegelib.core.audio_buffer
import spiegelib.estimator
blocked = [
    "spiegelib.estimator.conv_s2s",
    "spiegelib.estimator.linear",
    "spiegelib.estimator.lstm_s2s",
]
imported = [name for name in blocked if name in sys.modules]
if imported:
    raise RuntimeError("Blocked Sound2Synth-derived modules were imported: " + ", ".join(imported))
import numpy, scipy, numba, tensorflow
print("SPIEGELIB_IMPORTS=" + json.dumps({
    "numpy": numpy.__version__,
    "scipy": scipy.__version__,
    "numba": numba.__version__,
    "tensorflow": tensorflow.__version__,
    "blockedModulesImported": imported,
}, sort_keys=True))
PY
                imports=${PIPESTATUS[0]}
                python -m pip freeze | sort > /workspace/spiegelib-container-freeze.txt
              else imports=99; : >/workspace/spiegelib-container-freeze.txt; fi
              cat >/workspace/spiegelib-status.env <<EOF
bootstrap=$bootstrap
clone=$clone
checkout=$checkout
pin=$pin
license=$license
blocked=$blocked
pipboot=$pipboot
install=$install
imports=$imports
EOF
              exit 0
            '
          mv spiegelib-container.log /tmp/spiegelib-container.log 2>/dev/null || true
          mv spiegelib-container-freeze.txt /tmp/spiegelib-container-freeze.txt 2>/dev/null || true
          if [ -f spiegelib-status.env ]; then source spiegelib-status.env; rm spiegelib-status.env; else bootstrap=99;clone=99;checkout=99;pin=99;license=99;blocked=99;pipboot=99;install=99;imports=99; fi
          for key in bootstrap clone checkout pin license blocked pipboot install imports; do eval "value=\$$key"; echo "$key=$value" >> "$GITHUB_OUTPUT"; done
          if [ "$bootstrap" -eq 0 ] && [ "$clone" -eq 0 ] && [ "$checkout" -eq 0 ] && [ "$pin" -eq 0 ] && [ "$license" -eq 0 ] && [ "$blocked" -eq 0 ] && [ "$pipboot" -eq 0 ] && [ "$install" -eq 0 ] && [ "$imports" -eq 0 ]; then echo ok=true >> "$GITHUB_OUTPUT"; else echo ok=false >> "$GITHUB_OUTPUT"; fi
      - name: Persist container reproduction receipt
        if: always()
        env:
          OK: ${{ steps.smoke.outputs.ok }}
          BOOTSTRAP: ${{ steps.smoke.outputs.bootstrap }}
          CLONE: ${{ steps.smoke.outputs.clone }}
          CHECKOUT: ${{ steps.smoke.outputs.checkout }}
          PIN: ${{ steps.smoke.outputs.pin }}
          LICENSE: ${{ steps.smoke.outputs.license }}
          BLOCKED: ${{ steps.smoke.outputs.blocked }}
          PIPBOOT: ${{ steps.smoke.outputs.pipboot }}
          INSTALL: ${{ steps.smoke.outputs.install }}
          IMPORTS: ${{ steps.smoke.outputs.imports }}
        shell: python
        run: |
          import os,re
          from pathlib import Path
          log=Path('/tmp/spiegelib-container.log').read_text(encoding='utf-8',errors='replace') if Path('/tmp/spiegelib-container.log').exists() else 'container log unavailable'
          freeze=Path('/tmp/spiegelib-container-freeze.txt').read_text(encoding='utf-8',errors='replace') if Path('/tmp/spiegelib-container-freeze.txt').exists() else ''
          match=re.search(r'SPIEGELIB_IMPORTS=(\{.*\})',log)
          versions=match.group(1) if match else 'not resolved'
          ok=os.environ.get('OK')=='true'
          stages=[('container bootstrap','BOOTSTRAP'),('git clone','CLONE'),('exact checkout','CHECKOUT'),('pin verify','PIN'),('MIT license verify','LICENSE'),('Sound2Synth provenance markers','BLOCKED'),('pip bootstrap','PIPBOOT'),('editable install','INSTALL'),('native import / blocked-not-imported assertion','IMPORTS')]
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {name} | {os.environ.get(key,"?")} |' for name,key in stages]
          Path('docs/validation/spiegelib-isolated-reproduction.md').write_text('\n'.join(['# SpiegeLib isolated environment reproduction','', 'Pinned upstream: `hjdeheer/spiegelib@1a3fa1a172c89b869928005874071d0220fc9ccc`','', 'Root code license reviewed: **MIT**','',f"Python 3.7 container smoke: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'',f'Resolved imports: `{versions}`.','', 'The three files explicitly labeled “From Sound2Synth” are treated as provenance-blocked because the reviewed Sound2Synth core has no explicit root code license. The import smoke asserts those modules do not enter `sys.modules`.','', 'No Dexed/VST binary, RenderMan dependency, preset library, training data or model weights are admitted into FM1 Editor. This is research reproduction evidence only.','', 'Environment snapshot:','```text',freeze[-12000:],'```','','Execution log:','```text',log[-18000:],'```','']),encoding='utf-8')
          Path('.github/workflows/reproduce-spiegelib-environment.yml').unlink(missing_ok=True)
          Path('.github/workflows/reproduce-spiegelib-container.yml').unlink(missing_ok=True)
      - name: Commit research evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs(research): record SpiegeLib Python 3.7 reproduction' || true
          git pull --rebase origin main
          git push origin HEAD:main
