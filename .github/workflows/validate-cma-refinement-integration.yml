name: Validate CMA-ES refinement integration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-cma-refinement-integration.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply strict-TypeScript fixes under validation
        shell: python
        run: |
          from pathlib import Path
          core = Path('src/audio/dx7CmaEs.ts')
          text = core.read_text(encoding='utf-8')
          old = "      const score = await objective(voice, { generation, candidateIndex, evaluation: evaluations, signal: options.signal })\n"
          new = """      const score = await objective(voice, {\n        generation,\n        candidateIndex,\n        evaluation: evaluations,\n        ...(options.signal === undefined ? {} : { signal: options.signal }),\n      })\n"""
          if old not in text and new not in text:
              raise SystemExit('CMA objective context anchor not found')
          text = text.replace(old, new, 1)
          core.write_text(text, encoding='utf-8')

          test = Path('src/audio/dx7CmaEsRefinement.test.ts')
          text = test.read_text(encoding='utf-8')
          old = "  const operators = [...voice.operators] as Dx7Voice['operators']\n"
          new = "  const operators = [...voice.operators] as [...Dx7Voice['operators']]\n"
          if old not in text and new not in text:
              raise SystemExit('mutable operator tuple anchor not found')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - name: Run complete software gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/cma-integration-gate.txt
          run_stage() {
            local name="$1"; shift
            echo "=== ${name} ===" | tee -a /tmp/cma-integration-gate.txt
            "$@" 2>&1 | tee -a /tmp/cma-integration-gate.txt
            local code=${PIPESTATUS[0]}
            echo "${name}=${code}" >> "$GITHUB_OUTPUT"
            return 0
          }
          run_stage audit npm run audit:virtual-dx7
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused npm test -- src/audio/dx7CmaEs.test.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.test.tsx src/audio/compactPresetIndex.test.ts
          run_stage test npm run test
          run_stage build npm run build
          if [ "$(grep -E '^(audit|typecheck|lint|focused|test|build)=' "$GITHUB_OUTPUT" | grep -vc '=0$')" -eq 0 ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage tested source and capture tree identity
        id: tree
        shell: bash
        run: |
          git add src/audio/dx7CmaEs.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.tsx
          echo "sha=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - name: Persist receipts and keep source only on success
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
          TREE_SHA: ${{ steps.tree.outputs.sha }}
        shell: python
        run: |
          import os
          from pathlib import Path
          ok = os.environ['OK'] == 'true'
          log = Path('/tmp/cma-integration-gate.txt').read_text(encoding='utf-8', errors='replace')
          table = [
              '| Stage | Exit |', '| --- | ---: |',
              f"| audit | {os.environ['AUDIT']} |",
              f"| typecheck | {os.environ['TYPECHECK']} |",
              f"| lint | {os.environ['LINT']} |",
              f"| focused | {os.environ['FOCUSED']} |",
              f"| full tests | {os.environ['TEST']} |",
              f"| build | {os.environ['BUILD']} |",
          ]
          common = [
              f"Validated Git tree: `{os.environ['TREE_SHA']}`",
              '',
              f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",
              '', *table, '',
          ]
          Path('docs/validation/dx7-cma-es-core.md').write_text('\n'.join([
              '# Constrained seeded DX7 CMA-ES core', '', *common,
              'The repository-owned separable CMA-ES is seeded, bounded and cancellable. The default production search group mutates six operator output levels plus feedback only, keeps legal semantic ranges, evaluates candidates sequentially for repeatability, and drops stale raw source provenance when semantic parameters change.', '',
              'The core alone does not claim reconstruction quality or physical FM-1 equivalence.', '',
              '```text', log[-12000:], '```', ''
          ]), encoding='utf-8')
          Path('docs/validation/dx7-renderer-refinement.md').write_text('\n'.join([
              '# Renderer-backed constrained DX7 refinement', '', *common,
              'The refinement objective renders semantic candidates through the accepted deterministic MSFA offline engine, computes the same compact descriptor fingerprint used by nearest-preset retrieval, and minimizes the weighted fingerprint distance. Persistent local fingerprint caching may bypass duplicate renders.', '',
              'Multi-start refinement begins only from explicit retrieved candidates; it never auto-loads or sends a patch to hardware.', '',
              '```text', log[-12000:], '```', ''
          ]), encoding='utf-8')
          Path('docs/validation/dx7-cma-es-ui-software.md').write_text('\n'.join([
              '# Renderer-backed CMA-ES retrieval UI software gate', '', *common,
              'The mounted Audio → FM nearest-preset panel exposes CMA-ES as a separate explicit second stage over up to the top three retrieved voices. Production defaults use seed 2026, eight candidates for eight generations and the seven-dimensional output-level/feedback search group.', '',
              'Retrieval results remain visible while refinement runs. Progress/cancel are explicit, and refined Audition / Load actions remain separate from hardware transmission.', '',
              'Chrome/Edge execution is still required before the roadmap item closes.', '',
              '```text', log[-16000:], '```', ''
          ]), encoding='utf-8')
          if not ok:
              # Keep the already-committed panel visible for diagnosis, but do not retain the unvalidated strict-TS source edits.
              import subprocess
              subprocess.run(['git', 'checkout', '--', 'src/audio/dx7CmaEs.ts', 'src/audio/dx7CmaEsRefinement.test.ts'], check=True)
          Path('.github/workflows/validate-cma-refinement-integration.yml').unlink(missing_ok=True)
      - name: Commit evidence and validated fixes
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record CMA-ES integration gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
