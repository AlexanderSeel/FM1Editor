name: Package audited virtual DX7 engine

on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-msfa-engine.yml']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Prepare audited derived source
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git init "$RUNNER_TEMP/dexed"
            git -C "$RUNNER_TEMP/dexed" remote add origin https://github.com/asb2m10/dexed.git
            git -C "$RUNNER_TEMP/dexed" fetch --depth 1 origin 2e182b3db85c09083ab13c8b9b00565ce7d9ff85
            git -C "$RUNNER_TEMP/dexed" checkout --detach FETCH_HEAD
            npm run audit:virtual-dx7 -- --source-root "$RUNNER_TEMP/dexed" --require-hashes
            node scripts/materialize-msfa-spike.mjs --source-root "$RUNNER_TEMP/dexed" --output-root "$RUNNER_TEMP/materialized"
            node scripts/prepare-msfa-distribution.mjs \
              --source-root "$RUNNER_TEMP/materialized/msfa" \
              --manifest "$RUNNER_TEMP/derived-manifest.json"
          } 2>&1 | tee "$RUNNER_TEMP/source.log"
      - name: Rebuild accepted WASM
        id: wasm
        if: steps.source.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker pull emscripten/emsdk:4.0.7 >/dev/null
          docker image inspect emscripten/emsdk:4.0.7 --format '{{index .RepoDigests 0}}' | tee "$RUNNER_TEMP/emsdk-digest.txt"
          docker run --rm -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD" emscripten/emsdk:4.0.7 \
            bash scripts/build-msfa-spike.sh "$RUNNER_TEMP/materialized" "$RUNNER_TEMP/wasm" wasm 2>&1 | tee "$RUNNER_TEMP/wasm.log"
          echo '2f39f43d45fc4be075e0bc7ca4be76fb662372da1690c5db067cb565bb65b331  expected.wasm' > "$RUNNER_TEMP/expected.sha"
          actual=$(sha256sum "$RUNNER_TEMP/wasm/fm1-msfa.wasm" | awk '{print $1}')
          test "$actual" = '2f39f43d45fc4be075e0bc7ca4be76fb662372da1690c5db067cb565bb65b331'
      - name: Assemble distributable package
        id: assemble
        if: steps.wasm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/msfa public/virtual-dx7
          mkdir -p third_party/msfa/src third_party/msfa/toolchain public/virtual-dx7/licenses
          cp -R "$RUNNER_TEMP/materialized/msfa/." third_party/msfa/src/
          cp "$RUNNER_TEMP/derived-manifest.json" third_party/msfa/manifest.json
          cp "$RUNNER_TEMP/wasm/fm1-msfa.wasm" public/virtual-dx7/fm1-msfa.wasm
          cp "$RUNNER_TEMP/wasm/fm1-msfa.mjs" public/virtual-dx7/fm1-msfa.mjs

          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://www.apache.org/licenses/LICENSE-2.0.txt -o third_party/msfa/LICENSE
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://raw.githubusercontent.com/emscripten-core/emscripten/4.0.7/LICENSE -o third_party/msfa/toolchain/EMSCRIPTEN-LICENSE
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://raw.githubusercontent.com/emscripten-core/emscripten/4.0.7/system/lib/libc/musl/COPYRIGHT -o third_party/msfa/toolchain/MUSL-COPYRIGHT
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://raw.githubusercontent.com/emscripten-core/emscripten/4.0.7/system/lib/compiler-rt/LICENSE.TXT -o third_party/msfa/toolchain/LLVM-COMPILER-RT-LICENSE
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://raw.githubusercontent.com/emscripten-core/emscripten/4.0.7/system/lib/libcxx/LICENSE.TXT -o third_party/msfa/toolchain/LLVM-LIBCXX-LICENSE

          grep -q 'Apache License' third_party/msfa/LICENSE
          grep -q 'Version 2.0' third_party/msfa/LICENSE
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            'third_party/msfa/toolchain/EMSCRIPTEN-LICENSE':'70cabe388d27da221bd769c50b427a35354f4f1d',
            'third_party/msfa/toolchain/MUSL-COPYRIGHT':'c1628e9ac84f927fe791124ec172fb61c760bb9b',
            'third_party/msfa/toolchain/LLVM-COMPILER-RT-LICENSE':'5a79a1b9d5cb0af9a779751f07033e44ca3b14d8',
            'third_party/msfa/toolchain/LLVM-LIBCXX-LICENSE':'e159d283443f92ac78b964d2bccebe8f95d5d445',
          }
          for name,want in expected.items():
            b=Path(name).read_bytes(); got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
            if got != want: raise SystemExit(f'{name}: pinned Git blob mismatch {got} != {want}')
          PY

          cat > third_party/msfa/NOTICE.md <<'EOF'
          # FM1 Editor MSFA-compatible core notices

          This package contains a narrowly selected and modified subset of the MSFA sound engine as present in `asb2m10/dexed` commit `2e182b3db85c09083ab13c8b9b00565ce7d9ff85`.

          The included MSFA source files retain their original copyright and Apache-2.0 headers. Five derived files carry prominent FM1 Editor modification notices. The exact upstream and derived hashes and modifications are recorded in `manifest.json`.

          FM1 Editor excludes the complete Dexed GPL-3.0 application/plugin wrapper, JUCE, MTS-ESP, the external tuning library, Dexed effects/UI/assets/cartridges and third-party patch banks from this package. The browser engine is standard-12-TET only at this stage.

          No `NOTICE` or `NOTICE.txt` file was present at the reviewed Dexed repository root or the reviewed original Google `music-synthesizer-for-android` repository root. This file therefore records FM1 Editor's provenance and modifications rather than inventing upstream NOTICE text.

          Browser artifacts are built with Emscripten 4.0.7. Toolchain license material retained for the generated runtime/support code is stored under `toolchain/` and is also published beside the browser artifact.

          The virtual result is a DX7-compatible dry renderer. It is not a claim of physical Yamaha DX7 or M-VAVE FM-1 equivalence.
          EOF

          cp third_party/msfa/LICENSE public/virtual-dx7/licenses/MSFA-APACHE-2.0.txt
          cp third_party/msfa/NOTICE.md public/virtual-dx7/NOTICE.md
          cp third_party/msfa/toolchain/EMSCRIPTEN-LICENSE public/virtual-dx7/licenses/EMSCRIPTEN-LICENSE
          cp third_party/msfa/toolchain/MUSL-COPYRIGHT public/virtual-dx7/licenses/MUSL-COPYRIGHT
          cp third_party/msfa/toolchain/LLVM-COMPILER-RT-LICENSE public/virtual-dx7/licenses/LLVM-COMPILER-RT-LICENSE
          cp third_party/msfa/toolchain/LLVM-LIBCXX-LICENSE public/virtual-dx7/licenses/LLVM-LIBCXX-LICENSE

          ! grep -R -n -E '(\.\./Dexed\.h|libMTSClient\.h|Tunings\.h|juce_)' third_party/msfa/src
          test "$(find third_party/msfa/src -type f | wc -l)" -eq 23
      - name: Generate browser artifact manifest
        id: manifest
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          source=json.loads(Path('third_party/msfa/manifest.json').read_text())
          license_sha=sha('third_party/msfa/LICENSE')
          digest=Path(os.environ['RUNNER_TEMP'],'emsdk-digest.txt').read_text().strip()
          artifact={
            'schemaVersion':1,
            'engineId':'fm1-editor-msfa-compatible',
            'engineVersion':'msfa-2e182b3-fm1-v1',
            'label':'DX7-compatible dry renderer',
            'licenseSpdx':'Apache-2.0',
            'upstream':source['upstream'],
            'emscripten':{'version':'4.0.7','imageDigest':digest},
            'wasm':{'path':'fm1-msfa.wasm','sha256':sha('public/virtual-dx7/fm1-msfa.wasm')},
            'glue':{'path':'fm1-msfa.mjs','sha256':sha('public/virtual-dx7/fm1-msfa.mjs')},
            'acceptedReferencePcmSha256':'313be5ffcb29436e92ecce45b5e1002c72dd810c6999379844b82ce87a18cfc2',
            'sourceManifestSha256':sha('third_party/msfa/manifest.json'),
            'apacheLicenseSha256':license_sha,
            'limitations':['standard-12-TET only','sample-and-hold LFO seed policy not yet integrated','dry engine only','not physical-device validation'],
          }
          if artifact['wasm']['sha256'] != '2f39f43d45fc4be075e0bc7ca4be76fb662372da1690c5db067cb565bb65b331':
            raise SystemExit('distributed WASM does not match accepted feasibility hash')
          Path('public/virtual-dx7/manifest.json').write_text(json.dumps(artifact,indent=2)+'\n')
          PY
      - id: typecheck
        if: steps.install.outcome == 'success' && steps.manifest.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck
      - id: lint
        if: steps.install.outcome == 'success' && steps.manifest.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - id: tests
        if: steps.install.outcome == 'success' && steps.manifest.outcome == 'success'
        continue-on-error: true
        run: npm run test
      - id: build
        if: steps.install.outcome == 'success' && steps.manifest.outcome == 'success'
        continue-on-error: true
        run: npm run build
      - name: Record receipt and self-clean
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          WASM: ${{ steps.wasm.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys=['SOURCE','WASM','ASSEMBLE','MANIFEST','TYPECHECK','LINT','TESTS','BUILD']
          results={k.lower():os.environ[k] for k in keys}; ok=all(v=='success' for v in results.values())
          lines=['# MSFA browser distribution package','',f"Packaging source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall package gate: **{'SUCCESS' if ok else 'FAILED'}**",'', '| Check | Result |','| --- | --- |']
          lines += [f"| {k} | **{v.upper()}** |" for k,v in results.items()]
          if Path('public/virtual-dx7/manifest.json').exists():
            m=json.loads(Path('public/virtual-dx7/manifest.json').read_text())
            lines += ['', '## Published identity','',f"- Engine: `{m['engineId']}` / `{m['engineVersion']}`",f"- WASM SHA-256: `{m['wasm']['sha256']}`",f"- Glue SHA-256: `{m['glue']['sha256']}`",f"- Source manifest SHA-256: `{m['sourceManifestSha256']}`",f"- Apache license SHA-256: `{m['apacheLicenseSha256']}`",f"- Emscripten image: `{m['emscripten']['imageDigest']}`"]
          lines += ['', 'The package contains only the audited Apache-2.0 MSFA-compatible source closure plus FM1 Editor-owned bridge/build files. Modified source files are marked, the complete source/provenance manifest is retained, and the hosted browser artifact carries MSFA and toolchain license material.', '', 'No AudioWorklet or physical-device validation is claimed. The normal CI workflow remains read-only; this temporary packaging workflow removes itself in the result commit.']
          Path('docs/validation/msfa-distribution-package.md').write_text('\n'.join(lines)+'\n')
          Path('.github/workflows/package-msfa-engine.yml').unlink(missing_ok=True)
          PY
      - name: Commit package, receipt and cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat(audio): package audited virtual DX7 engine'
          git pull --rebase origin main
          git push origin HEAD:main
