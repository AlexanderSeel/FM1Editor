name: Validate local sequence UI browser route

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-local-sequence-ui-browser.yml']

permissions:
  contents: write

concurrency:
  group: validate-local-sequence-ui-browser
  cancel-in-progress: false

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: node --check scripts/test-local-sequence-ui-browser.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  browser:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Execute mounted local sequence UI
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          if ($env:BROWSER_NAME -eq 'chrome') {
            $candidates=@("$env:ProgramFiles\Google\Chrome\Application\chrome.exe","${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          } else {
            $candidates=@("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe")
          }
          $browser=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $result="local-sequence-ui-$env:BROWSER_NAME.json"
          if(-not $browser){ @{ok=$false;browserName=$env:BROWSER_NAME;error='browser executable missing'} | ConvertTo-Json | Set-Content -Encoding utf8 $result; exit 1 }
          node scripts/test-local-sequence-ui-browser.mjs --browser-executable "$browser" --browser-name "$env:BROWSER_NAME" --result "$result"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-sequence-ui-${{ matrix.browser }}
          path: local-sequence-ui-${{ matrix.browser }}.json
          if-no-files-found: error

  record:
    if: always()
    needs: [software,browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: local-sequence-ui-*
          path: browser-results
          merge-multiple: true
      - name: Record UI acceptance and self-clean
        env:
          SOFTWARE_RESULT: ${{ needs.software.result }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          software_ok=os.environ.get('SOFTWARE_RESULT')=='success'
          results=[]
          for name in ['chrome','edge']:
              p=Path('browser-results')/f'local-sequence-ui-{name}.json'
              if p.exists():
                  try:d=json.loads(p.read_text(encoding='utf-8-sig'))
                  except Exception as exc:d={'ok':False,'browserName':name,'error':f'invalid result: {exc}'}
              else:d={'ok':False,'browserName':name,'error':'result missing'}
              results.append(d)
          browser_ok=all(bool(d.get('ok')) and d.get('workletNodeCount')==1 and isinstance(d.get('activePeak'),(int,float)) and d.get('activePeak')>1e-6 and isinstance(d.get('silencePeak'),(int,float)) and d.get('silencePeak')<1e-4 and not d.get('errors') and not d.get('rejections') for d in results)
          ok=software_ok and browser_ok
          lines=['# Local sequence audio real-browser UI acceptance','',f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall UI route gate: **{'SUCCESS' if ok else 'FAILED'}**",'',f"- Same-commit software suite: **{'SUCCESS' if software_ok else 'FAILED'}**",f"- Branded Chrome/Edge mounted UI: **{'SUCCESS' if browser_ok else 'FAILED'}**",'', '| Browser | Result | Version | Worklet nodes | Active peak | Silence peak |','| --- | --- | --- | ---: | ---: | ---: |']
          for d in results: lines.append(f"| {d.get('browserName','?')} | **{'SUCCESS' if d.get('ok') else 'FAILURE'}** | {d.get('browserProduct','n/a')} | {d.get('workletNodeCount','n/a')} | {d.get('activePeak','n/a')} | {d.get('silencePeak','n/a')} |")
          lines += ['', '## Acceptance scope','', '- Loads the production build, switches to the persistent Sequencer workspace and operates the mounted **Local sequence audio** controls through DOM clicks.', '- Verifies explicit local-audio activation creates exactly one worklet node for the route.', '- Connects a zero-gain analyser branch to that actual UI-created worklet, requires non-silent PCM during **Play local**, then requires silence after **Stop local**.', '- Requires no window errors or unhandled rejections in the browser run.', '- Hardware MIDI controls are not clicked and no MIDI output is required.', '- External MIDI-clock local playback remains intentionally unsupported and is not claimed by this gate.', '- Headless/muted CI validates graph execution, not audible physical-device output.']
          for d in results: lines += ['',f"## {d.get('browserName','browser')}",'```json',json.dumps(d,indent=2),'```']
          Path('docs/validation/local-sequence-ui-browser.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/validate-local-sequence-ui-browser.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record local sequence UI browser acceptance'
          git pull --rebase origin main
          git push origin HEAD:main
