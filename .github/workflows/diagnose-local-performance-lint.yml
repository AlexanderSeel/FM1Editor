name: Diagnose local performance lint

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-local-performance-lint.yml']

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture lint output
        shell: bash
        run: |
          mkdir -p .tmp
          npm run lint > .tmp/lint.log 2>&1 || true
          cat .tmp/lint.log
      - name: Record lint output and self-clean
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log=Path('.tmp/lint.log').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/local-performance-lint-diagnostic.md').write_text('\n'.join([
            '# Local performance preview lint diagnostic','',
            f"Diagnostic source commit: `{os.environ['GITHUB_SHA']}`",'',
            '```text',log[-12000:],'```'
          ])+'\n',encoding='utf-8')
          Path('.github/workflows/diagnose-local-performance-lint.yml').unlink(missing_ok=True)
          PY
      - name: Commit diagnostic and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record local performance lint diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
