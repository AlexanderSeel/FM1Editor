name: Validate physical evidence package helper

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-physical-evidence-package.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run evidence package software acceptance
        shell: bash
        run: |
          set +e
          : > validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "validation-$name.log" 2>&1
            code=$?
            cat "validation-$name.log"
            echo "$name=$code" >> validation-stage-codes.txt
          }
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused-package npm test -- src/validation/physicalEvidencePackage.test.ts
          run_stage focused-hardware npm test -- src/validation/hardwareEvidence.test.ts
          run_stage focused-delivery npm test -- src/validation/fm1DeliveryEvidence.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist exact-head receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os

          codes = {}
          p = Path('validation-stage-codes.txt')
          if p.exists():
              for line in p.read_text(encoding='utf-8').splitlines():
                  if '=' not in line:
                      continue
                  name, value = line.split('=', 1)
                  try:
                      codes[name] = int(value)
                  except ValueError:
                      codes[name] = 999

          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'focused-package', 'focused-hardware', 'focused-delivery', 'full-test', 'build']
          ok = all(codes.get(stage) == 0 for stage in stages)
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]
          failures = []
          if not ok:
              for stage in stages:
                  if codes.get(stage) == 0:
                      continue
                  log = Path(f'validation-{stage}.log')
                  text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'log missing'
                  failures.extend(['', f'## {stage} failure tail', '', '```text', text[-16000:], '```'])

          Path('docs/validation/physical-evidence-package-acceptance.md').write_text('\n'.join([
              '# Physical evidence package helper software acceptance',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              *rows,
              '',
              'The accepted state contains the local-only physical evidence package helper, SHA-256 artifact indexing/classification, duplicate-content review, target-aware coverage warnings, documentation and PLAN linkage. The 2026-08-08 provider review also remains conservative: no additional patch provider was admitted without explicit compatible patch-data rights and stable machine-readable access.',
              '',
              'The exported package index contains metadata/hashes only and does not embed raw MIDI, SysEx, WAV, screenshots or parsed JSON payloads. Package completeness never converts physical observations into PASS states and does not close hardware-dependent PLAN items.',
              *failures,
              '',
          ]), encoding='utf-8')

          Path('.github/workflows/validate-physical-evidence-package.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'):
              path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(validation): record physical evidence package acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
