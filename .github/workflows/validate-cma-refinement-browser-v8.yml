name: Validate CMA refinement browsers v8

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-cma-refinement-browser-v8.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check scripts/test-cma-refinement-browser-v3.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge
        shell: pwsh
        run: |
          Remove-Item cma-refinement-chrome.json,cma-refinement-edge.json -Force -ErrorAction SilentlyContinue
          $pfx=${env:ProgramFiles(x86)}
          $chrome=@((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'),(Join-Path $pfx 'Google\Chrome\Application\chrome.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          $edge=@((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'),(Join-Path $pfx 'Microsoft\Edge\Application\msedge.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          if(-not $chrome){throw 'Chrome not found'};if(-not $edge){throw 'Edge not found'}
          function Run($exe,$name,$result){$code=1;for($i=1;$i -le 2;$i++){Remove-Item $result -Force -ErrorAction SilentlyContinue;node scripts/test-cma-refinement-browser-v3.mjs --browser-executable $exe --browser-name $name --result $result;$code=$LASTEXITCODE;if($code -eq 0){break};Start-Sleep -Seconds 1};if(-not(Test-Path $result)){@{ok=$false;browserName=$name;error="runner exited $code without result file"}|ConvertTo-Json|Set-Content -Encoding utf8 $result}}
          Run $chrome 'chrome' 'cma-refinement-chrome.json';Run $edge 'edge' 'cma-refinement-edge.json';exit 0
      - name: Persist receipt
        if: always()
        shell: pwsh
        run: |
          @'
          import json,os
          from pathlib import Path
          def read(p):
            q=Path(p)
            if not q.exists():return {'ok':False,'error':'result missing'}
            try:return json.loads(q.read_text(encoding='utf-8-sig'))
            except Exception as e:return {'ok':False,'error':f'invalid result: {e}'}
          c,e=read('cma-refinement-chrome.json'),read('cma-refinement-edge.json');ok=bool(c.get('ok')) and bool(e.get('ok'))
          def row(n,d):
            if not d.get('ok'):return f"| {n} | FAILED | — | — | — | — | {d.get('error','unknown')} |"
            imp=sum(1 for a,b in d.get('distancePairs',[]) if b<a-1e-6)
            return f"| {n} | {d.get('browserProduct')} | {d.get('refinedCount')} | {imp} | {float(d.get('auditionPeak',0)):.8f} | {d.get('midiRequests')} | PASS |"
          Path('docs/validation/dx7-cma-es-browser.md').write_text('\n'.join(['# Renderer-backed CMA-ES browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'','| Browser | Product | Refined candidates | Improved starts | Refined audition peak | Web MIDI requests | Result |','| --- | --- | ---: | ---: | ---: | ---: | --- |',row('Chrome',c),row('Edge',e),'','This clean run starts from a software-green head, prepares a local reference, performs Quick-scan retrieval and explicit seeded constrained CMA-ES refinement, validates structural numeric distances, refined dry audition PCM, explicit-only load, zero Web MIDI and no external/write fetches.','','Transient result JSON is ignored and removed. No exact source-recovery or physical FM-1 equivalence is claimed.','']),encoding='utf-8')
          if ok:
            p=Path('PLAN.md');t=p.read_text(encoding='utf-8');old='- [ ] Implement cancellable, repeatable evolutionary/CMA-ES refinement starting from the best catalog candidates and operating only on legal semantic `Dx7Voice` fields; begin with constrained parameter groups before attempting the full search space.';new='- [x] Implement cancellable, repeatable seeded CMA-ES refinement starting from the best retrieved catalog candidates and operating only on legal semantic `Dx7Voice` fields, initially constrained to six operator output levels plus feedback. The objective uses the accepted deterministic local renderer and compact fingerprint metric; progress/cancel and refined Audition/Load are explicit. Evidence: [`docs/validation/dx7-cma-es-core.md`](./docs/validation/dx7-cma-es-core.md), [`docs/validation/dx7-renderer-refinement.md`](./docs/validation/dx7-renderer-refinement.md), [`docs/validation/dx7-cma-es-ui-software.md`](./docs/validation/dx7-cma-es-ui-software.md) and [`docs/validation/dx7-cma-es-browser.md`](./docs/validation/dx7-cma-es-browser.md).'
            if old in t:t=t.replace(old,new,1)
            elif new not in t:raise SystemExit('CMA roadmap item not found')
            p.write_text(t,encoding='utf-8')
          for name in ('cma-refinement-chrome.json','cma-refinement-edge.json'):Path(name).unlink(missing_ok=True)
          Path('.github/workflows/validate-cma-refinement-browser-v8.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit evidence only
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(browser): validate CMA refinement from green head' || true;git pull --rebase origin main;git push origin HEAD:main
