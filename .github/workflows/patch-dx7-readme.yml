name: Document DX7 bulk workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-dx7-readme.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          content = path.read_text(encoding='utf-8')
          replacements = {
              'A TypeScript web editor and librarian for the **M-VAVE FM-1** pocket FM synthesizer.':
                  'A TypeScript web editor and librarian with separate, persistent target modes for the **M-VAVE FM-1** pocket FM synthesizer and a stock **Yamaha DX7**.',
              '- persisted MIDI port preferences with descriptor fallback when browser port IDs change;':
                  '- persisted device target selection plus per-target MIDI port preferences, descriptor fallback and non-binding FM-1/DX7 port-name suggestions;\n- target-routed safety boundaries that prevent FM-1 bank/effects operations from appearing in Yamaha DX7 mode;',
              '- Yamaha DX7-compatible 155-byte single-voice and 4,096-byte 32-voice bank codecs;':
                  '- Yamaha DX7-compatible 155-byte single-voice and 4,096-byte 32-voice bank codecs;\n- guarded stock-DX7 transmission of standard 163-byte single-voice and 4,104-byte 32-voice bank messages with matching-channel, System Info, Memory Protect and destructive-bank confirmations;',
              'See [`PLAN.md`](./PLAN.md) for unresolved work, [`docs/validation/ci-receipt.md`](./docs/validation/ci-receipt.md) for the general validation receipt and [`docs/validation/audio-recorder.md`](./docs/validation/audio-recorder.md) for the mocked-media recorder validation.':
                  'See [`PLAN.md`](./PLAN.md) for unresolved work, [`docs/validation/ci-receipt.md`](./docs/validation/ci-receipt.md) for the general validation receipt, [`docs/validation/audio-recorder.md`](./docs/validation/audio-recorder.md) for mocked-media recorder validation, [`docs/validation/target-capability-routing.md`](./docs/validation/target-capability-routing.md) for target routing, and [`docs/validation/dx7-bulk-transfer.md`](./docs/validation/dx7-bulk-transfer.md) for the guarded DX7 bulk-transfer gate.',
              '## Bank merge and virtual piano':
                  '''## Stock Yamaha DX7 target\n\nSelecting **Yamaha DX7** keeps file editing, the local library, audio recording and MIDI note audition available while hiding FM-1-only effects and bank/preset mapping. Device transmission is never automatic.\n\nThe DX7 audition panel supports two separately confirmed standard Yamaha receive operations:\n\n1. **Send current voice to edit buffer** transmits one channel-addressed 163-byte single-voice bulk message. It does not automatically store the voice in a numbered internal slot.\n2. **Overwrite DX7 with loaded 32-voice bank** transmits one channel-addressed 4,104-byte bank message and is treated as a destructive replacement of the complete internal bank.\n\nBoth controls require Web MIDI SysEx permission, a manually verified output, a matching DX7 MIDI channel, confirmation that System Info is available and confirmation that Memory Protect is off. The application sends all-notes-off before the bulk message and records the transfer in the MIDI monitor.\n\nVoice-parameter changes, function/performance data and programmatic dump requests remain disabled. No dump-request frame will be added unless an original Yamaha data-format source proves that the stock DX7 supports it; initiate outgoing dumps from the DX7 front panel meanwhile. Physical stock-DX7 reception remains unverified and must not be reported as passed until tested.\n\n## Bank merge and virtual piano''',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'Missing expected README text: {old}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(dx7): document guarded bulk transfer workflow"
          git push
