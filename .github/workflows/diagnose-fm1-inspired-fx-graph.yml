name: Record FM1-inspired FX validation result

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-fm1-inspired-fx-graph.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run and record gates
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1; TYPECHECK=$?
          npm run lint > /tmp/lint.log 2>&1; LINT=$?
          npm run test > /tmp/test.log 2>&1; TEST=$?
          npm run build > /tmp/build.log 2>&1; BUILD=$?
          export TYPECHECK LINT TEST BUILD
          python - <<'PY'
          import os
          from pathlib import Path

          values = {name: int(os.environ[name]) for name in ('TYPECHECK','LINT','TEST','BUILD')}
          success = all(value == 0 for value in values.values())
          lines = [
              '# FM1-inspired Web Audio effect graph validation',
              '',
              'Overall software gate: **' + ('SUCCESS' if success else 'FAILED') + '**',
              '',
              '| Stage | Exit code |',
              '| --- | ---: |',
          ]
          for name, value in values.items():
              lines.append(f'| {name.lower()} | {value} |')
          lines += [
              '',
              '## Boundary',
              '',
              '- The graph is an FM1 Editor software approximation and does not claim physical FM-1 DSP equivalence.',
              '- It reuses the existing 24 documented `Fm1FxState` values/ranges and does not change MIDI semantics.',
              '- Repository-owned routing is `filter → distortion → chorus → phaser → delay → reverb`.',
              '- Graph-level dry bypass is explicit and defaults to bypassed.',
              '- No third-party DSP dependency or impulse-response asset is added.',
              '',
          ]
          if not success:
              for name in ('typecheck','lint','test','build'):
                  log = Path(f'/tmp/{name}.log').read_text(errors='replace')
                  lines += [f'## {name} output', '```text', log[-12000:], '```', '']
          Path('docs/validation/fm1-inspired-fx-graph-software.md').write_text('\n'.join(lines), encoding='utf-8')

          if success:
              plan = Path('PLAN.md')
              text = plan.read_text(encoding='utf-8')
              old1 = '- [ ] Implement a separate FM-1-inspired effect graph for documented CC `0–23`: filter, reverb, delay, distortion, chorus and phaser, using native Web Audio and/or audited MIT-licensed Tone.js components.'
              new1 = '- [x] Implement a separate FM-1-inspired effect graph for documented CC `0–23`: filter, reverb, delay, distortion, chorus and phaser using native Web Audio, without adding a third-party DSP dependency. Evidence: [`docs/validation/fm1-inspired-fx-graph-software.md`](./docs/validation/fm1-inspired-fx-graph-software.md).'
              old2 = '- [ ] Reuse `Fm1FxState` and the documented value ranges, but keep dry bypass and clearly state that effect algorithms, internal scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware.'
              new2 = '- [x] Reuse `Fm1FxState` and the documented value ranges with explicit dry bypass and a repository-owned routing/scaling policy; clearly state that algorithms, internal scaling, routing order, stereo behavior and headroom are not known to match physical FM-1 firmware. Evidence: [`docs/validation/fm1-inspired-fx-graph-software.md`](./docs/validation/fm1-inspired-fx-graph-software.md).'
              if old1 not in text or old2 not in text:
                  raise SystemExit('Expected unresolved FX roadmap items were not found.')
              plan.write_text(text.replace(old1, new1).replace(old2, new2), encoding='utf-8')
          PY
          rm -f .github/workflows/validate-fm1-inspired-fx-graph.yml .github/workflows/diagnose-fm1-inspired-fx-graph.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A PLAN.md docs/validation/fm1-inspired-fx-graph-software.md .github/workflows
          git commit -m "test(audio): record FM1-inspired effect graph validation"
          git pull --rebase origin main
          git push origin main
