name: Reconcile Yamaha packed compatibility regressions

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-yamaha-compat-regressions.yml']

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile source and fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('src/sysex/normalizeLegacyVoice.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace('const detuneByte = packed[block * 17 + 16]', 'const detuneByte = packed[block * 17 + 12]', 1)
          text=text.replace('const detune = detuneByte & 0x0f', 'const detune = (detuneByte >> 3) & 0x0f', 1)
          path.write_text(text,encoding='utf-8')

          path=Path('src/sysex/normalizeLegacyVoice.test.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace('const op6DetuneOffset = 16', 'const op6DetuneOffset = 12', 1)
          text=text.replace('packed[op6DetuneOffset] = 0x3f', 'packed[op6DetuneOffset] = (15 << 3) | ((packed[op6DetuneOffset] ?? 0) & 0x07)', 1)
          path.write_text(text,encoding='utf-8')

          path=Path('src/sysex/syntheticFixtureCorpus.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace('legacyBank[6 + 16] = 0x7f', 'legacyBank[6 + 12] = (15 << 3) | ((legacyBank[6 + 12] ?? 0) & 0x07)', 1)
          path.write_text(text,encoding='utf-8')

          path=Path('src/sysex/dx7.property.test.ts')
          text=path.read_text(encoding='utf-8')
          old='''        packed[offset + 12] = (packed[offset + 12] ?? 0) | (((caseIndex + block) & 0x03) << 5)
        packed[offset + 14] = (packed[offset + 14] ?? 0) | (((caseIndex + block) & 0x01) << 6)
        packed[offset + 16] = (packed[offset + 16] ?? 0) | (((caseIndex + block) & 0x07) << 4)
'''
          new='''        packed[offset + 11] = (packed[offset + 11] ?? 0) | (((caseIndex + block) & 0x07) << 4)
        packed[offset + 13] = (packed[offset + 13] ?? 0) | (((caseIndex + block) & 0x03) << 5)
        packed[offset + 15] = (packed[offset + 15] ?? 0) | (((caseIndex + block) & 0x01) << 6)
'''
          if old not in text: raise SystemExit('packed reserved-bit property anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          path=Path('src/audio/referenceAudio.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace(
            'for (let index = 0; index < length; index += 1) mono[index] += (channel[index] ?? 0) / channels.length',
            'for (let index = 0; index < length; index += 1) mono[index] = (mono[index] ?? 0) + (channel[index] ?? 0) / channels.length',
            1,
          )
          path.write_text(text,encoding='utf-8')

          path=Path('src/sysex/dx7.test.ts')
          text=path.read_text(encoding='utf-8')
          text=text.replace('expect(packed[offset + 11] & 0x0f)', 'expect((packed[offset + 11] ?? 0) & 0x0f)', 1)
          text=text.replace('expect(packed[offset + 13] & 0x1f)', 'expect((packed[offset + 13] ?? 0) & 0x1f)', 1)
          text=text.replace('expect(packed[offset + 15] & 0x3f)', 'expect((packed[offset + 15] ?? 0) & 0x3f)', 1)
          path.write_text(text,encoding='utf-8')

          path=Path('src/library/storageMigration.test.ts')
          text=path.read_text(encoding='utf-8')
          old='''    const canonical = createInitializedVoice('CACHED PAD')
    canonical.operators[1] = {
      ...canonical.operators[1],
      keyboardScaling: {
        ...canonical.operators[1].keyboardScaling,
        rateScaling: 6,
      },
      amplitudeModulationSensitivity: 3,
      keyVelocitySensitivity: 5,
      outputLevel: 87,
      oscillatorMode: 'fixed',
      frequencyCoarse: 27,
      frequencyFine: 73,
      detune: 12,
    }

    const packed = encodePackedVoice(canonical)
'''
          new='''    const initialized = createInitializedVoice('CACHED PAD')
    const operators = initialized.operators.map((operator, index) => index === 1 ? {
      ...operator,
      keyboardScaling: { ...operator.keyboardScaling, rateScaling: 6 },
      amplitudeModulationSensitivity: 3,
      keyVelocitySensitivity: 5,
      outputLevel: 87,
      oscillatorMode: 'fixed' as const,
      frequencyCoarse: 27,
      frequencyFine: 73,
      detune: 12,
    } : operator) as unknown as Dx7Voice['operators']
    const canonical: Dx7Voice = { ...initialized, operators }

    const packed = encodePackedVoice(canonical)
'''
          if old not in text: raise SystemExit('storage migration readonly test anchor missing')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate corrected compatibility layer
        id: gate
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test -- src/sysex/dx7.test.ts src/sysex/dx7.property.test.ts src/sysex/normalizeLegacyVoice.test.ts src/sysex/syntheticFixtureCorpus.test.ts src/library/storageMigration.test.ts src/audio/localVoiceAudition.test.ts src/audio/libraryVoiceRender.integration.test.ts
          npm run test
          npm run build
      - name: Record receipt and remove transient workflows
        run: |
          cat > docs/validation/imported-bank-virtual-audio-repair.md <<EOF
          # Imported-bank virtual audio repair validation

          Validated source trigger: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          - Yamaha 128-byte packed operator mapping is corrected and covered by canonical byte-layout and generated property tests.
          - Compatibility normalization reads reserved packed detune from byte 12 bits 3–6 rather than fine-frequency byte 16.
          - Synthetic compatibility fixtures use the canonical reserved-bit locations.
          - Real tracked `sysexFinal.zip` bank voices render measurable PCM through packaged MSFA WASM.
          - IndexedDB schema v4 repairs old shifted semantic cache fields from retained raw packed bytes while preserving explicit edits.
          - Catalog audition arms local browser audio before asynchronous bank resolution.
          - Typecheck, lint, focused regressions, full Vitest suite and production build all passed.

          Browser PCM acceptance remains separate; no physical FM-1/DX7 claim is made.
          EOF
          rm -f .github/workflows/fix-yamaha-compat-regressions.yml
          rm -f .github/workflows/repair-library-virtual-audio.yml
          rm -f .github/workflows/repair-library-virtual-audio-v2.yml
      - name: Commit reconciled repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(sysex): reconcile canonical packed compatibility'
          git pull --rebase origin main
          git push origin HEAD:main
