name: Diagnose expanded renderer performance gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-expanded-renderer-performance.yml']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply structural performance metadata under validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/VirtualDx7PreviewPanel.tsx');t=p.read_text(encoding='utf-8')
          anchor="import { createVirtualFm1OutputRoute, VIRTUAL_FM1_LIMITER, VIRTUAL_FM1_MASTER_GAIN_DEFAULT_DB, VIRTUAL_FM1_MASTER_GAIN_MAX_DB, VIRTUAL_FM1_MASTER_GAIN_MIN_DB, type VirtualFm1OutputRoute } from '../audio/virtualFm1OutputRoute'\n"
          if 'VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS' not in t:
            if anchor not in t:raise SystemExit('performance import anchor missing')
            t=t.replace(anchor,anchor+"import { VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS } from '../audio/virtualFm1PerformanceLimits'\n",1)
          old='''      <div className="mt-4 grid gap-3 rounded-xl border border-white/10 bg-black/15 p-3 sm:grid-cols-2 lg:grid-cols-4" aria-label="Virtual FM-1 render diagnostics">\n'''
          new='''      <div\n        aria-label="Virtual FM-1 render diagnostics"\n        className="mt-4 grid gap-3 rounded-xl border border-white/10 bg-black/15 p-3 sm:grid-cols-2 lg:grid-cols-4"\n        data-callbacks={diagnostics?.callbacks ?? ''}\n        data-max-utilization={diagnostics?.maxUtilization ?? ''}\n        data-max-utilization-limit={VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS.maxUtilization}\n        data-mean-utilization={diagnostics?.meanUtilization ?? ''}\n        data-mean-utilization-limit={VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS.meanUtilization}\n        data-over-budget-callbacks={diagnostics?.overBudgetCallbacks ?? ''}\n        data-over-budget-limit={VIRTUAL_FM1_BROWSER_PERFORMANCE_LIMITS.overBudgetCallbacks}\n      >\n'''
          if 'data-max-utilization-limit' not in t:
            if old not in t:raise SystemExit('diagnostics root anchor missing')
            t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          r=Path('scripts/test-virtual-fm1-preview-browser.mjs');s=r.read_text(encoding='utf-8')
          old="""  const diagnosticsJson = await evaluate(cdp, `JSON.stringify({ errors:window.__fm1PreviewErrors,rejections:window.__fm1PreviewRejections,midiRequests:window.__fm1PreviewMidiRequests,fetches:window.__fm1PreviewFetches,downloads:window.__fm1PreviewDownloads,diagnosticsText:document.querySelector('[aria-label=\"Virtual FM-1 render diagnostics\"]')?.textContent??'' })`)\n  const diagnostics = JSON.parse(diagnosticsJson ?? '{}')\n"""
          new="""  const diagnosticsJson = await evaluate(cdp, `(() => { const root=document.querySelector('[aria-label=\"Virtual FM-1 render diagnostics\"]'); return JSON.stringify({ errors:window.__fm1PreviewErrors,rejections:window.__fm1PreviewRejections,midiRequests:window.__fm1PreviewMidiRequests,fetches:window.__fm1PreviewFetches,downloads:window.__fm1PreviewDownloads,diagnosticsText:root?.textContent??'',performance:root?{meanUtilization:Number(root.dataset.meanUtilization),maxUtilization:Number(root.dataset.maxUtilization),overBudgetCallbacks:Number(root.dataset.overBudgetCallbacks),callbacks:Number(root.dataset.callbacks),meanLimit:Number(root.dataset.meanUtilizationLimit),maxLimit:Number(root.dataset.maxUtilizationLimit),overBudgetLimit:Number(root.dataset.overBudgetLimit)}:null }); })()`)\n  const diagnostics = JSON.parse(diagnosticsJson ?? '{}')\n"""
          if 'meanUtilization:Number(root.dataset.meanUtilization)' not in s:
            if old not in s:raise SystemExit('browser diagnostics anchor missing')
            s=s.replace(old,new,1)
          midi="""  if (diagnostics.midiRequests !== 0) throw new Error(`Virtual FM-1 preview requested Web MIDI ${diagnostics.midiRequests} time(s)`)\n"""
          extra=midi+"""  const performanceSample = diagnostics.performance\n  if (!performanceSample || ![performanceSample.meanUtilization,performanceSample.maxUtilization,performanceSample.overBudgetCallbacks,performanceSample.callbacks,performanceSample.meanLimit,performanceSample.maxLimit,performanceSample.overBudgetLimit].every(Number.isFinite)) throw new Error(`Invalid structural performance diagnostics: ${JSON.stringify(performanceSample)}`)\n  if (!(performanceSample.callbacks > 0)) throw new Error(`Invalid diagnostic callback count: ${performanceSample.callbacks}`)\n  if (performanceSample.meanUtilization > performanceSample.meanLimit) throw new Error(`Mean render utilization ${(performanceSample.meanUtilization*100).toFixed(2)}% exceeds ${(performanceSample.meanLimit*100).toFixed(2)}%`)\n  if (performanceSample.maxUtilization > performanceSample.maxLimit) throw new Error(`Max render utilization ${(performanceSample.maxUtilization*100).toFixed(2)}% exceeds ${(performanceSample.maxLimit*100).toFixed(2)}%`)\n  if (performanceSample.overBudgetCallbacks > performanceSample.overBudgetLimit) throw new Error(`Over-budget callbacks ${performanceSample.overBudgetCallbacks} exceed ${performanceSample.overBudgetLimit}`)\n"""
          if 'Invalid structural performance diagnostics' not in s:
            if midi not in s:raise SystemExit('MIDI anchor missing')
            s=s.replace(midi,extra,1)
          old="""  const result = { ok:true,browserName,browserProduct:version.Browser??null,dryPeak,fxPeak,attenuatedPeak,referencePeak,currentBPeak,downloadCount:diagnostics.downloads.length,wavDetails,midiRequests:diagnostics.midiRequests,utilization,diagnosticsText:diagnostics.diagnosticsText }\n"""
          new="""  const result = { ok:true,browserName,browserProduct:version.Browser??null,dryPeak,fxPeak,attenuatedPeak,referencePeak,currentBPeak,downloadCount:diagnostics.downloads.length,wavDetails,midiRequests:diagnostics.midiRequests,utilization,performance:performanceSample,diagnosticsText:diagnostics.diagnosticsText }\n"""
          if 'performance:performanceSample' not in s:
            if old not in s:raise SystemExit('result anchor missing')
            s=s.replace(old,new,1)
          r.write_text(s,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting software gate
        id: gate
        shell: bash
        run: |
          set +e; : >/tmp/perf-gate.txt
          run_stage(){ local n="$1";shift;echo "=== $n ==="|tee -a /tmp/perf-gate.txt;"$@" 2>&1|tee -a /tmp/perf-gate.txt;local c=${PIPESTATUS[0]};echo "$n=$c" >> "$GITHUB_OUTPUT"; }
          run_stage syntax node --check scripts/test-virtual-fm1-preview-browser.mjs
          run_stage audit npm run audit:virtual-dx7
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused npm test -- src/audio/virtualDx7Engine.test.ts src/audio/msfaOfflineEngine.test.ts src/audio/virtualFm1WavRenderer.test.ts src/audio/fm1InspiredFxGraph.test.ts src/audio/fm1InspiredFxIsolation.test.ts src/audio/msfaAudioWorklet.test.ts src/audio/virtualFm1PerformanceLimits.test.ts src/components/VirtualDx7PreviewPanel.test.tsx
          run_stage test npm run test
          run_stage build npm run build
          if [ "$(grep -E '^(syntax|audit|typecheck|lint|focused|test|build)=' "$GITHUB_OUTPUT"|grep -vc '=0$')" -eq 0 ];then echo ok=true >> "$GITHUB_OUTPUT";else echo ok=false >> "$GITHUB_OUTPUT";fi
      - name: Persist result
        if: always()
        env:
          OK: ${{ steps.gate.outputs.ok }}
          SYNTAX: ${{ steps.gate.outputs.syntax }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        shell: python
        run: |
          import os,subprocess
          from pathlib import Path
          ok=os.environ.get('OK')=='true';log=Path('/tmp/perf-gate.txt').read_text(encoding='utf-8',errors='replace')
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {n} | {os.environ.get(k,"?")} |' for n,k in [('syntax','SYNTAX'),('audit','AUDIT'),('typecheck','TYPECHECK'),('lint','LINT'),('focused','FOCUSED'),('full tests','TEST'),('build','BUILD')]]
          Path('docs/validation/virtual-fm1-expanded-regression-software.md').write_text('\n'.join(['# Expanded Virtual FM-1 renderer regression software gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'','Performance policy: mean <= 5%, max <= 60%, zero callbacks over budget. Structural numeric metadata is exposed only for browser acceptance.','','```text',log[-18000:],'```','']),encoding='utf-8')
          if not ok:subprocess.run(['git','checkout','--','src/components/VirtualDx7PreviewPanel.tsx','scripts/test-virtual-fm1-preview-browser.mjs'],check=True)
          Path('.github/workflows/validate-expanded-renderer-performance.yml').unlink(missing_ok=True);Path('.github/workflows/diagnose-expanded-renderer-performance.yml').unlink(missing_ok=True)
      - name: Commit evidence and validated source
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(audio): record expanded renderer software gate' || true;git pull --rebase origin main;git push origin HEAD:main
