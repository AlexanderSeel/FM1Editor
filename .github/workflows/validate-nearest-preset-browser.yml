name: Validate nearest preset reconstruction in browsers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-nearest-preset-browser.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fix candidate-load wait expression and syntax-check runner
        shell: python
        run: |
          from pathlib import Path
          path=Path('scripts/test-nearest-preset-browser.mjs')
          text=path.read_text(encoding='utf-8')
          old='''  await clickButton(cdp, 'Load into editor', `${nearestRoot}.querySelector('article')`)\n  await waitForExpression(cdp, `(() => {\n    const current = (document.querySelector('.fm1-lcd-title')?.textContent ?? '').split(' ').filter(Boolean).join(' ');\n    const candidate = ${JSON.stringify('PLACEHOLDER')}; return current.length > 0 && current !== ${JSON.stringify('INITIAL_PLACEHOLDER')};\n  })()`.replace(${JSON.stringify('PLACEHOLDER')}, JSON.stringify(firstCandidateName.split(' ').filter(Boolean).join(' '))).replace(${JSON.stringify('INITIAL_PLACEHOLDER')}, JSON.stringify(initialVoiceTitle.split(' ').filter(Boolean).join(' '))), 15_000)\n'''
          new='''  await clickButton(cdp, 'Load into editor', `${nearestRoot}.querySelector('article')`)\n  const normalizedCandidateName = firstCandidateName.split(' ').filter(Boolean).join(' ')\n  await waitForExpression(cdp, `(() => {\n    const current = (document.querySelector('.fm1-lcd-title')?.textContent ?? '').split(' ').filter(Boolean).join(' ');\n    return current === ${JSON.stringify(normalizedCandidateName)};\n  })()`, 15_000)\n'''
          if old not in text:
              raise SystemExit('Nearest browser load-wait anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
      - run: node --check scripts/test-nearest-preset-browser.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Run Chrome and Edge nearest-preset acceptance with one retry
        shell: pwsh
        run: |
          $programFilesX86 = ${env:ProgramFiles(x86)}
          $chrome = @((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'), (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          $edge = @((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'), (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found' }
          if (-not $edge) { throw 'Edge not found' }
          function Run-Acceptance($exe, $name, $result) {
            $exitCode=1
            for ($attempt=1; $attempt -le 2; $attempt++) {
              node scripts/test-nearest-preset-browser.mjs --browser-executable $exe --browser-name $name --result $result
              $exitCode=$LASTEXITCODE
              if ($exitCode -eq 0) { break }
              Write-Host "$name attempt $attempt failed; retrying if available"
              Start-Sleep -Seconds 1
            }
            return $exitCode
          }
          $chromeExit=Run-Acceptance $chrome 'chrome' 'nearest-preset-chrome.json'
          $edgeExit=Run-Acceptance $edge 'edge' 'nearest-preset-edge.json'
          Write-Host "Chrome exit $chromeExit; Edge exit $edgeExit"
          exit 0
      - name: Persist browser evidence and PLAN status
        if: always()
        shell: pwsh
        run: |
          @'
          import json, os
          from pathlib import Path
          def read(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'ok':False,'error':'result missing'}
          chrome=read('nearest-preset-chrome.json'); edge=read('nearest-preset-edge.json')
          ok=bool(chrome.get('ok')) and bool(edge.get('ok'))
          def row(name,d):
              if not d.get('ok'):
                  return f"| {name} | FAILED | — | — | — | — | — | {d.get('error','unknown')} |"
              return f"| {name} | {d.get('browserProduct')} | {d.get('resultCount')} | {d.get('referencePeak'):.8f} | {d.get('candidatePeak'):.8f} | {d.get('midiRequests')} | {d.get('firstCandidateName')} | PASS |"
          Path('docs/validation/nearest-preset-browser.md').write_text('\n'.join([
            '# Nearest-preset reconstruction browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Browser | Product | Ranked results | Reference A peak | Candidate B peak | Web MIDI requests | Top candidate | Result |',
            '| --- | --- | ---: | ---: | ---: | ---: | --- | --- |',row('Chrome',chrome),row('Edge',edge),'',
            'The mounted Quick scan uses a generated local PCM16 A4 reference, up to 256 checksum-valid bundled catalog voices, the deterministic offline MSFA renderer and compact local fingerprint cache. Acceptance requires at least three ranked results, measurable reference A PCM, measurable dry candidate B AudioWorklet PCM, no implicit voice load during search/audition, an explicit Load into editor transition, zero Web MIDI requests and no external or write fetches.','',
            'Software/browser validation only; no physical FM-1/DX7 fidelity or transfer claim.',''
          ]),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md'); text=plan.read_text(encoding='utf-8')
              old='- [ ] Implement nearest-preset retrieval by rendering and indexing eligible voices from the existing DX7 catalog at standardized notes/velocities, then return several ranked candidates with dry A/B playback and explicit load actions.'
              new='- [x] Implement local nearest-preset retrieval over checksum-valid bundled DX7 voices using standardized deterministic probes, persistent compact fingerprints, several ranked candidates with metric breakdowns, reference-A / dry-candidate-B playback and a separate explicit editor-load action. Evidence: [`docs/validation/compact-preset-index-core.md`](./docs/validation/compact-preset-index-core.md), [`docs/validation/nearest-preset-ui-software.md`](./docs/validation/nearest-preset-ui-software.md) and [`docs/validation/nearest-preset-browser.md`](./docs/validation/nearest-preset-browser.md).'
              if old not in text:
                  raise SystemExit('Expected unresolved nearest-preset roadmap item not found')
              plan.write_text(text.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/validate-nearest-preset-browser.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit runner, evidence and roadmap state
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(browser): record nearest preset reconstruction acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
