name: Diagnose draggable envelope browser

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-draggable-envelope-browser.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run browser diagnostics
        shell: bash
        run: |
          mkdir -p artifacts docs/validation
          npm run preview -- --host 127.0.0.1 > /tmp/fm1-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          cat > artifacts/diagnose-envelopes.mjs <<'JS'
          import { chromium } from 'playwright'
          import { appendFile, writeFile } from 'node:fs/promises'

          const logPath = 'docs/validation/draggable-envelope-browser-diagnostics.md'
          await writeFile(logPath, '# Draggable envelope browser diagnostics\n\n')

          async function log(message) {
            await appendFile(logPath, `${message}\n`)
          }

          async function step(name, action) {
            try {
              const result = await action()
              await log(`- ${name}: **PASS**${result === undefined ? '' : ` — ${result}`}`)
              return true
            } catch (error) {
              await log(`- ${name}: **FAIL** — ${error instanceof Error ? error.stack ?? error.message : String(error)}`)
              return false
            }
          }

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } })
          page.on('console', (message) => void log(`  - browser console ${message.type()}: ${message.text()}`))
          page.on('pageerror', (error) => void log(`  - browser page error: ${error.stack ?? error.message}`))

          await step('open production preview', async () => {
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' })
            return page.url()
          })

          const pitchGraph = page.getByRole('group', { name: 'Pitch envelope draggable controls' })
          await step('locate pitch envelope group', async () => {
            await pitchGraph.waitFor({ timeout: 10_000 })
            return `slider count ${await pitchGraph.getByRole('slider').count()}`
          })

          const pitchRate = page.getByRole('slider', { name: 'Pitch envelope stage 1 rate' })
          const pitchRateNumeric = page.getByRole('slider', { name: 'Pitch rate 1' })
          await step('read initial pitch rate', async () => `graph ${await pitchRate.getAttribute('aria-valuenow')}, numeric ${await pitchRateNumeric.inputValue()}`)

          await step('drag pitch rate horizontally', async () => {
            const box = await pitchRate.boundingBox()
            if (!box) throw new Error('Pitch rate handle has no bounding box.')
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2)
            await page.mouse.down()
            await page.mouse.move(box.x + box.width / 2 + 48, box.y + box.height / 2, { steps: 8 })
            await page.mouse.up()
            return `graph ${await pitchRate.getAttribute('aria-valuenow')}, numeric ${await pitchRateNumeric.inputValue()}`
          })

          await step('undo pitch rate drag', async () => {
            const undo = page.getByRole('button', { name: 'Undo last editor change' })
            await undo.click()
            await page.waitForTimeout(100)
            return `graph ${await pitchRate.getAttribute('aria-valuenow')}, numeric ${await pitchRateNumeric.inputValue()}`
          })

          await step('keyboard Home and End on pitch rate', async () => {
            await pitchRate.focus()
            await page.keyboard.press('Home')
            const home = `${await pitchRate.getAttribute('aria-valuenow')}/${await pitchRateNumeric.inputValue()}`
            await page.keyboard.press('End')
            const end = `${await pitchRate.getAttribute('aria-valuenow')}/${await pitchRateNumeric.inputValue()}`
            return `Home ${home}, End ${end}`
          })

          const pitchLevel = page.getByRole('slider', { name: 'Pitch envelope stage 1 level' })
          const pitchLevelNumeric = page.getByRole('slider', { name: 'Pitch level 1' })
          await step('drag pitch level vertically', async () => {
            const box = await pitchLevel.boundingBox()
            if (!box) throw new Error('Pitch level handle has no bounding box.')
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2)
            await page.mouse.down()
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2 - 34, { steps: 8 })
            await page.mouse.up()
            return `graph ${await pitchLevel.getAttribute('aria-valuenow')}, numeric ${await pitchLevelNumeric.inputValue()}`
          })

          const operatorLevel = page.getByRole('slider', { name: 'Operator 1 amplitude envelope stage 1 level' })
          const operatorLevelNumeric = page.getByRole('slider', { name: 'Level 1', exact: true })
          await step('drag operator level vertically', async () => {
            const box = await operatorLevel.boundingBox()
            if (!box) throw new Error('Operator level handle has no bounding box.')
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2)
            await page.mouse.down()
            await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2 + 42, { steps: 8 })
            await page.mouse.up()
            return `graph ${await operatorLevel.getAttribute('aria-valuenow')}, numeric ${await operatorLevelNumeric.inputValue()}`
          })

          await step('capture browser screenshot', async () => {
            await page.screenshot({ path: 'artifacts/draggable-envelope-browser-diagnostics.png', fullPage: true })
          })

          await browser.close()
          JS
          node artifacts/diagnose-envelopes.mjs
          rm artifacts/diagnose-envelopes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: draggable-envelope-browser-diagnostics
          path: artifacts/draggable-envelope-browser-diagnostics.png
          if-no-files-found: warn
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/draggable-envelope-browser-diagnostics.md
          git commit -m 'chore(ci): record draggable envelope browser diagnostics'
          git push origin HEAD:main
