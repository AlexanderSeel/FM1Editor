name: Validate one-voice worklet software boundary

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-msfa-worklet-software.yml']

permissions:
  contents: write

concurrency:
  group: validate-msfa-worklet-software
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        continue-on-error: true
        shell: bash
        run: npm install --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: Validate packaged stateful artifact
        id: artifact
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-msfa-realtime-wasm.mjs \
            --module public/virtual-dx7/fm1-msfa.mjs \
            --patch native/virtual-dx7-spike/reference-patch-v1.hex \
            2>&1 | tee "$RUNNER_TEMP/artifact.log"
      - id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"
      - id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run test 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Record receipt and self-clean
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          checks = ['INSTALL','ARTIFACT','TYPECHECK','LINT','TESTS','BUILD']
          results = {name.lower(): os.environ[name] for name in checks}
          success = all(value == 'success' for value in results.values())

          def read(name):
              path = temp / name
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''

          def tail(name, count=80):
              lines = read(name).splitlines()
              return '\n'.join(lines[-count:])

          lines = [
              '# One-voice AudioWorklet software-boundary validation', '',
              f"Validated source commit: `{os.environ['GITHUB_SHA']}`", '',
              f"Overall software gate: **{'SUCCESS' if success else 'FAILED'}**", '',
              '| Check | Result |', '| --- | --- |',
          ]
          lines.extend(f"| {name} | **{value.upper()}** |" for name, value in results.items())
          lines.extend([
              '', '## Scope', '',
              '- Validates the TypeScript AudioWorklet controller, mocked browser lifecycle, local package verification, semantic voice routing and the actual packaged stateful WASM ABI.',
              '- The public worklet remains dry and one-voice only: two 64-frame engine blocks per standard 128-frame callback, note on/off, all-notes-off, zero-output fallback and disposal.',
              '- No Web MIDI, SysEx, effects or hardware-send path is introduced.',
              '- The controller package identity is aligned to `msfa-2e182b3-fm1-v3-stateful`, note validation rejects through the Promise API, and initialization has a bounded ready timeout.',
              '',
              'This is not browser AudioWorklet execution evidence. Chrome/Edge execution and soak remain separate required gates.',
              '',
              'The temporary workflow removes itself; normal CI remains read-only.',
          ])
          if not success:
              for check, filename in [
                  ('install','install.log'),('artifact','artifact.log'),('typecheck','typecheck.log'),
                  ('lint','lint.log'),('tests','tests.log'),('build','build.log')
              ]:
                  if results[check] != 'success':
                      lines.extend(['', f"## {check} failure log", '```text', tail(filename), '```'])
          else:
              artifact = tail('artifact.log', 10)
              if artifact:
                  lines.extend(['', '## Artifact regression', '```text', artifact, '```'])

          Path('docs/validation/msfa-audioworklet-software.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/validate-msfa-worklet-software.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt and cleanup
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record worklet software rerun'
          git pull --rebase origin main
          git push origin HEAD:main
