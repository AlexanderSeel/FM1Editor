name: Validate renderer-backed CMA-ES refinement in browsers v6

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-cma-refinement-browser-v6.yml']

permissions:
  contents: write

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build raw-metadata CMA runner
        shell: python
        run: |
          from pathlib import Path
          source=Path('scripts/test-cma-refinement-browser-v2.mjs'); target=Path('scripts/test-cma-refinement-browser-v3.mjs'); text=source.read_text(encoding='utf-8')
          start=text.find('  const distancePairs=await evaluate(cdp,')
          end=text.find('\n  const refinedRoot=',start)
          if start<0 or end<0: raise SystemExit('distance validation block missing')
          replacement="""  const rawDistanceMetadata=await evaluate(cdp,`[...${root}.querySelector('[aria-label=\"CMA-ES refined candidates\"]').querySelectorAll('article')].map((article)=>({initial:article.getAttribute('data-initial-distance'),best:article.getAttribute('data-best-distance'),text:article.textContent??''}))`)\n  if(!Array.isArray(rawDistanceMetadata)||rawDistanceMetadata.length<2) throw new Error(`Unable to read refined card metadata: ${JSON.stringify(rawDistanceMetadata)}`)\n  const distancePairs=rawDistanceMetadata.map((entry)=>[Number(entry.initial),Number(entry.best)])\n  if(distancePairs.some(([initial,best])=>!Number.isFinite(initial)||!Number.isFinite(best))) throw new Error(`Invalid refined distance metadata: ${JSON.stringify(rawDistanceMetadata)}`)\n  if(distancePairs.some(([initial,best])=>best>initial+1e-9)) throw new Error(`Refinement worsened a reported best distance: ${JSON.stringify(distancePairs)}`)\n  if(!distancePairs.some(([initial,best])=>best<initial-1e-6)) throw new Error(`No constrained refinement improved the retrieved starts: ${JSON.stringify(distancePairs)}`)\n"""
          text=text[:start]+replacement+text[end:]
          if 'rawDistanceMetadata' not in text: raise SystemExit('raw metadata patch missing')
          target.write_text(text,encoding='utf-8')
      - run: node --check scripts/test-cma-refinement-browser-v3.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Run branded browsers
        shell: pwsh
        run: |
          $pfx=${env:ProgramFiles(x86)}
          $chrome=@((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'),(Join-Path $pfx 'Google\Chrome\Application\chrome.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          $edge=@((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'),(Join-Path $pfx 'Microsoft\Edge\Application\msedge.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          if(-not $chrome){throw 'Chrome not found'};if(-not $edge){throw 'Edge not found'}
          function Run($exe,$name,$result){$code=1;for($i=1;$i -le 2;$i++){node scripts/test-cma-refinement-browser-v3.mjs --browser-executable $exe --browser-name $name --result $result;$code=$LASTEXITCODE;if($code -eq 0){break};Start-Sleep -Seconds 1};if(-not(Test-Path $result)){@{ok=$false;browserName=$name;error="runner exited $code without result file"}|ConvertTo-Json|Set-Content -Encoding utf8 $result}}
          Run $chrome 'chrome' 'cma-refinement-chrome.json';Run $edge 'edge' 'cma-refinement-edge.json';exit 0
      - name: Persist evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import json,os
          from pathlib import Path
          def read(p):
            q=Path(p)
            if not q.exists():return {'ok':False,'error':'result missing'}
            try:return json.loads(q.read_text(encoding='utf-8-sig'))
            except Exception as e:return {'ok':False,'error':f'invalid result: {e}'}
          c,e=read('cma-refinement-chrome.json'),read('cma-refinement-edge.json');ok=bool(c.get('ok')) and bool(e.get('ok'))
          def row(n,d):
            if not d.get('ok'):return f"| {n} | FAILED | — | — | — | — | {d.get('error','unknown')} |"
            imp=sum(1 for a,b in d.get('distancePairs',[]) if b<a-1e-6)
            return f"| {n} | {d.get('browserProduct')} | {d.get('refinedCount')} | {imp} | {float(d.get('auditionPeak',0)):.8f} | {d.get('midiRequests')} | PASS |"
          Path('docs/validation/dx7-cma-es-browser.md').write_text('\n'.join(['# Renderer-backed CMA-ES browser acceptance','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall browser gate: **{'SUCCESS' if ok else 'FAILED'}**",'','| Browser | Product | Refined candidates | Improved starts | Refined audition peak | Web MIDI requests | Result |','| --- | --- | ---: | ---: | ---: | ---: | --- |',row('Chrome',c),row('Edge',e),'','The mounted Audio → FM flow performs local reference preparation, Quick-scan retrieval and explicit seeded CMA-ES refinement. Raw structural distance metadata is returned over CDP and validated in the Node runner. Acceptance requires at least one improvement, measurable dry refined audition, no implicit editor load, explicit Load refined, zero Web MIDI requests and no external/write fetches.','','This validates local semantic optimization against the DX7-compatible renderer/fingerprint objective only; it does not claim exact source recovery or physical FM-1 equivalence.','']),encoding='utf-8')
          if ok:
            p=Path('PLAN.md');t=p.read_text(encoding='utf-8');old='- [ ] Implement cancellable, repeatable evolutionary/CMA-ES refinement starting from the best catalog candidates and operating only on legal semantic `Dx7Voice` fields; begin with constrained parameter groups before attempting the full search space.';new='- [x] Implement cancellable, repeatable seeded CMA-ES refinement starting from the best retrieved catalog candidates and operating only on legal semantic `Dx7Voice` fields, initially constrained to six operator output levels plus feedback. The objective uses the accepted deterministic local renderer and compact fingerprint metric; progress/cancel and refined Audition/Load are explicit. Evidence: [`docs/validation/dx7-cma-es-core.md`](./docs/validation/dx7-cma-es-core.md), [`docs/validation/dx7-renderer-refinement.md`](./docs/validation/dx7-renderer-refinement.md), [`docs/validation/dx7-cma-es-ui-software.md`](./docs/validation/dx7-cma-es-ui-software.md) and [`docs/validation/dx7-cma-es-browser.md`](./docs/validation/dx7-cma-es-browser.md).'
            if old in t:t=t.replace(old,new,1)
            elif new not in t:raise SystemExit('CMA roadmap item not found')
            p.write_text(t,encoding='utf-8')
          Path('.github/workflows/validate-cma-refinement-browser-v6.yml').unlink(missing_ok=True)
          '@ | python
      - name: Commit
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(browser): inspect CMA distance metadata externally' || true;git pull --rebase origin main;git push origin HEAD:main
