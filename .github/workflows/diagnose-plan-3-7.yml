name: Diagnose plan sections 3-7

on:
  push:
    branches: [main]
    paths:
      - docs/validation/.trigger-plan-3-7-diagnostics

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture compiler diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          mkdir -p docs/validation
          {
            echo '# Plan sections 3–7 TypeScript diagnostics'
            echo
            echo "Source commit: \`$GITHUB_SHA\`"
            echo
            echo '```text'
            cat /tmp/typecheck.log
            echo '```'
          } > docs/validation/plan-3-7-typecheck.md
          rm -f .github/workflows/diagnose-plan-3-7.yml docs/validation/.trigger-plan-3-7-diagnostics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ci): record plan TypeScript diagnostics"
          git push
          exit "$status"
