name: Validate current software and responsive browser gate v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-current-software-browser-gate-v3.yml']

permissions:
  contents: write

jobs:
  same-source:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run all software stages without short-circuiting receipt generation
        shell: pwsh
        run: |
          $results=[ordered]@{}
          function Stage([string]$name,[scriptblock]$command){Write-Host "=== $name ===";& $command;$results[$name]=$LASTEXITCODE}
          Stage 'auditVirtual' { npm run audit:virtual-dx7 }
          Stage 'auditResearch' { npm run audit:reconstruction-upstreams }
          Stage 'typecheck' { npm run typecheck }
          Stage 'lint' { npm run lint }
          Stage 'tests' { npm run test }
          Stage 'build' { npm run build }
          $results | ConvertTo-Json | Set-Content -Encoding utf8 software-gate.json
          exit 0
      - name: Validate target smoke syntax
        shell: pwsh
        run: node --check scripts/smoke-target-responsive.mjs
      - name: Execute four branded responsive matrices
        shell: pwsh
        run: |
          Remove-Item responsive-*.json -Force -ErrorAction SilentlyContinue
          $pfx=${env:ProgramFiles(x86)}
          $chrome=@((Join-Path $env:PROGRAMFILES 'Google\Chrome\Application\chrome.exe'),(Join-Path $pfx 'Google\Chrome\Application\chrome.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          $edge=@((Join-Path $env:PROGRAMFILES 'Microsoft\Edge\Application\msedge.exe'),(Join-Path $pfx 'Microsoft\Edge\Application\msedge.exe'))|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          if(-not $chrome){throw 'Chrome not found'};if(-not $edge){throw 'Edge not found'}
          function Run([string]$exe,[string]$browser,[string]$target){
            $result="responsive-$target-$browser.json";$code=1
            for($attempt=1;$attempt -le 2;$attempt++){
              Remove-Item $result -Force -ErrorAction SilentlyContinue
              node scripts/smoke-target-responsive.mjs --browser-executable $exe --browser-name $browser --target $target --result $result
              $code=$LASTEXITCODE
              if($code -eq 0){break}
              Start-Sleep -Seconds 1
            }
            if(-not(Test-Path $result)){@{ok=$false;browserName=$browser;target=$target;error="runner exited $code without result"}|ConvertTo-Json|Set-Content -Encoding utf8 $result}
          }
          Run $chrome 'chrome' 'fm1';Run $chrome 'chrome' 'dx7';Run $edge 'edge' 'fm1';Run $edge 'edge' 'dx7'
          exit 0
      - name: Persist permanent same-source evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import json,os
          from pathlib import Path
          def read(path,fallback):
              p=Path(path)
              if not p.exists():return fallback
              try:return json.loads(p.read_text(encoding='utf-8-sig'))
              except Exception as exc:return {**fallback,'error':f'invalid json: {exc}'}
          software=read('software-gate.json',{})
          stages=['auditVirtual','auditResearch','typecheck','lint','tests','build']
          software_ok=all(software.get(stage)==0 for stage in stages)
          matrices={(browser,target):read(f'responsive-{target}-{browser}.json',{'ok':False,'error':'result missing'}) for browser in ('chrome','edge') for target in ('fm1','dx7')}
          browser_ok=all(bool(value.get('ok')) for value in matrices.values())
          ok=software_ok and browser_ok
          rows=['| Software stage | Exit |','| --- | ---: |']+[f'| {stage} | {software.get(stage,"?")} |' for stage in stages]
          matrix=['| Browser | Target | Product | Desktop | Narrow | Mobile touch | MIDI requests | Result |','| --- | --- | --- | --- | --- | --- | ---: | --- |']
          for browser,target in [('chrome','fm1'),('chrome','dx7'),('edge','fm1'),('edge','dx7')]:
              value=matrices[(browser,target)]
              if not value.get('ok'):
                  matrix.append(f'| {browser} | {target.upper()} | FAILED | — | — | — | — | {value.get("error","unknown")} |')
                  continue
              names={item.get('viewport') for item in value.get('matrix',[])}
              matrix.append(f'| {browser} | {target.upper()} | {value.get("browserProduct")} | {"PASS" if "desktop" in names else "MISS"} | {"PASS" if "desktop-narrow" in names else "MISS"} | {"PASS" if "mobile-touch" in names else "MISS"} | {value.get("midiRequests",0)} | PASS |')
          Path('docs/validation/current-software-browser-gate.md').write_text('\n'.join(['# Current same-source software and responsive browser gate','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall gate: **{'SUCCESS' if ok else 'FAILED'}**",'',*rows,'',*matrix,'','All software checks and browser matrices ran from the same Windows checkout/build. The responsive matrix covers 1440×900, 1024×768 and 390×844 touch emulation for both FM-1 and DX7 target modes in branded Chrome and Edge. This is software/layout/browser evidence only and does not validate physical MIDI/audio hardware.','']),encoding='utf-8')
          if ok:
              plan=Path('PLAN.md');lines=plan.read_text(encoding='utf-8').splitlines();prefix='- [ ] Execute typecheck, lint, the full test suite, production build and the permanent Chrome/Edge FM-1 + DX7 responsive matrices successfully on the same source commit.';plan.write_text('\n'.join(line for line in lines if not line.startswith(prefix)).rstrip()+'\n',encoding='utf-8')
          for path in Path('.').glob('responsive-*.json'):path.unlink(missing_ok=True)
          Path('software-gate.json').unlink(missing_ok=True)
          for name in ('validate-current-software-browser-gate-v2.yml','validate-current-software-browser-gate-v3.yml'):
              Path('.github/workflows',name).unlink(missing_ok=True)
          '@ | python
      - name: Commit receipt only
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A;git commit -m 'test(browser): record corrected same-source responsive gate' || true;git pull --rebase origin main;git push origin HEAD:main
