name: Align DX7 workspace copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-dx7-workspace-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale target copy
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          content = path.read_text(encoding='utf-8')
          replacements = {
              'file editing, local recording and MIDI note audition; DX7 SysEx writes disabled':
                  'file editing, local recording, MIDI audition and guarded Yamaha voice/bank bulk transfer',
              "description={fm1Mode ? 'Whole-bank transfer, preset recall and virtual piano' : 'Standard MIDI note audition; DX7 SysEx operations remain disabled'}":
                  "description={fm1Mode ? 'Whole-bank transfer, preset recall and virtual piano' : 'Yamaha single-voice and 32-voice bulk transfer, plus virtual piano'}",
              "title={fm1Mode ? 'FM-1 bank audition' : 'DX7 note audition'}":
                  "title={fm1Mode ? 'FM-1 bank audition' : 'DX7 audition and bulk transfer'}",
              'DX7 SysEx transmission and hardware validation remain pending':
                  'DX7 parameter/function/dump operations and hardware validation remain pending',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'Missing expected text: {old}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
      - name: Commit aligned copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "docs(target): align DX7 workspace capability copy"
          git push
