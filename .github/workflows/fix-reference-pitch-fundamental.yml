name: Fix reference pitch fundamental selection

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-reference-pitch-fundamental.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prefer earliest strong autocorrelation peak
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/audio/referenceAudio.ts')
          text=path.read_text(encoding='utf-8')
          old='''  let bestLag = 0\n  let bestCorrelation = -Infinity\n  for (let lag = minimumLag; lag <= maximumLag; lag += 1) {\n    let correlation = 0\n    let energyA = 0\n    let energyB = 0\n    const count = analysisLength - lag\n    if (count <= 32) break\n    for (let index = 0; index < count; index += 1) {\n      const left = samples[index] ?? 0\n      const right = samples[index + lag] ?? 0\n      correlation += left * right\n      energyA += left * left\n      energyB += right * right\n    }\n    const denominator = Math.sqrt(energyA * energyB)\n    if (denominator <= 0) continue\n    const normalizedCorrelation = correlation / denominator\n    if (normalizedCorrelation > bestCorrelation) {\n      bestCorrelation = normalizedCorrelation\n      bestLag = lag\n    }\n  }\n  if (bestLag === 0 || bestCorrelation < 0.6) return null\n  return sampleRate / bestLag\n'''
          new='''  const correlations = new Float64Array(maximumLag + 1)\n  correlations.fill(Number.NEGATIVE_INFINITY)\n  let bestLag = 0\n  let bestCorrelation = -Infinity\n  for (let lag = minimumLag; lag <= maximumLag; lag += 1) {\n    let correlation = 0\n    let energyA = 0\n    let energyB = 0\n    const count = analysisLength - lag\n    if (count <= 32) break\n    for (let index = 0; index < count; index += 1) {\n      const left = samples[index] ?? 0\n      const right = samples[index + lag] ?? 0\n      correlation += left * right\n      energyA += left * left\n      energyB += right * right\n    }\n    const denominator = Math.sqrt(energyA * energyB)\n    if (denominator <= 0) continue\n    const normalizedCorrelation = correlation / denominator\n    correlations[lag] = normalizedCorrelation\n    if (normalizedCorrelation > bestCorrelation) {\n      bestCorrelation = normalizedCorrelation\n      bestLag = lag\n    }\n  }\n  if (bestLag === 0 || bestCorrelation < 0.6) return null\n\n  // Periodic signals can have virtually identical maxima at 2x, 3x, 4x...\n  // the fundamental period. PCM quantization can make a later multiple win by\n  // a tiny amount, which would report a subharmonic. Prefer the earliest local\n  // peak that is both strongly periodic and close to the global maximum.\n  const strongPeakThreshold = Math.max(0.6, bestCorrelation * 0.98)\n  for (let lag = minimumLag + 1; lag < maximumLag; lag += 1) {\n    const value = correlations[lag] ?? Number.NEGATIVE_INFINITY\n    if (value < strongPeakThreshold) continue\n    if (value >= (correlations[lag - 1] ?? Number.NEGATIVE_INFINITY)\n      && value >= (correlations[lag + 1] ?? Number.NEGATIVE_INFINITY)) {\n      return sampleRate / lag\n    }\n  }\n  return sampleRate / bestLag\n'''
          if old not in text: raise SystemExit('pitch estimator anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          test=Path('src/audio/referenceAudio.test.ts')
          content=test.read_text(encoding='utf-8')
          anchor="""  it('detects a stable synthetic pitch near A4', () => {\n    const detected = estimateReferencePitchHz(sine(440, 48_000, 0.5), 48_000)\n    expect(detected).not.toBeNull()\n    expect(detected ?? 0).toBeGreaterThan(436)\n    expect(detected ?? 0).toBeLessThan(444)\n  })\n"""
          addition=anchor+"""\n  it('keeps the fundamental for PCM16-like A4 with trimmed silence instead of selecting a subharmonic', () => {\n    const sampleRate = 48_000\n    const silenceFrames = Math.round(sampleRate * 0.1)\n    const tone = sine(440, sampleRate, 0.8, 0.25)\n    const channel = new Float32Array(silenceFrames + tone.length + silenceFrames)\n    for (let index = 0; index < tone.length; index += 1) {\n      const quantized = Math.round((tone[index] ?? 0) * 32767) / 32767\n      channel[silenceFrames + index] = quantized\n    }\n    const prepared = prepareReferenceAudio({\n      sampleRate,\n      durationSeconds: channel.length / sampleRate,\n      channels: [channel],\n    }, { trimSilence: true, normalize: true })\n    expect(prepared.detectedPitchHz).not.toBeNull()\n    expect(prepared.detectedPitchHz ?? 0).toBeGreaterThan(436)\n    expect(prepared.detectedPitchHz ?? 0).toBeLessThan(444)\n  })\n"""
          if 'keeps the fundamental for PCM16-like A4' not in content:
              if anchor not in content: raise SystemExit('reference pitch test anchor not found')
              content=content.replace(anchor,addition,1)
          test.write_text(content,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/referenceAudio.test.ts
      - run: npm run test
      - run: npm run build
      - name: Persist regression receipt
        run: |
          cat > docs/validation/reference-audio-pitch-fundamental.md <<EOF
          # Reference-audio fundamental pitch regression

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          The local autocorrelation estimator now records the correlation curve and selects the earliest strong local peak within 98% of the global maximum. This prevents later integer-period multiples from winning by tiny PCM-quantization differences and being reported as subharmonics.

          A regression reproduces the browser fixture: 440 Hz, PCM16-like quantization, 100 ms leading/trailing silence, local silence trimming and normalization. The detected pitch remains in the 436–444 Hz A4 range rather than the observed 109.98 Hz fourth-period subharmonic.

          Typecheck, lint, focused reference-audio tests, the full test suite and production build passed. This is a local analysis fix only; no hardware claim is made.
          EOF
          rm .github/workflows/fix-reference-pitch-fundamental.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(audio): prefer fundamental autocorrelation peak'
          git pull --rebase origin main
          git push origin HEAD:main
