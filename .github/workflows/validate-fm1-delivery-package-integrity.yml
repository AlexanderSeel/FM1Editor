name: Validate packaged FM-1 delivery gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-fm1-delivery-package-integrity.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run acceptance stages
        shell: bash
        run: |
          set +e
          : > stages.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> stages.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage base-delivery npm test -- src/validation/fm1DeliveryEvidence.test.ts
          run_stage delivery-v2 npm test -- src/validation/fm1DeliveryEvidenceIntegrity.test.ts
          run_stage delivery-v3 npm test -- src/validation/fm1DeliveryEvidencePackageIntegrity.test.ts
          run_stage consistency npm test -- src/validation/physicalEvidenceConsistency.test.ts
          run_stage package npm test -- src/validation/physicalEvidencePackage.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('stages.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1)
                try: codes[k]=int(v)
                except ValueError: codes[k]=999
          stages=['install','audit-virtual','audit-research','typecheck','lint','base-delivery','delivery-v2','delivery-v3','consistency','package','full-test','build']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          if not ok:
            for stage in stages:
              if codes.get(stage)==0: continue
              log=Path(f'{stage}.log')
              text=log.read_text(errors='replace') if log.exists() else 'missing log'
              failures += ['',f'## {stage} failure tail','','```text',text[-12000:],'```']
          Path('docs/validation/fm1-delivery-package-integrity.md').write_text('\n'.join([
            '# FM-1 packaged delivery evidence software acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            '- v1 remains the physical-manifest completeness evaluator and v2 remains the manifest/raw-MIDI SHA binding layer',
            '- final v3 READY requires one unique FM-1 package index for each selected Chrome/Edge session containing that exact manifest hash and raw-MIDI hash',
            '- each selected package must also contain at least one WAV artifact, one SysEx artifact and screenshot-or-notes evidence',
            '- Chrome and Edge must use distinct package-index hashes and distinct WAV hashes; the same known merged-bank SysEx may legitimately be reused',
            '- v3 persists artifact identities/hashes only and does not copy WAV audio, SysEx bytes or raw MIDI payloads',
            '- package completeness and hashing are integrity prerequisites and never derive physical PASS observations','',
            *failures,''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-fm1-delivery-package-integrity.yml').unlink(missing_ok=True)
          for path in Path('.').glob('*.log'): path.unlink(missing_ok=True)
          Path('stages.txt').unlink(missing_ok=True)

      - name: Commit receipt
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/fm1-delivery-package-integrity.md | grep -oE 'SUCCESS|FAILED' | head -1)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(validation): record packaged FM-1 delivery gate $status" || true
          git pull --rebase origin main
          git push origin HEAD:main
