name: Validate repaired current head v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-current-head-v2.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/reconstructionComparison.test.ts src/audio/dx7CandidateArtifacts.test.ts src/audio/fm1InspiredFxIsolation.test.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.test.tsx
      - run: npm run test
      - run: npm run build
      - name: Persist receipt
        shell: bash
        run: |
          cat > docs/validation/current-development-software-gate.md <<EOF
          # Current development software gate

          Source commit: \`${GITHUB_SHA}\`

          Overall: **SUCCESS**

          Audit, strict typecheck, lint, focused reconstruction/effect/CMA tests, full test suite and production build all passed after the candidate tuple-indexing and comparison-test lint fixes.
          EOF
          rm .github/workflows/validate-current-head-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(ci): accept repaired current development head'
          git pull --rebase origin main
          git push origin HEAD:main
