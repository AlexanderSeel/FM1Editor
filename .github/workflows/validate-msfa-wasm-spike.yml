name: Validate isolated MSFA WASM spike

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-msfa-wasm-spike.yml'

permissions:
  contents: write

concurrency:
  group: validate-msfa-wasm-spike
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Materialize audited source closure
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git init "$RUNNER_TEMP/dexed"
            git -C "$RUNNER_TEMP/dexed" remote add origin https://github.com/asb2m10/dexed.git
            git -C "$RUNNER_TEMP/dexed" fetch --depth 1 origin 2e182b3db85c09083ab13c8b9b00565ce7d9ff85
            git -C "$RUNNER_TEMP/dexed" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/dexed" rev-parse HEAD)" = '2e182b3db85c09083ab13c8b9b00565ce7d9ff85'
            npm run audit:virtual-dx7 -- --source-root "$RUNNER_TEMP/dexed" --require-hashes
            node scripts/materialize-msfa-spike.mjs --source-root "$RUNNER_TEMP/dexed" --output-root "$RUNNER_TEMP/materialized"
          } 2>&1 | tee "$RUNNER_TEMP/materialize.log"

      - name: Build native reference harness
        id: native_build
        if: steps.materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-msfa-spike.sh "$RUNNER_TEMP/materialized" "$RUNNER_TEMP/native-build" native 2>&1 | tee "$RUNNER_TEMP/native-build.log"

      - name: Render native reference
        id: native_render
        if: steps.native_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          "$RUNNER_TEMP/native-build/fm1-msfa-native" native/virtual-dx7-spike/reference-patch-v1.hex "$RUNNER_TEMP/native-reference.f32" 2>&1 | tee "$RUNNER_TEMP/native-render.log"
          sha256sum "$RUNNER_TEMP/native-reference.f32" | tee "$RUNNER_TEMP/native-reference.sha256"

      - name: Pull pinned Emscripten SDK image
        id: emsdk
        if: steps.materialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker pull emscripten/emsdk:4.0.7 2>&1 | tee "$RUNNER_TEMP/emsdk.log"
          docker image inspect emscripten/emsdk:4.0.7 --format '{{index .RepoDigests 0}}' | tee "$RUNNER_TEMP/emsdk-digest.txt"

      - name: Build WASM twice
        id: wasm_build
        if: steps.emsdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          for out in wasm-build-1 wasm-build-2; do
            docker run --rm \
              -v "$PWD:$PWD" \
              -v "$RUNNER_TEMP:$RUNNER_TEMP" \
              -w "$PWD" \
              emscripten/emsdk:4.0.7 \
              bash scripts/build-msfa-spike.sh "$RUNNER_TEMP/materialized" "$RUNNER_TEMP/$out" wasm
          done 2>&1 | tee "$RUNNER_TEMP/wasm-build.log"
          sha256sum "$RUNNER_TEMP/wasm-build-1/fm1-msfa.wasm" | tee "$RUNNER_TEMP/wasm-1.sha256"
          sha256sum "$RUNNER_TEMP/wasm-build-2/fm1-msfa.wasm" | tee "$RUNNER_TEMP/wasm-2.sha256"
          cmp "$RUNNER_TEMP/wasm-build-1/fm1-msfa.wasm" "$RUNNER_TEMP/wasm-build-2/fm1-msfa.wasm"

      - name: Render fixed WASM fixture twice internally
        id: wasm_render
        if: steps.wasm_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-msfa-wasm-spike.mjs \
            --module "$RUNNER_TEMP/wasm-build-1/fm1-msfa.mjs" \
            --patch native/virtual-dx7-spike/reference-patch-v1.hex \
            --output "$RUNNER_TEMP/wasm-reference.f32" \
            --note-on-frames 48000 \
            --release-frames 24000 \
            2>&1 | tee "$RUNNER_TEMP/wasm-reference.json"

      - name: Compare native and WASM reference PCM
        id: reference_compare
        if: steps.native_render.outcome == 'success' && steps.wasm_render.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmp "$RUNNER_TEMP/native-reference.f32" "$RUNNER_TEMP/wasm-reference.f32" 2>&1 | tee "$RUNNER_TEMP/reference-compare.log"
          printf 'byte-identical native/WASM PCM; waveform correlation=1.0; zero-lag peak; multi-resolution log-magnitude error=0 dB\n' | tee -a "$RUNNER_TEMP/reference-compare.log"

      - name: Benchmark five-second WASM render
        id: performance
        if: steps.wasm_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-msfa-wasm-spike.mjs \
            --module "$RUNNER_TEMP/wasm-build-1/fm1-msfa.mjs" \
            --patch native/virtual-dx7-spike/reference-patch-v1.hex \
            --output "$RUNNER_TEMP/wasm-five-seconds.f32" \
            --note-on-frames 192000 \
            --release-frames 48000 \
            2>&1 | tee "$RUNNER_TEMP/wasm-performance.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'], 'wasm-performance.json').read_text().splitlines()[-1])
          if data['frames'] != 240000:
              raise SystemExit('unexpected performance frame count')
          if data['realtimeRatio'] >= 1:
              raise SystemExit(f"five-second render was not faster than real time: ratio={data['realtimeRatio']}")
          PY

      - name: Measure bundle size
        id: size
        if: steps.wasm_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          wasm="$RUNNER_TEMP/wasm-build-1/fm1-msfa.wasm"
          glue="$RUNNER_TEMP/wasm-build-1/fm1-msfa.mjs"
          wasm_bytes=$(wc -c < "$wasm")
          glue_bytes=$(wc -c < "$glue")
          gzip -c "$wasm" > "$RUNNER_TEMP/fm1-msfa.wasm.gz"
          gzip -c "$glue" > "$RUNNER_TEMP/fm1-msfa.mjs.gz"
          compressed_bytes=$(( $(wc -c < "$RUNNER_TEMP/fm1-msfa.wasm.gz") + $(wc -c < "$RUNNER_TEMP/fm1-msfa.mjs.gz") ))
          printf '{"wasmBytes":%d,"glueBytes":%d,"compressedCombinedBytes":%d}\n' "$wasm_bytes" "$glue_bytes" "$compressed_bytes" | tee "$RUNNER_TEMP/wasm-size.json"
          test "$compressed_bytes" -le 1048576

      - name: Typecheck
        id: typecheck
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint and accessibility
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Full Vitest suite
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test

      - name: Production build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record spike receipt and remove temporary workflow
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          MATERIALIZE_RESULT: ${{ steps.materialize.outcome }}
          NATIVE_BUILD_RESULT: ${{ steps.native_build.outcome }}
          NATIVE_RENDER_RESULT: ${{ steps.native_render.outcome }}
          EMSDK_RESULT: ${{ steps.emsdk.outcome }}
          WASM_BUILD_RESULT: ${{ steps.wasm_build.outcome }}
          WASM_RENDER_RESULT: ${{ steps.wasm_render.outcome }}
          REFERENCE_RESULT: ${{ steps.reference_compare.outcome }}
          PERFORMANCE_RESULT: ${{ steps.performance.outcome }}
          SIZE_RESULT: ${{ steps.size.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          def read(name):
              path = temp / name
              return path.read_text(encoding='utf-8', errors='replace').strip() if path.exists() else 'not produced'
          def last_json(name):
              text = read(name)
              if text == 'not produced': return None
              for line in reversed(text.splitlines()):
                  try: return json.loads(line)
                  except json.JSONDecodeError: pass
              return None
          def tail(name, count=35):
              text = read(name)
              return '\n'.join(text.splitlines()[-count:])

          results = {
              'dependency install': os.environ['INSTALL_RESULT'],
              'source closure/materialization': os.environ['MATERIALIZE_RESULT'],
              'native build': os.environ['NATIVE_BUILD_RESULT'],
              'native reference render': os.environ['NATIVE_RENDER_RESULT'],
              'Emscripten image': os.environ['EMSDK_RESULT'],
              'two WASM builds': os.environ['WASM_BUILD_RESULT'],
              'deterministic WASM render': os.environ['WASM_RENDER_RESULT'],
              'native/WASM reference comparison': os.environ['REFERENCE_RESULT'],
              'five-second performance': os.environ['PERFORMANCE_RESULT'],
              'bundle-size gate': os.environ['SIZE_RESULT'],
              'typecheck': os.environ['TYPECHECK_RESULT'],
              'lint': os.environ['LINT_RESULT'],
              'full Vitest suite': os.environ['TEST_RESULT'],
              'production build': os.environ['BUILD_RESULT'],
          }
          required = list(results)
          success = all(results[name] == 'success' for name in required)
          fixed = last_json('wasm-reference.json')
          perf = last_json('wasm-performance.json')
          size = last_json('wasm-size.json')
          digest = read('emsdk-digest.txt')
          wasm_hash_1 = read('wasm-1.sha256').split()[0] if read('wasm-1.sha256') != 'not produced' else 'not produced'
          wasm_hash_2 = read('wasm-2.sha256').split()[0] if read('wasm-2.sha256') != 'not produced' else 'not produced'
          native_hash = read('native-reference.sha256').split()[0] if read('native-reference.sha256') != 'not produced' else 'not produced'

          lines = [
              '# Isolated MSFA WebAssembly feasibility execution', '',
              f"Validated FM1 Editor source commit: `{os.environ['GITHUB_SHA']}`", '',
              'Pinned MSFA upstream: `asb2m10/dexed@2e182b3db85c09083ab13c8b9b00565ce7d9ff85`',
              'Requested Emscripten SDK image: `emscripten/emsdk:4.0.7`',
              f"Resolved Emscripten image digest: `{digest}`", '',
              f"Overall offline feasibility gate: **{'SUCCESS' if success else 'FAILED'}**", '',
              '| Check | Result |', '| --- | --- |',
          ]
          lines.extend(f"| {name} | **{value.upper()}** |" for name, value in results.items())
          lines.extend(['', '## Measurements', ''])
          lines.append(f"- WASM build 1 SHA-256: `{wasm_hash_1}`")
          lines.append(f"- WASM build 2 SHA-256: `{wasm_hash_2}`")
          lines.append(f"- Native reference PCM SHA-256: `{native_hash}`")
          if fixed:
              lines.append(f"- Fixed WASM render: `{fixed['sha256']}`, {fixed['frames']} frames, peak {fixed['peak']}, RMS {fixed['rms']}, first render {fixed['firstRenderMs']} ms")
          if perf:
              lines.append(f"- Five-second WASM render: {perf['firstRenderMs']} ms first pass, real-time ratio {perf['realtimeRatio']}, hash `{perf['sha256']}`")
          if size:
              lines.append(f"- WASM bytes: {size['wasmBytes']}; JS glue bytes: {size['glueBytes']}; combined gzip bytes: {size['compressedCombinedBytes']}")
          if results['native/WASM reference comparison'] == 'success':
              lines.append('- Native and WASM fixed PCM were byte-identical. Therefore gain-aligned waveform correlation is 1.0, the maximum correlation includes zero-frame lag, and multi-resolution log-magnitude error is 0 dB.')
          lines.extend([
              '',
              'The source materialization and all engine binaries existed only under the GitHub Actions runner temporary directory. No MSFA source, native executable, WASM binary or generated glue was committed by this workflow.',
              '',
              'This validates only the dry offline DX7-compatible feasibility path. It does not run an AudioWorklet and does not validate a physical Yamaha DX7 or M-VAVE FM-1.',
              '',
              'The normal `.github/workflows/ci.yml` remains read-only. This temporary workflow removes itself in the result commit.',
          ])
          if not success:
              lines.extend(['', '## Failure log tails', ''])
              for name in ['materialize.log','native-build.log','native-render.log','emsdk.log','wasm-build.log','wasm-reference.json','reference-compare.log','wasm-performance.json']:
                  content = tail(name)
                  if content != 'not produced':
                      lines.extend([f'### `{name}`', '', '```text', content, '```', ''])
          Path('docs/validation/msfa-wasm-feasibility-execution.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/validate-msfa-wasm-spike.yml').unlink(missing_ok=True)
          PY

      - name: Commit receipt and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(ci): record isolated MSFA WASM spike'
          git pull --rebase origin main
          git push origin HEAD:main
