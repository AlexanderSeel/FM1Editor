name: Integrate optional reconstruction candidate FX state

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-candidate-fx-state.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Mount explicit candidate FX snapshots
        shell: python
        run: |
          from pathlib import Path

          app=Path('src/App.tsx');t=app.read_text(encoding='utf-8')
          t=t.replace("import { createInitializedFxState } from './domain/fx'", "import { createInitializedFxState, type Fm1FxState } from './domain/fx'", 1)
          anchor="""  const loadCatalogVoice = (nextVoice: Dx7Voice) => {\n    if (!confirmDiscardVoiceChanges('Loading another voice')) return\n    setBank([])\n    loadVoiceDocument(nextVoice)\n    setWorkspace('voice')\n  }\n\n"""
          addition=anchor+"""  const loadReconstructionCandidate = (nextVoice: Dx7Voice, nextFxState?: Fm1FxState) => {\n    const replacingDirtyEffects = nextFxState !== undefined && effectsHistory.dirty\n    if ((voiceHistory.dirty || replacingDirtyEffects) && !window.confirm(\n      `The current ${voiceHistory.dirty && replacingDirtyEffects ? 'voice and effects have' : voiceHistory.dirty ? 'voice has' : 'effects have'} unsaved changes. Loading this reconstruction candidate will replace them. Continue?`,\n    )) return\n    setBank([])\n    loadVoiceDocument(nextVoice)\n    if (nextFxState) effectsHistory.reset(nextFxState)\n    setWorkspace('voice')\n  }\n\n"""
          if 'const loadReconstructionCandidate' not in t:
            if anchor not in t:raise SystemExit('App load voice anchor missing')
            t=t.replace(anchor,addition,1)
          old="""                    <AudioToFmReferencePanel\n                      onAuditionVoice={auditionVoice}\n                      onLoadVoice={loadCatalogVoice}\n                      onStopAudition={stopAudition}\n                    />\n"""
          new="""                    <AudioToFmReferencePanel\n                      fxState={effects}\n                      onAuditionVoice={auditionVoice}\n                      onLoadVoice={loadCatalogVoice}\n                      onLoadVoiceWithFx={loadReconstructionCandidate}\n                      onStopAudition={stopAudition}\n                    />\n"""
          if 'onLoadVoiceWithFx={loadReconstructionCandidate}' not in t:
            if old not in t:raise SystemExit('AudioToFm App anchor missing')
            t=t.replace(old,new,1)
          app.write_text(t,encoding='utf-8')

          audio=Path('src/components/AudioToFmReferencePanel.tsx');t=audio.read_text(encoding='utf-8')
          t=t.replace("import type { Dx7Voice } from '../domain/voice'", "import type { Dx7Voice } from '../domain/voice'\nimport type { Fm1FxState } from '../domain/fx'", 1)
          old="""interface AudioToFmReferencePanelProps {\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n  onReferenceChange?: (reference: PreparedReferenceAudio | null) => void\n}\n"""
          new="""interface AudioToFmReferencePanelProps {\n  fxState?: Fm1FxState\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n  onLoadVoiceWithFx?: (voice: Dx7Voice, fxState: Fm1FxState) => void\n  onReferenceChange?: (reference: PreparedReferenceAudio | null) => void\n}\n"""
          if 'onLoadVoiceWithFx?:' not in t:
            if old not in t:raise SystemExit('AudioToFm props anchor missing')
            t=t.replace(old,new,1)
          old="""export function AudioToFmReferencePanel({\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n  onReferenceChange,\n}: AudioToFmReferencePanelProps) {\n"""
          new="""export function AudioToFmReferencePanel({\n  fxState,\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n  onLoadVoiceWithFx,\n  onReferenceChange,\n}: AudioToFmReferencePanelProps) {\n"""
          if '  fxState,\n  onAuditionVoice' not in t:
            if old not in t:raise SystemExit('AudioToFm destructure anchor missing')
            t=t.replace(old,new,1)
          old="""      <NearestPresetPanel\n        onAuditionVoice={onAuditionVoice}\n        onLoadVoice={onLoadVoice}\n        onStopAudition={onStopAudition}\n        reference={reference}\n      />\n"""
          new="""      <NearestPresetPanel\n        fxState={fxState}\n        onAuditionVoice={onAuditionVoice}\n        onLoadVoice={onLoadVoice}\n        onLoadVoiceWithFx={onLoadVoiceWithFx}\n        onStopAudition={onStopAudition}\n        reference={reference}\n      />\n"""
          if 'fxState={fxState}' not in t:
            if old not in t:raise SystemExit('NearestPreset mount anchor missing')
            t=t.replace(old,new,1)
          audio.write_text(t,encoding='utf-8')

          panel=Path('src/components/NearestPresetPanel.tsx');t=panel.read_text(encoding='utf-8')
          t=t.replace("import type { Dx7Voice } from '../domain/voice'", "import type { Dx7Voice } from '../domain/voice'\nimport type { Fm1FxState } from '../domain/fx'", 1)
          artifact_import="import { createDx7VoiceSemanticDiff, createDx7VoiceSyxArtifact } from '../audio/dx7CandidateArtifacts'\n"
          if 'createDx7CandidateFxAttachment' not in t:
            t=t.replace(artifact_import,artifact_import+"import { createDx7CandidateFxAttachment, type Dx7CandidateFxAttachment } from '../audio/dx7CandidateFxState'\n",1)
          old="""interface NearestPresetPanelProps {\n  reference: PreparedReferenceAudio | null\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n}\n"""
          new="""interface NearestPresetPanelProps {\n  reference: PreparedReferenceAudio | null\n  fxState?: Fm1FxState\n  onAuditionVoice: (voice: Dx7Voice | Promise<Dx7Voice>) => Promise<void>\n  onStopAudition: () => Promise<void>\n  onLoadVoice: (voice: Dx7Voice) => void\n  onLoadVoiceWithFx?: (voice: Dx7Voice, fxState: Fm1FxState) => void\n}\n"""
          if 'onLoadVoiceWithFx?:' not in t:
            if old not in t:raise SystemExit('Nearest props anchor missing')
            t=t.replace(old,new,1)
          old="""export function NearestPresetPanel({\n  reference,\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n}: NearestPresetPanelProps) {\n"""
          new="""export function NearestPresetPanel({\n  reference,\n  fxState,\n  onAuditionVoice,\n  onStopAudition,\n  onLoadVoice,\n  onLoadVoiceWithFx,\n}: NearestPresetPanelProps) {\n"""
          if '  fxState,\n  onAuditionVoice' not in t:
            if old not in t:raise SystemExit('Nearest destructure anchor missing')
            t=t.replace(old,new,1)
          state_anchor="""  const [refinementProgress, setRefinementProgress] = useState<RefinementProgress | null>(null)\n"""
          if 'candidateFxById' not in t:
            t=t.replace(state_anchor,state_anchor+"  const [candidateFxById, setCandidateFxById] = useState<Readonly<Record<string, Dx7CandidateFxAttachment>>>({})\n",1)
          reset_anchor="""    setRefinementResults([])\n    setRefinementProgress(null)\n"""
          if 'setCandidateFxById({})' not in t:
            t=t.replace(reset_anchor,reset_anchor+"    setCandidateFxById({})\n",1)
          refine_anchor="""    setRefinementResults([])\n    setRefinementProgress(null)\n    setError(null)\n    setStatus('Refining top retrieved voices · operator output levels + feedback only…')\n"""
          refine_new="""    setRefinementResults([])\n    setRefinementProgress(null)\n    setCandidateFxById({})\n    setError(null)\n    setStatus('Refining top retrieved voices · operator output levels + feedback only…')\n"""
          if refine_anchor in t:t=t.replace(refine_anchor,refine_new,1)
          load_button="""                  <button className=\"rounded-lg bg-emerald-300 px-3 py-2 text-xs font-black text-slate-950\" onClick={() => onLoadVoice(item.bestVoice)} type=\"button\">\n                    Load refined\n                  </button>\n"""
          fx_buttons="""                  <button\n                    className=\"rounded-lg border border-cyan-300/30 px-3 py-2 text-xs font-bold text-cyan-100 disabled:opacity-40\"\n                    disabled={!fxState}\n                    onClick={() => {\n                      if (!fxState) return\n                      setCandidateFxById((current) => ({ ...current, [item.sourceCandidate.id]: createDx7CandidateFxAttachment(fxState) }))\n                    }}\n                    type=\"button\"\n                  >\n                    {candidateFxById[item.sourceCandidate.id] ? 'Refresh attached FX' : 'Attach current FX'}\n                  </button>\n                  {candidateFxById[item.sourceCandidate.id] && onLoadVoiceWithFx && (\n                    <button\n                      className=\"rounded-lg bg-cyan-200 px-3 py-2 text-xs font-black text-slate-950\"\n                      onClick={() => {\n                        const attachment = candidateFxById[item.sourceCandidate.id]\n                        if (attachment) onLoadVoiceWithFx(item.bestVoice, attachment.state)\n                      }}\n                      type=\"button\"\n                    >\n                      Load refined + FX\n                    </button>\n                  )}\n"""+load_button
          if 'Attach current FX' not in t:
            if load_button not in t:raise SystemExit('refined load anchor missing')
            t=t.replace(load_button,fx_buttons,1)
          diff_end="""              </div>\n            </article>\n"""
          attachment="""              {candidateFxById[item.sourceCandidate.id] && (\n                <p className=\"mt-3 text-[10px] text-cyan-200\" data-candidate-fx-attached=\"true\">\n                  Attached FM-1-inspired FX snapshot · channel {candidateFxById[item.sourceCandidate.id]?.state.midiChannel} · {candidateFxById[item.sourceCandidate.id]?.nonZeroControls} non-zero controls · local metadata only\n                </p>\n              )}\n              </div>\n            </article>\n"""
          # Insert only in the refined-card tail, using the final occurrence before the map closes.
          if 'data-candidate-fx-attached' not in t:
            idx=t.rfind(diff_end)
            if idx<0:raise SystemExit('refined article tail missing')
            t=t[:idx]+t[idx:].replace(diff_end,attachment,1)
          panel.write_text(t,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/dx7CandidateFxState.test.ts src/audio/dx7CandidateArtifacts.test.ts src/audio/dx7CmaEsRefinement.test.ts src/components/NearestPresetPanel.test.tsx
      - run: npm run test
      - run: npm run build
      - name: Persist software receipt
        shell: bash
        run: |
          cat > docs/validation/dx7-candidate-fx-state-ui.md <<EOF
          # Audio → FM optional candidate FX-state software validation

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          Refined candidates can explicitly capture an independent snapshot of the current FM-1-inspired software FX state. The snapshot records only \`Fm1FxState\` plus a non-zero-control summary. Voice-only audition/export/load remain unchanged; an attached snapshot exposes a separate \`Load refined + FX\` action and never sends MIDI/hardware data.

          App loading prompts before replacing dirty voice/effects state and applies the FX snapshot only when the combined action is explicitly selected. Audit, strict typecheck, lint, focused tests, full tests and production build passed.
          EOF
          rm .github/workflows/integrate-candidate-fx-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(audio): attach optional FX state to refined candidates'
          git pull --rebase origin main
          git push origin HEAD:main
