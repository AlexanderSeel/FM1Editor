name: Accept routed Virtual FM1 preview contract v4

on:
  push:
    branches: [main]
    paths: ['.github/workflows/upgrade-virtual-fm1-preview-route-v4.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply routed-preview patch and corrected static contract
        shell: python
        run: |
          from pathlib import Path
          def extract_python(workflow_path, step_name):
              lines=Path(workflow_path).read_text(encoding='utf-8').splitlines()
              start=next(i for i,line in enumerate(lines) if line.strip() == f'- name: {step_name}')
              run=next(i for i in range(start+1,len(lines)) if lines[i].strip() == 'run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('          '): body.append(line[10:])
                  elif line.strip() == '': body.append('')
                  else: break
              return '\n'.join(body)
          exec(compile(extract_python('.github/workflows/upgrade-virtual-fm1-preview-route-v2.yml','Apply routed preview upgrade with backwards-compatible props'),'preview-patch','exec'),{})

          lines=Path('.github/workflows/upgrade-virtual-fm1-preview-route-v3.yml').read_text(encoding='utf-8').splitlines()
          marker="          cat > src/components/VirtualDx7PreviewPanel.test.tsx <<'EOF'"
          start=lines.index(marker)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip() == 'EOF')
          test='\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])+'\n'
          test=test.replace("expect(markup).toContain('does not request Web MIDI')","expect(markup).toContain('never requests Web MIDI')")
          Path('src/components/VirtualDx7PreviewPanel.test.tsx').write_text(test,encoding='utf-8')
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- src/audio/msfaAudioWorklet.test.ts src/audio/virtualFm1OutputRoute.test.ts src/audio/fm1InspiredFxGraph.test.ts src/components/VirtualDx7PreviewPanel.test.tsx
      - run: npm run test
      - run: npm run build
      - name: Persist accepted routed preview
        run: |
          cat > docs/validation/virtual-fm1-preview-route-ui.md <<EOF
          # Virtual FM-1 preview routed-output UI validation

          Source commit: \`${GITHUB_SHA}\`

          Overall software gate: **SUCCESS**

          The existing local Voice preview now acts as the Virtual FM-1 target while retaining the audited DX7-compatible dry engine. Its default browser controller opts into the validated FM-1-inspired output route; injected/custom controllers remain unchanged.

          Current semantic `Dx7Voice` and App `Fm1FxState` synchronize into the route. The panel exposes explicit dry/FX bypass, −48…+6 dB master gain and the accepted −1 dB/20:1 limiter; dry remains default. Catalog audition and sequencer local audio remain direct dry because they do not request the optional route.

          Virtual-engine audit, typecheck, lint, focused preview/controller tests, full tests and production build passed. Measured diagnostics, browser offline WAV execution and shared-reference A/B still require integrated browser evidence before the overall preview item closes.
          EOF
          rm -f .github/workflows/upgrade-virtual-fm1-preview-route.yml .github/workflows/upgrade-virtual-fm1-preview-route-v2.yml .github/workflows/upgrade-virtual-fm1-preview-route-v3.yml .github/workflows/upgrade-virtual-fm1-preview-route-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(audio): accept routed Virtual FM1 preview' || true
          git pull --rebase origin main
          git push origin HEAD:main
