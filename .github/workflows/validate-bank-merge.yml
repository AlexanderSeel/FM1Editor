name: Validate bank merge workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-bank-merge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        shell: bash
        run: |
          set +e
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p .validation-logs docs/validation

          npm install --no-audit --no-fund >.validation-logs/install.log 2>&1
          install_status=$?
          npm run typecheck >.validation-logs/typecheck.log 2>&1
          typecheck_status=$?
          npm run lint >.validation-logs/lint.log 2>&1
          lint_status=$?
          npm run test >.validation-logs/test.log 2>&1
          test_status=$?
          npm run build >.validation-logs/build.log 2>&1
          build_status=$?

          status_word() {
            if [[ "$1" -eq 0 ]]; then printf 'PASS'; else printf 'FAIL (%s)' "$1"; fi
          }

          cat > docs/validation/ci-receipt.md <<EOF
          # CI validation receipt

          Validated on GitHub Actions with Node \`$(node --version)\`.

          - Validated commit: \`$validated_sha\`
          - npm install: **$(status_word "$install_status")**
          - npm run typecheck: **$(status_word "$typecheck_status")**
          - npm run lint: **$(status_word "$lint_status")**
          - npm run test: **$(status_word "$test_status")**
          - npm run build: **$(status_word "$build_status")**

          Validated FM-1 transfer boundary:

          - unsafe isolated single-voice and byte-index parameter-stream transports are removed from the UI and transfer module;
          - one selected slot is merged into a complete 32-voice base bank;
          - the encoded transfer is one checksum-valid 4,104-byte Yamaha DX7 bank message;
          - bank A/B/C/D plus slot 1–32 resolves to preset 1–128;
          - the UI requires an explicit whole-bank overwrite confirmation and retains base/merged bank export;
          - preset recall and virtual-piano note audition remain available.
          EOF

          for log in typecheck lint test build; do
            {
              printf '\n## %s output\n\n```text\n' "$log"
              tail -n 120 ".validation-logs/$log.log"
              printf '\n```\n'
            } >> docs/validation/ci-receipt.md
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/ci-receipt.md
          git commit -m 'test(ci): record bank merge validation' || true
          git push origin HEAD:main

          if [[ "$install_status" -ne 0 || "$typecheck_status" -ne 0 || "$lint_status" -ne 0 || "$test_status" -ne 0 || "$build_status" -ne 0 ]]; then
            exit 1
          fi
