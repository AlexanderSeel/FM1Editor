name: Integrate primary sound recreation flow

on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-primary-sound-recreation.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make recreation primary and retrieval secondary
        shell: python
        run: |
          from pathlib import Path

          path=Path('src/components/NearestPresetPanel.tsx')
          text=path.read_text(encoding='utf-8')

          replacements=[
            (
              "const search = useCallback(async () => {",
              "const search = useCallback(async (recreate = false) => {",
            ),
            (
              """      setResults(ranked)\n      setProgress({ completed: catalogCandidates.length, total: catalogCandidates.length, current: '' })\n      setStatus(`Ranked ${catalogCandidates.length} local voices · ${hitCount} fingerprint cache hits`)\n      setPhase('ready')\n      abortRef.current = null\n""",
              """      setResults(ranked)\n      setProgress({ completed: catalogCandidates.length, total: catalogCandidates.length, current: '' })\n      if (recreate) {\n        if (ranked.length === 0) throw new Error('No local DX7 seed candidate is available for sound recreation.')\n        setPhase('refining')\n        setRefinementProgress(null)\n        setStatus('Recreating a new DX7 patch from the strongest local seeds · optimizing output, feedback, frequency and envelopes…')\n        const recreated = await refineRetrievedDx7Candidates(ranked, nextReferenceFingerprint, engine, {\n          startCount: Math.min(REFINEMENT_STARTS, ranked.length),\n          groups: ['output-feedback', 'operator-frequency', 'operator-envelope'],\n          seed: REFINEMENT_SEED,\n          sampleRate: INDEX_SAMPLE_RATE,\n          descriptorConfig: COMPACT_PRESET_DESCRIPTOR_CONFIG,\n          fingerprintCache,\n          signal,\n          cmaEs: {\n            populationSize: 10,\n            maxGenerations: 10,\n            sigma: 0.18,\n            targetScore: 0,\n          },\n          onProgress: (item) => {\n            setRefinementProgress({\n              startIndex: item.startIndex,\n              startCount: item.startCount,\n              generation: item.generation,\n              evaluations: item.evaluations,\n              bestDistance: item.bestDistance,\n              sourceName: item.sourceCandidate.voice.name || item.sourceCandidate.sourceLabel,\n            })\n          },\n        })\n        if (recreated.length === 0) throw new Error('DX7 sound recreation produced no optimized candidate.')\n        setRefinementResults(recreated)\n        setStatus(`Recreated ${recreated.length} DX7-compatible candidate${recreated.length === 1 ? '' : 's'} from ${catalogCandidates.length} local seed voices · best distance ${recreated[0]?.bestDistance.toFixed(5) ?? '—'}`)\n      } else {\n        setStatus(`Found ${ranked.length} similar seed presets from ${catalogCandidates.length} local voices · ${hitCount} fingerprint cache hits`)\n      }\n      setPhase('ready')\n      abortRef.current = null\n""",
            ),
            (
              "setStatus('Nearest-preset search cancelled. Cached fingerprints remain local for the next run.')",
              "setStatus('Sound recreation / preset search cancelled. Cached fingerprints remain local for the next run.')",
            ),
            (
              'aria-label="Nearest preset reconstruction"',
              'aria-label="DX7 sound recreation"',
            ),
            (
              'Nearest preset · local retrieval',
              'Recreate sound · local synthesis',
            ),
            (
              'Render checksum-valid bundled DX7 voices through the deterministic local engine and rank compact fingerprints against the prepared reference. After retrieval, an explicit constrained CMA-ES step can refine operator output levels and feedback only. Nothing is uploaded, loaded into the editor, or sent to hardware automatically.',
              'Create a new DX7-compatible patch that approaches the prepared reference. Local preset retrieval is only the seed-selection stage; Recreate sound automatically runs constrained synthesis optimization across operator output levels, feedback, operator frequencies and operator envelopes. Similar-preset search remains available separately. Nothing is uploaded or sent to hardware automatically.',
            ),
            (
              """        <button\n          className=\"rounded-xl bg-cyan-300 px-4 py-2.5 text-sm font-black text-slate-950 disabled:cursor-not-allowed disabled:opacity-40\"\n          disabled={!reference || working}\n          onClick={() => void search()}\n          type=\"button\"\n        >\n          {phase === 'ready' ? 'Search again' : 'Build / search local index'}\n        </button>\n""",
              """        <button\n          className=\"rounded-xl bg-amber-200 px-4 py-2.5 text-sm font-black text-slate-950 disabled:cursor-not-allowed disabled:opacity-40\"\n          disabled={!reference || working}\n          onClick={() => void search(true)}\n          type=\"button\"\n        >\n          {refinementResults.length > 0 ? 'Recreate sound again' : 'Recreate sound'}\n        </button>\n        <button\n          className=\"rounded-xl border border-cyan-300/30 px-4 py-2.5 text-sm font-bold text-cyan-100 disabled:cursor-not-allowed disabled:opacity-40\"\n          disabled={!reference || working}\n          onClick={() => void search(false)}\n          type=\"button\"\n        >\n          Find similar presets\n        </button>\n""",
            ),
            (
              'Refine top {Math.min(REFINEMENT_STARTS, results.length)} · output + feedback',
              'Quick refine seeds · output + feedback',
            ),
            (
              '>Ranked candidates</h4>',
              '>Seed candidates · similar presets</h4>',
            ),
            (
              '>CMA-ES refined candidates</h4>',
              '>Recreated patch candidates</h4>',
            ),
            (
              'Seed {REFINEMENT_SEED} · six operator output levels + feedback only · each result starts from a ranked catalog voice.',
              'Recreate sound uses ranked presets only as starting points and optimizes output levels, feedback, operator frequencies and operator envelopes. The optional Quick refine action remains the smaller output/feedback-only pass. Seed {REFINEMENT_SEED}.',
            ),
          ]

          for old,new in replacements:
            if old not in text:
              raise SystemExit(f'NearestPresetPanel patch anchor missing: {old[:100]!r}')
            text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          test=Path('src/components/NearestPresetPanel.test.tsx')
          t=test.read_text(encoding='utf-8')
          t=t.replace("it('keeps indexing explicit and disabled until a prepared reference exists', () => {", "it('makes recreation primary while keeping similar-preset search explicit and disabled until a reference exists', () => {")
          t=t.replace("expect(markup).toContain('Nearest preset · local retrieval')", "expect(markup).toContain('Recreate sound · local synthesis')")
          t=t.replace("expect(markup).toContain('Build / search local index')", "expect(markup).toContain('Recreate sound')\n    expect(markup).toContain('Find similar presets')")
          test.write_text(t,encoding='utf-8')

      - name: Run acceptance stages
        shell: bash
        run: |
          set +e
          : > stages.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "$name.log" 2>&1
            code=$?
            cat "$name.log"
            echo "$name=$code" >> stages.txt
          }
          run_stage install npm install --no-audit --no-fund
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-reconstruction npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage recreation-ui npm test -- src/components/NearestPresetPanel.test.tsx src/audio/dx7CmaEsRefinement.test.ts src/audio/dx7CmaEs.test.ts src/audio/msfaOfflineEngine.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os
          codes={}
          p=Path('stages.txt')
          if p.exists():
            for line in p.read_text().splitlines():
              if '=' in line:
                k,v=line.split('=',1)
                try: codes[k]=int(v)
                except ValueError: codes[k]=999
          stages=['install','audit-virtual','audit-reconstruction','typecheck','lint','recreation-ui','full-test','build']
          ok=all(codes.get(stage)==0 for stage in stages)
          rows=['| Stage | Exit |','| --- | ---: |']+[f'| {stage} | {codes.get(stage,"?")} |' for stage in stages]
          failures=[]
          if not ok:
            for stage in stages:
              if codes.get(stage)==0: continue
              log=Path(f'{stage}.log')
              text=log.read_text(errors='replace') if log.exists() else 'missing log'
              failures += ['',f'## {stage} failure tail','','```text',text[-12000:],'```']
          Path('docs/validation/primary-sound-recreation-ui.md').write_text('\n'.join([
            '# Primary Audio-to-FM sound recreation UI acceptance','',
            f"Source commit: `{os.environ['GITHUB_SHA']}`",'',
            f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",'',
            *rows,'',
            '- `Recreate sound` is the primary Audio-to-FM action; similar-preset retrieval is explicitly secondary',
            '- retrieval selects promising local DX7 seed voices but is not presented as the recreation result',
            '- one recreation run automatically refines up to three seeds with deterministic CMA-ES over six operator output levels, feedback, twelve operator frequency controls and forty-eight operator envelope points',
            '- recreated candidates remain explicit local results that can be auditioned, exported as single-voice SysEx or loaded into the editor',
            '- no recreated candidate is automatically transmitted to physical hardware',
            '- the smaller output/feedback-only quick refinement remains available after an explicit similar-preset search',
            '- exact inverse recovery is not claimed; the result is an optimized DX7-compatible approximation measured against the prepared reference fingerprint','',
            *failures,''
          ]),encoding='utf-8')
          Path('.github/workflows/integrate-primary-sound-recreation.yml').unlink(missing_ok=True)
          for path in Path('.').glob('*.log'): path.unlink(missing_ok=True)
          Path('stages.txt').unlink(missing_ok=True)

      - name: Commit result
        if: always()
        shell: bash
        run: |
          status=$(grep -F 'Software acceptance:' docs/validation/primary-sound-recreation-ui.md | grep -oE 'SUCCESS|FAILED' | head -1)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(audio): make sound recreation primary ($status)" || true
          git pull --rebase origin main
          git push origin HEAD:main
