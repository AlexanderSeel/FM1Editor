name: Fix legacy 0-99 ranges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-legacy-99-ranges.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply legacy range compatibility
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          codec = Path('src/sysex/dx7.ts')
          text = codec.read_text()

          replacements = [
            (
              "function asFour(data: Uint8Array, offset: number): FourValues {\n  return [data[offset] ?? 0, data[offset + 1] ?? 0, data[offset + 2] ?? 0, data[offset + 3] ?? 0]\n}",
              "function asFour(data: Uint8Array, offset: number): FourValues {\n  return [\n    normalizeParameter99(data[offset] ?? 0),\n    normalizeParameter99(data[offset + 1] ?? 0),\n    normalizeParameter99(data[offset + 2] ?? 0),\n    normalizeParameter99(data[offset + 3] ?? 0),\n  ]\n}",
            ),
            (
              "function writeRange(target: Uint8Array, offset: number, values: FourValues, maximum = 99): void {\n  values.forEach((value, index) => {\n    assertRange(`value at ${offset + index}`, value, 0, maximum)\n    target[offset + index] = value\n  })\n}",
              "function writeRange(target: Uint8Array, offset: number, values: FourValues, maximum = 99): void {\n  values.forEach((value, index) => {\n    assertRange(`value at ${offset + index}`, value, 0, maximum === 99 ? 127 : maximum)\n    target[offset + index] = maximum === 99 ? normalizeParameter99(value) : value\n  })\n}",
            ),
            (
              "/**\n * Keyboard-scaling breakpoint is defined as 0..99. Some legacy or\n * third-party banks contain the reserved 7-bit value 127. Normalize\n * it to the nearest valid breakpoint instead of blocking bank export.\n */\nfunction normalizeBreakpoint(value: number): number {\n  return Math.min(value, 99)\n}",
              "/**\n * DX7 parameters documented as 0..99 occasionally contain reserved 7-bit\n * values from 100..127 in legacy and third-party banks. Normalize them to\n * the nearest valid value so one malformed field cannot block a complete\n * voice or 32-voice bank export.\n */\nfunction normalizeParameter99(value: number): number {\n  return Math.min(value, 99)\n}",
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'codec marker not found: {old[:80]}')
            text = text.replace(old, new, 1)

          text = text.replace('normalizeBreakpoint(', 'normalizeParameter99(')

          direct_decode = [
            ('leftDepth: data[offset + 9] ?? 0,', 'leftDepth: normalizeParameter99(data[offset + 9] ?? 0),'),
            ('rightDepth: data[offset + 10] ?? 0,', 'rightDepth: normalizeParameter99(data[offset + 10] ?? 0),'),
            ('outputLevel: data[offset + 16] ?? 0,', 'outputLevel: normalizeParameter99(data[offset + 16] ?? 0),'),
            ('frequencyFine: data[offset + 19] ?? 0,', 'frequencyFine: normalizeParameter99(data[offset + 19] ?? 0),'),
            ('outputLevel: data[offset + 13] ?? 0,', 'outputLevel: normalizeParameter99(data[offset + 13] ?? 0),'),
            ('frequencyFine: data[offset + 15] ?? 0,', 'frequencyFine: normalizeParameter99(data[offset + 15] ?? 0),'),
            ('speed: data[137] ?? 0,', 'speed: normalizeParameter99(data[137] ?? 0),'),
            ('delay: data[138] ?? 0,', 'delay: normalizeParameter99(data[138] ?? 0),'),
            ('pitchModulationDepth: data[139] ?? 0,', 'pitchModulationDepth: normalizeParameter99(data[139] ?? 0),'),
            ('amplitudeModulationDepth: data[140] ?? 0,', 'amplitudeModulationDepth: normalizeParameter99(data[140] ?? 0),'),
            ('speed: data[112] ?? 0,', 'speed: normalizeParameter99(data[112] ?? 0),'),
            ('delay: data[113] ?? 0,', 'delay: normalizeParameter99(data[113] ?? 0),'),
            ('pitchModulationDepth: data[114] ?? 0,', 'pitchModulationDepth: normalizeParameter99(data[114] ?? 0),'),
            ('amplitudeModulationDepth: data[115] ?? 0,', 'amplitudeModulationDepth: normalizeParameter99(data[115] ?? 0),'),
          ]
          for old, new in direct_decode:
            if old not in text:
              raise SystemExit(f'decode marker not found: {old}')
            text = text.replace(old, new)

          validation_replacements = [
            ('operator.envelope.rates.forEach((value, index) => assertRange(`${label} envelope rate ${index + 1}`, value, 0, 99))', 'operator.envelope.rates.forEach((value, index) => assertRange(`${label} envelope rate ${index + 1}`, value, 0, 127))'),
            ('operator.envelope.levels.forEach((value, index) => assertRange(`${label} envelope level ${index + 1}`, value, 0, 99))', 'operator.envelope.levels.forEach((value, index) => assertRange(`${label} envelope level ${index + 1}`, value, 0, 127))'),
            ('assertRange(`${label} left depth`, operator.keyboardScaling.leftDepth, 0, 99)', 'assertRange(`${label} left depth`, operator.keyboardScaling.leftDepth, 0, 127)'),
            ('assertRange(`${label} right depth`, operator.keyboardScaling.rightDepth, 0, 99)', 'assertRange(`${label} right depth`, operator.keyboardScaling.rightDepth, 0, 127)'),
            ('assertRange(`${label} output level`, operator.outputLevel, 0, 99)', 'assertRange(`${label} output level`, operator.outputLevel, 0, 127)'),
            ('assertRange(`${label} frequency fine`, operator.frequencyFine, 0, 99)', 'assertRange(`${label} frequency fine`, operator.frequencyFine, 0, 127)'),
            ('voice.pitchEnvelope.rates.forEach((value, index) => assertRange(`pitch envelope rate ${index + 1}`, value, 0, 99))', 'voice.pitchEnvelope.rates.forEach((value, index) => assertRange(`pitch envelope rate ${index + 1}`, value, 0, 127))'),
            ('voice.pitchEnvelope.levels.forEach((value, index) => assertRange(`pitch envelope level ${index + 1}`, value, 0, 99))', 'voice.pitchEnvelope.levels.forEach((value, index) => assertRange(`pitch envelope level ${index + 1}`, value, 0, 127))'),
            ("assertRange('LFO speed', voice.lfo.speed, 0, 99)", "assertRange('LFO speed', voice.lfo.speed, 0, 127)"),
            ("assertRange('LFO delay', voice.lfo.delay, 0, 99)", "assertRange('LFO delay', voice.lfo.delay, 0, 127)"),
            ("assertRange('LFO pitch modulation depth', voice.lfo.pitchModulationDepth, 0, 99)", "assertRange('LFO pitch modulation depth', voice.lfo.pitchModulationDepth, 0, 127)"),
            ("assertRange('LFO amplitude modulation depth', voice.lfo.amplitudeModulationDepth, 0, 99)", "assertRange('LFO amplitude modulation depth', voice.lfo.amplitudeModulationDepth, 0, 127)"),
          ]
          for old, new in validation_replacements:
            if old not in text:
              raise SystemExit(f'validation marker not found: {old}')
            text = text.replace(old, new, 1)

          encode_replacements = [
            ('data[offset + 9] = operator.keyboardScaling.leftDepth', 'data[offset + 9] = normalizeParameter99(operator.keyboardScaling.leftDepth)'),
            ('data[offset + 10] = operator.keyboardScaling.rightDepth', 'data[offset + 10] = normalizeParameter99(operator.keyboardScaling.rightDepth)'),
            ('data[offset + 16] = operator.outputLevel', 'data[offset + 16] = normalizeParameter99(operator.outputLevel)'),
            ('data[offset + 19] = operator.frequencyFine', 'data[offset + 19] = normalizeParameter99(operator.frequencyFine)'),
            ('data[offset + 13] = operator.outputLevel', 'data[offset + 13] = normalizeParameter99(operator.outputLevel)'),
            ('data[offset + 15] = operator.frequencyFine', 'data[offset + 15] = normalizeParameter99(operator.frequencyFine)'),
            ('data[137] = voice.lfo.speed', 'data[137] = normalizeParameter99(voice.lfo.speed)'),
            ('data[138] = voice.lfo.delay', 'data[138] = normalizeParameter99(voice.lfo.delay)'),
            ('data[139] = voice.lfo.pitchModulationDepth', 'data[139] = normalizeParameter99(voice.lfo.pitchModulationDepth)'),
            ('data[140] = voice.lfo.amplitudeModulationDepth', 'data[140] = normalizeParameter99(voice.lfo.amplitudeModulationDepth)'),
            ('data[112] = voice.lfo.speed', 'data[112] = normalizeParameter99(voice.lfo.speed)'),
            ('data[113] = voice.lfo.delay', 'data[113] = normalizeParameter99(voice.lfo.delay)'),
            ('data[114] = voice.lfo.pitchModulationDepth', 'data[114] = normalizeParameter99(voice.lfo.pitchModulationDepth)'),
            ('data[115] = voice.lfo.amplitudeModulationDepth', 'data[115] = normalizeParameter99(voice.lfo.amplitudeModulationDepth)'),
          ]
          for old, new in encode_replacements:
            if old not in text:
              raise SystemExit(f'encode marker not found: {old}')
            text = text.replace(old, new)

          codec.write_text(text)

          tests = Path('src/sysex/dx7.test.ts')
          test_text = tests.read_text()
          start = test_text.index("it('normalizes reserved breakpoint value 127")
          end = test_text.index('\n\n})\n\ndescribe(\'DX7 bank\'', start)
          replacement = """  it('normalizes reserved breakpoint value 127 without blocking voice or bank encoding', () => {
            const packed = encodePackedVoice(createInitializedVoice('BREAK 127'))
            const op2BreakpointOffset = 4 * 17 + 8
            packed[op2BreakpointOffset] = 127

            const decoded = decodePackedVoice(packed)
            const reencoded = encodePackedVoice(decoded)

            expect(decoded.operators[1].keyboardScaling.breakPoint).toBe(99)
            expect(reencoded[op2BreakpointOffset]).toBe(99)

            const legacyVoice = createInitializedVoice('LEGACY BP')
            legacyVoice.operators[1].keyboardScaling.breakPoint = 127
            const legacySingle = encodeSingleVoiceMessage(legacyVoice)
            expect(decodeSingleVoiceMessage(legacySingle).voice.operators[1].keyboardScaling.breakPoint).toBe(99)
          })

          it('normalizes legacy 7-bit values across all 0-99 parameter groups', () => {
            const packed = encodePackedVoice(createInitializedVoice('RANGE 127'))
            packed[2] = 127
            packed[4] = 127
            packed[9] = 127
            packed[10] = 127
            packed[13] = 127
            packed[15] = 127
            packed[102] = 127
            packed[106] = 127
            packed[112] = 127
            packed[113] = 127
            packed[114] = 127
            packed[115] = 127

            const decoded = decodePackedVoice(packed)
            const reencoded = encodePackedVoice(decoded)

            expect(decoded.operators[5].envelope.rates[2]).toBe(99)
            expect(decoded.operators[5].envelope.levels[0]).toBe(99)
            expect(decoded.operators[5].keyboardScaling.leftDepth).toBe(99)
            expect(decoded.operators[5].keyboardScaling.rightDepth).toBe(99)
            expect(decoded.operators[5].outputLevel).toBe(99)
            expect(decoded.operators[5].frequencyFine).toBe(99)
            expect(decoded.pitchEnvelope.rates[0]).toBe(99)
            expect(decoded.pitchEnvelope.levels[0]).toBe(99)
            expect(decoded.lfo.speed).toBe(99)
            expect(decoded.lfo.delay).toBe(99)
            expect(decoded.lfo.pitchModulationDepth).toBe(99)
            expect(decoded.lfo.amplitudeModulationDepth).toBe(99)
            for (const offset of [2, 4, 9, 10, 13, 15, 102, 106, 112, 113, 114, 115]) {
              expect(reencoded[offset]).toBe(99)
            }

            const legacyVoice = createInitializedVoice('LEGACY 99')
            legacyVoice.operators[5].envelope.rates[2] = 127
            legacyVoice.operators[5].outputLevel = 127
            legacyVoice.lfo.speed = 127
            const single = decodeSingleVoiceMessage(encodeSingleVoiceMessage(legacyVoice)).voice
            expect(single.operators[5].envelope.rates[2]).toBe(99)
            expect(single.operators[5].outputLevel).toBe(99)
            expect(single.lfo.speed).toBe(99)

            const voices = Array.from({ length: 32 }, (_, index) => createInitializedVoice(`VOICE ${index + 1}`))
            const bankVoice = voices[3]
            if (!bankVoice) throw new Error('Missing test bank voice.')
            bankVoice.operators[5].envelope.rates[2] = 127
            const bankMessage = encodeVoiceBankMessage(voices)
            expect(decodeVoiceBankMessage(bankMessage).voices[3]?.operators[5].envelope.rates[2]).toBe(99)
          })"""
          tests.write_text(test_text[:start] + replacement + test_text[end:])
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Record validation and commit
        shell: bash
        run: |
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p docs/validation
          cat > docs/validation/legacy-99-ranges.md <<EOF
          # Legacy 0-99 range compatibility

          Validated source commit: \`$validated_sha\`

          - npm install: **PASS**
          - npm run typecheck: **PASS**
          - npm run lint: **PASS**
          - npm run test: **PASS**
          - npm run build: **PASS**

          Verified behavior:

          - OP6 envelope rate 3 value 127 normalizes to 99;
          - operator envelope levels, scaling depths, output and fine frequency normalize to 99;
          - pitch-envelope and LFO 0-99 fields normalize to 99;
          - packed, unpacked, single-voice and complete bank encoding accept legacy 100-127 values;
          - narrower bit-field parameters remain strictly validated;
          - Yamaha checksums are recalculated after normalization.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sysex/dx7.ts src/sysex/dx7.test.ts docs/validation/legacy-99-ranges.md
          git commit -m 'fix(sysex): normalize legacy 0-99 parameter ranges'
          git push origin HEAD:main
