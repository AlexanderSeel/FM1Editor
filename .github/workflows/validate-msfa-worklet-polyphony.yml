name: Validate MSFA AudioWorklet polyphony

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-msfa-worklet-polyphony.yml']

permissions:
  contents: write

concurrency:
  group: validate-msfa-worklet-polyphony
  cancel-in-progress: false

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit:virtual-dx7
      - run: node --check scripts/test-msfa-audioworklet-browser.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  browser:
    name: ${{ matrix.browser }} polyphony smoke
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute real polyphonic AudioWorklet smoke
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          if ($env:BROWSER_NAME -eq 'chrome') {
            $candidates = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          } else {
            $candidates = @("$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe")
          }
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $result = "polyphony-$env:BROWSER_NAME.json"
          if (-not $browser) {
            @{ ok = $false; browserName = $env:BROWSER_NAME; requestedSoakSeconds = 30; error = 'Installed browser executable was not found on windows-latest' } | ConvertTo-Json | Set-Content -Encoding utf8 $result
            exit 1
          }
          node scripts/test-msfa-audioworklet-browser.mjs --browser-executable "$browser" --browser-name "$env:BROWSER_NAME" --soak-seconds 30 --result "$result"
      - name: Upload polyphony result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyphony-${{ matrix.browser }}
          path: polyphony-${{ matrix.browser }}.json
          if-no-files-found: error

  record:
    if: always()
    needs: [software, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: polyphony-*
          path: browser-results
          merge-multiple: true
      - name: Record polyphony receipt and self-clean
        env:
          SOFTWARE_RESULT: ${{ needs.software.result }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root=Path('browser-results')
          results=[]
          expected=list(range(16))
          for name in ['chrome','edge']:
              path=root/f'polyphony-{name}.json'
              if path.exists():
                  try:
                      data=json.loads(path.read_text(encoding='utf-8-sig'))
                  except Exception as exc:
                      data={'ok':False,'browserName':name,'error':f'invalid result: {exc}'}
              else:
                  data={'ok':False,'browserName':name,'error':'result artifact missing'}
              data['allocationSatisfied']=data.get('allocationVoiceIndices') == expected
              data['stealSatisfied']=data.get('stolenVoiceIndex') == 0
              data['durationSatisfied']=isinstance(data.get('durationMs'),(int,float)) and data.get('durationMs') >= 30000
              results.append(data)

          software_ok=os.environ.get('SOFTWARE_RESULT') == 'success'
          browser_ok=all(
              bool(data.get('ok'))
              and bool(data.get('allocationSatisfied'))
              and bool(data.get('stealSatisfied'))
              and bool(data.get('durationSatisfied'))
              and data.get('workletPolyphony') == 16
              and data.get('processorErrors') == 0
              and data.get('suspendedObservations') == 0
              for data in results
          )
          ok=software_ok and browser_ok

          lines=[
              '# MSFA AudioWorklet polyphony validation',
              '',
              f"Validated source/workflow commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Overall polyphony gate: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              f"- Same-commit software suite: **{'SUCCESS' if software_ok else os.environ.get('SOFTWARE_RESULT','UNKNOWN').upper()}**",
              '- Audited WASM identity remains unchanged; polyphony is orchestration over 16 stateful sessions in the repository-owned AudioWorklet.',
              '',
              '| Browser | Result | Version | Duration | Cycles | Allocation | 17th-note steal | Peak | Processor errors | Suspensions |',
              '| --- | --- | --- | ---: | ---: | --- | --- | ---: | ---: | ---: |',
          ]
          for data in results:
              success=(
                  bool(data.get('ok'))
                  and bool(data.get('allocationSatisfied'))
                  and bool(data.get('stealSatisfied'))
                  and bool(data.get('durationSatisfied'))
              )
              lines.append(
                  f"| {data.get('browserName','?')} | **{'SUCCESS' if success else 'FAILURE'}** | "
                  f"{data.get('browserProduct','n/a')} | {data.get('durationMs','n/a')} ms | {data.get('cycles','n/a')} | "
                  f"{'0–15' if data.get('allocationSatisfied') else 'FAILED'} | "
                  f"{'voice 0' if data.get('stealSatisfied') else 'FAILED'} | {data.get('maxPeak','n/a')} | "
                  f"{data.get('processorErrors','n/a')} | {data.get('suspendedObservations','n/a')} |"
              )

          lines += [
              '',
              '## Acceptance scope',
              '',
              '- Manifest and controller require exactly 16 worklet voices.',
              '- Initial simultaneous allocation must return voice indices `0` through `15` in deterministic order.',
              '- With all 16 voices held, the 17th note must deterministically steal the oldest held voice, index `0`.',
              '- Repeated triads must use distinct voices; releasing one MIDI note must leave the remaining chord active.',
              '- All-notes-off must return the analyser to silence with zero processor errors, window errors, unhandled rejections or unresolved AudioContext suspension.',
              '- The single-note synthesis engine and WASM hash are unchanged. The worklet sums stateful sessions and applies a final safety clamp; this is not a physical DX7/FM-1 headroom or voice-stealing equivalence claim.',
              '- Hardware MIDI/SysEx and physical FM-1/DX7 behavior are outside this gate.',
          ]
          for data in results:
              lines += ['', f"## {data.get('browserName','browser')}", '```json', json.dumps(data,indent=2), '```']

          Path('docs/validation/msfa-audioworklet-polyphony.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/validate-msfa-worklet-polyphony.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record AudioWorklet polyphony validation'
          git pull --rebase origin main
          git push origin HEAD:main
