name: Diagnose MSFA performance ABI rebuild

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-msfa-performance-build.yml']

permissions:
  contents: write

concurrency:
  group: diagnose-msfa-performance-build
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run isolated rebuild diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .tmp/source/msfa .tmp/out
          cp -R third_party/msfa/src/. .tmp/source/msfa/
          {
            echo '## Docker/version'
            docker --version
            echo
            echo '## Build'
            docker run --rm -v "$PWD:/repo" -w /repo \
              emscripten/emsdk@sha256:8acec700a48dbff5250afc1e3ee545b7c002b689043ee82c277de6481a237fd7 \
              bash -lc 'scripts/build-msfa-spike.sh /repo/.tmp/source /repo/.tmp/out wasm'
            BUILD_RC=$?
            echo "BUILD_RC=$BUILD_RC"
            if [ "$BUILD_RC" -eq 0 ]; then
              echo
              echo '## Generated files'
              ls -lh .tmp/out
              sha256sum .tmp/out/fm1-msfa.wasm .tmp/out/fm1-msfa.mjs
              echo
              echo '## Export probe'
              node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { pathToFileURL } from 'node:url'
          import { resolve } from 'node:path'
          const factory=(await import(pathToFileURL(resolve('.tmp/out/fm1-msfa.mjs')).href)).default
          const wasmBinary=new Uint8Array(await readFile('.tmp/out/fm1-msfa.wasm'))
          const module=await factory({wasmBinary,locateFile:(path)=>path})
          const names=['_fm1_msfa_session_configure_performance','_fm1_msfa_session_set_pitch_bend','_fm1_msfa_session_set_modulation','_fm1_msfa_session_set_aftertouch']
          console.log(Object.fromEntries(names.map((name)=>[name,typeof module[name]])))
          NODE
              echo "PROBE_RC=$?"
            fi
          } > .tmp/diagnostic.log 2>&1
          cat .tmp/diagnostic.log
          exit 0
      - name: Record diagnostic and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log=Path('.tmp/diagnostic.log').read_text(encoding='utf-8', errors='replace')
          lines=['# MSFA performance rebuild diagnostic','',f"Diagnostic source commit: `{os.environ['GITHUB_SHA']}`",'', '```text', log[-16000:], '```','', 'This is diagnostic evidence only; it does not validate or publish a new WASM artifact.']
          Path('docs/validation/msfa-performance-rebuild-diagnostic.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/diagnose-msfa-performance-build.yml').unlink(missing_ok=True)
          PY
      - name: Commit diagnostic and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record performance rebuild diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
