name: Validate MSFA AudioWorklet browser smoke

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-msfa-worklet-browser-smoke.yml']

permissions:
  contents: write

concurrency:
  group: validate-msfa-worklet-browser-smoke
  cancel-in-progress: false

jobs:
  browser:
    name: ${{ matrix.browser }} smoke
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute real AudioWorklet smoke
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          if ($env:BROWSER_NAME -eq 'chrome') {
            $candidates = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            )
          } else {
            $candidates = @(
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            )
          }
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $result = "browser-smoke-$env:BROWSER_NAME.json"
          if (-not $browser) {
            @{ ok = $false; browserName = $env:BROWSER_NAME; requestedSoakSeconds = 20; error = 'Installed browser executable was not found on windows-latest' } | ConvertTo-Json | Set-Content -Encoding utf8 $result
            exit 1
          }
          node scripts/test-msfa-audioworklet-browser.mjs --browser-executable "$browser" --browser-name "$env:BROWSER_NAME" --soak-seconds 20 --result "$result"
      - name: Upload browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ matrix.browser }}
          path: browser-smoke-${{ matrix.browser }}.json
          if-no-files-found: error

  record:
    if: always()
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-smoke-*
          path: browser-results
          merge-multiple: true
      - name: Record smoke receipt and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('browser-results')
          results=[]
          for name in ['chrome','edge']:
              path=root/f'browser-smoke-{name}.json'
              if path.exists():
                  try: data=json.loads(path.read_text(encoding='utf-8-sig'))
                  except Exception as exc: data={'ok':False,'browserName':name,'error':f'invalid result: {exc}'}
              else: data={'ok':False,'browserName':name,'error':'result artifact missing'}
              results.append(data)
          ok=all(bool(item.get('ok')) for item in results)
          lines=['# MSFA AudioWorklet real-browser smoke','',f"Validated source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall smoke gate: **{'SUCCESS' if ok else 'FAILED'}**",'', '| Browser | Result | Version | Sample rate | Duration | Peak | Processor errors |','| --- | --- | --- | ---: | ---: | ---: | ---: |']
          for item in results:
              lines.append(f"| {item.get('browserName','?')} | **{'SUCCESS' if item.get('ok') else 'FAILURE'}** | {item.get('browserProduct','n/a')} | {item.get('sampleRate','n/a')} | {item.get('durationMs','n/a')} ms | {item.get('maxPeak','n/a')} | {item.get('processorErrors','n/a')} |")
          lines += ['', '## Scope','', '- Executes the actual packaged stateful WASM inside a real `AudioWorklet` on the Windows GitHub-hosted runner.', '- Verifies local WASM SHA-256 against the manifest, worklet initialization, semantic reference patch load, repeated note on/off/all-notes-off command flow, non-silent analyser output, return to silence and absence of processor/window/unhandled-rejection errors.', '- Browser audio is headless and muted in CI, so this smoke validates the browser audio graph and processor execution, not audible hardware dropout quality.', '- This 20-second smoke is a prerequisite only; the required ten-minute Chrome/Edge soak remains open until a separate 600-second run passes.']
          for item in results:
              lines += ['', f"## {item.get('browserName','browser')}", '```json', json.dumps(item, indent=2), '```']
          Path('docs/validation/msfa-audioworklet-browser-smoke.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('.github/workflows/validate-msfa-worklet-browser-smoke.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'test(ci): record real-browser worklet smoke'
          git pull --rebase origin main
          git push origin HEAD:main
