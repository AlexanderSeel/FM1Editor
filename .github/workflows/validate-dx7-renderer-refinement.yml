name: Validate renderer-backed DX7 refinement

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-dx7-renderer-refinement.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Run self-reporting refinement gate
        id: gate
        shell: bash
        run: |
          set +e
          : > /tmp/refine-gate.txt
          ok=true
          for stage in audit typecheck lint focused test build; do
            echo "=== $stage ===" | tee -a /tmp/refine-gate.txt
            case "$stage" in
              audit) npm run audit:virtual-dx7 2>&1 | tee -a /tmp/refine-gate.txt ;;
              typecheck) npm run typecheck 2>&1 | tee -a /tmp/refine-gate.txt ;;
              lint) npm run lint 2>&1 | tee -a /tmp/refine-gate.txt ;;
              focused) npm test -- src/audio/dx7CmaEs.test.ts src/audio/dx7CmaEsRefinement.test.ts 2>&1 | tee -a /tmp/refine-gate.txt ;;
              test) npm run test 2>&1 | tee -a /tmp/refine-gate.txt ;;
              build) npm run build 2>&1 | tee -a /tmp/refine-gate.txt ;;
            esac
            code=${PIPESTATUS[0]}; echo "$stage=$code" >> "$GITHUB_OUTPUT"; [ "$code" = 0 ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result
        env:
          OK: ${{ steps.gate.outputs.ok }}
          AUDIT: ${{ steps.gate.outputs.audit }}
          TYPECHECK: ${{ steps.gate.outputs.typecheck }}
          LINT: ${{ steps.gate.outputs.lint }}
          FOCUSED: ${{ steps.gate.outputs.focused }}
          TEST: ${{ steps.gate.outputs.test }}
          BUILD: ${{ steps.gate.outputs.build }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          ok=os.environ.get('OK')=='true'; log=Path('/tmp/refine-gate.txt').read_text(encoding='utf-8',errors='replace')
          Path('docs/validation/dx7-renderer-refinement.md').write_text('\n'.join([
            '# Renderer-backed constrained DX7 refinement','',f"Source commit: `{os.environ['GITHUB_SHA']}`",'',f"Overall software gate: **{'SUCCESS' if ok else 'FAILED'}**",'',
            '| Stage | Exit |','| --- | ---: |',f"| audit | {os.environ.get('AUDIT')} |",f"| typecheck | {os.environ.get('TYPECHECK')} |",f"| lint | {os.environ.get('LINT')} |",f"| focused | {os.environ.get('FOCUSED')} |",f"| full tests | {os.environ.get('TEST')} |",f"| build | {os.environ.get('BUILD')} |",'',
            'The refinement objective renders semantic `Dx7Voice` candidates through the accepted deterministic offline MSFA engine, creates the same compact descriptor fingerprint used by retrieval, and minimizes its weighted distance to the prepared-reference fingerprint. A local persistent fingerprint cache may bypass duplicate renders. Multi-start refinement accepts the best retrieved candidates, runs seeded constrained CMA-ES sequentially, reports progress and remains cancellable.','',
            'The default search group remains six operator output levels plus feedback. This receipt does not close the PLAN item until the mounted reconstruction UI starts from ranked retrieval results and exposes explicit refinement candidates.','',
            '```text',log[-16000:],'```',''
          ]),encoding='utf-8')
          Path('.github/workflows/validate-dx7-renderer-refinement.yml').unlink(missing_ok=True)
          PY
      - name: Commit receipt
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(audio): record renderer-backed refinement gate' || true
          git pull --rebase origin main
          git push origin HEAD:main
