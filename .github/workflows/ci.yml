name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit virtual DX7 source boundary
        run: npm run audit:virtual-dx7

      - name: Audit reconstruction research boundary
        run: npm run audit:reconstruction-upstreams

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and accessibility
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
