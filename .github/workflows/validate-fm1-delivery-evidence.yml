name: Validate FM-1 delivery evidence gate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-fm1-delivery-evidence.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Run delivery gate software acceptance
        shell: bash
        run: |
          set +e
          : > validation-stage-codes.txt
          run_stage() {
            name="$1"
            shift
            "$@" > "validation-$name.log" 2>&1
            code=$?
            cat "validation-$name.log"
            echo "$name=$code" >> validation-stage-codes.txt
          }
          run_stage audit-virtual npm run audit:virtual-dx7
          run_stage audit-research npm run audit:reconstruction-upstreams
          run_stage typecheck npm run typecheck
          run_stage lint npm run lint
          run_stage focused-hardware npm test -- src/validation/hardwareEvidence.test.ts
          run_stage focused-delivery npm test -- src/validation/fm1DeliveryEvidence.test.ts
          run_stage full-test npm run test
          run_stage build npm run build
          exit 0

      - name: Persist exact-head receipt
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import os

          codes = {}
          stage_file = Path('validation-stage-codes.txt')
          if stage_file.exists():
              for line in stage_file.read_text(encoding='utf-8').splitlines():
                  if '=' not in line:
                      continue
                  name, value = line.split('=', 1)
                  try:
                      codes[name] = int(value)
                  except ValueError:
                      codes[name] = 999

          stages = ['audit-virtual', 'audit-research', 'typecheck', 'lint', 'focused-hardware', 'focused-delivery', 'full-test', 'build']
          ok = all(codes.get(stage) == 0 for stage in stages)
          rows = ['| Stage | Exit |', '| --- | ---: |'] + [f'| {stage} | {codes.get(stage, "?")} |' for stage in stages]
          failure_sections = []
          if not ok:
              for stage in stages:
                  if codes.get(stage) == 0:
                      continue
                  log = Path(f'validation-{stage}.log')
                  text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'log missing'
                  failure_sections.extend(['', f'## {stage} failure tail', '', '```text', text[-16000:], '```'])

          Path('docs/validation/fm1-delivery-evidence-gate.md').write_text('\n'.join([
              '# FM-1 delivery evidence gate software acceptance',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              '',
              f"Software acceptance: **{'SUCCESS' if ok else 'FAILED'}**",
              '',
              *rows,
              '',
              'The accepted state contains the FM-1 hardware manifest fields for note-off recovery and channel selection, the deterministic Chrome/Edge delivery evidence evaluator, the in-app multi-manifest importer/exporter, the physical protocol instructions, support-matrix boundary and PLAN linkage.',
              '',
              'READY requires matching complete physical Chrome and Edge sessions for one HTTPS origin, FM-1 firmware, editor commit and Windows build, including USB-audio measurements, a captured standard 4,104-byte bank send, destination/persistence/recovery observations, note-off recovery and channel selection. The software tests use synthetic manifests only and do not satisfy or close the physical PLAN items.',
              *failure_sections,
              '',
          ]), encoding='utf-8')

          Path('.github/workflows/validate-fm1-delivery-evidence.yml').unlink(missing_ok=True)
          for path in Path('.').glob('validation-*.log'):
              path.unlink(missing_ok=True)
          Path('validation-stage-codes.txt').unlink(missing_ok=True)

      - name: Commit permanent validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(validation): record FM-1 delivery gate acceptance' || true
          git pull --rebase origin main
          git push origin HEAD:main
