name: Validate detune 15 compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-detune-15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Record validation
        shell: bash
        run: |
          cat > docs/validation/detune-15.md <<EOF
          # Detune 15 compatibility validation

          Validated commit: \`$(git rev-parse HEAD)\`

          - npm install: **PASS**
          - npm run typecheck: **PASS**
          - npm run lint: **PASS**
          - npm run test: **PASS**
          - npm run build: **PASS**

          Compatibility behavior:

          - packed DX7 detune nibble 15 is normalized to valid detune 14;
          - upper reserved bits remain preserved;
          - an existing in-memory detune 15 no longer blocks single-voice encoding;
          - an existing in-memory detune 15 no longer blocks a complete 32-voice bank encoding;
          - normalization happens before the Yamaha checksum is calculated.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/detune-15.md
          git commit -m 'test(ci): record detune 15 validation'
          git push origin HEAD:main
