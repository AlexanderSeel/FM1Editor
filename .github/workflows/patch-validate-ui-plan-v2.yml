name: Patch and validate UI plan continuation v2

on:
  push:
    branches:
      - main
    paths:
      - docs/validation/.trigger-ui-plan-v2

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate algorithm, live MIDI and sequencer fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/components/SequenceEditor.tsx',
              "import { useEffect, useMemo, useRef, useState } from 'react'",
              "import { useCallback, useEffect, useMemo, useRef, useState } from 'react'",
          )
          replace_once(
              'src/components/SequenceEditor.tsx',
              '''  const clearUiTimers = () => {
    timersRef.current.forEach((timer) => window.clearTimeout(timer))
    timersRef.current = []
  }

  const recordDrift = (expectedTimestamp: number) => {
    const drift = Math.abs(performance.now() - expectedTimestamp)
    setDiagnostics((current) => ({
      ...current,
      driftSamples: current.driftSamples + 1,
      totalDriftMs: current.totalDriftMs + drift,
      maximumDriftMs: Math.max(current.maximumDriftMs, drift),
    }))
  }

  useEffect(() => () => {
    clearUiTimers()
    externalPlayerRef.current?.stop()
  }, [])''',
              '''  const clearUiTimers = useCallback(() => {
    timersRef.current.forEach((timer) => window.clearTimeout(timer))
    timersRef.current = []
  }, [])

  const recordDrift = useCallback((expectedTimestamp: number) => {
    const drift = Math.abs(performance.now() - expectedTimestamp)
    setDiagnostics((current) => ({
      ...current,
      driftSamples: current.driftSamples + 1,
      totalDriftMs: current.totalDriftMs + drift,
      maximumDriftMs: Math.max(current.maximumDriftMs, drift),
    }))
  }, [])

  useEffect(() => () => {
    clearUiTimers()
    externalPlayerRef.current?.stop()
  }, [clearUiTimers])''',
          )
          replace_once(
              'src/components/SequenceEditor.tsx',
              "  }, [clockMode, output, sequence])",
              "  }, [clockMode, output, recordDrift, sequence])",
          )
          replace_once(
              'src/components/SequenceEditor.tsx',
              "title={`${formatNote(note)} · Step ${index + 1}${event?.shiftKey ? '' : ''}`}",
              "title={`${formatNote(note)} · Step ${index + 1}`}",
          )

          operations = Path('src/domain/sequenceOperations.ts')
          text = operations.read_text()
          replacement = '''export function updateStepNotes(step: SequenceStep, note: number, additive: boolean): SequenceStep {
            const normalized = clampNote(note)
            const withoutNotes: Omit<SequenceStep, 'notes'> = {
              enabled: step.enabled,
              note: step.note,
              velocity: step.velocity,
              gate: step.gate,
              tie: step.tie,
            }
            if (!additive) return { ...withoutNotes, enabled: true, note: normalized }
            const current = [...getStepNotes(step)]
            const existingIndex = current.indexOf(normalized)
            if (existingIndex >= 0) current.splice(existingIndex, 1)
            else if (current.length < 6) current.push(normalized)
            current.sort((left, right) => left - right)
            if (current.length === 0) return { ...withoutNotes, enabled: false }
            return {
              ...withoutNotes,
              enabled: true,
              note: current[0] ?? normalized,
              ...(current.length > 1 ? { notes: current } : {}),
            }
          }
          '''
          text, count = re.subn(r'export function updateStepNotes\([\s\S]*?\n}\n?$', replacement, text)
          if count != 1:
              raise SystemExit(f'src/domain/sequenceOperations.ts: replaced {count} updateStepNotes functions')
          operations.write_text(text)

          replace_once(
              'src/components/LiveMidiControls.tsx',
              '<div className="flex flex-wrap gap-2" onClick={(event) => event.stopPropagation()}>',
              '<div className="flex flex-wrap gap-2">',
          )

          replace_once(
              'src/components/AlgorithmGraph.tsx',
              "} from '../domain/dx7Algorithms'\n",
              "} from '../domain/dx7Algorithms'\nimport { RangeControl } from './RangeControl'\n",
          )
          replace_once(
              'src/components/AlgorithmGraph.tsx',
              "  onSelect: (operatorIndex: number) => void\n",
              "  onSelect: (operatorIndex: number) => void\n  onAlgorithmChange: (algorithm: number) => void\n",
          )
          replace_once(
              'src/components/AlgorithmGraph.tsx',
              "  onSelect,\n  onToggleEnabled,\n",
              "  onSelect,\n  onAlgorithmChange,\n  onToggleEnabled,\n",
          )
          replace_once(
              'src/components/AlgorithmGraph.tsx',
              '''        <div className="flex flex-wrap gap-3 text-[10px] font-bold uppercase tracking-[0.12em] text-slate-400">
          <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-sky-300" />Carrier</span>
          <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-lime-300" />Modulator</span>
          <span className="flex items-center gap-1.5"><span className="h-0 w-7 border-t border-dashed border-amber-300" />Feedback</span>
        </div>''',
              '''        <div className="grid w-full gap-3 sm:w-auto sm:min-w-[230px] sm:justify-items-end">
          <div className="w-full sm:w-[230px]">
            <RangeControl
              label="Algorithm selection"
              max={32}
              min={1}
              onChange={onAlgorithmChange}
              value={algorithm.number}
            />
          </div>
          <div className="flex flex-wrap gap-3 text-[10px] font-bold uppercase tracking-[0.12em] text-slate-400">
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-sky-300" />Carrier</span>
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full bg-lime-300" />Modulator</span>
            <span className="flex items-center gap-1.5"><span className="h-0 w-7 border-t border-dashed border-amber-300" />Feedback</span>
          </div>
        </div>''',
          )
          replace_once(
              'src/components/OperatorRoutingEditor.tsx',
              "        onSelect={onSelect}\n",
              "        onAlgorithmChange={(algorithm) => onChange({ ...voice, algorithm })}\n        onSelect={onSelect}\n",
          )
          replace_once(
              'src/components/VoiceEditor.tsx',
              '          <RangeControl label="Algorithm" max={32} min={1} onChange={(algorithm) => onChange({ ...voice, algorithm })} value={voice.algorithm} />\n',
              '',
          )

          replace_once(
              'src/App.tsx',
              "                      baseBank={bank}\n                      output={midi.output}\n",
              "                      baseBank={bank}\n                      fxState={effects}\n                      onFxChange={effectsHistory.setValue}\n                      output={midi.output}\n",
          )

          replace_once(
              'src/components/TargetVoiceAuditionPanel.tsx',
              "import type { DeviceTarget } from '../domain/deviceTarget'\n",
              "import type { DeviceTarget } from '../domain/deviceTarget'\nimport type { Fm1FxState } from '../domain/fx'\n",
          )
          replace_once(
              'src/components/TargetVoiceAuditionPanel.tsx',
              "import { VirtualPiano } from './VirtualPiano'\n",
              "import { LiveMidiControls } from './LiveMidiControls'\nimport { VirtualPiano } from './VirtualPiano'\n",
          )
          replace_once(
              'src/components/TargetVoiceAuditionPanel.tsx',
              "  sysexEnabled: boolean\n",
              "  sysexEnabled: boolean\n  fxState: Fm1FxState\n  onFxChange: (state: Fm1FxState) => void\n",
          )
          replace_once(
              'src/components/TargetVoiceAuditionPanel.tsx',
              '''      <div className="mt-4">
        <VirtualPiano
          baseOctave={baseOctave}''',
              '''      <div className="mt-4 grid gap-4">
        <LiveMidiControls
          disabled={busy}
          midiChannel={midiChannel}
          output={output}
          target="dx7"
        />
        <VirtualPiano
          baseOctave={baseOctave}''',
          )
          replace_once(
              'src/components/TargetVoiceAuditionPanel.tsx',
              "    <VoiceAuditionPanel\n      baseBank={props.baseBank}\n      output={props.output}\n",
              "    <VoiceAuditionPanel\n      baseBank={props.baseBank}\n      fxState={props.fxState}\n      onFxChange={props.onFxChange}\n      output={props.output}\n",
          )

          replace_once(
              'src/components/VoiceAuditionPanel.tsx',
              "import type { Dx7Voice } from '../domain/voice'\n",
              "import type { Fm1FxState } from '../domain/fx'\nimport type { Dx7Voice } from '../domain/voice'\n",
          )
          replace_once(
              'src/components/VoiceAuditionPanel.tsx',
              "import { VirtualPiano } from './VirtualPiano'\n",
              "import { LiveMidiControls } from './LiveMidiControls'\nimport { VirtualPiano } from './VirtualPiano'\n",
          )
          replace_once(
              'src/components/VoiceAuditionPanel.tsx',
              "  sysexEnabled: boolean\n",
              "  sysexEnabled: boolean\n  fxState: Fm1FxState\n  onFxChange: (state: Fm1FxState) => void\n",
          )
          replace_once(
              'src/components/VoiceAuditionPanel.tsx',
              "  selectedBankSlot,\n  output,\n  sysexEnabled,\n",
              "  selectedBankSlot,\n  output,\n  sysexEnabled,\n  fxState,\n  onFxChange,\n",
          )
          replace_once(
              'src/components/VoiceAuditionPanel.tsx',
              '''      <div className="mt-4">
        <VirtualPiano
          baseOctave={baseOctave}''',
              '''      <div className="mt-4 grid gap-4">
        <LiveMidiControls
          disabled={busy}
          fxState={fxState}
          midiChannel={midiChannel}
          onFxChange={onFxChange}
          output={output}
          target="fm1"
        />
        <VirtualPiano
          baseOctave={baseOctave}''',
          )
      - name: Install and validate
        id: validate
        shell: bash
        run: |
          set +e
          npm install
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            npm run typecheck; typecheck_status=$?
            npm run lint; lint_status=$?
            npm run test; test_status=$?
            npm run build; build_status=$?
          else
            typecheck_status=125
            lint_status=125
            test_status=125
            build_status=125
          fi
          set -e
          {
            echo "install_status=$install_status"
            echo "typecheck_status=$typecheck_status"
            echo "lint_status=$lint_status"
            echo "test_status=$test_status"
            echo "build_status=$build_status"
          } >> "$GITHUB_OUTPUT"
      - name: Record receipt and publish validated changes
        env:
          INSTALL_STATUS: ${{ steps.validate.outputs.install_status }}
          TYPECHECK_STATUS: ${{ steps.validate.outputs.typecheck_status }}
          LINT_STATUS: ${{ steps.validate.outputs.lint_status }}
          TEST_STATUS: ${{ steps.validate.outputs.test_status }}
          BUILD_STATUS: ${{ steps.validate.outputs.build_status }}
        shell: bash
        run: |
          set -euo pipefail
          result() { if [ "$1" -eq 0 ]; then echo SUCCESS; else echo FAILURE; fi; }
          mkdir -p docs/validation
          {
            echo '# UI, live MIDI and advanced sequencer validation'
            echo
            echo "Validated trigger commit: $GITHUB_SHA"
            echo
            echo "- npm install: **$(result "$INSTALL_STATUS")**"
            echo "- TypeScript typecheck: **$(result "$TYPECHECK_STATUS")**"
            echo "- ESLint and JSX accessibility: **$(result "$LINT_STATUS")**"
            echo "- Full Vitest suite: **$(result "$TEST_STATUS")**"
            echo "- Production build: **$(result "$BUILD_STATUS")**"
            echo
            echo 'Covered changes:'
            echo
            echo '- algorithm selection is located beside the graphical algorithm routing display;'
            echo '- the duplicate distant algorithm range control was removed;'
            echo '- Live MIDI controls appear directly above the virtual piano in FM-1 and DX7 modes;'
            echo '- both targets expose explicit Program Change, Start, Continue, Stop, Clock and All Notes Off;'
            echo '- FM-1 exposes the complete documented CC 0–23 filter/effects map with opt-in live send and shared Effects-workspace state;'
            echo '- no guessed voice-parameter or function-parameter SysEx was enabled;'
            echo '- advanced sequencer project compatibility, piano roll, polyphony, presets, transforms, arrangements, playhead, timing diagnostics and internal/external 24-PPQN clock are validated;'
            echo '- FM-1 internal pattern transfer remains disabled pending a verified protocol.'
          } > docs/validation/ui-live-midi-and-sequencer.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/ui-live-midi-and-sequencer.md
          if [ "$INSTALL_STATUS" -eq 0 ] && [ "$TYPECHECK_STATUS" -eq 0 ] && [ "$LINT_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ]; then
            git add src/App.tsx src/components/AlgorithmGraph.tsx src/components/LiveMidiControls.tsx src/components/OperatorRoutingEditor.tsx src/components/VoiceEditor.tsx src/components/TargetVoiceAuditionPanel.tsx src/components/VoiceAuditionPanel.tsx src/components/SequenceEditor.tsx src/domain/sequenceOperations.ts
            git commit -m "feat(ui): consolidate live MIDI controls"
            git push
          else
            git commit -m "test(ci): record UI plan validation failure"
            git push
            exit 1
          fi
